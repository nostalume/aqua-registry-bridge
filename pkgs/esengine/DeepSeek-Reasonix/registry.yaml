# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: esengine
    repo_name: DeepSeek-Reasonix
    description: DeepSeek-native AI coding agent for the terminal
    version_filter: Version startsWith "v"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 1.0.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/esengine/DeepSeek-Reasonix/releases/download/{{.Version}}/reasonix-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: reasonix-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: reasonix
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/esengine/DeepSeek-Reasonix/releases/download/{{.Version}}/reasonix-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/esengine/DeepSeek-Reasonix/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
