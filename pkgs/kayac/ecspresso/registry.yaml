# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kayac
    repo_name: ecspresso
    asset: ecspresso_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: ecspresso is a deployment tool for Amazon ECS
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/kayac/ecspresso/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 3.0.0")
        type: http
        url: https://gh-proxy.org/github.com/kayac/ecspresso/releases/download/{{.Version}}/ecspresso_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kayac/ecspresso/releases/download/{{.Version}}/ecspresso_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/kayac/ecspresso/releases/download/{{.Version}}/packslip.sigstore.json
            asset: packslip.sigstore.json
          opts:
            - --certificate-identity
            - https://gh-proxy.org/github.com/kayac/ecspresso/.github/workflows/tagpr-release.yml@refs/heads/v3
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
