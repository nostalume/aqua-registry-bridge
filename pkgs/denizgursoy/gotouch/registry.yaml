# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: denizgursoy
    repo_name: gotouch
    description: Customizable Boilerplate Project Creator
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.1.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/denizgursoy/gotouch/releases/download/{{.Version}}/gotouch_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gotouch_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/denizgursoy/gotouch/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
