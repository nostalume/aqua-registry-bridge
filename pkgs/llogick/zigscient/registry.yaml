# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: llogick
    repo_name: zigscient
    description: A Zig Language Server
    files:
      - name: zls
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/llogick/zigscient/releases/download/{{.Version}}/zigscient-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: zigscient-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        files:
          - name: zls
            src: "{{.AssetWithoutExt}}"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
