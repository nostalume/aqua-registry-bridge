# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ericchiang
    repo_name: pup
    description: Parsing HTML at the command line
    search_words:
      - HTML
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/ericchiang/pup/releases/download/{{.Version}}/pup_{{.OS}}_{{.Arch}}
        asset: pup_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.3.9")
        type: http
        url: https://gh-proxy.org/github.com/ericchiang/pup/releases/download/{{.Version}}/pup_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pup_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ericchiang/pup/releases/download/{{.Version}}/pup_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pup_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
