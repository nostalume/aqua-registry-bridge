# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: muesli
    repo_name: gitty
    description: Contextual information about your git projects, right on the command-line
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/muesli/gitty/releases/download/{{.Version}}/gitty_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gitty_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/muesli/gitty/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/muesli/gitty/releases/download/{{.Version}}/gitty_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
