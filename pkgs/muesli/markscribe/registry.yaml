# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: muesli
    repo_name: markscribe
    description: Your personal markdown scribe with template-engine and Git(Hub) & RSS powers
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/muesli/markscribe/releases/download/{{.Version}}/markscribe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: markscribe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/muesli/markscribe/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/muesli/markscribe/releases/download/{{.Version}}/markscribe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/muesli/markscribe/releases/download/{{.Version}}/markscribe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: markscribe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/muesli/markscribe/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/muesli/markscribe/releases/download/{{.Version}}/markscribe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
