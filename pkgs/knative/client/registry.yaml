# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/knative/client/releases/download/{{.Version}}/kn-{{.OS}}-{{.Arch}}
    repo_owner: knative
    repo_name: client
    format: raw
    asset: kn-{{.OS}}-{{.Arch}}
    description: Knative developer experience, docs, reference Knative CLI implementation
    files:
      - name: kn
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/knative/client/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
