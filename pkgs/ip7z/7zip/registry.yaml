# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ip7z
    repo_name: 7zip
    description: 7-Zip is a file archiver with a high compression ratio
    files:
      - name: 7zzs
      - name: 7zz
      - name: 7za
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "21.07"
        type: http
        url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: 7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        replacements:
          darwin: mac
          amd64: x64
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            files:
              - name: 7zzs
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}.{{.Format}}
            asset: 7z{{replace "." "" .Version}}-{{.OS}}.{{.Format}}
            files:
              - name: 7zz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-extra.{{.Format}}
            format: 7z
            asset: 7z{{replace "." "" .Version}}-extra.{{.Format}}
            files:
              - name: 7za
                src: "{{.Arch}}/7za.exe"
      - version_constraint: Version in ["22.00", "22.01"]
        type: http
        url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: 7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        replacements:
          amd64: x64
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            files:
              - name: 7zzs
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-extra.{{.Format}}
            format: 7z
            asset: 7z{{replace "." "" .Version}}-extra.{{.Format}}
            files:
              - name: 7za
                src: "{{.Arch}}/7za.exe"
        supported_envs:
          - linux
          - windows
      - version_constraint: Version == "23.01"
        type: http
        url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: 7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        replacements:
          darwin: mac
          amd64: x64
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            files:
              - name: 7zzs
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}.{{.Format}}
            asset: 7z{{replace "." "" .Version}}-{{.OS}}.{{.Format}}
            files:
              - name: 7zz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-extra.{{.Format}}
            format: 7z
            asset: 7z{{replace "." "" .Version}}-extra.{{.Format}}
            files:
              - name: 7za
                src: "{{.Arch}}/7za.exe"
      - version_constraint: Version in ["24.05", "24.06"]
        type: http
        url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: 7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        replacements:
          darwin: mac
          amd64: x64
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            files:
              - name: 7zzs
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}.{{.Format}}
            asset: 7z{{replace "." "" .Version}}-{{.OS}}.{{.Format}}
            files:
              - name: 7zz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-extra.{{.Format}}
            format: 7z
            asset: 7z{{replace "." "" .Version}}-extra.{{.Format}}
            files:
              - name: 7za
                src: "{{.Arch}}/7za.exe"
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: 7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.xz
        replacements:
          amd64: x64
          darwin: mac
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            files:
              - name: 7zzs
              - name: 7zz
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-{{.OS}}.{{.Format}}
            asset: 7z{{replace "." "" .Version}}-{{.OS}}.{{.Format}}
            files:
              - name: 7zz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ip7z/7zip/releases/download/{{.Version}}/7z{{replace "." "" .Version}}-extra.{{.Format}}
            format: 7z
            asset: 7z{{replace "." "" .Version}}-extra.{{.Format}}
            files:
              - name: 7za
                src: "{{.Arch}}/7za.exe"
