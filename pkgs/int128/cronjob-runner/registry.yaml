# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: int128
    repo_name: cronjob-runner
    description: Run one-shot Kubernetes Job from CronJob template and tail logs
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/int128/cronjob-runner/releases/download/{{.Version}}/cronjob-runner_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cronjob-runner_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
