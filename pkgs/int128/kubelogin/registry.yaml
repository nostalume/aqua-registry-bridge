# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: int128
    repo_name: kubelogin
    description: kubectl plugin for Kubernetes OpenID Connect authentication (kubectl oidc-login)
    files:
      - name: kubectl-oidc_login
        src: kubelogin
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.5.0")
        type: http
        url: https://gh-proxy.org/github.com/int128/kubelogin/releases/download/{{.Version}}/kubelogin_{{.OS}}_{{.Arch}}
        asset: kubelogin_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.8.2")
        type: http
        url: https://gh-proxy.org/github.com/int128/kubelogin/releases/download/{{.Version}}/kubelogin_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubelogin_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/int128/kubelogin/releases/download/{{.Version}}/kubelogin_{{.Version}}_checksums.txt
          asset: kubelogin_{{.Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.18.0")
        type: http
        url: https://gh-proxy.org/github.com/int128/kubelogin/releases/download/{{.Version}}/kubelogin_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubelogin_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.22.1")
        type: http
        url: https://gh-proxy.org/github.com/int128/kubelogin/releases/download/{{.Version}}/kubelogin_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubelogin_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver("<= 1.31.1")
        type: http
        url: https://gh-proxy.org/github.com/int128/kubelogin/releases/download/{{.Version}}/kubelogin_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubelogin_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/int128/kubelogin/releases/download/{{.Version}}/kubelogin_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubelogin_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
