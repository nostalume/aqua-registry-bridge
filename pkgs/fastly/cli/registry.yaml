# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/fastly/cli/releases/download/{{.Version}}/fastly_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: fastly
    repo_name: cli
    description: A CLI for interacting with the Fastly platform
    asset: fastly_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: fastly
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/fastly/cli/releases/download/{{.Version}}/fastly_{{.Version}}_SHA256SUMS
      asset: fastly_{{.Version}}_SHA256SUMS
      algorithm: sha256
    version_constraint: semver(">= 4.6.0")
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fastly/cli/releases/download/{{.Version}}/fastly_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fastly/cli/releases/download/{{.Version}}/fastly_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
