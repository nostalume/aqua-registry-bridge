# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: barnybug
    repo_name: cli53
    description: Command line tool for Amazon Route 53
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "0.6.0"
        no_asset: true
      - version_constraint: semver("<= 0.7.2")
        type: http
        url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/cli53-{{.OS}}-{{.Arch}}
        asset: cli53-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: mac
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.8.10")
        type: http
        url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/cli53-{{.OS}}-{{.Arch}}
        asset: cli53-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: mac
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.8.19")
        type: http
        url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/cli53-{{.OS}}-{{.Arch}}
        asset: cli53-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: mac
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/cli53_{{.Version}}_checksums.txt
          asset: cli53_{{.Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.8.23")
        type: http
        url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/cli53-{{.OS}}-{{.Arch}}
        asset: cli53-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          darwin: mac
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/cli53_{{.Version}}_checksums.txt
          asset: cli53_{{.Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/cli53-{{.OS}}-{{.Arch}}
        asset: cli53-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          darwin: mac
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/barnybug/cli53/releases/download/{{.Version}}/cli53_{{trimV .Version}}_checksums.txt
          asset: cli53_{{trimV .Version}}_checksums.txt
          algorithm: sha256
