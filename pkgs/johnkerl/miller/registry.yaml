# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/johnkerl/miller/releases/download/{{.Version}}/miller-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: johnkerl
    repo_name: miller
    description: Miller is like awk, sed, cut, join, and sort for name-indexed data such as CSV, TSV, and tabular JSON
    asset: miller-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/johnkerl/miller/releases/download/{{.Version}}/miller-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    files:
      - name: mlr
        src: miller-{{trimV .Version}}-{{.OS}}-{{.Arch}}/mlr
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/johnkerl/miller/releases/download/{{.Version}}/miller-{{trimV .Version}}-checksums.txt
      asset: miller-{{trimV .Version}}-checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 6.9.0")
    version_overrides:
      - version_constraint: Version == "v5.1.0w"
        type: http
        url: https://gh-proxy.org/github.com/johnkerl/miller/releases/download/{{.Version}}/mlr
        asset: mlr
        format: raw
        overrides: []
        supported_envs:
          - windows/amd64
        checksum:
          enabled: false
      - version_constraint: Version == "v6.0.0-beta"
        type: http
        url: https://gh-proxy.org/github.com/johnkerl/miller/releases/download/{{.Version}}/mlr-{{.OS}}-latest.{{.Format}}
        asset: mlr-{{.OS}}-latest.{{.Format}}
        format: zip
        files:
          - name: mlr
        overrides: []
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows/amd64
        rosetta2: true
        checksum:
          enabled: false
      - version_constraint: Version == "v6.0.0.rc1"
        type: http
        url: https://gh-proxy.org/github.com/johnkerl/miller/releases/download/{{.Version}}/mlr-{{.OS}}-{{trimV .Version}}.{{.Format}}
        asset: mlr-{{.OS}}-{{trimV .Version}}.{{.Format}}
        format: zip
        overrides: []
        files:
          - name: mlr
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows/amd64
        rosetta2: true
        checksum:
          enabled: false
      - version_constraint: semver(">= 6.1.0")
        type: http
        url: https://gh-proxy.org/github.com/johnkerl/miller/releases/download/{{.Version}}/miller-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        replacements:
