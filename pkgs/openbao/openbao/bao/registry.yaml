# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: openbao/openbao/bao
    type: github_release
    repo_owner: openbao
    repo_name: openbao
    description: OpenBao exists to provide a software solution to manage, store, and distribute sensitive data including secrets, certificates, and keys
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v2.0.0-alpha20240329"
        type: http
        url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/openbao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: openbao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
      - version_constraint: Version == "v2.0.0-beta20240618"
        type: http
        url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 2.1.1")
        type: http
        url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt
          asset: checksums-{{.OS}}.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 2.4.4")
        type: http
        url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt
          asset: checksums-{{.OS}}.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt.pem
              - --certificate-identity-regexp
              - '^https://github\.com/openbao/openbao/\.github/workflows/release\.yml@refs/tags/.*$'
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt.sig
              - --certificate-github-workflow-repository
              - openbao/openbao
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v2.5.0-beta20251125"
        type: http
        url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt
          asset: checksums-{{.OS}}.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 2.5.5")
        type: http
        url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt
          asset: checksums-{{.OS}}.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - '^https://github\.com/openbao/openbao/\.github/workflows/release\.yml@refs/tags/.*$'
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - openbao/openbao
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt.sigstore.json
              asset: checksums-{{.OS}}.txt.sigstore.json
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/bao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/openbao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: openbao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - '^https://github\.com/openbao/openbao/\.github/workflows/release\.yml@refs/(tags/.*|heads/release/.*)$'
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - openbao/openbao
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/openbao/openbao/releases/download/{{.Version}}/openbao_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
