# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: RyuyaIshibashi
    repo_name: aws-s3-siggy
    files:
      - name: siggy
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        no_asset: true
      - version_constraint: Version == "v0.0.7"
        type: http
        url: https://gh-proxy.org/github.com/RyuyaIshibashi/aws-s3-siggy/releases/download/{{.Version}}/aws-s3-siggy_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: aws-s3-siggy_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: aws-s3-siggy
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/RyuyaIshibashi/aws-s3-siggy/releases/download/{{.Version}}/aws-s3-siggy_{{trimV .Version}}_checksums.txt
          asset: aws-s3-siggy_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/RyuyaIshibashi/aws-s3-siggy/releases/download/{{.Version}}/aws-s3-siggy_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v0.0.9"
