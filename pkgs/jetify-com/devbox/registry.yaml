# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jetify-com
    repo_name: devbox
    aliases:
      - name: jetpack-io/devbox
    description: Instant, easy, and predictable development environments
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/jetify-com/devbox/releases/download/{{.Version}}/devbox_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: devbox_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/jetify-com/devbox/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
