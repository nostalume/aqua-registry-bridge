# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tontinton
    repo_name: maki
    description: An efficient AI coding agent extendable by neovim-like Lua plugins
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/tontinton/maki/releases/download/{{.Version}}/maki-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: maki-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tontinton/maki/releases/download/{{.Version}}/sha256sums.txt
          asset: sha256sums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tontinton/maki/releases/download/{{.Version}}/maki-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/tontinton/maki/releases/download/{{.Version}}/maki-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: maki-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tontinton/maki/releases/download/{{.Version}}/sha256sums.txt
          asset: sha256sums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tontinton/maki/releases/download/{{.Version}}/maki-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
