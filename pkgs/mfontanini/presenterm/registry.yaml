# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mfontanini
    repo_name: presenterm
    description: A markdown terminal slideshow tool
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mfontanini/presenterm/releases/download/{{.Version}}/presenterm-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: presenterm-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: presenterm
            src: presenterm-{{trimV .Version}}/presenterm
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha512"
          asset: "{{.Asset}}.sha512"
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mfontanini/presenterm/releases/download/{{.Version}}/presenterm-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
