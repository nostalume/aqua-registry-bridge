# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: pacedotdev
    repo_name: oto
    description: Go driven rpc code generation tool for right now
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.8.0")
        no_asset: true
      - version_constraint: semver("<= 0.12.1")
        type: http
        url: https://gh-proxy.org/github.com/pacedotdev/oto/releases/download/{{.Version}}/oto_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: oto_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macOS
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pacedotdev/oto/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.14.2")
        type: http
        url: https://gh-proxy.org/github.com/pacedotdev/oto/releases/download/{{.Version}}/oto_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: oto_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: macOS
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pacedotdev/oto/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/pacedotdev/oto/releases/download/{{.Version}}/oto_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: oto_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pacedotdev/oto/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
