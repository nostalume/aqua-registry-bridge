# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: genuinetools
    repo_name: reg
    description: Docker registry v2 command line client and repo listing generator with security checks
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.4.0"
        type: http
        url: https://gh-proxy.org/github.com/genuinetools/reg/releases/download/{{.Version}}/reg-{{.OS}}-{{.Arch}}
        asset: reg-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        complete_windows_ext: false
      - version_constraint: Version == "v0.15.4"
        type: http
        url: https://gh-proxy.org/github.com/genuinetools/reg/releases/download/{{.Version}}/reg-{{.OS}}-{{.Arch}}
        asset: reg-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        supported_envs:
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/genuinetools/reg/releases/download/{{.Version}}/reg-{{.OS}}-{{.Arch}}
        asset: reg-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        complete_windows_ext: false
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
