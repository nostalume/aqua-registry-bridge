# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sunny0826
    repo_name: kubectl-pod-lens
    description: kubectl plugin for show pod-related resources
    files:
      - name: kubectl-pod_lens
        src: pod-lens
      - name: pod-lens
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.2.1"
        type: http
        url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{trimV .Version}}_checksums.txt
          asset: pod-lens_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v0.2.2"
        type: http
        url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{trimV .Version}}_checksums.txt
          asset: pod-lens_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{trimV .Version}}_checksums.txt
          asset: pod-lens_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{trimV .Version}}_checksums.txt
          asset: pod-lens_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sunny0826/kubectl-pod-lens/releases/download/{{.Version}}/pod-lens_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
