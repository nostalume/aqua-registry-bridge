# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: concourse/concourse/concourse
    type: http
    url: https://gh-proxy.org/github.com/concourse/concourse/releases/download/{{.Version}}/concourse-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: concourse
    repo_name: concourse
    asset: concourse-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tgz
    description: Concourse is a container-based continuous thing-doer written in Go
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/concourse/concourse/releases/download/{{.Version}}/concourse-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    files:
      - name: concourse
        src: concourse/bin/concourse
    checksum:
      type: http
      url: "{{.AssetURL}}.sha1"
      asset: "{{.Asset}}.sha1"
      file_format: regexp
      algorithm: sha1
      pattern:
        checksum: ^(\b[A-Fa-f0-9]{40}\b)
        file: "^\\b[A-Fa-f0-9]{40}\\b\\s+(\\S+)$"
