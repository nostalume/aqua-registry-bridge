# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: agentgateway/agentgateway/agctl
    type: github_release
    repo_owner: agentgateway
    repo_name: agentgateway
    description: Next Generation Agentic Proxy for AI Agents and MCP servers
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.3.0-alpha.1")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/agentgateway/agentgateway/releases/download/{{.Version}}/agctl-{{.OS}}-{{.Arch}}
        asset: agctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
