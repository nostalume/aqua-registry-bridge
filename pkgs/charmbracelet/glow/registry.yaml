          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/charmbracelet/glow/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/charmbracelet/glow/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
