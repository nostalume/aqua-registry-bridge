        url: https://gh-proxy.org/github.com/charmbracelet/glow/releases/download/{{.Version}}/glow_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: glow_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: Darwin
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/charmbracelet/glow/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
