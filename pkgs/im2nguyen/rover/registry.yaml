# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/im2nguyen/rover/releases/download/{{.Version}}/rover_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
    repo_owner: im2nguyen
    repo_name: rover
    asset: rover_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
    description: Interactive Terraform visualization. State and configuration explorer
    files:
      - name: rover
        src: rover_{{.Version}}
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/im2nguyen/rover/releases/download/{{.Version}}/rover_{{trimV .Version}}_SHA256SUMS
      asset: rover_{{trimV .Version}}_SHA256SUMS
      algorithm: sha256
