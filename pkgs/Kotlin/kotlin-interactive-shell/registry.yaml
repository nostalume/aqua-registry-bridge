# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Kotlin
    repo_name: kotlin-interactive-shell
    description: Kotlin Language Interactive Shell
    files:
      - name: ki
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.3")
        no_asset: true
      - version_constraint: Version in ["v0.3.2", "v0.4.0"]
        type: http
        url: https://gh-proxy.org/github.com/Kotlin/kotlin-interactive-shell/releases/download/{{.Version}}/ki-archive.{{.Format}}
        asset: ki-archive.{{.Format}}
        format: zip
        files:
          - name: ki
            src: ki/bin/ki.sh
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Kotlin/kotlin-interactive-shell/releases/download/{{.Version}}/ki-archive.{{.Format}}
            files:
              - name: ki
                src: ki/bin/ki.bat
      - version_constraint: Version == "v0.3.3"
        type: http
        url: https://gh-proxy.org/github.com/Kotlin/kotlin-interactive-shell/releases/download/{{.Version}}/ki-archive.{{.Format}}
        asset: ki-archive.{{.Format}}
        format: zip
        files:
          - name: ki
            src: ki/bin/ki.sh
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Kotlin/kotlin-interactive-shell/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Kotlin/kotlin-interactive-shell/releases/download/{{.Version}}/ki-archive.{{.Format}}
            files:
              - name: ki
                src: ki/bin/ki.bat
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Kotlin/kotlin-interactive-shell/releases/download/{{.Version}}/ki-archive.{{.Format}}
        asset: ki-archive.{{.Format}}
        format: zip
        files:
          - name: ki
            src: ki/bin/ki.sh
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Kotlin/kotlin-interactive-shell/releases/download/{{.Version}}/checksums_sha256.txt
          asset: checksums_sha256.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Kotlin/kotlin-interactive-shell/releases/download/{{.Version}}/ki-archive.{{.Format}}
            files:
              - name: ki
                src: ki/bin/ki.bat
