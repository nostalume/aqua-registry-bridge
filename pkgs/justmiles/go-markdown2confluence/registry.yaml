# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/go-markdown2confluence_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: justmiles
    repo_name: go-markdown2confluence
    description: Push markdown files to Confluence Cloud
    asset: go-markdown2confluence_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x86_64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    files:
      - name: markdown2confluence
    version_constraint: semver(">= 3.3.2")
    version_overrides:
      - version_constraint: semver(">= 3.3.1")
        type: http
        url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/go-markdown2confluence_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - linux
          - amd64
      - version_constraint: semver(">= 3.3.0")
        type: http
        url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/go-markdown2confluence_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - linux
          - amd64
        rosetta2: true
      - version_constraint: semver(">= 3.1.1")
        type: http
        url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/go-markdown2confluence_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
      - version_constraint: semver(">= 3.0.0")
        type: http
        url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/markdown2confluence_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: markdown2confluence_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/markdown2confluence_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
      - version_constraint: semver(">= 2.0.0")
        type: http
        url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/markdown2confluence-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        asset: markdown2confluence-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        format: raw
        replacements: {}
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
        checksum:
          enabled: false
      - version_constraint: semver("< 2.0.0")
        type: http
        url: https://gh-proxy.org/github.com/justmiles/go-markdown2confluence/releases/download/{{.Version}}/markdown2confluence.{{.OS}}-{{.Arch}}
        asset: markdown2confluence.{{.OS}}-{{.Arch}}
        format: raw
        replacements: {}
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
        checksum:
          enabled: false
