# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: crate-ci
    repo_name: typos
    description: Source code spell checker
    version_filter: not (Version startsWith "varcon-")
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.13.17"
        type: http
        url: https://gh-proxy.org/github.com/crate-ci/typos/releases/download/{{.Version}}/typos-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: typos-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/crate-ci/typos/releases/download/{{.Version}}/typos-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: semver("<= 1.0.11")
        type: http
        url: https://gh-proxy.org/github.com/crate-ci/typos/releases/download/{{.Version}}/typos-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: typos-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
