# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: benchkram
    repo_name: bob
    description: Bob is a high-level build tool for multi-language projects
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/benchkram/bob/releases/download/{{.Version}}/bob_{{.Version}}_{{.OS}}_{{.Arch}}
        asset: bob_{{.Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/benchkram/bob/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
