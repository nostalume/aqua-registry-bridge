# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Kampfkarren/selene/releases/download/{{.Version}}/selene-{{.Version}}-{{.OS}}.zip
    repo_owner: Kampfkarren
    repo_name: selene
    description: A blazing-fast modern Lua linter written in Rust
    replacements:
      darwin: macos
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    version_constraint: semver(">= 0.6.0")
    asset: selene-{{.Version}}-{{.OS}}.zip
    version_overrides:
      - version_constraint: semver(">= 0.4.3")
        type: http
        url: https://gh-proxy.org/github.com/Kampfkarren/selene/releases/download/{{.Version}}/selene-{{.OS}}
        asset: selene-{{.OS}}
        replacements:
          darwin: osx
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Kampfkarren/selene/releases/download/{{.Version}}/selene.exe
            asset: selene.exe
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Kampfkarren/selene/releases/download/{{.Version}}/selene
        asset: selene
        supported_envs:
          - linux/amd64
          - windows/amd64
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Kampfkarren/selene/releases/download/{{.Version}}/selene.exe
            asset: selene.exe
