# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: devops-works
    repo_name: egress-auditor
    description: "Audit your egress connections and finally populate this OUTPUT chain "
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/devops-works/egress-auditor/releases/download/{{.Version}}/egress-auditor_{{.OS}}_{{.Arch}}
        asset: egress-auditor_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/devops-works/egress-auditor/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
