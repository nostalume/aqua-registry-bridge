# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: babarot
    repo_name: vtest
    aliases:
      - name: b4b4r07/vtest
    description: Unix `test` command for Version comparison
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/babarot/vtest/releases/download/{{.Version}}/vtest_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: vtest_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/babarot/vtest/releases/download/{{.Version}}/vtest_{{trimV .Version}}_checksums.txt
          asset: vtest_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
