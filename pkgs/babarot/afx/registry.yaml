# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: babarot
    repo_name: afx
    aliases:
      - name: b4b4r07/afx
    description: Package manager to provide declaretive way to manage CLI commands and shell plugins as code
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: afx_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{trimV .Version}}_checksums.txt
          asset: afx_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.1.25")
        type: http
        url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: afx_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{trimV .Version}}_checksums.txt
          asset: afx_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.2.1")
        type: http
        url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: afx_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{trimV .Version}}_checksums.txt
          asset: afx_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: afx_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/babarot/afx/releases/download/{{.Version}}/afx_{{trimV .Version}}_checksums.txt
          asset: afx_{{trimV .Version}}_checksums.txt
          algorithm: sha256
