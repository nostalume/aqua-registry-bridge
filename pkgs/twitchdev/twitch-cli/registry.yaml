# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: twitchdev
    repo_name: twitch-cli
    description: The official Twitch CLI to make developing on Twitch easier
    files:
      - name: twitch
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.1.3"
        type: http
        url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.2.1")
        type: http
        url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-{{.OS}}-{{.Arch}}
        asset: twitch-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-{{.OS}}-10.6-{{.Arch}}
            asset: twitch-{{.OS}}-10.6-{{.Arch}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-{{.OS}}-4.0-{{.Arch}}
            asset: twitch-{{.OS}}-4.0-{{.Arch}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.1.1")
        type: http
        url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: twitch-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.1.6")
        type: http
        url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: twitch
            src: twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}/twitch
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: twitch
            src: twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}/twitch
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/twitchdev/twitch-cli/releases/download/{{.Version}}/twitch-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
