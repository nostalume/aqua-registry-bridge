# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/d2lang/d2/releases/download/{{.Version}}/d2-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    repo_owner: d2lang
    repo_name: d2
    aliases:
      - name: terrastruct/d2
    asset: d2-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    description: D2 is a modern diagram scripting language that turns text to diagrams
    replacements:
      darwin: macos
    files:
      - name: d2
        src: d2-{{.Version}}/bin/d2
