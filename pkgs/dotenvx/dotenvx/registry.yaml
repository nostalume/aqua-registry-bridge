# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: dotenvx
    repo_name: dotenvx
    description: a better dotenv–from the creator of `dotenv`
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.7")
        type: http
        url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/git-dotenv-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: git-dotenv-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: git-dotenv
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.1.18")
        type: http
        url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/git-dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: git-dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: git-dotenv
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.2.7")
        type: http
        url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: dotenv
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: Version == "v0.2.8"
        type: http
        url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: dotenv
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.2.10")
        type: http
        url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: dotenv
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.2.19")
        type: http
        url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: dotenv
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenv-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: aarch64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.44.5")
        type: http
        url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenvx-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: dotenvx-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenvx-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: aarch64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenvx-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: dotenvx-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/dotenvx-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: aarch64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dotenvx/dotenvx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
