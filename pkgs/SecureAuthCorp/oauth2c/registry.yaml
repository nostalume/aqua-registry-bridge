# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: SecureAuthCorp
    repo_name: oauth2c
    aliases:
      - name: cloudentity/oauth2c
    description: User-friendly OAuth2 CLI
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/SecureAuthCorp/oauth2c/releases/download/{{.Version}}/oauth2c_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: oauth2c_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/SecureAuthCorp/oauth2c/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
