# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: awslabs
    repo_name: eks-auto-mode-ebs-migration-tool
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/awslabs/eks-auto-mode-ebs-migration-tool/releases/download/{{.Version}}/eks-auto-mode-ebs-migration-tool_{{.OS}}_{{.Arch}}
        asset: eks-auto-mode-ebs-migration-tool_{{.OS}}_{{.Arch}}
        format: raw
        replacements:
          darwin: Darwin
          linux: Linux
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/awslabs/eks-auto-mode-ebs-migration-tool/releases/download/{{.Version}}/eks-auto-mode-ebs-migration-tool_{{trimV .Version}}_sha256_checksums.txt
          asset: eks-auto-mode-ebs-migration-tool_{{trimV .Version}}_sha256_checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/awslabs/eks-auto-mode-ebs-migration-tool/releases/download/{{.Version}}/eks-auto-mode-ebs-migration-tool_{{.OS}}_all
            asset: eks-auto-mode-ebs-migration-tool_{{.OS}}_all
        supported_envs:
          - linux
          - darwin
