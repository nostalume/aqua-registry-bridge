# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: ahmetb/kubectx/kubens
    type: github_release
    repo_owner: ahmetb
    repo_name: kubectx
    aliases:
      - name: ahmetb/kubens
    description: Faster way to switch between clusters and namespaces in kubectl
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.9.0"
        type: http
        url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.8.0")
        no_asset: true
      - version_constraint: semver("<= 0.9.2")
        type: http
        url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.9.4")
        type: http
        url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ahmetb/kubectx/releases/download/{{.Version}}/kubens_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
