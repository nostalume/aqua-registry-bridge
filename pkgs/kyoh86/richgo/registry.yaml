# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kyoh86
    repo_name: richgo
    description: Enrich `go test` outputs with text decorations
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.2")
        no_asset: true
      - version_constraint: semver("<= 0.3.6")
        type: http
        url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux/amd64
          - darwin
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_checksums.txt
          asset: richgo_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.3.8")
        type: http
        url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux
          - darwin
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_checksums.txt
          asset: richgo_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.3.10")
        type: http
        url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux
          - darwin
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_checksums.txt
          asset: richgo_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kyoh86/richgo/releases/download/{{.Version}}/richgo_{{trimV .Version}}_checksums.txt
          asset: richgo_{{trimV .Version}}_checksums.txt
          algorithm: sha256
