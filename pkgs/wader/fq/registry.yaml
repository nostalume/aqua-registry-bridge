# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: wader
    repo_name: fq
    description: "jq for binary formats - tool, language and decoders for working with binary and text formats"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.4")
        type: http
        url: https://gh-proxy.org/github.com/wader/fq/releases/download/{{.Version}}/fq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: fq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/wader/fq/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/wader/fq/releases/download/{{.Version}}/fq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/wader/fq/releases/download/{{.Version}}/fq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: fq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/wader/fq/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/wader/fq/releases/download/{{.Version}}/fq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
