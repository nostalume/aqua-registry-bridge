# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: smol-machines
    repo_name: smolvm
    description: Tool to build & run portable, lightweight, self-contained virtual machines
    files:
      - name: smolvm
        src: "{{.AssetWithoutExt}}/smolvm"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v0.1.17", "v0.1.19"]
        type: http
        url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin/arm64
      - version_constraint: Version == "v0.1.18"
        type: http
        url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - darwin/arm64
      - version_constraint: semver("<= 0.1.5")
        type: http
        url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin/arm64
      - version_constraint: semver("<= 0.1.8")
        type: http
        url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - darwin/arm64
      - version_constraint: semver("<= 0.1.11")
        type: http
        url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin/arm64
      - version_constraint: semver("<= 0.1.16")
        type: http
        url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - darwin/arm64
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin/arm64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: smolvm-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/smol-machines/smolvm/releases/download/{{.Version}}/checksums.sha256
          asset: checksums.sha256
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin/arm64
