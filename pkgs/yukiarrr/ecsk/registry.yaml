# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: yukiarrr
    repo_name: ecsk
    description: CLI tool that you can interactively call Amazon ECS APIs (run-task, execute-command, stop-task), copy files between ECS and local, and view logs
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.6")
        type: http
        url: https://gh-proxy.org/github.com/yukiarrr/ecsk/releases/download/{{.Version}}/ecsk_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ecsk_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yukiarrr/ecsk/releases/download/{{.Version}}/ecsk_{{trimV .Version}}_checksums.txt
          asset: ecsk_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.9.0")
        type: http
        url: https://gh-proxy.org/github.com/yukiarrr/ecsk/releases/download/{{.Version}}/ecsk_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ecsk_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yukiarrr/ecsk/releases/download/{{.Version}}/ecsk_{{trimV .Version}}_checksums.txt
          asset: ecsk_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yukiarrr/ecsk/releases/download/{{.Version}}/ecsk_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/yukiarrr/ecsk/releases/download/{{.Version}}/ecsk_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ecsk_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yukiarrr/ecsk/releases/download/{{.Version}}/ecsk_{{trimV .Version}}_checksums.txt
          asset: ecsk_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yukiarrr/ecsk/releases/download/{{.Version}}/ecsk_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
