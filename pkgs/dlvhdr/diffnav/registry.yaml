# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: dlvhdr
    repo_name: diffnav
    description: A git diff pager based on delta but with a file tree, à la GitHub
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/diffnav/releases/download/{{.Version}}/diffnav_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: diffnav_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dlvhdr/diffnav/releases/download/{{.Version}}/diffnav_{{trimV .Version}}_checksums.txt
          asset: diffnav_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dlvhdr/diffnav/releases/download/{{.Version}}/diffnav_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
