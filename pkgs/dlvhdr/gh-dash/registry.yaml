# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: dlvhdr
    repo_name: gh-dash
    description: A beautiful CLI dashboard for GitHub
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        no_asset: true
      - version_constraint: semver("<= 1.1.1")
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
        asset: "{{.OS}}-{{.Arch}}"
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 1.2.2")
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
        asset: "{{.OS}}-{{.Arch}}"
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
            replacements:
              amd64: amd64
        replacements:
          amd64: x86_64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 2.1.0")
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
        asset: "{{.OS}}-{{.Arch}}"
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 3.0.0")
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
        asset: "{{.OS}}-{{.Arch}}"
        format: raw
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 3.1.3")
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
        asset: "{{.OS}}-{{.Arch}}"
        format: raw
        windows_arm_emulation: true
      - version_constraint: semver("<= 3.7.0")
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
        asset: "{{.OS}}-{{.Arch}}"
        format: raw
      - version_constraint: Version == "v3.7.3-next"
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/gh-dash_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gh-dash_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/gh-dash_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v3.7.4"
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/gh-dash_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gh-dash_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/gh-dash_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v3.7.5"
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}_{{.Arch}}.{{.Format}}
        asset: "{{.OS}}_{{.Arch}}.{{.Format}}"
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 3.14.0")
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
        asset: "{{.OS}}-{{.Arch}}"
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/gh-dash_{{.Version}}_{{.OS}}-{{.Arch}}
        asset: gh-dash_{{.Version}}_{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dlvhdr/gh-dash/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
