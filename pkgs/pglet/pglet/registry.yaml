# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: pglet
    repo_name: pglet
    description: "Pglet - build internal web apps quickly in the language you already know"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.15")
        type: http
        url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: pglet-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet_{{trimV .Version}}_checksums.txt
          asset: pglet_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.6")
        type: http
        url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: pglet-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet_{{trimV .Version}}_checksums.txt
          asset: pglet_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: pglet-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet_{{trimV .Version}}_checksums.txt
          asset: pglet_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/pglet/pglet/releases/download/{{.Version}}/pglet-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
