# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tellerops
    repo_name: teller
    aliases:
      - name: SpectralOps/teller
    description: Cloud native secrets management for developers - never leave your command line for secrets
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.4.0")
        type: http
        url: https://gh-proxy.org/github.com/tellerops/teller/releases/download/{{.Version}}/teller_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: teller_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tellerops/teller/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 1.5.6")
        type: http
        url: https://gh-proxy.org/github.com/tellerops/teller/releases/download/{{.Version}}/teller_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: teller_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tellerops/teller/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/tellerops/teller/releases/download/{{.Version}}/teller-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: teller-{{.Arch}}-{{.OS}}.{{.Format}}
        files:
          - name: teller
            src: "{{.AssetWithoutExt}}/teller"
        format: tar.xz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/tellerops/teller/releases/download/{{.Version}}/teller-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tellerops/teller/releases/download/{{.Version}}/teller-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
