# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: so-dang-cool
    repo_name: sigi
    aliases:
      - name: sigi-cli/sigi
    description: Sigi - a tool for organizing
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 3.6.1")
        no_asset: true
      - version_constraint: semver("<= 3.6.3")
        type: http
        url: https://gh-proxy.org/github.com/so-dang-cool/sigi/releases/download/{{.Version}}/sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-gnu
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/so-dang-cool/sigi/releases/download/{{.Version}}/sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}.sha256sum
          asset: sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}.sha256sum
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/so-dang-cool/sigi/releases/download/{{.Version}}/sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-gnu
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/so-dang-cool/sigi/releases/download/{{.Version}}/sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}.sha256sum
          asset: sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}.sha256sum
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/so-dang-cool/sigi/releases/download/{{.Version}}/sigi_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
