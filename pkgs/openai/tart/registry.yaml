# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/openai/tart/releases/download/{{.Version}}/tart.tar.gz
    repo_owner: openai
    repo_name: tart
    description: macOS and Linux VMs on Apple Silicon to use in CI and other automations
    asset: tart.tar.gz
    aliases:
      - name: cirruslabs/tart
    files:
      - name: tart
        src: tart.app/Contents/MacOS/tart
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/openai/tart/releases/download/{{.Version}}/tart_{{.Version}}_checksums.txt
      asset: tart_{{.Version}}_checksums.txt
      algorithm: sha256
    supported_envs:
      - darwin
