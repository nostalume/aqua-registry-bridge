# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: openai
    repo_name: tunnel-client
    description: "Customer-run client for Secure MCP Tunnel: connect private or localhost MCP servers to ChatGPT, Codex, the Responses API, and AgentKit without exposing them to the public internet"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.6--context-conduit-saphire"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/openai/tunnel-client/releases/download/{{.Version}}/tunnel-client-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: tunnel-client-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openai/tunnel-client/releases/download/{{.Version}}/SHA256SUMS.txt
          asset: SHA256SUMS.txt
          algorithm: sha256
