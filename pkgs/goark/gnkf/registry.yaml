# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: goark
    repo_name: gnkf
    description: Network Kanji Filter by Golang
    asset: gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    replacements:
      amd64: 64bit
      arm64: ARM64
      darwin: Darwin
      linux: Linux
      windows: Windows
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_checksums.txt
      asset: gnkf_{{trimV .Version}}_checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 0.7.5")
    version_overrides:
      - version_constraint: Version == "v0.7.4"
        type: http
        url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_.{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gnkf_.{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        checksum:
          enabled: false # checksum file was broken. https://github.com/aquaproj/aqua-registry/pull/10446#issuecomment-1455275091
      - version_constraint: semver(">= 0.6.0")
        type: http
        url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        replacements:
          amd64: 64bit
          arm64: ARM64
          darwin: macOS
          linux: Linux
          windows: Windows
      - version_constraint: semver(">= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
            replacements:
              arm64: arm64
        replacements:
          amd64: 64bit
          arm64: ARM64
          darwin: macOS
          linux: Linux
          windows: Windows
        supported_envs:
          - darwin
          - linux
          - amd64
      - version_constraint: semver("< 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            replacements:
              arm64: ARM64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/goark/gnkf/releases/download/{{.Version}}/gnkf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: 64bit
          darwin: macOS
          linux: Linux
          windows: Windows
        supported_envs:
          - darwin
          - linux
          - amd64
        rosetta2: true
