# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: getgaal
    repo_name: gaal
    description: A single CLI to keep your local repositories, AI agent skills, and MCP server configurations in sync
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/getgaal/gaal/releases/download/{{.Version}}/gaal-{{.OS}}-{{.Arch}}
        asset: gaal-{{.OS}}-{{.Arch}}
        format: raw
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/getgaal/gaal/releases/download/{{.Version}}/gaal-{{.OS}}-{{.Arch}}
        asset: gaal-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/getgaal/gaal/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
