# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/mutagen-io/mutagen/releases/download/{{.Version}}/mutagen_{{.OS}}_{{.Arch}}_{{.Version}}.tar.gz
    repo_owner: mutagen-io
    repo_name: mutagen
    asset: mutagen_{{.OS}}_{{.Arch}}_{{.Version}}.tar.gz
    description: Fast file synchronization and network forwarding for remote development
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/mutagen-io/mutagen/releases/download/{{.Version}}/SHA256SUMS
      asset: SHA256SUMS
      algorithm: sha256
