# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/mutagen-io/mutagen-compose/releases/download/{{.Version}}/mutagen-compose_{{.OS}}_{{.Arch}}_{{.Version}}.tar.gz
    repo_owner: mutagen-io
    repo_name: mutagen-compose
    asset: mutagen-compose_{{.OS}}_{{.Arch}}_{{.Version}}.tar.gz
    description: Compose with Mutagen integration
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/mutagen-io/mutagen-compose/releases/download/{{.Version}}/SHA256SUMS
      asset: SHA256SUMS
      algorithm: sha256
