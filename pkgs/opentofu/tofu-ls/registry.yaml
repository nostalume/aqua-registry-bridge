# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: opentofu
    repo_name: tofu-ls
    description: OpenTofu Language Server
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.1-alpha1"
        type: http
        url: https://gh-proxy.org/github.com/opentofu/tofu-ls/releases/download/{{.Version}}/tofu-ls_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tofu-ls_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/opentofu/tofu-ls/releases/download/{{.Version}}/tofu-ls_{{trimV .Version}}_checksums.txt
          asset: tofu-ls_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/opentofu/tofu-ls/releases/download/{{.Version}}/tofu-ls_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v0.0.1-alpha2"
        type: http
        url: https://gh-proxy.org/github.com/opentofu/tofu-ls/releases/download/{{.Version}}/tofu-ls_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tofu-ls_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/opentofu/tofu-ls/releases/download/{{.Version}}/tofu-ls_{{trimV .Version}}_checksums.txt
          asset: tofu-ls_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/opentofu/tofu-ls/releases/download/{{.Version}}/tofu-ls_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/opentofu/tofu-ls/releases/download/{{.Version}}/tofu-ls_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tofu-ls_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/opentofu/tofu-ls/releases/download/{{.Version}}/tofu-ls_{{trimV .Version}}_checksums.txt
          asset: tofu-ls_{{trimV .Version}}_checksums.txt
          algorithm: sha256
