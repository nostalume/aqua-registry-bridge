              - --certificate-identity-regexp
              - "^https://github\\.com/opentofu/opentofu/\\.github/workflows/release\\.yml@refs/heads/(main|v\\d+\\..+)$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/opentofu/opentofu/releases/download/{{.Version}}/tofu_{{trimV .Version}}_SHA256SUMS.sig
        cosign:
          opts:
            - --certificate
            - https://gh-proxy.org/github.com/opentofu/opentofu/releases/download/{{.Version}}/{{.Asset}}.pem
            - --certificate-identity-regexp
