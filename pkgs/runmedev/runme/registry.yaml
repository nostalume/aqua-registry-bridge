# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: runmedev
    repo_name: runme
    description: DevOps Notebooks Built with Markdown
    version_constraint: "false"
    aliases:
      - name: stateful/rdme
      - name: stateful/runme
    version_overrides:
      - version_constraint: semver("<= 0.1.12")
        type: http
        url: https://gh-proxy.org/github.com/runmedev/runme/releases/download/{{.Version}}/rdme_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: rdme_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: rdme
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/runmedev/runme/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/runmedev/runme/releases/download/{{.Version}}/rdme_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/runmedev/runme/releases/download/{{.Version}}/runme_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: runme_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/runmedev/runme/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/runmedev/runme/releases/download/{{.Version}}/runme_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
