# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: yashikota
    repo_name: tlc-static
    description: Native, JVM-free TLA+ TLC. Fully static on Linux
    files:
      - name: tlc
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/yashikota/tlc-static/releases/download/{{.Version}}/tlc-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: tlc-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yashikota/tlc-static/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/yashikota/tlc-static/releases/download/{{.Version}}/tlc-{{.OS}}-{{.Arch}}.{{.Format}}
            format: tar.gz
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/yashikota/tlc-static/releases/download/{{.Version}}/tlc-{{.OS}}-{{.Arch}}.{{.Format}}
            format: tar.gz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yashikota/tlc-static/releases/download/{{.Version}}/tlc-{{.OS}}-{{.Arch}}-emulated.{{.Format}}
            goarch: arm64
            asset: tlc-{{.OS}}-{{.Arch}}-emulated.{{.Format}}
        supported_envs:
          - linux
          - darwin/arm64
          - windows
