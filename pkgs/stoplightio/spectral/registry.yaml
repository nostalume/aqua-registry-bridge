# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: stoplightio
    repo_name: spectral
    description: A flexible JSON/YAML linter for creating automated style guides, with baked in support for OpenAPI (v3.1, v3.0, and v2.0), Arazzo v1.0, as well as AsyncAPI v2.x
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v4.0.0-beta.7"
        type: http
        url: https://gh-proxy.org/github.com/stoplightio/spectral/releases/download/{{.Version}}/spectral-cli
        asset: spectral-cli
        format: raw
        supported_envs:
          - windows/amd64
      - version_constraint: Version == "v4.2.0-beta5"
        type: http
        url: https://gh-proxy.org/github.com/stoplightio/spectral/releases/download/{{.Version}}/spectral-cli
        asset: spectral-cli
        format: raw
        supported_envs:
          - windows/amd64
      - version_constraint: Version == "v4.2.0"
        type: http
        url: https://gh-proxy.org/github.com/stoplightio/spectral/releases/download/{{.Version}}/spectral-{{.OS}}
        asset: spectral-{{.OS}}
        format: raw
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/stoplightio/spectral/releases/download/{{.Version}}/spectral-cli
            asset: spectral-cli
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: Version == "v5.4.0-beta1"
        type: http
        url: https://gh-proxy.org/github.com/stoplightio/spectral/releases/download/{{.Version}}/spectral-{{.OS}}
        asset: spectral-{{.OS}}
        format: raw
        replacements:
          darwin: macos
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "v6.7.0"
        type: http
        url: https://gh-proxy.org/github.com/stoplightio/spectral/releases/download/{{.Version}}/spectral-{{.OS}}-{{.Arch}}
        asset: spectral-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        replacements:
          amd64: x64
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/stoplightio/spectral/releases/download/{{.Version}}/spectral
            asset: spectral
        supported_envs:
