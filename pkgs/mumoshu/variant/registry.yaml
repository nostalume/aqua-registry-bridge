# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/mumoshu/variant/releases/download/{{.Version}}/variant_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: mumoshu
    repo_name: variant
    description: Wrap up your bash scripts into a modern CLI today. Graduate to a full-blown golang app tomorrow
    rosetta2: true
    asset: variant_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    supported_envs:
      - darwin
      - linux
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/mumoshu/variant/releases/download/{{.Version}}/variant_{{trimV .Version}}_checksums.txt
      asset: variant_{{trimV .Version}}_checksums.txt
      algorithm: sha256
