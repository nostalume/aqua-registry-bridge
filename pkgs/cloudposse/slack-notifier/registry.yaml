# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cloudposse
    repo_name: slack-notifier
    description: Command line utility to send messages with attachments to Slack channels via Incoming Webhooks
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/slack-notifier_{{.OS}}_{{.Arch}}
        asset: slack-notifier_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "0.5.0"
        type: http
        url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/slack-notifier_{{.OS}}_{{.Arch}}
        asset: slack-notifier_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: Version == "0.5.1"
        type: http
        url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/slack-notifier_{{.Version}}_{{.OS}}_{{.Arch}}
        asset: slack-notifier_{{.Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/slack-notifier_{{.Version}}_SHA256SUMS
          asset: slack-notifier_{{.Version}}_SHA256SUMS
          algorithm: sha256
      - version_constraint: semver("<= 0.7.0")
        no_asset: true
      - version_constraint: Version == "0.8.0"
        type: http
        url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/slack-notifier_{{.Version}}_{{.OS}}_{{.Arch}}
        asset: slack-notifier_{{.Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/slack-notifier_{{.Version}}_SHA256SUMS
          asset: slack-notifier_{{.Version}}_SHA256SUMS
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/slack-notifier_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: slack-notifier_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        files:
          - name: slack-notifier
            src: slack-notifier_v{{.Version}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cloudposse/slack-notifier/releases/download/{{.Version}}/slack-notifier_{{.Version}}_SHA256SUMS
          asset: slack-notifier_{{.Version}}_SHA256SUMS
          algorithm: sha256
