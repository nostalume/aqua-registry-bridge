# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: stripe
    repo_name: stripe-cli
    description: A command-line tool for Stripe
    files:
      - name: stripe
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.5.10"
        type: http
        url: https://gh-proxy.org/github.com/stripe/stripe-cli/releases/download/{{.Version}}/stripe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: stripe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: mac-os
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/stripe/stripe-cli/releases/download/{{.Version}}/stripe-{{.OS}}-checksums.txt
          asset: stripe-{{.OS}}-checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/stripe/stripe-cli/releases/download/{{.Version}}/stripe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            checksum:
              type: http
              url: https://gh-proxy.org/github.com/stripe/stripe-cli/releases/download/{{.Version}}/stripe-checksums.txt
              asset: stripe-checksums.txt
              algorithm: sha256
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/stripe/stripe-cli/releases/download/{{.Version}}/stripe_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
