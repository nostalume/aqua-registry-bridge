        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v1.2.0"
        no_asset: true
      - version_constraint: semver("< 2.2.0")
