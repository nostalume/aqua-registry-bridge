        asset: jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macOS
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
            files:
              - name: jwt
                src: target/release/jwt
