# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mike-engel
    repo_name: jwt-cli
    description: A super fast CLI tool to decode and encode JWTs built in Rust
    files:
      - name: jwt
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        no_asset: true
      - version_constraint: Version == "0.3.1"
        type: http
        url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: jwt-cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        files:
          - name: jwt-cli
            src: jwt-cli
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: jwt-cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        files:
          - name: jwt-cli
            src: jwt-cli
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          windows: pc-windows-msvc
        supported_envs:
          - windows/amd64
      - version_constraint: Version == "0.4.1"
        type: http
        url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
        asset: jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
        format: tar.gz
        files:
          - name: jwt-cli
            src: jwt-cli
        windows_arm_emulation: true
        replacements:
          darwin: macOS
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            asset: jwt-cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: x86_64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.7.0")
        type: http
        url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
        asset: jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macOS
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.9.0")
        no_asset: true
      - version_constraint: semver("<= 1.1.0")
        type: http
        url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
        asset: jwt-cli-{{.Version}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
