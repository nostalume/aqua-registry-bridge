        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 6.1.0")
        type: http
        url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-{{.OS}}.{{.Format}}
        asset: jwt-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-{{.OS}}.sha256
          asset: jwt-{{.OS}}.sha256
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-{{.OS}}.{{.Format}}
        asset: jwt-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macOS
          linux: linux-musl
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mike-engel/jwt-cli/releases/download/{{.Version}}/jwt-{{.OS}}.sha256
          asset: jwt-{{.OS}}.sha256
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
