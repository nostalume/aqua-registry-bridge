# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: borghei
    repo_name: ink
    description: Terminal markdown reader with syntax highlighting, inline images, and themes
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.2")
        type: http
        url: https://gh-proxy.org/github.com/borghei/ink/releases/download/{{.Version}}/ink-{{.OS}}-{{.Arch}}
        asset: ink-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          darwin: macos
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/borghei/ink/releases/download/{{.Version}}/ink-{{.OS}}-{{.Arch}}
        asset: ink-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/borghei/ink/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
