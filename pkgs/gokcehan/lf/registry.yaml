# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/gokcehan/lf/releases/download/{{.Version}}/lf-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: gokcehan
    repo_name: lf
    description: Terminal file manager
    supported_envs:
      - darwin
      - linux
      - amd64
    rosetta2: true
    asset: lf-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/gokcehan/lf/releases/download/{{.Version}}/lf-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
