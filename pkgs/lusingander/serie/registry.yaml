# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: lusingander
    repo_name: serie
    description: A rich git commit graph in your terminal, like magic
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.1")
        type: http
        url: https://gh-proxy.org/github.com/lusingander/serie/releases/download/{{.Version}}/serie-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: serie-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/lusingander/serie/releases/download/{{.Version}}/checksum.txt
          asset: checksum.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/lusingander/serie/releases/download/{{.Version}}/serie-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/lusingander/serie/releases/download/{{.Version}}/serie-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: serie-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/lusingander/serie/releases/download/{{.Version}}/checksum.txt
          asset: checksum.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
