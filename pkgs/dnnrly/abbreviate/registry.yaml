# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/dnnrly/abbreviate/releases/download/{{.Version}}/abbreviate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: dnnrly
    repo_name: abbreviate
    description: Supporting your devops by shortening your strings using common abbreviations and clever guesswork
    rosetta2: true
    asset: abbreviate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/dnnrly/abbreviate/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
