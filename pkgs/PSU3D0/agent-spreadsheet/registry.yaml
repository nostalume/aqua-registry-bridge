# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: PSU3D0
    repo_name: agent-spreadsheet
    description: MCP server for spreadsheet analysis and editing. Slim, token-efficient tool surface designed for LLM agents
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.10.1"
        type: http
        url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/spreadsheet-cli-{{.OS}}-{{.Arch}}
        asset: spreadsheet-cli-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/spreadsheet-cli-{{.OS}}-{{.Arch}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.11.1"
        type: http
        url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/spreadsheet-mcp-{{.OS}}-{{.Arch}}
        asset: spreadsheet-mcp-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/spreadsheet-mcp-{{.OS}}-{{.Arch}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.12.0"
        type: http
        url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/agent-spreadsheet-{{.OS}}-{{.Arch}}
        asset: agent-spreadsheet-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/agent-spreadsheet-{{.OS}}-{{.Arch}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/spreadsheet-read-mcp-{{.OS}}-{{.Arch}}
        asset: spreadsheet-read-mcp-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/spreadsheet-read-mcp-{{.OS}}-{{.Arch}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.10.0")
        type: http
        url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/spreadsheet-mcp-{{.OS}}-{{.Arch}}
        asset: spreadsheet-mcp-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/spreadsheet-mcp-{{.OS}}-{{.Arch}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/agent-spreadsheet-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: agent-spreadsheet-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: agent-spreadsheet
          - name: asp
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/PSU3D0/agent-spreadsheet/releases/download/{{.Version}}/agent-spreadsheet-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
            replacements: {}
