# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kevwan
    repo_name: tproxy
    description: A cli tool to proxy and analyze TCP connections
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.1")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kevwan/tproxy/releases/download/{{.Version}}/tproxy-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: tproxy-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kevwan/tproxy/releases/download/{{.Version}}/tproxy-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
