# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kentaro-m
    repo_name: md2confl
    description: md2confl is a CLI tool to convert the markdown text to confluence wiki format
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/kentaro-m/md2confl/releases/download/{{.Version}}/{{.OS}}_{{.Arch}}_md2confl
        asset: "{{.OS}}_{{.Arch}}_md2confl"
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kentaro-m/md2confl/releases/download/{{.Version}}/md2confl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: md2confl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kentaro-m/md2confl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
