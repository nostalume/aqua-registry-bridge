# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: rootless-containers
    repo_name: slirp4netns
    description: User-mode networking for unprivileged network namespaces
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.3.2")
        type: http
        url: https://gh-proxy.org/github.com/rootless-containers/slirp4netns/releases/download/{{.Version}}/slirp4netns-{{.Arch}}
        asset: slirp4netns-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm: armv7l
          arm64: aarch64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rootless-containers/slirp4netns/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/rootless-containers/slirp4netns/releases/download/{{.Version}}/slirp4netns-{{.Arch}}
        asset: slirp4netns-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm: armv7l
          arm64: aarch64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rootless-containers/slirp4netns/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
        github_artifact_attestations:
          signer_workflow: rootless-containers/slirp4netns/.github/workflows/release.yaml
