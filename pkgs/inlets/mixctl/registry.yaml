# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: inlets
    repo_name: mixctl
    description: A tiny TCP load balancer
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "0.0.3-rc1"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/inlets/mixctl/releases/download/{{.Version}}/mixctl
        format: raw
        asset: mixctl
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/inlets/mixctl/releases/download/{{.Version}}/mixctl-arm64
            goarch: arm64
            asset: mixctl-arm64
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/inlets/mixctl/releases/download/{{.Version}}/mixctl-darwin
            goarch: amd64
            asset: mixctl-darwin
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/inlets/mixctl/releases/download/{{.Version}}/mixctl-darwin-arm64
            goarch: arm64
            asset: mixctl-darwin-arm64
        supported_envs:
          - darwin
          - linux
          - amd64
