# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cswank
    repo_name: kcli
    description: A kafka command line browser
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["1.4.0", "1.8.1", "1.8.2"]
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cswank/kcli/releases/download/{{.Version}}/kcli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kcli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cswank/kcli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
