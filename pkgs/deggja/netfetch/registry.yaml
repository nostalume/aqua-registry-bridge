# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: deggja
    repo_name: netfetch
    description: Kubernetes tool for scanning clusters for network policies and identifying unprotected workloads
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/deggja/netfetch/releases/download/{{.Version}}/netfetch_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: netfetch_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: netfetch
            src: "{{.AssetWithoutExt}}/netfetch"
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/deggja/netfetch/releases/download/{{.Version}}/netfetch_{{trimV .Version}}_checksums.txt
          asset: netfetch_{{trimV .Version}}_checksums.txt
          algorithm: sha256
