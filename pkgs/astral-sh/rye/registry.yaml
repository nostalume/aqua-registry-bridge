# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: astral-sh
    repo_name: rye
    aliases:
      - name: mitsuhiko/rye
    description: a Hassle-Free Python Experience
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.2")
        type: http
        url: https://gh-proxy.org/github.com/astral-sh/rye/releases/download/{{.Version}}/rye-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rye-{{.Arch}}-{{.OS}}.{{.Format}}
        format: gz
        windows_arm_emulation: true
        files:
          - name: rye
            src: rye-{{.Arch}}-{{.OS}}
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/astral-sh/rye/releases/download/{{.Version}}/rye-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/astral-sh/rye/releases/download/{{.Version}}/rye-{{.Arch}}-{{.OS}}
            format: raw
            asset: rye-{{.Arch}}-{{.OS}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/astral-sh/rye/releases/download/{{.Version}}/rye-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rye-{{.Arch}}-{{.OS}}.{{.Format}}
        format: gz
        windows_arm_emulation: true
        files:
          - name: rye
            src: rye-{{.Arch}}-{{.OS}}
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/astral-sh/rye/releases/download/{{.Version}}/rye-{{.Arch}}-{{.OS}}
            format: raw
            asset: rye-{{.Arch}}-{{.OS}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/astral-sh/rye/releases/download/{{.Version}}/rye-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rye-{{.Arch}}-{{.OS}}.{{.Format}}
        format: gz
        windows_arm_emulation: true
        files:
          - name: rye
            src: rye-{{.Arch}}-{{.OS}}
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/astral-sh/rye/releases/download/{{.Version}}/rye-{{.Arch}}-{{.OS}}
            format: raw
            asset: rye-{{.Arch}}-{{.OS}}
