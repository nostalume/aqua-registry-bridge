# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Gentleman-Programming
    repo_name: gentle-ai
    description: Ecosystem, frameworks, and workflows for AI coding agents
    version_filter: Version startsWith "v" and not (Version contains "-")
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.2.1")
        type: http
        url: https://gh-proxy.org/github.com/Gentleman-Programming/gentle-ai/releases/download/{{.Version}}/gentle-ai_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gentle-ai_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Gentleman-Programming/gentle-ai/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 2.1.11")
        type: http
        url: https://gh-proxy.org/github.com/Gentleman-Programming/gentle-ai/releases/download/{{.Version}}/gentle-ai_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gentle-ai_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Gentleman-Programming/gentle-ai/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Gentleman-Programming/gentle-ai/releases/download/{{.Version}}/gentle-ai_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Gentleman-Programming/gentle-ai/releases/download/{{.Version}}/gentle-ai_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gentle-ai_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Gentleman-Programming/gentle-ai/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
