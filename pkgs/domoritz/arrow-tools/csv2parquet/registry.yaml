# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: domoritz/arrow-tools/csv2parquet
    type: github_release
    repo_owner: domoritz
    repo_name: arrow-tools
    description: Convert CSV files to Apache Parquet. This package is part of Arrow CLI tools
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.12.0"
        no_asset: true
      - version_constraint: semver("<= 0.8.0")
        type: http
        url: https://gh-proxy.org/github.com/domoritz/arrow-tools/releases/download/{{.Version}}/csv2parquet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: csv2parquet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: csv2parquet
            src: "{{.AssetWithoutExt}}/csv2parquet"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/domoritz/arrow-tools/releases/download/{{.Version}}/csv2parquet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: csv2parquet
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.8.1"
