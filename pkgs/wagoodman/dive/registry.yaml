# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: wagoodman
    repo_name: dive
    description: A tool for exploring each layer in a docker image
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/wagoodman/dive/releases/download/{{.Version}}/dive_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dive_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/wagoodman/dive/releases/download/{{.Version}}/dive_{{trimV .Version}}_checksums.txt
          asset: dive_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.10.0")
        type: http
        url: https://gh-proxy.org/github.com/wagoodman/dive/releases/download/{{.Version}}/dive_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dive_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/wagoodman/dive/releases/download/{{.Version}}/dive_{{trimV .Version}}_checksums.txt
          asset: dive_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/wagoodman/dive/releases/download/{{.Version}}/dive_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/wagoodman/dive/releases/download/{{.Version}}/dive_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dive_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/wagoodman/dive/releases/download/{{.Version}}/dive_{{trimV .Version}}_checksums.txt
          asset: dive_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/wagoodman/dive/releases/download/{{.Version}}/dive_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
