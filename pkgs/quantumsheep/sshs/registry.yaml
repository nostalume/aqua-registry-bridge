# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: quantumsheep
    repo_name: sshs
    description: Terminal user interface for SSH
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 3.4.0")
        type: http
        url: https://gh-proxy.org/github.com/quantumsheep/sshs/releases/download/{{.Version}}/sshs-{{.OS}}-{{.Arch}}
        asset: sshs-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/quantumsheep/sshs/releases/download/{{.Version}}/sshs-{{.OS}}-{{.Arch}}
        asset: sshs-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          file_format: regexp
          asset: "{{.Asset}}.sha256"
          pattern:
            checksum: ^(\b[A-Fa-f0-9]{64}\b)
          algorithm: sha256
