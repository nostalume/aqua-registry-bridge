# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/minishift/minishift/releases/download/{{.Version}}/minishift-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: minishift
    repo_name: minishift
    description: Run OpenShift 3.x locally
    rosetta2: true
    supported_envs:
      - darwin
      - amd64
    asset: minishift-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tgz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/minishift/minishift/releases/download/{{.Version}}/minishift-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    files:
      - name: minishift
        src: minishift-{{trimV .Version}}-{{.OS}}-{{.Arch}}/minishift
    checksum:
      type: http
      url: "{{.AssetURL}}.sha256"
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
