# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mitsuhiko
    repo_name: minijinja
    description: MiniJinja is a powerful but minimal dependency template engine for Rust compatible with Jinja/Jinja2
    files:
      - name: minijinja-cli
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 2.3.1")
        type: http
        url: https://gh-proxy.org/github.com/mitsuhiko/minijinja/releases/download/{{.Version}}/minijinja-cli-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: minijinja-cli-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: minijinja-cli
            src: "{{.AssetWithoutExt}}/minijinja-cli"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/mitsuhiko/minijinja/releases/download/{{.Version}}/minijinja-cli-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mitsuhiko/minijinja/releases/download/{{.Version}}/minijinja-cli-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: minijinja-cli
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mitsuhiko/minijinja/releases/download/{{.Version}}/minijinja-cli-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: minijinja-cli-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: minijinja-cli
            src: "{{.AssetWithoutExt}}/minijinja-cli"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mitsuhiko/minijinja/releases/download/{{.Version}}/minijinja-cli-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: minijinja-cli
