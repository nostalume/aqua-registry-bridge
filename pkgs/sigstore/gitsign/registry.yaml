# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sigstore
    repo_name: gitsign
    description: Keyless Git signing using Sigstore
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.1-alpha")
        no_asset: true
      - version_constraint: semver("<= 0.14.0")
        type: http
        url: https://gh-proxy.org/github.com/sigstore/gitsign/releases/download/{{.Version}}/gitsign_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: gitsign_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sigstore/gitsign/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        cosign:
          opts:
            - --certificate
            - https://gh-proxy.org/github.com/sigstore/gitsign/releases/download/{{.Version}}/{{.Asset}}.pem
            - --certificate-identity
            - https://gh-proxy.org/github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/{{.Version}}
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --signature
            - https://gh-proxy.org/github.com/sigstore/gitsign/releases/download/{{.Version}}/{{.Asset}}.sig
      - version_constraint: Version == "v0.15.0"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sigstore/gitsign/releases/download/{{.Version}}/gitsign_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: gitsign_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sigstore/gitsign/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/sigstore/gitsign/releases/download/{{.Version}}/{{.Asset}}.bundle
            asset: "{{.Asset}}.bundle"
          opts:
            - --certificate-identity
            - https://gh-proxy.org/github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/{{.Version}}
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
