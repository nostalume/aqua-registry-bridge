# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: allyring
    repo_name: pvw
    description: A port viewer TUI made with BubbleTea in Go
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.3.1")
        type: http
        url: https://gh-proxy.org/github.com/allyring/pvw/releases/download/{{.Version}}/pvw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pvw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/allyring/pvw/releases/download/{{.Version}}/pvw_{{trimV .Version}}_checksums.txt
          asset: pvw_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 1.4.1")
        type: http
        url: https://gh-proxy.org/github.com/allyring/pvw/releases/download/{{.Version}}/pvw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pvw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/allyring/pvw/releases/download/{{.Version}}/pvw_{{trimV .Version}}_checksums.txt
          asset: pvw_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/allyring/pvw/releases/download/{{.Version}}/pvw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pvw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/allyring/pvw/releases/download/{{.Version}}/pvw_{{trimV .Version}}_checksums.txt
          asset: pvw_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
