# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ossf
    repo_name: scorecard
    description: OpenSSF Scorecard - Security health metrics for Open Source
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0") || Version == "v4.9.0"
        no_asset: true
      - version_constraint: Version == "v1.1.0"
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_checksums.txt
          asset: scorecard_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 2.1.2")
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_checksums.txt
          asset: scorecard_{{trimV .Version}}_checksums.txt
          algorithm: sha512
      - version_constraint: Version == "v2.1.3"
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_checksums.txt
          asset: scorecard_{{trimV .Version}}_checksums.txt
          algorithm: sha512
      - version_constraint: semver("<= 3.0.1")
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_checksums.txt
          asset: scorecard_{{trimV .Version}}_checksums.txt
          algorithm: sha512
      - version_constraint: semver("<= 4.4.0")
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: scorecard
            src: scorecard-{{.OS}}-{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_checksums.txt
          asset: scorecard_checksums.txt
          algorithm: sha512
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            goarch: amd64
            checksum:
              enabled: false
      - version_constraint: Version == "v4.5.0"
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: scorecard
            src: scorecard-{{.OS}}-{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_checksums.txt
          asset: scorecard_checksums.txt
          algorithm: sha512
        supported_envs:
          - linux/arm64
          - darwin
          - windows
      - version_constraint: semver("<= 4.8.0")
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: scorecard
            src: scorecard-{{.OS}}-{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_checksums.txt
          asset: scorecard_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 5.0.0")
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: scorecard
            src: scorecard-{{.OS}}-{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_checksums.txt
          asset: scorecard_checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scorecard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/scorecard_checksums.txt
          asset: scorecard_checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/ossf/scorecard/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
