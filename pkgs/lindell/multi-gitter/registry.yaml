# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/lindell/multi-gitter/releases/download/{{.Version}}/multi-gitter_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: lindell
    repo_name: multi-gitter
    asset: multi-gitter_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: CLI to update multiple repositories in bulk
    replacements:
      amd64: x86_64
      arm64: ARM64
      darwin: Darwin
      linux: Linux
      windows: Windows
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/lindell/multi-gitter/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
