# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/librespeed/speedtest-cli/releases/download/{{.Version}}/librespeed-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: librespeed
    repo_name: speedtest-cli
    asset: librespeed-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: librespeed-cli
        src: librespeed-cli
    description: Command line client for LibreSpeed
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/librespeed/speedtest-cli/releases/download/{{.Version}}/librespeed-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/librespeed/speedtest-cli/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
