# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kubermatic
    repo_name: kubeone
    asset: kubeone_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
    description: Kubermatic KubeOne automate cluster operations on all your cloud, on-prem, edge, and IoT environments
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 1.4.2")
        type: http
        url: https://gh-proxy.org/github.com/kubermatic/kubeone/releases/download/{{.Version}}/kubeone_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.13.5")
        type: http
        url: https://gh-proxy.org/github.com/kubermatic/kubeone/releases/download/{{.Version}}/kubeone_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
        supported_envs:
          - linux
          - darwin
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubermatic/kubeone/releases/download/{{.Version}}/kubeone_{{trimV .Version}}_checksums.txt
          asset: kubeone_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kubermatic/kubeone/releases/download/{{.Version}}/kubeone_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
        supported_envs:
          - linux
          - darwin
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubermatic/kubeone/releases/download/{{.Version}}/kubeone_{{trimV .Version}}_checksums.txt
          asset: kubeone_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/kubermatic/kubeone/releases/download/{{.Version}}/kubeone_{{trimV .Version}}_checksums.txt.sigstore.json
              asset: kubeone_{{trimV .Version}}_checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/kubermatic/kubeone/.github/workflows/release.yml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
