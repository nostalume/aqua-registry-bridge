# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: arttor
    repo_name: helmify
    description: Creates Helm chart from Kubernetes yaml
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.3.0"
        type: http
        url: https://gh-proxy.org/github.com/arttor/helmify/releases/download/{{.Version}}/helmify-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: helmify-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/arttor/helmify/releases/download/{{.Version}}/helmify-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.2.2")
        no_asset: true
      - version_constraint: semver("<= 0.4.4")
        type: http
        url: https://gh-proxy.org/github.com/arttor/helmify/releases/download/{{.Version}}/helmify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: helmify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: 64-bit
          darwin: macOS
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/arttor/helmify/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/arttor/helmify/releases/download/{{.Version}}/helmify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/arttor/helmify/releases/download/{{.Version}}/helmify_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: helmify_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/arttor/helmify/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/arttor/helmify/releases/download/{{.Version}}/helmify_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
