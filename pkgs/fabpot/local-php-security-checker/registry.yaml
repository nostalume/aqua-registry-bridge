# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fabpot
    repo_name: local-php-security-checker
    description: PHP security vulnerabilities checker
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/fabpot/local-php-security-checker/releases/download/{{.Version}}/local-php-security-checker_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: local-php-security-checker_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fabpot/local-php-security-checker/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 2.0.6")
        type: http
        url: https://gh-proxy.org/github.com/fabpot/local-php-security-checker/releases/download/{{.Version}}/local-php-security-checker_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: local-php-security-checker_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fabpot/local-php-security-checker/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fabpot/local-php-security-checker/releases/download/{{.Version}}/local-php-security-checker_{{.OS}}_{{.Arch}}
        asset: local-php-security-checker_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fabpot/local-php-security-checker/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
