        url: https://gh-proxy.org/github.com/sass/dart-sass/releases/download/{{.Version}}/dart-sass-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: dart-sass-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x64
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/sass/dart-sass/releases/download/{{.Version}}/dart-sass-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: Version == "1.23.6"
