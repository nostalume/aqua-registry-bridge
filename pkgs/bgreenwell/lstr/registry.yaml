# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: bgreenwell
    repo_name: lstr
    description: A fast, minimalist directory tree viewer, written in Rust
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.2.1"
        type: http
        url: https://gh-proxy.org/github.com/bgreenwell/lstr/releases/download/{{.Version}}/lstr-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: lstr-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bgreenwell/lstr/releases/download/{{.Version}}/lstr-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/bgreenwell/lstr/releases/download/{{.Version}}/lstr-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lstr-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: lstr
            src: "{{.AssetWithoutExt}}/lstr"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/bgreenwell/lstr/releases/download/{{.Version}}/lstr-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/bgreenwell/lstr/releases/download/{{.Version}}/lstr-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              linux: unknown-linux-gnu
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bgreenwell/lstr/releases/download/{{.Version}}/lstr-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: lstr
