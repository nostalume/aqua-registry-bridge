# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: containrrr
    repo_name: shoutrrr
    description: Notification library for gophers and their furry friends
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.1")
        type: http
        url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{trimV .Version}}_checksums.txt
          asset: shoutrrr_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{.OS}}_{{.Arch}}v8.{{.Format}}
            goarch: arm64
            asset: shoutrrr_{{.OS}}_{{.Arch}}v8.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - windows/amd64
      - version_constraint: semver("<= 0.7.1")
        type: http
        url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{trimV .Version}}_checksums.txt
          asset: shoutrrr_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        replacements:
          arm64: arm64v8
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - windows
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{trimV .Version}}_checksums.txt
          asset: shoutrrr_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/containrrr/shoutrrr/releases/download/{{.Version}}/shoutrrr_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux
          - windows
