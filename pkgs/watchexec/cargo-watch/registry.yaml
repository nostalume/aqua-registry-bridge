# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: watchexec
    repo_name: cargo-watch
    description: Watches over your Cargo project's source
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 7.0.1")
        no_asset: true
      - version_constraint: semver("<= 7.0.5")
        type: http
        url: https://gh-proxy.org/github.com/watchexec/cargo-watch/releases/download/{{.Version}}/cargo-watch-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: cargo-watch-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: cargo-watch
            src: "{{.AssetWithoutExt}}/cargo-watch"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-gnu
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/watchexec/cargo-watch/releases/download/{{.Version}}/cargo-watch-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: cargo-watch
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 7.5.1")
