# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ayoisaiah
    repo_name: f2
    description: F2 is a cross-platform command-line tool for batch renaming files and directories quickly and safely. Written in Go
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0.0"
        no_asset: true
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/ayoisaiah/f2/releases/download/{{.Version}}/goname-{{.OS}}
        asset: goname-{{.OS}}
        format: raw
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.9.1")
        type: http
        url: https://gh-proxy.org/github.com/ayoisaiah/f2/releases/download/{{.Version}}/f2_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: f2_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ayoisaiah/f2/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ayoisaiah/f2/releases/download/{{.Version}}/f2_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: f2_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ayoisaiah/f2/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ayoisaiah/f2/releases/download/{{.Version}}/f2_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
