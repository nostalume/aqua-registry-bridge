# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/mattermost/mmctl/releases/download/{{.Version}}/{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: mattermost
    repo_name: mmctl
    asset: "{{.OS}}_{{.Arch}}.{{.Format}}"
    format: tar
    description: A remote CLI tool for Mattermost
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/mattermost/mmctl/releases/download/{{.Version}}/{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: "{{.AssetURL}}.md5.txt"
      asset: "{{.Asset}}.md5.txt"
      algorithm: md5
