# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: chime
    repo_name: mani-diffy
    description: mani-diffy walks a hierarchy of Argo CD Application templates, renders Kubernetes manifests from the input templates, and posts the rendered files back for the user to review and validate
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/chime/mani-diffy/releases/download/{{.Version}}/mani-diffy
        asset: mani-diffy
        format: raw
        supported_envs:
          - linux/amd64
          - darwin/arm64
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/chime/mani-diffy/releases/download/{{.Version}}/mani-diffy-{{.OS}}-{{.Arch}}
            goarch: arm64
            asset: mani-diffy-{{.OS}}-{{.Arch}}
