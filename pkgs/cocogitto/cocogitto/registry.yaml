        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: cog
            src: "{{.Arch}}-{{.OS}}/cog"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
