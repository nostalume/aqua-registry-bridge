            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/cocogitto/cocogitto/releases/download/{{.Version}}/cocogitto-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
