# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: kastenhq/external-tools/k10tools
    type: http
    url: https://gh-proxy.org/github.com/kastenhq/external-tools/releases/download/{{.Version}}/k10tools_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: kastenhq
    repo_name: external-tools
    description: Used to distribute external tools
    asset: k10tools_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: k10tools
    replacements:
      darwin: macOS
    supported_envs:
      - linux
      - darwin
    rosetta2: true
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/kastenhq/external-tools/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 6.0.3")
    version_overrides:
      - version_constraint: semver(">= 4.5.0")
        type: http
        url: https://gh-proxy.org/github.com/kastenhq/external-tools/releases/download/{{.Version}}/k10tools_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        rosetta2: false
      - version_constraint: semver(">= 4.0.3")
        type: http
        url: https://gh-proxy.org/github.com/kastenhq/external-tools/releases/download/{{.Version}}/k10tools_{{.Version}}_{{.OS}}_{{.Arch}}
        asset: k10tools_{{.Version}}_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: false
      - version_constraint: semver(">= 3.0.7")
        type: http
        url: https://gh-proxy.org/github.com/kastenhq/external-tools/releases/download/{{.Version}}/k10tools_{{.Version}}_{{.OS}}_{{.Arch}}
        asset: k10tools_{{.Version}}_{{.OS}}_{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("< 3.0.7")
        no_asset: true
