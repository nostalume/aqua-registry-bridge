# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kastenhq
    repo_name: kubestr
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v0.4.14", "v0.4.32", "v0.4.42"]
        no_asset: true
      - version_constraint: Version == "v0.4.23"
        type: http
        url: https://gh-proxy.org/github.com/kastenhq/kubestr/releases/download/{{.Version}}/kubestr-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: kubestr-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kastenhq/kubestr/releases/download/{{.Version}}/kubestr-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.4.29"
        type: http
        url: https://gh-proxy.org/github.com/kastenhq/kubestr/releases/download/{{.Version}}/kubestr_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubestr_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kastenhq/kubestr/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.3.0")
        no_asset: true
      - version_constraint: semver("<= 0.4.18")
        type: http
        url: https://gh-proxy.org/github.com/kastenhq/kubestr/releases/download/{{.Version}}/kubestr-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: kubestr-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kastenhq/kubestr/releases/download/{{.Version}}/kubestr-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.22")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kastenhq/kubestr/releases/download/{{.Version}}/kubestr_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubestr_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: MacOS
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kastenhq/kubestr/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
