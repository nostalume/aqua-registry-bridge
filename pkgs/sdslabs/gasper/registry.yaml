# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/sdslabs/gasper/releases/download/{{.Version}}/gasper_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: sdslabs
    repo_name: gasper
    asset: gasper_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: Your Cloud in a Binary
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/sdslabs/gasper/releases/download/{{.Version}}/gasper_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    rosetta2: true
    files:
      - name: gasper
        src: gasper_{{.Version}}_{{.OS}}_{{.Arch}}/gasper
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/sdslabs/gasper/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: md5
