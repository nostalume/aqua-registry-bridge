# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/bats-core/bats-core/archive/{{.Version}}.tar.gz
    format: tar.gz
    repo_owner: bats-core
    repo_name: bats-core
    description: Bash Automated Testing System
    supported_envs:
      - darwin
      - linux
    files:
      - name: bats
        src: bats-core-{{trimV .Version}}/bin/bats
