# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kunchenguid
    repo_name: treehouse
    description: Manage worktrees without managing worktrees
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0.0"
        type: http
        url: https://gh-proxy.org/github.com/kunchenguid/treehouse/releases/download/{{.Version}}/treehouse-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: treehouse-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kunchenguid/treehouse/releases/download/{{.Version}}/treehouse-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kunchenguid/treehouse/releases/download/{{.Version}}/treehouse-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: treehouse-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kunchenguid/treehouse/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kunchenguid/treehouse/releases/download/{{.Version}}/treehouse-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
