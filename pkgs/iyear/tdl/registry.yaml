# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: iyear
    repo_name: tdl
    description: A Telegram toolkit written in Golang
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/iyear/tdl/releases/download/{{.Version}}/tdl_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tdl_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: 64bit
          darwin: MacOS
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/iyear/tdl/releases/download/{{.Version}}/tdl_checksums.txt
          asset: tdl_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/iyear/tdl/releases/download/{{.Version}}/tdl_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
