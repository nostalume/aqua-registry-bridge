# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Gaurav-Gosain
    repo_name: tuios
    description: Terminal UI OS (Terminal Multiplexer)
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.5"
        type: http
        url: https://gh-proxy.org/github.com/Gaurav-Gosain/tuios/releases/download/{{.Version}}/tuios_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tuios_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Gaurav-Gosain/tuios/releases/download/{{.Version}}/tuios_{{trimV .Version}}_checksums.txt
          asset: tuios_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: Version == "v0.0.6"
        type: http
        url: https://gh-proxy.org/github.com/Gaurav-Gosain/tuios/releases/download/{{.Version}}/tuios_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tuios_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Gaurav-Gosain/tuios/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Gaurav-Gosain/tuios/releases/download/{{.Version}}/tuios_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Gaurav-Gosain/tuios/releases/download/{{.Version}}/tuios_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tuios_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Gaurav-Gosain/tuios/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
