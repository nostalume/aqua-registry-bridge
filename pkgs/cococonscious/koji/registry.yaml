# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cococonscious
    repo_name: koji
    aliases:
      - name: its-danny/koji
    description: An interactive CLI for creating conventional commits
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.2.0")
        type: http
        url: https://gh-proxy.org/github.com/cococonscious/koji/releases/download/{{.Version}}/koji-{{.OS}}-{{.Arch}}
        asset: koji-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        complete_windows_ext: false
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.4.0")
        type: http
        url: https://gh-proxy.org/github.com/cococonscious/koji/releases/download/{{.Version}}/koji-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: koji-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: osx
          linux: unknown-linux-musl
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 2.2.0")
        type: http
        url: https://gh-proxy.org/github.com/cococonscious/koji/releases/download/{{.Version}}/koji-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: koji-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        files:
          - name: koji
            src: "{{.AssetWithoutExt}}/koji"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/cococonscious/koji/releases/download/{{.Version}}/koji-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cococonscious/koji/releases/download/{{.Version}}/koji-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: koji-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/cococonscious/koji/releases/download/{{.Version}}/koji-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: amd64
        supported_envs:
          - linux/amd64
          - darwin/arm64
          - windows
