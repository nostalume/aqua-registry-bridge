# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/thestormforge/optimize-controller/releases/download/{{.Version}}/stormforge-{{.OS}}-{{.Arch}}.tar.gz
    repo_owner: thestormforge
    repo_name: optimize-controller
    asset: stormforge-{{.OS}}-{{.Arch}}.tar.gz
    description: Release with Confidence
    supported_envs:
      - linux/amd64
      - darwin
    files:
      - name: stormforge
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/thestormforge/optimize-controller/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
