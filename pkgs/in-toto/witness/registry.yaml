# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: in-toto
    repo_name: witness
    description: Witness is a pluggable framework for software supply chain risk management.  It automates, normalizes, and verifies software artifact provenance
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.13"
        type: http
        url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}-{{.OS}}_{{.Arch}}.{{.Format}}
        asset: witness_{{trimV .Version}}-{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
      - version_constraint: semver("<= 0.1.11")
        type: http
        url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: witness_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_checksums.txt
          asset: witness_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.6.0")
        type: http
        url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: witness_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_checksums.txt
          asset: witness_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("< 0.10.2-rc1")
        type: http
        url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: witness_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_checksums.txt
          asset: witness_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity
              - "https://gh-proxy.org/github.com/in-toto/witness/.github/workflows/release.yml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_checksums.txt.sig
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: witness_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_checksums.txt
          asset: witness_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/in-toto/witness/releases/download/{{.Version}}/witness_{{trimV .Version}}_checksums.txt.sigstore.json
              asset: witness_{{trimV .Version}}_checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - "https://gh-proxy.org/github.com/in-toto/witness/.github/workflows/release.yml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
