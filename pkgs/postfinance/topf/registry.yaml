# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: postfinance
    repo_name: topf
    description: Talos orchestrator by PostFinance
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/postfinance/topf/releases/download/{{.Version}}/topf_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: topf_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/postfinance/topf/releases/download/{{.Version}}/topf_{{trimV .Version}}_checksums.txt
          asset: topf_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
