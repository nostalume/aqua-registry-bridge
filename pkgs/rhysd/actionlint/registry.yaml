# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: rhysd
    repo_name: actionlint
    description: ":octocat: Static checker for GitHub Actions workflow files"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.4.0")
        type: http
        url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_checksums.txt
          asset: actionlint_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 1.6.1")
        type: http
        url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_checksums.txt
          asset: actionlint_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 1.7.10")
        type: http
        url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_checksums.txt
          asset: actionlint_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_checksums.txt
          asset: actionlint_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/rhysd/actionlint/releases/download/{{.Version}}/actionlint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        github_artifact_attestations:
          signer_workflow: rhysd/actionlint/.github/workflows/release.yaml
