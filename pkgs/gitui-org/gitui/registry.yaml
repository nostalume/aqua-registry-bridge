# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gitui-org
    repo_name: gitui
    aliases:
      - name: extrawurst/gitui
    description: Blazing  fast terminal-ui for git written in rust
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.7")
        type: http
        url: https://gh-proxy.org/github.com/gitui-org/gitui/releases/download/{{.Version}}/gitui-{{.OS}}.{{.Format}}
        asset: gitui-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          darwin: mac
        supported_envs:
          - darwin
      - version_constraint: Version == "v0.1.8"
        type: http
        url: https://gh-proxy.org/github.com/gitui-org/gitui/releases/download/{{.Version}}/gitui-{{.OS}}.{{.Format}}
        asset: gitui-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          darwin: mac
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.1.11")
        type: http
        url: https://gh-proxy.org/github.com/gitui-org/gitui/releases/download/{{.Version}}/gitui-{{.OS}}-musl.{{.Format}}
        asset: gitui-{{.OS}}-musl.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          darwin: mac
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/gitui-org/gitui/releases/download/{{.Version}}/gitui-{{.OS}}.{{.Format}}
