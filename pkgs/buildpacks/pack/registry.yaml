# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: buildpacks
    repo_name: pack
    description: CLI for building apps using Cloud Native Buildpacks
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.1"
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.OS}}
        asset: pack-{{.OS}}
        format: raw
        replacements:
          darwin: macos
        supported_envs:
          - darwin
      - version_constraint: Version == "v0.0.3"
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.OS}}
        asset: pack-{{.OS}}
        format: raw
        replacements:
          darwin: macos
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "v0.0.4"
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.OS}}.{{.Format}}
        asset: pack-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macos
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "v0.0.5"
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{trimV .Version}}-{{.OS}}.{{.Format}}
        asset: pack-{{trimV .Version}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macos
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.0.9")
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{trimV .Version}}-{{.OS}}.{{.Format}}
        asset: pack-{{trimV .Version}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{trimV .Version}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.13.1")
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}.{{.Format}}
        asset: pack-{{.Version}}-{{.OS}}.{{.Format}}
        format: tgz
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.16.0")
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}.{{.Format}}
        asset: pack-{{.Version}}-{{.OS}}.{{.Format}}
        format: tgz
        replacements:
          darwin: macos
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.24.1")
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}.{{.Format}}
        asset: pack-{{.Version}}-{{.OS}}.{{.Format}}
        format: tgz
        replacements:
          darwin: macos
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            goarch: arm64
            asset: pack-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}.{{.Format}}
        asset: pack-{{.Version}}-{{.OS}}.{{.Format}}
        format: tgz
        replacements:
          darwin: macos
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            goarch: arm64
            asset: pack-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            goarch: arm64
            asset: pack-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/buildpacks/pack/releases/download/{{.Version}}/pack-{{.Version}}-{{.OS}}.{{.Format}}
            format: zip
