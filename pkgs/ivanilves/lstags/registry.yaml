# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/ivanilves/lstags/releases/download/{{.Version}}/lstags-{{.OS}}-{{.Version}}.tar.gz
    repo_owner: ivanilves
    repo_name: lstags
    description: Explore Docker registries and manipulate Docker images
    asset: lstags-{{.OS}}-{{.Version}}.tar.gz
    supported_envs:
      - windows
      - darwin
      - linux/amd64
