# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fission
    repo_name: fission
    description: Fast and Simple Serverless Functions for Kubernetes
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.12.0")
        type: http
        url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/fission-cli-{{.OS}}
        asset: fission-cli-{{.OS}}
        format: raw
        replacements:
          darwin: osx
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.14.1")
        type: http
        url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/fission-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: fission-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 1.17.0-rc2")
        type: http
        url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/fission-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: fission-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 1.20.5")
        type: http
        url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/fission-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: fission-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 1.21.0")
        type: http
        url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/fission-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: fission-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/fission_{{.Version}}.intoto.jsonl
          asset: fission_{{.Version}}.intoto.jsonl
        cosign:
          opts:
            - --certificate
            - https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/{{.Asset}}.pem
            - --certificate-identity
            - https://gh-proxy.org/github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --signature
            - https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/{{.Asset}}.sig
            - --certificate-github-workflow-repository
            - fission/fission
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/fission-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: fission-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/checksums.txt.sig.bundle
              asset: checksums.txt.sig.bundle
            opts:
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-identity
              - https://gh-proxy.org/github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-github-workflow-repository
              - fission/fission
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/fission/fission/releases/download/{{.Version}}/{{.Asset}}.sig.bundle
            asset: "{{.Asset}}.sig.bundle"
          opts:
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --certificate-identity
            - https://gh-proxy.org/github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
            - --certificate-github-workflow-repository
            - fission/fission
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
        github_artifact_attestations:
          signer_workflow: fission/fission/.github/workflows/release.yaml
