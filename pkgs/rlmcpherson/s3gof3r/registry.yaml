# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/rlmcpherson/s3gof3r/releases/download/{{.Version}}/gof3r_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: rlmcpherson
    repo_name: s3gof3r
    description: Fast, concurrent, streaming access to Amazon S3, including gof3r, a CLI
    rosetta2: true
    supported_envs:
      - darwin
      - amd64
    files:
      - name: gof3r
        src: gof3r_{{trimV .Version}}_{{.OS}}_{{.Arch}}/gof3r
    asset: gof3r_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/rlmcpherson/s3gof3r/releases/download/{{.Version}}/gof3r.exe
        format: raw
        asset: gof3r.exe
      - goos: darwin
        type: http
        url: https://gh-proxy.org/github.com/rlmcpherson/s3gof3r/releases/download/{{.Version}}/gof3r_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
