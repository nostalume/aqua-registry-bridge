# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fishi0x01
    repo_name: vsh
    description: "vsh - HashiCorp Vault interactive shell and cli tool"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.9.0")
        type: http
        url: https://gh-proxy.org/github.com/fishi0x01/vsh/releases/download/{{.Version}}/vsh_{{.OS}}_{{.Arch}}
        asset: vsh_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fishi0x01/vsh/releases/download/{{.Version}}/SHA256SUM
          asset: SHA256SUM
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fishi0x01/vsh/releases/download/{{.Version}}/vsh_{{.OS}}_{{.Arch}}
        asset: vsh_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fishi0x01/vsh/releases/download/{{.Version}}/SHA256SUM
          asset: SHA256SUM
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
