# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: roie
    repo_name: ovw
    description: A terminal overview for your local projects
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/roie/ovw/releases/download/{{.Version}}/ovw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ovw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/roie/ovw/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/roie/ovw/releases/download/{{.Version}}/ovw_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
