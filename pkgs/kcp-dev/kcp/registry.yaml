# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/kcp-dev/kcp/releases/download/{{.Version}}/kcp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: kcp-dev
    repo_name: kcp
    asset: kcp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    files:
      - name: kcp
        src: bin/kcp
    format: tar.gz
    description: kcp is a Kubernetes-like control plane for workloads on many clusters
    supported_envs:
      - darwin
      - linux
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/kcp-dev/kcp/releases/download/{{.Version}}/kcp_{{trimV .Version}}_checksums.txt
      asset: kcp_{{trimV .Version}}_checksums.txt
      algorithm: sha256
