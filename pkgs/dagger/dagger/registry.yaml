# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/dagger/dagger/releases/download/{{.Version}}/dagger_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: dagger
    repo_name: dagger
    description: A portable devkit for CI/CD pipelines
    supported_envs:
      - darwin
      - linux
      - amd64
    format: tar.gz
    asset: dagger_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/dagger/dagger/releases/download/{{.Version}}/dagger_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/dagger/dagger/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
