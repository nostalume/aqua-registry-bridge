# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: koki-develop
    repo_name: sheep
    description: Sleep with Sheep
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/koki-develop/sheep/releases/download/{{.Version}}/sheep_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sheep_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/koki-develop/sheep/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/koki-develop/sheep/releases/download/{{.Version}}/sheep_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
