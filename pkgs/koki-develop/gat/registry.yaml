# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: koki-develop
    repo_name: gat
    description: cat alternative written in Go
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.19.2"
        no_asset: true
      - version_constraint: semver("<= 0.20.0")
        type: http
        url: https://gh-proxy.org/github.com/koki-develop/gat/releases/download/{{.Version}}/gat_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gat_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/koki-develop/gat/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/koki-develop/gat/releases/download/{{.Version}}/gat_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.20.3")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/koki-develop/gat/releases/download/{{.Version}}/gat_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gat_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/koki-develop/gat/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/koki-develop/gat/releases/download/{{.Version}}/gat_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
