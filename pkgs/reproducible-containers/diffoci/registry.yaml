# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: reproducible-containers
    repo_name: diffoci
    description: diff for Docker and OCI container images
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.2")
        type: http
        url: https://gh-proxy.org/github.com/reproducible-containers/diffoci/releases/download/{{.Version}}/diffoci-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: diffoci-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/reproducible-containers/diffoci/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: Version == "v0.1.3"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/reproducible-containers/diffoci/releases/download/{{.Version}}/diffoci-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: diffoci-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/reproducible-containers/diffoci/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
