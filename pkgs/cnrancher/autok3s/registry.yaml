# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cnrancher
    repo_name: autok3s
    description: Run K3s Everywhere
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.7-rc2")
        type: http
        url: https://gh-proxy.org/github.com/cnrancher/autok3s/releases/download/{{.Version}}/autok3s_{{.OS}}_{{.Arch}}
        asset: autok3s_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cnrancher/autok3s/releases/download/{{.Version}}/sha256sum.txt
          asset: sha256sum.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cnrancher/autok3s/releases/download/{{.Version}}/autok3s_{{.OS}}_{{.Arch}}
        asset: autok3s_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cnrancher/autok3s/releases/download/{{.Version}}/sha256sum.txt
          asset: sha256sum.txt
          algorithm: sha256
