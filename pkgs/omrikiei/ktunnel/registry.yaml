# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/omrikiei/ktunnel/releases/download/{{.Version}}/ktunnel_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: omrikiei
    repo_name: ktunnel
    asset: ktunnel_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: A cli that exposes your local resources to kubernetes
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    files:
      - name: kubectl-tunnel
        src: ktunnel
      - name: ktunnel
        src: ktunnel
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/omrikiei/ktunnel/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
