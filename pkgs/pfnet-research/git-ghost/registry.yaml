# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: pfnet-research
    repo_name: git-ghost
    description: Synchronize your working directory efficiently to a remote place without committing the changes
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.4")
        type: http
        url: https://gh-proxy.org/github.com/pfnet-research/git-ghost/releases/download/{{.Version}}/git-ghost-{{.OS}}-{{.Arch}}
        asset: git-ghost-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/pfnet-research/git-ghost/releases/download/{{.Version}}/git-ghost_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: git-ghost_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pfnet-research/git-ghost/releases/download/{{.Version}}/git-ghost_{{trimV .Version}}_checksums.txt
          asset: git-ghost_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
