# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: YS-L
    repo_name: csvlens
    description: Command line csv viewer
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.10.0")
        type: http
        url: https://gh-proxy.org/github.com/YS-L/csvlens/releases/download/{{.Version}}/csvlens-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: csvlens-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: csvlens
            src: csvlens-{{.Arch}}-{{.OS}}/csvlens
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/YS-L/csvlens/releases/download/{{.Version}}/csvlens-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/YS-L/csvlens/releases/download/{{.Version}}/csvlens-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: csvlens
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/YS-L/csvlens/releases/download/{{.Version}}/csvlens-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: csvlens-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: csvlens
            src: csvlens-{{.Arch}}-{{.OS}}/csvlens
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/YS-L/csvlens/releases/download/{{.Version}}/csvlens-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/YS-L/csvlens/releases/download/{{.Version}}/csvlens-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: csvlens
        supported_envs:
          - darwin
          - windows
          - amd64
