# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Songmu/ghch/releases/download/{{.Version}}/ghch_{{.Version}}_{{.OS}}_amd64.{{.Format}}
    repo_owner: Songmu
    repo_name: ghch
    description: Generate changelog from git history, tags and merged pull requests
    rosetta2: true
    asset: ghch_{{.Version}}_{{.OS}}_amd64.{{.Format}}
    supported_envs:
      - darwin
      - amd64
    files:
      - name: ghch
        src: ghch_{{.Version}}_{{.OS}}_amd64/ghch
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/Songmu/ghch/releases/download/{{.Version}}/ghch_{{.Version}}_{{.OS}}_amd64.{{.Format}}
        format: tar.gz
