# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Songmu/godzil/releases/download/{{.Version}}/godzil_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: Songmu
    repo_name: godzil
    asset: godzil_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: zip
    description: A Go Authoring tool
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/Songmu/godzil/releases/download/{{.Version}}/godzil_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
    files:
      - name: godzil
        src: godzil_{{.Version}}_{{.OS}}_{{.Arch}}/godzil
