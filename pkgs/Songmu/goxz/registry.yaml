# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Songmu/goxz/releases/download/{{.Version}}/goxz_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: Songmu
    repo_name: goxz
    asset: goxz_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    description: Just do cross building and archiving go tools conventionally
    files:
      - name: goxz
        src: goxz_{{.Version}}_{{.OS}}_{{.Arch}}/goxz
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/Songmu/goxz/releases/download/{{.Version}}/goxz_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
