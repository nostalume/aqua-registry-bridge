# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Songmu
    repo_name: ghg
    description: Get the executable from github releases easily
    rosetta2: true
    asset: ghg_{{.Version}}_{{.OS}}_amd64.{{.Format}}
    files:
      - name: ghg
        src: ghg_{{.Version}}_{{.OS}}_amd64/ghg
    format: zip
    overrides:
      - goos: linux
        format: tar.gz
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.2")
        type: http
        url: https://gh-proxy.org/github.com/Songmu/ghg/releases/download/{{.Version}}/ghg_{{.Version}}_{{.OS}}_amd64.{{.Format}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Songmu/ghg/releases/download/{{.Version}}/ghg_{{.Version}}_{{.OS}}_amd64.{{.Format}}
        github_artifact_attestations:
          signer_workflow: Songmu/ghg/.github/workflows/release-build.yaml
