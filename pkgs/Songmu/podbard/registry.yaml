# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Songmu
    repo_name: podbard
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.2")
        type: http
        url: https://gh-proxy.org/github.com/Songmu/podbard/releases/download/{{.Version}}/primcast_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: primcast_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Songmu/podbard/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Songmu/podbard/releases/download/{{.Version}}/primcast_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux
          - darwin
        files:
          - name: primcast
            src: primcast_{{.Version}}_{{.OS}}_{{.Arch}}/primcast
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Songmu/podbard/releases/download/{{.Version}}/podbard_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: podbard_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Songmu/podbard/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Songmu/podbard/releases/download/{{.Version}}/podbard_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux
          - darwin
        files:
          - name: podbard
            src: podbard_{{.Version}}_{{.OS}}_{{.Arch}}/podbard
