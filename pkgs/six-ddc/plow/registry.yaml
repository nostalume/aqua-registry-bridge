# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: six-ddc
    repo_name: plow
    description: A high-performance HTTP benchmarking tool that includes a real-time web UI and terminal display
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/six-ddc/plow/releases/download/{{.Version}}/plow_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: plow_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/six-ddc/plow/releases/download/{{.Version}}/plow_{{trimV .Version}}_checksums.txt
          asset: plow_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 1.2.0")
        type: http
        url: https://gh-proxy.org/github.com/six-ddc/plow/releases/download/{{.Version}}/plow_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: plow_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/six-ddc/plow/releases/download/{{.Version}}/plow_{{trimV .Version}}_checksums.txt
          asset: plow_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/six-ddc/plow/releases/download/{{.Version}}/plow_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: plow_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/six-ddc/plow/releases/download/{{.Version}}/plow_{{trimV .Version}}_checksums.txt
          asset: plow_{{trimV .Version}}_checksums.txt
          algorithm: sha256
