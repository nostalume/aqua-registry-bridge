# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Pluralith/pluralith-cli/releases/download/{{.Version}}/pluralith_cli_tap_{{.OS}}_{{.Arch}}_{{.Version}}.{{.Format}}
    repo_owner: Pluralith
    repo_name: pluralith-cli
    asset: pluralith_cli_tap_{{.OS}}_{{.Arch}}_{{.Version}}.{{.Format}}
    format: tar.gz
    description: A tool for Terraform state visualisation and automated generation of infrastructure documentation
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/Pluralith/pluralith-cli/releases/download/{{.Version}}/pluralith_cli_tap_{{.OS}}_{{.Arch}}_{{.Version}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    files:
      - name: pluralith
        src: "{{.OS}}/pluralith"
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/Pluralith/pluralith-cli/releases/download/{{.Version}}/pluralith_checksums_{{.Version}}.txt
      asset: pluralith_checksums_{{.Version}}.txt
      algorithm: sha256
