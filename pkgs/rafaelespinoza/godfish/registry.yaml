# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: rafaelespinoza
    repo_name: godfish
    description: a db migration management CLI for cassandra, mysql, postgres, sqlite, sqlserver
    version_filter: semver(">= 0.18.0")
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/rafaelespinoza/godfish/releases/download/{{.Version}}/godfish_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: godfish_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - darwin
          - linux
          - windows
        files:
          - name: godfish
          - name: godfish-cassandra
          - name: godfish-mysql
          - name: godfish-postgres
          - name: godfish-sqlite3
          - name: godfish-sqlserver
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rafaelespinoza/godfish/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/rafaelespinoza/godfish/\\.github/workflows/.+\\.ya?ml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/rafaelespinoza/godfish/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
