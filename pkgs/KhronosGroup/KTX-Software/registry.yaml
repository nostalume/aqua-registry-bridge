# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: KhronosGroup
    repo_name: KTX-Software
    description: KTX (Khronos Texture) Library and Tools
    search_words:
      - Linux Only
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v4.0.0"
        type: http
        url: https://gh-proxy.org/github.com/KhronosGroup/KTX-Software/releases/download/{{.Version}}/KTX-Software-{{trimV .Version}}-{{.OS}}.{{.Format}}
        asset: KTX-Software-{{trimV .Version}}-{{.OS}}.{{.Format}}
        rosetta2: true
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/KhronosGroup/KTX-Software/releases/download/{{.Version}}/KTX-Software-{{trimV .Version}}-{{.OS}}.{{.Format}}
            format: tar.bz2
            files:
              - name: ktx2check
                src: "{{.AssetWithoutExt}}/bin/ktx2check"
              - name: ktxinfo
                src: "{{.AssetWithoutExt}}/bin/ktxinfo"
              - name: ktx2ktx2
                src: "{{.AssetWithoutExt}}/bin/ktx2ktx2"
              - name: ktxsc
                src: "{{.AssetWithoutExt}}/bin/ktxsc"
              - name: toktx
                src: "{{.AssetWithoutExt}}/bin/toktx"
            checksum:
              type: http
              url: "{{.AssetURL}}.sha1"
              asset: "{{.Asset}}.sha1"
              algorithm: sha1
            replacements:
              linux: Linux
        supported_envs:
          - linux/amd64
      - version_constraint: Version == "v4.1.0"
        type: http
        url: https://gh-proxy.org/github.com/KhronosGroup/KTX-Software/releases/download/{{.Version}}/KTX-Software-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: KTX-Software-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        replacements:
          amd64: x86_64
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/KhronosGroup/KTX-Software/releases/download/{{.Version}}/KTX-Software-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: tar.bz2
            files:
              - name: ktx2check
                src: "{{.AssetWithoutExt}}/bin/ktx2check"
              - name: ktxinfo
                src: "{{.AssetWithoutExt}}/bin/ktxinfo"
              - name: ktx2ktx2
                src: "{{.AssetWithoutExt}}/bin/ktx2ktx2"
              - name: ktxsc
                src: "{{.AssetWithoutExt}}/bin/ktxsc"
              - name: toktx
                src: "{{.AssetWithoutExt}}/bin/toktx"
            checksum:
              type: http
              url: "{{.AssetURL}}.sha1"
              asset: "{{.Asset}}.sha1"
              algorithm: sha1
            replacements:
              linux: Linux
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 4.2.1")
        type: http
        url: https://gh-proxy.org/github.com/KhronosGroup/KTX-Software/releases/download/{{.Version}}/KTX-Software-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: KTX-Software-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        replacements:
          amd64: x86_64
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/KhronosGroup/KTX-Software/releases/download/{{.Version}}/KTX-Software-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: tar.bz2
            files:
              - name: ktx2check
                src: "{{.AssetWithoutExt}}/bin/ktx2check"
              - name: ktxinfo
                src: "{{.AssetWithoutExt}}/bin/ktxinfo"
              - name: ktx2ktx2
                src: "{{.AssetWithoutExt}}/bin/ktx2ktx2"
              - name: ktxsc
                src: "{{.AssetWithoutExt}}/bin/ktxsc"
              - name: toktx
