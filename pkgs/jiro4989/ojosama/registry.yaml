# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jiro4989
    repo_name: ojosama
    description: テキストを壱百満天原サロメお嬢様風の口調に変換します
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/jiro4989/ojosama/releases/download/{{.Version}}/ojosama_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ojosama_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/jiro4989/ojosama/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/jiro4989/ojosama/releases/download/{{.Version}}/ojosama_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
