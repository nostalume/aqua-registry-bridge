# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: out-of-cheese-error
    repo_name: the-way
    description: A code snippets manager for your terminal
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.2.1-osx"
        type: http
        url: https://gh-proxy.org/github.com/out-of-cheese-error/the-way/releases/download/{{.Version}}/the-way-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: the-way-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
        supported_envs:
          - darwin
      - version_constraint: semver("<= 0.14.0")
        type: http
        url: https://gh-proxy.org/github.com/out-of-cheese-error/the-way/releases/download/{{.Version}}/the-way-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: the-way-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/out-of-cheese-error/the-way/releases/download/{{.Version}}/the-way-{{.OS}}.{{.Format}}
        asset: the-way-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/out-of-cheese-error/the-way/releases/download/{{.Version}}/the-way-{{.OS}}.sha256
          asset: the-way-{{.OS}}.sha256
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
