# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: grpc-ecosystem
    repo_name: grpc-health-probe
    description: A command-line tool to perform health-checks for gRPC applications in Kubernetes and elsewhere
    files:
      - name: grpc_health_probe
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/grpc_health_probe-{{.OS}}-{{.Arch}}
        asset: grpc_health_probe-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 0.3.4")
        type: http
        url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/grpc_health_probe-{{.OS}}-{{.Arch}}
        asset: grpc_health_probe-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux
      - version_constraint: semver("<= 0.3.6")
        type: http
        url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/grpc_health_probe-{{.OS}}-{{.Arch}}
        asset: grpc_health_probe-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
      - version_constraint: semver("<= 0.4.2")
        type: http
        url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/grpc_health_probe-{{.OS}}-{{.Arch}}
        asset: grpc_health_probe-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.4.13")
        type: http
        url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/grpc_health_probe-{{.OS}}-{{.Arch}}
        asset: grpc_health_probe-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/grpc_health_probe-{{.OS}}-{{.Arch}}
        asset: grpc_health_probe-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/grpc-ecosystem/grpc-health-probe/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
