# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: firecow
    repo_name: gitlab-ci-local
    description: Tired of pushing to test your .gitlab-ci.yml
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 4.9.0")
        type: http
        url: https://gh-proxy.org/github.com/firecow/gitlab-ci-local/releases/download/{{.Version}}/{{.OS}}.{{.Format}}
        asset: "{{.OS}}.{{.Format}}"
        format: gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: gitlab-ci-local
            src: "{{.AssetWithoutExt}}"
        replacements:
          darwin: macos
          windows: win
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 4.9.7")
        type: http
        url: https://gh-proxy.org/github.com/firecow/gitlab-ci-local/releases/download/{{.Version}}/{{.OS}}.{{.Format}}
        asset: "{{.OS}}.{{.Format}}"
        format: gz
        rosetta2: true
        files:
          - name: gitlab-ci-local
            src: "{{.AssetWithoutExt}}"
        replacements:
          darwin: macos
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<=4.65.1")
        type: http
        url: https://gh-proxy.org/github.com/firecow/gitlab-ci-local/releases/download/{{.Version}}/{{.OS}}.{{.Format}}
        asset: "{{.OS}}.{{.Format}}"
        format: gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: gitlab-ci-local
            src: "{{.AssetWithoutExt}}"
        replacements:
          darwin: macos
          windows: win
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/firecow/gitlab-ci-local/releases/download/{{.Version}}/gitlab-ci-local-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: gitlab-ci-local-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/firecow/gitlab-ci-local/releases/download/{{.Version}}/gitlab-ci-local-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
