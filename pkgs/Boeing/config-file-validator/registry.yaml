# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Boeing
    repo_name: config-file-validator
    description: Cross-platform CLI tool to validate configuration files across 17 formats. Syntax and schema validation with JSON Schema, XSD, and SchemaStore integration. Written in Go
    files:
      - name: validator
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.3.0"
        type: http
        url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator.{{.OS}}-{{.Arch}}
        asset: validator.{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator
            asset: validator
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v1.4.0"
        type: http
        url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        asset: validator-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-{{trimV .Version}}
            asset: validator-{{trimV .Version}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.2.0")
        type: http
        url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator.{{.OS}}-{{.Arch}}
        asset: validator.{{.OS}}-{{.Arch}}
        format: raw
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator
            asset: validator
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: semver("<= 2.1.0")
        type: http
        url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: validator-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v2.2.0"
        type: http
        url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-v2.2-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: validator-v2.2-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-v2.2-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v2.2.1"
        type: http
        url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-v2.2-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: validator-v2.2-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-v2.2-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-v{{(semver .Version).Major}}.{{(semver .Version).Minor}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: validator-v{{(semver .Version).Major}}.{{(semver .Version).Minor}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Boeing/config-file-validator/releases/download/{{.Version}}/validator-v{{(semver .Version).Major}}.{{(semver .Version).Minor}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
