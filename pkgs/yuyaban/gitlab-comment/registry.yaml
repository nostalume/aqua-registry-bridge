# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/yuyaban/gitlab-comment/releases/download/{{.Version}}/gitlab-comment_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: yuyaban
    repo_name: gitlab-comment
    description: About gitlab-comment is a CLI command to post Merge Request Note
    asset: gitlab-comment_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/yuyaban/gitlab-comment/releases/download/{{.Version}}/gitlab-comment_{{trimV .Version}}_checksums.txt
      asset: gitlab-comment_{{trimV .Version}}_checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity-regexp
          - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
          - --certificate-oidc-issuer
          - "https://token.actions.githubusercontent.com"
          - --signature
          - https://gh-proxy.org/github.com/yuyaban/gitlab-comment/releases/download/{{.Version}}/gitlab-comment_{{trimV .Version}}_checksums.txt.sig
          - --certificate
          - https://gh-proxy.org/github.com/yuyaban/gitlab-comment/releases/download/{{.Version}}/gitlab-comment_{{trimV .Version}}_checksums.txt.pem
          - --certificate-github-workflow-repository
          - yuyaban/gitlab-comment
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
    slsa_provenance:
      type: http
      url: https://gh-proxy.org/github.com/yuyaban/gitlab-comment/releases/download/{{.Version}}/multiple.intoto.jsonl
      asset: multiple.intoto.jsonl
