# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gptscript-ai
    repo_name: gptscript
    description: Natural Language Programming
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/gptscript-ai/gptscript/releases/download/{{.Version}}/gptscript-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: gptscript-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gptscript-ai/gptscript/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/gptscript-ai/gptscript/releases/download/{{.Version}}/gptscript-{{.Version}}-{{.OS}}-universal.{{.Format}}
            asset: gptscript-{{.Version}}-{{.OS}}-universal.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gptscript-ai/gptscript/releases/download/{{.Version}}/gptscript-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
