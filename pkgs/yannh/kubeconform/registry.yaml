# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: yannh
    repo_name: kubeconform
    description: A FAST Kubernetes manifests validator, with support for Custom Resources
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.8")
        type: http
        url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/CHECKSUMS
          asset: CHECKSUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/CHECKSUMS
          asset: CHECKSUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yannh/kubeconform/releases/download/{{.Version}}/kubeconform-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
