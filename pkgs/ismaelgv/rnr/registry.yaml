# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ismaelgv
    repo_name: rnr
    description: A command-line tool to batch rename files and directories
    files:
      - name: rnr
        src: rnr-{{.Version}}-{{.Arch}}-{{.OS}}/rnr
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/ismaelgv/rnr/releases/download/{{.Version}}/rnr-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rnr-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ismaelgv/rnr/releases/download/{{.Version}}/rnr-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: rnr
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ismaelgv/rnr/releases/download/{{.Version}}/rnr-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rnr-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ismaelgv/rnr/releases/download/{{.Version}}/rnr-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ismaelgv/rnr/releases/download/{{.Version}}/rnr-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              arm64: aarch64
              linux: unknown-linux-gnu
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ismaelgv/rnr/releases/download/{{.Version}}/rnr-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        supported_envs:
          - darwin
          - linux
          - amd64
        rosetta2: true
