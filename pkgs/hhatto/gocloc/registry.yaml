# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: hhatto
    repo_name: gocloc
    description: A little fast cloc(Count Lines Of Code)
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.4.6"
        no_asset: true
      - version_constraint: Version == "v0.4.0"
        type: http
        url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{trimV .Version}}_checksums.txt
          asset: gocloc_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: Version == "v0.4.3"
        type: http
        url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{trimV .Version}}_checksums.txt
          asset: gocloc_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.3.1")
        type: http
        url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gocloc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.3.3")
        type: http
        url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{trimV .Version}}_checksums.txt
          asset: gocloc_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.4.2")
        type: http
        url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{trimV .Version}}_checksums.txt
          asset: gocloc_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{trimV .Version}}_checksums.txt
          asset: gocloc_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{trimV .Version}}_checksums.txt
          asset: gocloc_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hhatto/gocloc/releases/download/{{.Version}}/gocloc_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
