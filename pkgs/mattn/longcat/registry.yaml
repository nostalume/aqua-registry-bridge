# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mattn
    repo_name: longcat
    description: Looooooooooooooooooooooooooooooooooooooooooooooong cat
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mattn/longcat/releases/download/{{.Version}}/longcat_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: longcat_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/mattn/longcat/releases/download/{{.Version}}/longcat_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        files:
          - name: longcat
            src: "{{.AssetWithoutExt}}/longcat"
