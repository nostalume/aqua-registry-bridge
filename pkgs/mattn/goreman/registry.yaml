# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/mattn/goreman/releases/download/{{.Version}}/goreman_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: mattn
    repo_name: goreman
    description: foreman clone written in go language
    supported_envs:
      - darwin
      - linux
      - amd64
    asset: goreman_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    files:
      - name: goreman
        src: goreman_{{.Version}}_{{.OS}}_{{.Arch}}/goreman
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/mattn/goreman/releases/download/{{.Version}}/goreman_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
