# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/mattn/gof/releases/download/{{.Version}}/gof_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: mattn
    repo_name: gof
    asset: gof_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    description: Go Fuzzy
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/mattn/gof/releases/download/{{.Version}}/gof_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
    files:
      - name: gof
        src: gof_{{.Version}}_{{.OS}}_{{.Arch}}/gof
    version_constraint: semver(">= 0.0.12")
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mattn/gof/releases/download/{{.Version}}/gof_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        rosetta2: true
        supported_envs:
          - darwin
          - amd64
