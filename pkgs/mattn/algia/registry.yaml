# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/mattn/algia/releases/download/{{.Version}}/algia_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: mattn
    repo_name: algia
    description: A cli application for nostr
    asset: algia_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/mattn/algia/releases/download/{{.Version}}/algia_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
    files:
      - name: algia
        src: algia_{{.Version}}_{{.OS}}_{{.Arch}}/algia
