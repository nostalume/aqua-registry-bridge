# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/NimbleArchitect/kubectl-ice/releases/download/{{.Version}}/kubectl-ice_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: NimbleArchitect
    repo_name: kubectl-ice
    description: A kubectl plugin that allows you to easily view advanced configuration of all containers that are running inside pods
    asset: kubectl-ice_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/NimbleArchitect/kubectl-ice/releases/download/{{.Version}}/kubectl-ice_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/NimbleArchitect/kubectl-ice/releases/download/{{.Version}}/kubectl-ice_{{trimV .Version}}_checksums.txt
      asset: kubectl-ice_{{trimV .Version}}_checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 0.0.2")
    version_overrides:
      - version_constraint: semver("< 0.0.2")
        type: http
        url: https://gh-proxy.org/github.com/NimbleArchitect/kubectl-ice/releases/download/{{.Version}}/ice_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ice_{{.OS}}_{{.Arch}}.{{.Format}}
        files:
          - name: kubectl-ice
            src: ice
          - name: ice
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/NimbleArchitect/kubectl-ice/releases/download/{{.Version}}/ice_{{trimV .Version}}_checksums.txt
          asset: ice_{{trimV .Version}}_checksums.txt
          algorithm: sha256
