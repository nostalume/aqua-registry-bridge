# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mvisonneau
    repo_name: approuvez
    description: command line helper to obtain live confirmation from relevant people
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "edge"
        type: http
        url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_sha512sums.txt
          asset: approuvez_{{.Version}}_sha512sums.txt
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.1.0")
        type: http
        url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_sha512sums.txt
          asset: approuvez_{{.Version}}_sha512sums.txt
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_sha512sums.txt
          asset: approuvez_{{.Version}}_sha512sums.txt
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mvisonneau/approuvez/releases/download/{{.Version}}/approuvez_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
