# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mvisonneau
    repo_name: gpcd
    description: GoPro Cloud Downloader
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mvisonneau/gpcd/releases/download/{{.Version}}/gpcd_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gpcd_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mvisonneau/gpcd/releases/download/{{.Version}}/gpcd_{{.Version}}_sha512sums.txt
          asset: gpcd_{{.Version}}_sha512sums.txt
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mvisonneau/gpcd/releases/download/{{.Version}}/gpcd_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
