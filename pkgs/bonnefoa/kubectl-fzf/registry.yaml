# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/bonnefoa/kubectl-fzf/releases/download/{{.Version}}/kubectl-fzf_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: bonnefoa
    repo_name: kubectl-fzf
    asset: kubectl-fzf_{{.OS}}_{{.Arch}}.tar.gz
    description: A fast kubectl autocompletion with fzf
    supported_envs:
      - linux/amd64
      - darwin
    rosetta2: true
    files:
      - name: kubectl-fzf-server
      - name: kubectl-fzf-completion
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/bonnefoa/kubectl-fzf/releases/download/{{.Version}}/kubectl-fzf_checksums.txt
      asset: kubectl-fzf_checksums.txt
      algorithm: sha256
