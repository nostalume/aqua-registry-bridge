# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: str4d
    repo_name: age-plugin-yubikey
    description: YubiKey plugin for age
    version_constraint: "false"
    files:
      - name: age-plugin-yubikey
        src: age-plugin-yubikey/age-plugin-yubikey
    version_overrides:
      - version_constraint: Version == "v0.5.0"
        type: http
        url: https://gh-proxy.org/github.com/str4d/age-plugin-yubikey/releases/download/{{.Version}}/age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/str4d/age-plugin-yubikey/releases/download/{{.Version}}/age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - linux/amd64
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/str4d/age-plugin-yubikey/releases/download/{{.Version}}/age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/str4d/age-plugin-yubikey/releases/download/{{.Version}}/age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.5.1"
        type: http
        url: https://gh-proxy.org/github.com/str4d/age-plugin-yubikey/releases/download/{{.Version}}/age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/str4d/age-plugin-yubikey/releases/download/{{.Version}}/age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/str4d/age-plugin-yubikey/releases/download/{{.Version}}/age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/str4d/age-plugin-yubikey/releases/download/{{.Version}}/age-plugin-yubikey-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
