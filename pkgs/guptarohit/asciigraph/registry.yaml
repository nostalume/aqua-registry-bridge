# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: guptarohit
    repo_name: asciigraph
    description: Go package to make lightweight ASCII line graph ╭┈╯ in command line apps with no other dependencies
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.4.2"
        type: http
        url: https://gh-proxy.org/github.com/guptarohit/asciigraph/releases/download/{{.Version}}/asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/guptarohit/asciigraph/releases/download/{{.Version}}/asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.5.2")
        type: http
        url: https://gh-proxy.org/github.com/guptarohit/asciigraph/releases/download/{{.Version}}/asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/guptarohit/asciigraph/releases/download/{{.Version}}/asciigraph_{{trimV .Version}}_sha512-checksums.txt
          asset: asciigraph_{{trimV .Version}}_sha512-checksums.txt
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/guptarohit/asciigraph/releases/download/{{.Version}}/asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/guptarohit/asciigraph/releases/download/{{.Version}}/asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/guptarohit/asciigraph/releases/download/{{.Version}}/asciigraph_{{trimV .Version}}_sha512-checksums.txt
          asset: asciigraph_{{trimV .Version}}_sha512-checksums.txt
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/guptarohit/asciigraph/releases/download/{{.Version}}/asciigraph_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
