# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: bmf-san
    repo_name: ggc
    description: A modern Git CLI tool with both traditional command-line and interactive incremental-search UI
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 3.2.1")
        no_asset: true
      - version_constraint: Version in ["v8.5.1", "v8.5.3", "v8.6.0", "v8.6.1", "v8.6.2"]
        no_asset: true
      - version_constraint: semver("< 8.3.0")
        type: http
        url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_checksums.txt
          asset: ggc_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("< 8.4.0")
        type: http
        url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 8.4.1")
        type: http
        url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - "https://gh-proxy.org/github.com/bmf-san/ggc/.github/workflows/release.yml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt.sig
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 8.6.3")
        type: http
        url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - https://gh-proxy.org/github.com/bmf-san/ggc/.github/workflows/release.yml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt.sig
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/checksums.txt.bundle
              asset: checksums.txt.bundle
            opts:
              - --certificate-identity
              - "https://gh-proxy.org/github.com/bmf-san/ggc/.github/workflows/release.yml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bmf-san/ggc/releases/download/{{.Version}}/ggc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
