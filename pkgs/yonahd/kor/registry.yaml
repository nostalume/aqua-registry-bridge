# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/yonahd/kor/releases/download/{{.Version}}/kor_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: yonahd
    repo_name: kor
    description: A Golang Tool to discover unused Kubernetes Resources
    asset: kor_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/yonahd/kor/releases/download/{{.Version}}/kor_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    supported_envs:
      - darwin
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/yonahd/kor/releases/download/{{.Version}}/kor_{{trimV .Version}}_checksums.txt
      asset: kor_{{trimV .Version}}_checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 0.2.0")
    version_overrides:
      - version_constraint: semver("< 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/yonahd/kor/releases/download/{{.Version}}/kor_{{.OS}}_{{.Arch}}.{{.Format}}
        rosetta2: true
        files:
          - name: kor
            src: kor-{{.GOOS}}-{{if eq .GOOS "darwin"}}amd64{{else}}{{.GOARCH}}{{end}}
