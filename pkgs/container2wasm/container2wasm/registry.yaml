# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: container2wasm
    repo_name: container2wasm
    aliases:
      - name: ktock/container2wasm
    description: Container to WASM converter
    files:
      - name: c2w
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/container2wasm/container2wasm/releases/download/{{.Version}}/container2wasm-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: container2wasm-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/container2wasm/container2wasm/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
