# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: noborus
    repo_name: xlsxsql
    description: Execute SQL on xlsx file
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        type: http
        url: https://gh-proxy.org/github.com/noborus/xlsxsql/releases/download/{{.Version}}/xlsxsql_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: xlsxsql_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/noborus/xlsxsql/releases/download/{{.Version}}/xlsxsql_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/noborus/xlsxsql/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/noborus/xlsxsql/releases/download/{{.Version}}/xlsxsql_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: xlsxsql_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/noborus/xlsxsql/releases/download/{{.Version}}/xlsxsql_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/noborus/xlsxsql/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
