# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: noborus
    repo_name: mdviewer
    description: Rendered display of markdown on terminal
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/noborus/mdviewer/releases/download/{{.Version}}/mdviewer_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: mdviewer_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/noborus/mdviewer/releases/download/{{.Version}}/mdviewer_{{trimV .Version}}_checksums.txt
          asset: mdviewer_{{trimV .Version}}_checksums.txt
          algorithm: sha256
