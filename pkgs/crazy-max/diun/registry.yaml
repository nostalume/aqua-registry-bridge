# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: crazy-max
    repo_name: diun
    description: Receive notifications when an image is updated on a Docker registry
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v4.23.0"
        type: http
        url: https://gh-proxy.org/github.com/crazy-max/diun/releases/download/{{.Version}}/diun_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.{{.Format}}
        asset: diun_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.{{.Format}}
        format: tgz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/crazy-max/diun/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/crazy-max/diun/releases/download/{{.Version}}/diun_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
            asset: diun_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
      - version_constraint: semver("<= 4.9.0")
        type: http
        url: https://gh-proxy.org/github.com/crazy-max/diun/releases/download/{{.Version}}/diun_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: diun_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
