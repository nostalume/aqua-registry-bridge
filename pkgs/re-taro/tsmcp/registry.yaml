# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: re-taro
    repo_name: tsmcp
    description: MCP server specialized for the TypeScript 7 native language server (tsc --lsp)
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/re-taro/tsmcp/releases/download/{{.Version}}/tsmcp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tsmcp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/re-taro/tsmcp/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
