# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: foresterre
    repo_name: cargo-msrv
    description: Find the minimum supported Rust version (MSRV) for your project
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.2.0"
        type: http
        url: https://gh-proxy.org/github.com/foresterre/cargo-msrv/releases/download/{{.Version}}/cargo-msrv-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: cargo-msrv-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          windows: pc-windows-msvc
        supported_envs:
          - windows
      - version_constraint: Version == "v0.11.1-testing.1"
        type: http
        url: https://gh-proxy.org/github.com/foresterre/cargo-msrv/releases/download/{{.Version}}/cargo-msrv_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cargo-msrv_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          windows: Windows
        supported_envs:
          - windows
      - version_constraint: Version == "v0.11.1-testing.2"
        type: http
        url: https://gh-proxy.org/github.com/foresterre/cargo-msrv/releases/download/{{.Version}}/cargo-msrv_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cargo-msrv_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          linux: Linux
          windows: Windows
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/foresterre/cargo-msrv/releases/download/{{.Version}}/cargo-msrv_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar
        supported_envs:
          - linux/amd64
          - windows
      - version_constraint: Version == "v0.11.1-testing.3"
        type: http
        url: https://gh-proxy.org/github.com/foresterre/cargo-msrv/releases/download/{{.Version}}/cargo-msrv_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cargo-msrv_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/foresterre/cargo-msrv/releases/download/{{.Version}}/cargo-msrv_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.7.0") or semver("> 0.10.0, <= 0.12.0") or Version in ["v0.11.0", "v0.15.0", "v0.16.0-beta.12", "v0.16.0-beta.16", "v0.16.0-beta.21", "v0.17.0"]
