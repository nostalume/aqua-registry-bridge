        asset: cargo-msrv-{{.Arch}}-{{.OS}}-{{.Version}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        files:
          - name: cargo-msrv
            src: "{{.AssetWithoutExt}}/cargo-msrv"
        replacements:
