# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/gcla/termshark/releases/download/{{.Version}}/termshark_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: gcla
    repo_name: termshark
    description: A terminal UI for tshark, inspired by Wireshark
    asset: termshark_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/gcla/termshark/releases/download/{{.Version}}/termshark_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    replacements:
      amd64: x64
      darwin: macOS
    files:
      - name: termshark
        src: termshark_{{trimV .Version}}_{{.OS}}_{{.Arch}}/termshark
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/gcla/termshark/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
