# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: innobead
    repo_name: huber
    description: "Huber: A package installer for GitHub repository releases"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        type: http
        url: https://gh-proxy.org/github.com/innobead/huber/releases/download/{{.Version}}/huber-{{.OS}}-{{.Arch}}
        asset: huber-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.2.3")
        type: http
        url: https://gh-proxy.org/github.com/innobead/huber/releases/download/{{.Version}}/huber-{{.OS}}-{{.Arch}}
        asset: huber-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.3.11")
        type: http
        url: https://gh-proxy.org/github.com/innobead/huber/releases/download/{{.Version}}/huber-{{.OS}}-{{.Arch}}
        asset: huber-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/innobead/huber/releases/download/{{.Version}}/huber-{{.Arch}}-{{.OS}}
        asset: huber-{{.Arch}}-{{.OS}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256sum"
          asset: "{{.Asset}}.sha256sum"
          algorithm: sha256
