# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: UpCloudLtd
    repo_name: upcloud-cli
    description: UpCloud command line client (upctl)
    files:
      - name: upctl
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upctl-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: upctl-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.3.0")
        type: http
        url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 3.16.0")
        type: http
        url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 3.24.0")
        type: http
        url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 3.31.0")
        type: http
        url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        github_artifact_attestations:
          signer_workflow: UpCloudLtd/upcloud-cli/.github/workflows/publish.yml
