          asset: checksums.txt
          algorithm: sha256
        github_artifact_attestations:
          signer_workflow: UpCloudLtd/workflows/.github/workflows/build-provenance.yaml
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        github_artifact_attestations:
          signer_workflow: UpCloudLtd/workflows/.github/workflows/build-provenance.yaml
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli.sigstore.json
            asset: upcloud-cli.sigstore.json
          opts:
            - --certificate-identity
            - https://gh-proxy.org/github.com/UpCloudLtd/workflows/.github/workflows/build-provenance.yaml@refs/heads/main
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/UpCloudLtd/upcloud-cli/releases/download/{{.Version}}/upcloud-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
