# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Arata1202
    repo_name: ascdir
    description: Manage App Store Connect metadata, TestFlight distribution, and releases with safe CLI workflows
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Arata1202/ascdir/releases/download/{{.Version}}/ascdir_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ascdir_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Arata1202/ascdir/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Arata1202/ascdir/releases/download/{{.Version}}/ascdir_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
