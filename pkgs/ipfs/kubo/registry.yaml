# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/ipfs/kubo/releases/download/{{.Version}}/kubo_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: ipfs
    repo_name: kubo
    aliases:
      - name: ipfs/go-ipfs
    description: IPFS is a global, versioned, peer-to-peer filesystem
    supported_envs:
      - darwin
      - linux
      - amd64
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/ipfs/kubo/releases/download/{{.Version}}/kubo_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    version_constraint: semver(">= 0.14.0")
    asset: kubo_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
    files:
      - name: ipfs
        src: kubo/ipfs
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ipfs/kubo/releases/download/{{.Version}}/go-ipfs_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: go-ipfs_{{.Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        files:
          - name: ipfs
            src: go-ipfs/ipfs
    checksum:
      type: http
      url: "{{.AssetURL}}.sha512"
      asset: "{{.Asset}}.sha512"
      algorithm: sha512
