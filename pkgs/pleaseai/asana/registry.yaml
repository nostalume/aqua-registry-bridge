# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: pleaseai
    repo_name: asana
    description: asana cli
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/pleaseai/asana/releases/download/{{.Version}}/asana-{{.OS}}-{{.Arch}}
        asset: asana-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
