# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: DeNA/unity-meta-check/gh-action
    type: github_release
    repo_owner: DeNA
    repo_name: unity-meta-check
    description: Binary for GitHub Actions of DeNA/unity-meta-check
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 3.3.0")
        type: http
        url: https://gh-proxy.org/github.com/DeNA/unity-meta-check/releases/download/{{.Version}}/gh-action-{{.OS}}-{{.Arch}}
        asset: gh-action-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/DeNA/unity-meta-check/releases/download/{{.Version}}/gh-action-{{.OS}}-{{.Arch}}
        asset: gh-action-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/DeNA/unity-meta-check/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
