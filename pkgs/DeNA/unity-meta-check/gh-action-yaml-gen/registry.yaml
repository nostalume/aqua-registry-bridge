# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: DeNA/unity-meta-check/gh-action-yaml-gen
    type: github_release
    repo_owner: DeNA
    repo_name: unity-meta-check
    description: A cli tool to automatically generate action.yaml for DeNA/unity-meta-check
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 3.3.0")
        type: http
        url: https://gh-proxy.org/github.com/DeNA/unity-meta-check/releases/download/{{.Version}}/gh-action-yaml-gen-{{.OS}}-{{.Arch}}
        asset: gh-action-yaml-gen-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        rosetta2: true
        supported_envs:
          - darwin
          - linux/amd64
          - windows
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/DeNA/unity-meta-check/releases/download/{{.Version}}/gh-action-yaml-gen-{{.OS}}-{{.Arch}}
        asset: gh-action-yaml-gen-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - linux
          - windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/DeNA/unity-meta-check/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
