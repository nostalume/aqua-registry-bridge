# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: busser
    repo_name: tftree
    description: Display your Terraform module call stack in your terminal
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        type: http
        url: https://gh-proxy.org/github.com/busser/tftree/releases/download/{{.Version}}/tftree_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tftree_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/busser/tftree/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/busser/tftree/releases/download/{{.Version}}/tftree_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/busser/tftree/releases/download/{{.Version}}/tftree_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tftree_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/busser/tftree/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/busser/tftree/releases/download/{{.Version}}/tftree_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
