# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: busser
    repo_name: murmur
    description: Pass secrets as environment variables to a process
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.2")
        type: http
        url: https://gh-proxy.org/github.com/busser/murmur/releases/download/{{.Version}}/whisper_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: whisper_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/busser/murmur/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/busser/murmur/releases/download/{{.Version}}/whisper_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        # https://github.com/busser/murmur#changes-from-v04-to-v05
        files:
          - name: whisper
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/busser/murmur/releases/download/{{.Version}}/murmur_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: murmur_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/busser/murmur/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/busser/murmur/releases/download/{{.Version}}/murmur_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
