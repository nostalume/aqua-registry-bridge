# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: dhall-lang
    repo_name: dhall-haskell
    description: Maintainable configuration files
    files:
      - name: dhall
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "1.42.1"
        no_asset: true
      - version_constraint: Version == "1.40.0"
        error_message: "tar.bz2.zip is not supported"
      - version_constraint: semver("<= 1.9.0-rc1")
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/{{.OS}}.{{.Format}}
        asset: "{{.OS}}.{{.Format}}"
        format: tar.gz
        replacements:
          darwin: osx
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.16.0")
        no_asset: true
      - version_constraint: semver("<= 1.17.0")
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.bz2
        files:
          - name: dhall
            src: bin/dhall
        replacements:
          amd64: x86_64
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 1.24.0")
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.bz2
        windows_arm_emulation: true
        files:
          - name: dhall
            src: bin/dhall
        replacements:
          amd64: x86_64
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: dhall
        supported_envs:
          - linux/amd64
          - windows
      - version_constraint: semver("<= 1.39.0")
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.bz2
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: dhall
            src: bin/dhall
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: dhall
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "1.40.1"
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.bz2
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: dhall
            src: bin/dhall
        replacements:
          amd64: x86_64
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.41.1")
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.bz2
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: dhall
            src: bin/dhall
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "1.41.2"
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.bz2
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: dhall
            src: bin/dhall
        replacements:
          amd64: x86_64
          darwin: macOS
          linux: Linux
          windows: Windows
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "1.42.0"
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.bz2
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: dhall
            src: bin/dhall
        replacements:
          amd64: x86_64
          darwin: macOS
          windows: Windows
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.bz2
        windows_arm_emulation: true
        files:
          - name: dhall
            src: bin/dhall
        replacements:
          amd64: x86_64
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dhall-lang/dhall-haskell/releases/download/{{.Version}}/dhall-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
