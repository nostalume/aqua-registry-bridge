# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: bcicen
    repo_name: slackcat
    description: CLI utility to post files and command output to slack
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0"
        type: http
        url: https://gh-proxy.org/github.com/bcicen/slackcat/releases/download/{{.Version}}/slackcat-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        asset: slackcat-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bcicen/slackcat/releases/download/{{.Version}}/slackcat-{{trimV .Version}}
            asset: slackcat-{{trimV .Version}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.6.0")
        type: http
        url: https://gh-proxy.org/github.com/bcicen/slackcat/releases/download/{{.Version}}/slackcat-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        asset: slackcat-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/bcicen/slackcat/releases/download/{{.Version}}/slackcat-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: slackcat-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/bcicen/slackcat/releases/download/{{.Version}}/sha256sums.txt
          asset: sha256sums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
