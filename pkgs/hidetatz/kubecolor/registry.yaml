# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: hidetatz
    repo_name: kubecolor
    description: colorizes kubectl output
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.17"
        type: http
        url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.0.6")
        no_asset: true
      - version_constraint: semver("<= 0.0.16")
        type: http
        url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.0.20")
        type: http
        url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubecolor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hidetatz/kubecolor/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
