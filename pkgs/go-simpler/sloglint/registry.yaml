# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: go-simpler
    repo_name: sloglint
    description: Ensure consistent code style when using log/slog
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.12.0")
        type: http
        url: https://gh-proxy.org/github.com/go-simpler/sloglint/releases/download/{{.Version}}/sloglint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sloglint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/go-simpler/sloglint/releases/download/{{.Version}}/sloglint_{{trimV .Version}}_checksums.txt
          asset: sloglint_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/go-simpler/sloglint/releases/download/{{.Version}}/sloglint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/go-simpler/sloglint/releases/download/{{.Version}}/sloglint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sloglint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/go-simpler/sloglint/releases/download/{{.Version}}/sloglint_{{trimV .Version}}_checksums.txt
          asset: sloglint_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - linux
          - windows
