# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: lsd-rs
    repo_name: lsd
    description: The next gen ls command
    files:
      - name: lsd
        src: lsd-{{.Version}}-{{.Arch}}-{{.OS}}/lsd
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.15.1")
        type: http
        url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "0.16.0"
        type: http
        url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.19.0")
        type: http
        url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "0.20.0"
        no_asset: true
      - version_constraint: semver("<= 0.23.1")
        type: http
        url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/lsd-rs/lsd/releases/download/{{.Version}}/lsd-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
