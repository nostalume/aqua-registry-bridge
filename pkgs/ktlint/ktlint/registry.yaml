# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ktlint
    repo_name: ktlint
    aliases:
      - name: pinterest/ktlint
    description: An anti-bikeshedding Kotlin linter with built-in formatter
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.49.0")
        type: http
        url: https://gh-proxy.org/github.com/ktlint/ktlint/releases/download/{{.Version}}/ktlint
        complete_windows_ext: false
        asset: ktlint
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ktlint/ktlint/releases/download/{{.Version}}/ktlint-{{.Version}}.{{.Format}}
        asset: "ktlint-{{.Version}}.{{.Format}}"
        format: zip
        files:
          - name: ktlint
            src: "{{.AssetWithoutExt}}/bin/ktlint"
