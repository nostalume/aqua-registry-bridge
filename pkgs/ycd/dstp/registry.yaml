# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ycd
    repo_name: dstp
    description: Run common networking tests against any site
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.1")
        no_asset: true
      - version_constraint: semver("<= 0.1.3")
        type: http
        url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v0.4.20"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ycd/dstp/releases/download/{{.Version}}/dstp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
