# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sqlc-dev
    repo_name: sqlc
    aliases:
      - name: kyleconroy/sqlc
    description: Generate type-safe code from SQL
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        type: http
        url: https://gh-proxy.org/github.com/sqlc-dev/sqlc/releases/download/{{.Version}}/sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/sqlc-dev/sqlc/releases/download/{{.Version}}/sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.4.0")
        type: http
        url: https://gh-proxy.org/github.com/sqlc-dev/sqlc/releases/download/{{.Version}}/sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.6.0")
        type: http
        url: https://gh-proxy.org/github.com/sqlc-dev/sqlc/releases/download/{{.Version}}/sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.8.0")
        type: http
        url: https://gh-proxy.org/github.com/sqlc-dev/sqlc/releases/download/{{.Version}}/sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sqlc-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.15.0")
        type: http
        url: https://gh-proxy.org/github.com/sqlc-dev/sqlc/releases/download/{{.Version}}/sqlc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqlc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.17.0")
        type: http
        url: https://gh-proxy.org/github.com/sqlc-dev/sqlc/releases/download/{{.Version}}/sqlc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqlc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v1.17.1"
        no_asset: true
      - version_constraint: semver("<= 1.24.0")
        type: http
        url: https://gh-proxy.org/github.com/sqlc-dev/sqlc/releases/download/{{.Version}}/sqlc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqlc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
      - version_constraint: "true"
        type: http
        url: https://downloads.sqlc.dev/sqlc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
