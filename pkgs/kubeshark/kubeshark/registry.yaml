# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kubeshark
    repo_name: kubeshark
    aliases:
      # Repository was transferred at 37.0
      - name: up9inc/mizu
    description: The API traffic analyzer for Kubernetes providing real-time K8s protocol-level visibility, capturing and monitoring all traffic and payloads going in, out and across containers, pods, nodes and clusters. Inspired by Wireshark, purposely built for Kubernetes
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.17.0")
        type: http
        url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/mizu_{{.OS}}_{{.Arch}}
        asset: mizu_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        files:
          - name: mizu
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.23.0")
        type: http
        url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/mizu_{{.OS}}_{{.Arch}}
        asset: mizu_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        files:
          - name: mizu
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/mizu.exe
            asset: mizu.exe
            checksum:
              enabled: false
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 36.0")
        type: http
        url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/mizu_{{.OS}}_{{.Arch}}
        asset: mizu_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        files:
          - name: mizu
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/mizu.exe
            asset: mizu.exe
            checksum:
              enabled: false
      - version_constraint: semver("<= 37.0")
        type: http
        url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/kubeshark_{{.OS}}_{{.Arch}}
        asset: kubeshark_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/kubeshark.exe
            asset: kubeshark.exe
            checksum:
              enabled: false
      - version_constraint: semver("<= 50.4")
        type: http
        url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/kubeshark_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubeshark_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/kubeshark_{{trimV .Version}}_checksums.txt
          asset: kubeshark_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 52.1.50")
        type: http
        url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/kubeshark_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubeshark_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/kubeshark_{{trimV .Version}}_checksums.txt
          asset: kubeshark_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/kubeshark_{{.OS}}_{{.Arch}}
        asset: kubeshark_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubeshark/kubeshark/releases/download/{{.Version}}/kubeshark
            asset: kubeshark
            checksum:
              enabled: false
