# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/kurehajime/pong-command/releases/download/{{.Version}}/pong-command_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
    repo_owner: kurehajime
    repo_name: pong-command
    description: pong is not ping. pong is CLI game
    files:
      - name: pong
    version_constraint: semver(">= 2.0.8")
    asset: pong-command_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
    replacements:
      amd64: x86_64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/kurehajime/pong-command/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_overrides:
      - version_constraint: semver(">= 2.0.5")
        type: http
        url: https://gh-proxy.org/github.com/kurehajime/pong-command/releases/download/{{.Version}}/pong-command_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
        supported_envs: []
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kurehajime/pong-command/releases/download/{{.Version}}/{{.OS}}_{{.Arch}}.zip
        rosetta2: true
        asset: "{{.OS}}_{{.Arch}}.zip"
        supported_envs:
          - darwin
          - amd64
        replacements:
          darwin: macos
        checksum:
          enabled: false
