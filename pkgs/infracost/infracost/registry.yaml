# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/infracost/infracost/releases/download/{{.Version}}/infracost-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: infracost
    repo_name: infracost
    description: Cloud cost estimates for Terraform in pull requests. Love your cloud bill
    asset: infracost-{{.OS}}-{{.Arch}}.{{.Format}}
    files:
      - name: infracost
        src: infracost-{{.OS}}-{{.Arch}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/infracost/infracost/releases/download/{{.Version}}/infracost-{{.OS}}-{{.Arch}}.{{.Format}}
        goarch: amd64
        files:
          - name: infracost
            src: infracost.exe
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/infracost/infracost/releases/download/{{.Version}}/infracost-{{.OS}}-{{.Arch}}.{{.Format}}
        goarch: arm64
        files:
          - name: infracost
            src: infracost-arm64.exe
    version_constraint: semver(">= 0.9.18")
    version_overrides:
      - version_constraint: semver(">= 0.9.17")
        type: http
        url: https://gh-proxy.org/github.com/infracost/infracost/releases/download/{{.Version}}/infracost-{{.OS}}-{{.Arch}}.{{.Format}}
        checksum:
          enabled: false
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/infracost/infracost/releases/download/{{.Version}}/infracost-{{.OS}}-{{.Arch}}.{{.Format}}
        checksum:
          enabled: false
        supported_envs:
          - darwin
          - amd64
    checksum:
      type: http
      url: "{{.AssetURL}}.sha256"
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
