# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/zitadel/zitadel/releases/download/{{.Version}}/zitadel-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: zitadel
    repo_name: zitadel
    description: ZITADEL - The best of Auth0 and Keycloak combined. Built for the serverless era
    asset: zitadel-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/zitadel/zitadel/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    files:
      - name: zitadel
        src: zitadel-{{.OS}}-{{.Arch}}/zitadel
