# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/yudai/gotty/releases/download/{{.Version}}/gotty_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: yudai
    repo_name: gotty
    asset: gotty_{{.OS}}_{{.Arch}}.tar.gz
    description: Share your terminal as a web application
    supported_envs:
      - linux/amd64
      - darwin
    rosetta2: true
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/yudai/gotty/releases/download/{{.Version}}/SHA256SUMS
      asset: SHA256SUMS
      algorithm: sha256
