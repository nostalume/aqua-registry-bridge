# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: liamg
    repo_name: dismember
    description: Scan memory for secrets and more. Maybe eventually a full /proc toolkit
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/liamg/dismember/releases/download/{{.Version}}/dismember-{{.OS}}-{{.Arch}}
        asset: dismember-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/liamg/dismember/releases/download/{{.Version}}/dismember_{{trimV .Version}}_checksums.txt
          asset: dismember_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
