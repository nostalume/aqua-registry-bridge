# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: liamg
    repo_name: comet
    description: Command line tool to help you use conventional commit messages (https://www.conventionalcommits.org)
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/liamg/comet/releases/download/{{.Version}}/comet-{{.OS}}-{{.Arch}}
        asset: comet-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/liamg/comet/releases/download/{{.Version}}/comet_{{trimV .Version}}_checksums.txt
          asset: comet_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
