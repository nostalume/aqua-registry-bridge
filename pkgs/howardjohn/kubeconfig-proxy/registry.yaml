# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: howardjohn
    repo_name: kubeconfig-proxy
    description: Tunnel Kubectl requests over `kubectl proxy` to avoid round trips to API server
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/howardjohn/kubeconfig-proxy/releases/download/{{.Version}}/kubeconfig-proxy_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubeconfig-proxy_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/howardjohn/kubeconfig-proxy/releases/download/{{.Version}}/kubeconfig-proxy_{{trimV .Version}}_checksums.txt
          asset: kubeconfig-proxy_{{trimV .Version}}_checksums.txt
          algorithm: sha256
