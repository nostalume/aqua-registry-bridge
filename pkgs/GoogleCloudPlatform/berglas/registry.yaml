# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: GoogleCloudPlatform
    repo_name: berglas
    description: A tool for managing secrets on Google Cloud
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.7.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/GoogleCloudPlatform/berglas/releases/download/{{.Version}}/berglas_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: berglas_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/GoogleCloudPlatform/berglas/releases/download/{{.Version}}/berglas_{{trimV .Version}}_SHA512SUMS
          asset: berglas_{{trimV .Version}}_SHA512SUMS
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/GoogleCloudPlatform/berglas/releases/download/{{.Version}}/berglas_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
