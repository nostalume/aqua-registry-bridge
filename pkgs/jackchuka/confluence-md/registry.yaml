# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jackchuka
    repo_name: confluence-md
    description: From Confluence to clean Markdown, images and all — just one command
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/jackchuka/confluence-md/releases/download/{{.Version}}/confluence-md_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: confluence-md_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/jackchuka/confluence-md/releases/download/{{.Version}}/confluence-md_{{trimV .Version}}_checksums.txt
          asset: confluence-md_{{trimV .Version}}_checksums.txt
          algorithm: sha256
