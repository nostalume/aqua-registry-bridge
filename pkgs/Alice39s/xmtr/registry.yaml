# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Alice39s
    repo_name: xmtr
    description: Concurrent traceroute built on trippy that publishes routes
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Alice39s/xmtr/releases/download/{{.Version}}/xmtr-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: xmtr-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-gnu
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Alice39s/xmtr/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Alice39s/xmtr/releases/download/{{.Version}}/xmtr-{{.Arch}}-{{.OS}}.{{.Format}}
            format: tar.gz
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/Alice39s/xmtr/releases/download/{{.Version}}/xmtr-{{.Arch}}-{{.OS}}.{{.Format}}
            format: tar.gz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Alice39s/xmtr/releases/download/{{.Version}}/xmtr-{{.Arch}}-{{.OS}}llvm.{{.Format}}
            goarch: arm64
            asset: xmtr-{{.Arch}}-{{.OS}}llvm.{{.Format}}
