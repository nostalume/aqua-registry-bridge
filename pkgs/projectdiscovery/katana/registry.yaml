# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: projectdiscovery
    repo_name: katana
    description: A next-generation crawling and spidering framework
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.2")
        type: http
        url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: katana_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana_{{trimV .Version}}_checksums.txt
          asset: katana_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 1.1.0")
        type: http
        url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: katana_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana-{{.OS}}-checksums.txt
          asset: katana-{{.OS}}-checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            checksum:
              type: http
              url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana-mac-checksums.txt
              asset: katana-mac-checksums.txt
              algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: katana_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana-{{.OS}}-checksums.txt
          asset: katana-{{.OS}}-checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            checksum:
              type: http
              url: https://gh-proxy.org/github.com/projectdiscovery/katana/releases/download/{{.Version}}/katana-mac-checksums.txt
              asset: katana-mac-checksums.txt
              algorithm: sha256
