# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: soh335
    repo_name: shukujitsu
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.8"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/soh335/shukujitsu/releases/download/{{.Version}}/shukujitsu_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: shukujitsu_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/soh335/shukujitsu/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
