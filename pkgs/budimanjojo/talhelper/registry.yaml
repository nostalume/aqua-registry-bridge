# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: budimanjojo
    repo_name: talhelper
    description: A tool to help creating Talos kubernetes cluster
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.6.4")
        type: http
        url: https://gh-proxy.org/github.com/budimanjojo/talhelper/releases/download/{{.Version}}/talhelper_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: talhelper_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/budimanjojo/talhelper/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/budimanjojo/talhelper/releases/download/{{.Version}}/talhelper_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: talhelper_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/budimanjojo/talhelper/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
