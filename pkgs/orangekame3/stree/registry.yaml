# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: orangekame3
    repo_name: stree
    description: Directory trees of AWS S3 Bucket
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.12")
        type: http
        url: https://gh-proxy.org/github.com/orangekame3/stree/releases/download/{{.Version}}/stree_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: stree_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/orangekame3/stree/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/orangekame3/stree/releases/download/{{.Version}}/stree_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v0.0.13"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/orangekame3/stree/releases/download/{{.Version}}/stree_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: stree_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/orangekame3/stree/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
