# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/elsesiy/kubectl-view-secret/releases/download/{{.Version}}/kubectl-view-secret_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: elsesiy
    repo_name: kubectl-view-secret
    description: Kubernetes CLI plugin to decode Kubernetes secrets
    files:
      - name: kubectl-view_secret
        src: kubectl-view-secret
    version_constraint: semver(">= 0.8.0")
    asset: kubectl-view-secret_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/elsesiy/kubectl-view-secret/releases/download/{{.Version}}/kubectl-view-secret_{{trimV .Version}}_checksums.txt
      asset: kubectl-view-secret_{{trimV .Version}}_checksums.txt
      algorithm: sha256
    version_overrides:
      - version_constraint: semver("= 0.7.0")
        type: http
        url: https://gh-proxy.org/github.com/elsesiy/kubectl-view-secret/releases/download/{{.Version}}/kubectl-view-secret_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz
        rosetta2: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/elsesiy/kubectl-view-secret/releases/download/{{.Version}}/kubectl-view-secret_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        asset: kubectl-view-secret_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        rosetta2: true
        supported_envs:
          - darwin
          - amd64
        replacements:
          darwin: Darwin
          windows: Windows
          linux: Linux
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/elsesiy/kubectl-view-secret/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
