# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/cloudspannerecosystem/yo/releases/download/{{.Version}}/yo-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: cloudspannerecosystem
    repo_name: yo
    asset: yo-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    description: yo is a command-line tool to generate Go code for Google Cloud Spanner
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/cloudspannerecosystem/yo/releases/download/{{.Version}}/yo-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    files:
      - name: yo
        src: yo-{{trimV .Version}}-{{.OS}}-{{.Arch}}/yo
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/cloudspannerecosystem/yo/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
