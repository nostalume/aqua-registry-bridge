# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: aws
    repo_name: amazon-ec2-spot-interrupter
    description: The ec2-spot-interrupter is a simple CLI tool that triggers Amazon EC2 Spot Interruption Notifications and Rebalance Recommendations
    files:
      - name: ec2-spot-interrupter
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.7")
        type: http
        url: https://gh-proxy.org/github.com/aws/amazon-ec2-spot-interrupter/releases/download/{{.Version}}/ec2-spot-interrupter_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ec2-spot-interrupter_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aws/amazon-ec2-spot-interrupter/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.0.10")
        type: http
        url: https://gh-proxy.org/github.com/aws/amazon-ec2-spot-interrupter/releases/download/{{.Version}}/ec2-spot-interrupter_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ec2-spot-interrupter_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aws/amazon-ec2-spot-interrupter/releases/download/{{.Version}}/ec2-spot-interrupter_{{trimV .Version}}_checksums.txt
          asset: ec2-spot-interrupter_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "v0.0.11"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/aws/amazon-ec2-spot-interrupter/releases/download/{{.Version}}/ec2-spot-interrupter_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ec2-spot-interrupter_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aws/amazon-ec2-spot-interrupter/releases/download/{{.Version}}/ec2-spot-interrupter_{{trimV .Version}}_checksums.txt
          asset: ec2-spot-interrupter_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - linux
