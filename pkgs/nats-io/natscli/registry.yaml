# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/nats-io/natscli/releases/download/{{.Version}}/nats-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: nats-io
    repo_name: natscli
    description: The NATS Command Line Interface
    asset: nats-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: zip
    files:
      - name: nats
        src: nats-{{trimV .Version}}-{{.OS}}-{{.Arch}}/nats
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/nats-io/natscli/releases/download/{{.Version}}/SHA256SUMS
      asset: SHA256SUMS
      algorithm: sha256
    version_constraint: semver(">= 0.0.27")
    version_overrides:
      - version_constraint: semver(">= 0.0.23")
        type: http
        url: https://gh-proxy.org/github.com/nats-io/natscli/releases/download/{{.Version}}/nats-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: nats-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - linux
          - amd64
        rosetta2: true
      - version_constraint: semver(">= 0.0.22")
        type: http
        url: https://gh-proxy.org/github.com/nats-io/natscli/releases/download/{{.Version}}/nats-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: nats-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - linux
          - amd64
      - version_constraint: semver("< 0.0.22")
        type: http
        url: https://gh-proxy.org/github.com/nats-io/natscli/releases/download/{{.Version}}/nats-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: nats-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - linux
          - amd64
        rosetta2: true
