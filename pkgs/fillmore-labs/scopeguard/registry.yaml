# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fillmore-labs
    repo_name: scopeguard
    description: A Go static analyzer that identifies variables with unnecessarily wide scope and suggests moving them to tighter scopes
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fillmore-labs/scopeguard/releases/download/{{.Version}}/scopeguard_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scopeguard_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fillmore-labs/scopeguard/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fillmore-labs/scopeguard/releases/download/{{.Version}}/scopeguard_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
