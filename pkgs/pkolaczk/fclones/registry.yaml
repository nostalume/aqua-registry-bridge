# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: pkolaczk
    repo_name: fclones
    description: Efficient Duplicate File Finder
    version_filter: not (Version matches "^gui")
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v0.12.3", "v0.18.1", "v0.29.2", "v0.31.1"]
        no_asset: true
      - version_constraint: Version == "0.2.0"
        type: http
        url: https://gh-proxy.org/github.com/pkolaczk/fclones/releases/download/{{.Version}}/fclones-{{.Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
        asset: fclones-{{.Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          windows: win
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/pkolaczk/fclones/releases/download/{{.Version}}/fclones-{{.Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/pkolaczk/fclones/releases/download/{{.Version}}/fclones-{{.Version}}-{{.OS}}.{{.Arch}}.{{.Format}}
            asset: fclones-{{.Version}}-{{.OS}}.{{.Arch}}.{{.Format}}
            replacements:
              amd64: x86_64
        supported_envs:
          - linux/arm64
          - windows/amd64
      - version_constraint: Version in ["v0.19.0", "v0.23.0"]
        type: http
        url: https://gh-proxy.org/github.com/pkolaczk/fclones/releases/download/{{.Version}}/fclones-{{trimV .Version}}-{{.OS}}.{{.Arch}}.{{.Format}}
        asset: fclones-{{trimV .Version}}-{{.OS}}.{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
