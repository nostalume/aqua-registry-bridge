# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: joshmedeski
    repo_name: sesh
    description: Smart session manager for the terminal
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0.0"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/joshmedeski/sesh/releases/download/{{.Version}}/sesh_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sesh_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/joshmedeski/sesh/releases/download/{{.Version}}/sesh_{{trimV .Version}}_checksums.txt
          asset: sesh_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/joshmedeski/sesh/releases/download/{{.Version}}/sesh_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
