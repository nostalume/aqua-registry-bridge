# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: dimonomid
    repo_name: nerdlog
    description: "Nerdlog: fast, remote-first, multi-host TUI log viewer with timeline histogram and no central server"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.2.2")
        no_asset: true
      - version_constraint: semver("<= 1.5.0")
        type: http
        url: https://gh-proxy.org/github.com/dimonomid/nerdlog/releases/download/{{.Version}}/nerdlog_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: nerdlog_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dimonomid/nerdlog/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dimonomid/nerdlog/releases/download/{{.Version}}/nerdlog_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/dimonomid/nerdlog/releases/download/{{.Version}}/nerdlog_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: nerdlog_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dimonomid/nerdlog/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dimonomid/nerdlog/releases/download/{{.Version}}/nerdlog_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
