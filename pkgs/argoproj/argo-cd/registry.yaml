# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
    repo_owner: argoproj
    repo_name: argo-cd
    description: Declarative continuous deployment for Kubernetes
    asset: argocd-{{.OS}}-{{.Arch}}
    format: raw
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/cli_checksums.txt
      asset: cli_checksums.txt
      algorithm: sha256
    files:
      - name: argocd
    slsa_provenance:
      type: http
      url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-cli.intoto.jsonl
      asset: argocd-cli.intoto.jsonl
    version_constraint: semver(">= 2.7.0-rc1")
    version_overrides:
      - version_constraint: semver(">= 2.5.0-rc3")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{trimV .Version}}-checksums.txt
          asset: argocd-{{trimV .Version}}-checksums.txt
          algorithm: sha256
      - version_constraint: semver(">= 2.5.0-rc1")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver(">= 2.4.15")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{trimV .Version}}-checksums.txt
          asset: argocd-{{trimV .Version}}-checksums.txt
          algorithm: sha256
      - version_constraint: semver(">= 2.4.0-rc1")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver(">= 2.3.11")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{trimV .Version}}-checksums.txt
          asset: argocd-{{trimV .Version}}-checksums.txt
          algorithm: sha256
      - version_constraint: semver(">= 2.3.10")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver(">= 2.3.0-rc1")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        checksum:
          enabled: false
      - version_constraint: semver(">= 2.2.15")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{trimV .Version}}-checksums.txt
          asset: argocd-{{trimV .Version}}-checksums.txt
          algorithm: sha256
      - version_constraint: semver(">= 1.4.3")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
        checksum:
          enabled: false
      - version_constraint: semver("< 1.4.3")
        type: http
        url: https://gh-proxy.org/github.com/argoproj/argo-cd/releases/download/{{.Version}}/argocd-{{.OS}}-{{.Arch}}
        slsa_provenance:
          enabled: false
        supported_envs:
          - linux/amd64
          - darwin
        rosetta2: true
        checksum:
          enabled: false
