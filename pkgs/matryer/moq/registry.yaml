# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: matryer
    repo_name: moq
    description: Interface mocking tool for go generate
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.6")
        type: http
        url: https://gh-proxy.org/github.com/matryer/moq/releases/download/{{.Version}}/moq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: moq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macOS
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/matryer/moq/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: Version == "v0.1.7"
