# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/datastax-archive/astra-cli/releases/download/{{.Version}}/astra-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: datastax-archive
    repo_name: astra-cli
    aliases:
      - name: datastax-labs/astra-cli
    description: DataStax Astra automation CLI
    asset: astra-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    files:
      - name: astra
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/datastax-archive/astra-cli/releases/download/{{.Version}}/astra-cli_{{trimV .Version}}_checksums.txt
      asset: astra-cli_{{trimV .Version}}_checksums.txt
      algorithm: sha256
