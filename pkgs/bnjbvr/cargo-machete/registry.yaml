# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: bnjbvr
    repo_name: cargo-machete
    description: Remove unused Rust dependencies with this one weird trick
    files:
      - name: cargo-machete
        src: "{{.AssetWithoutExt}}/cargo-machete"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.3.1"
        type: http
        url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: cargo-machete-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.10.0"
        type: http
        url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
        supported_envs:
          - linux
          - windows/amd64
      - version_constraint: semver("<= 0.8.0")
        type: http
        url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.9.2")
        type: http
        url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              linux: unknown-linux-gnu
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/bnjbvr/cargo-machete/releases/download/{{.Version}}/cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: cargo-machete-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
