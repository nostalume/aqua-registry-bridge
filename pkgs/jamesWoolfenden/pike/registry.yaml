# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jamesWoolfenden
    repo_name: pike
    description: Pike is a tool for determining the permissions or policy required for IAC code
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.3"
        no_asset: true
      - version_constraint: semver("<= 0.1.3")
        type: http
        url: https://gh-proxy.org/github.com/jamesWoolfenden/pike/releases/download/{{.Version}}/pike_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pike_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/jamesWoolfenden/pike/releases/download/{{.Version}}/pike_{{trimV .Version}}_checksums.txt
          asset: pike_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.1.35")
        type: http
        url: https://gh-proxy.org/github.com/jamesWoolfenden/pike/releases/download/{{.Version}}/pike_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pike_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/jamesWoolfenden/pike/releases/download/{{.Version}}/pike_{{trimV .Version}}_checksums.txt
          asset: pike_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/jamesWoolfenden/pike/releases/download/{{.Version}}/pike_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pike_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/jamesWoolfenden/pike/releases/download/{{.Version}}/pike_{{trimV .Version}}_checksums.txt
          asset: pike_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/jamesWoolfenden/pike/releases/download/{{.Version}}/pike_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
