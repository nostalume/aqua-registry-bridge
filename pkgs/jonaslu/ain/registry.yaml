# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/jonaslu/ain/releases/download/{{.Version}}/ain_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: jonaslu
    repo_name: ain
    asset: ain_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    description: An HTTP API client for the terminal
    files:
      - name: ain
        src: ain_{{trimV .Version}}_{{.OS}}_{{.Arch}}/ain
    replacements:
      darwin: mac_os
      amd64: x86_64
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/jonaslu/ain/releases/download/{{.Version}}/ain_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/jonaslu/ain/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
