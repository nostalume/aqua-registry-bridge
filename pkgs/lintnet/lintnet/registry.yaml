# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: lintnet
    repo_name: lintnet
    aliases:
      - name: suzuki-shunsuke/lintnet
    description: General Linter powered by Jsonnet
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.8-1")
        type: http
        url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{trimV .Version}}_checksums.txt
          asset: lintnet_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --signature
              - https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{trimV .Version}}_checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - lintnet/lintnet
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
      - version_constraint: semver("<= 0.4.11")
        type: http
        url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{trimV .Version}}_checksums.txt
          asset: lintnet_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --signature
              - https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{trimV .Version}}_checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - lintnet/lintnet
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        github_artifact_attestations:
          signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{trimV .Version}}_checksums.txt
          asset: lintnet_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/lintnet/lintnet/releases/download/{{.Version}}/lintnet_{{trimV .Version}}_checksums.txt.bundle
              asset: lintnet_{{trimV .Version}}_checksums.txt.bundle
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - lintnet/lintnet
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        github_artifact_attestations:
          signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
