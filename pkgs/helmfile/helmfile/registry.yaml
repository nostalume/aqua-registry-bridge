# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: helmfile
    repo_name: helmfile
    aliases:
      - name: roboll/helmfile
    description: Declaratively deploy your Kubernetes manifests, Kustomize configs, and Charts as Helm releases. Generate all-in-one manifests for use with ArgoCD
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/helmfile/helmfile/releases/download/{{.Version}}/helmfile_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: helmfile_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helmfile/helmfile/releases/download/{{.Version}}/helmfile_{{trimV .Version}}_checksums.txt
          asset: helmfile_{{trimV .Version}}_checksums.txt
          algorithm: sha256
