# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/drlau/akashi/releases/download/{{.Version}}/akashi_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: drlau
    repo_name: akashi
    asset: akashi_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: Validate "terraform plan" changes against a customizable ruleset
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/drlau/akashi/releases/download/{{.Version}}/akashi_{{trimV .Version}}_checksums.txt
      asset: akashi_{{trimV .Version}}_checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 0.0.12")
    version_overrides:
      - version_constraint: semver(">= 0.0.8")
        type: http
        url: https://gh-proxy.org/github.com/drlau/akashi/releases/download/{{.Version}}/akashi_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        rosetta2: true
        supported_envs:
          - darwin
          - linux
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/drlau/akashi/releases/download/{{.Version}}/akashi_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        rosetta2: true
        supported_envs:
          - darwin
          - amd64
