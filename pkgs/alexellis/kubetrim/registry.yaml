# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: alexellis
    repo_name: kubetrim
    description: Trim  your KUBECONFIG automatically
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.1-rc1")
        no_asset: true
      - version_constraint: semver("<= 0.0.1-rc3")
        type: http
        url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim
        asset: kubetrim
        format: raw
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim-arm64
            goarch: arm64
            asset: kubetrim-arm64
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim-darwin
            goarch: amd64
            asset: kubetrim-darwin
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim-darwin-arm64
            goarch: arm64
            asset: kubetrim-darwin-arm64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim.tgz
        asset: kubetrim.tgz
        format: tgz
        files:
          - name: kubetrim
            src: '{{trimSuffix ".tgz" .Asset}}'
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim-arm64.tgz
            goarch: arm64
            asset: kubetrim-arm64.tgz
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim-darwin.tgz
            goarch: amd64
            asset: kubetrim-darwin.tgz
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim-darwin-arm64.tgz
            goarch: arm64
            asset: kubetrim-darwin-arm64.tgz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/alexellis/kubetrim/releases/download/{{.Version}}/kubetrim.exe.tgz
            asset: kubetrim.exe.tgz
