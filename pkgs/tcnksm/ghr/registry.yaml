# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/tcnksm/ghr/releases/download/{{.Version}}/ghr_{{.Version}}_{{.OS}}_amd64.{{.Format}}
    repo_owner: tcnksm
    repo_name: ghr
    description: Upload multiple artifacts to GitHub Release in parallel
    rosetta2: true
    supported_envs:
      - darwin
      - amd64
    asset: ghr_{{.Version}}_{{.OS}}_amd64.{{.Format}}
    files:
      - name: ghr
        src: ghr_{{.Version}}_{{.OS}}_amd64/ghr
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/tcnksm/ghr/releases/download/{{.Version}}/ghr_{{.Version}}_{{.OS}}_amd64.{{.Format}}
        format: tar.gz
