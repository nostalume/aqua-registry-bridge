# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: containerd
    repo_name: nerdctl
    description: "contaiNERD CTL - Docker-compatible CLI for containerd, with support for Compose, Rootless, eStargz, OCIcrypt, IPFS, "
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.1"
        type: http
        url: https://gh-proxy.org/github.com/containerd/nerdctl/releases/download/{{.Version}}/nerdctl-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: nerdctl-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containerd/nerdctl/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
      - version_constraint: semver("<= 0.8.1")
        type: http
        url: https://gh-proxy.org/github.com/containerd/nerdctl/releases/download/{{.Version}}/nerdctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: nerdctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containerd/nerdctl/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
      - version_constraint: semver("<= 2.0.4")
        type: http
        url: https://gh-proxy.org/github.com/containerd/nerdctl/releases/download/{{.Version}}/nerdctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: nerdctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containerd/nerdctl/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
          - windows/amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/containerd/nerdctl/releases/download/{{.Version}}/nerdctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: nerdctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containerd/nerdctl/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        github_artifact_attestations:
          signer_workflow: containerd/nerdctl/.github/workflows/release.yml
        supported_envs:
          - linux
          - windows/amd64
