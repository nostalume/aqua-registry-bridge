# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: containerd
    repo_name: stargz-snapshotter
    description: |-
      Fast container image distribution plugin with lazy pulling

      ## How to set up

      Please see:

      https://github.com/containerd/stargz-snapshotter/blob/main/docs/INSTALL.md
      https://github.com/containerd/stargz-snapshotter/blob/main/docs/rootless.md
    files:
      - name: containerd-stargz-grpc
      - name: ctr-remote
      - name: stargz-store
      - name: stargz-store-helper
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/containerd/stargz-snapshotter/releases/download/{{.Version}}/stargz-snapshotter-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: stargz-snapshotter-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containerd/stargz-snapshotter/releases/download/{{.Version}}/stargz-snapshotter-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz.sha256sum
          asset: stargz-snapshotter-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz.sha256sum
          algorithm: sha256
        supported_envs:
          - linux/amd64
        files:
          - name: containerd-stargz-grpc
          - name: ctr-remote
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/containerd/stargz-snapshotter/releases/download/{{.Version}}/stargz-snapshotter-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: stargz-snapshotter-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containerd/stargz-snapshotter/releases/download/{{.Version}}/stargz-snapshotter-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz.sha256sum
          asset: stargz-snapshotter-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz.sha256sum
          algorithm: sha256
        supported_envs:
          - linux
