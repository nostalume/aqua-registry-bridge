# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: containerd
    repo_name: fuse-overlayfs-snapshotter
    description: fuse-overlayfs plugin for rootless containerd on old Linux (not needed on modern Linux)
    files:
      - name: containerd-fuse-overlayfs-grpc
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0.0"
        no_asset: true
      - version_constraint: semver("<= 2.1.2")
        type: http
        url: https://gh-proxy.org/github.com/containerd/fuse-overlayfs-snapshotter/releases/download/{{.Version}}/containerd-fuse-overlayfs-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: containerd-fuse-overlayfs-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containerd/fuse-overlayfs-snapshotter/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
      - version_constraint: semver("<= 2.1.4")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/containerd/fuse-overlayfs-snapshotter/releases/download/{{.Version}}/containerd-fuse-overlayfs-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: containerd-fuse-overlayfs-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containerd/fuse-overlayfs-snapshotter/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        github_artifact_attestations:
          signer_workflow: containerd/fuse-overlayfs-snapshotter/.github/workflows/release.yml
        supported_envs:
          - linux
