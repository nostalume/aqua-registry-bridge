# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/taskctl/taskctl/releases/download/{{.Version}}/taskctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: taskctl
    repo_name: taskctl
    asset: taskctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: Concurrent task runner, developer's routine tasks automation toolkit. Simple modern alternative to GNU Make
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/taskctl/taskctl/releases/download/{{.Version}}/taskctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/taskctl/taskctl/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
