# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/bridgecrewio/yor/releases/download/{{.Version}}/yor_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: bridgecrewio
    repo_name: yor
    asset: yor_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: Extensible auto-tagger for your IaC files. The ultimate way to link entities in the cloud back to the codified resource which created it
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/bridgecrewio/yor/releases/download/{{.Version}}/yor_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/bridgecrewio/yor/releases/download/{{.Version}}/yor_{{.Version}}_checksums.txt
      asset: yor_{{.Version}}_checksums.txt
      algorithm: sha256
