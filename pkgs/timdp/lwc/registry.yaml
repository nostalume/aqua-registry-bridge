# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: timdp
    repo_name: lwc
    description: A live-updating version of the UNIX wc command
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/timdp/lwc/releases/download/{{.Version}}/lwc-golang_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lwc-golang_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/timdp/lwc/releases/download/{{.Version}}/lwc-golang_{{trimV .Version}}_checksums.txt
          asset: lwc-golang_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.4")
        type: http
        url: https://gh-proxy.org/github.com/timdp/lwc/releases/download/{{.Version}}/lwc-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: lwc-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/timdp/lwc/releases/download/{{.Version}}/lwc-checksums.txt
          asset: lwc-checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/timdp/lwc/releases/download/{{.Version}}/lwc-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: lwc-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/timdp/lwc/releases/download/{{.Version}}/lwc-checksums.txt
          asset: lwc-checksums.txt
          algorithm: sha256
