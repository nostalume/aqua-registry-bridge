# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: devops-kung-fu
    repo_name: bomber
    description: Scans Software Bill of Materials (SBOMs) for security vulnerabilities
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.1")
        type: http
        url: https://gh-proxy.org/github.com/devops-kung-fu/bomber/releases/download/{{.Version}}/bomber_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bomber_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/devops-kung-fu/bomber/releases/download/{{.Version}}/bomber_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
            asset: bomber_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/devops-kung-fu/bomber/releases/download/{{.Version}}/bomber_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            files:
              # https://github.com/devops-kung-fu/bomber/pull/27
              - name: bomber
                src: hookz
        supported_envs:
          - linux
          - darwin
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/devops-kung-fu/bomber/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.3.2")
