# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: aubepkg
    repo_name: aube
    aliases:
      - name: endevco/aube
      - name: jdx/aube
    description: A fast Node.js package manager
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0.0-beta.1"
        type: http
        url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - linux/amd64
          - darwin
          - windows
      - version_constraint: semver("<= 1.0.0-beta.11")
        type: http
        url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: amd64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - darwin/arm64
          - windows
      - version_constraint: semver("<= 1.1.0")
        type: http
        url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: amd64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - darwin/arm64
          - windows
      - version_constraint: semver("<= 2.2.4")
        type: http
        url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            variants:
              - key: libc
                value: glibc
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              linux: unknown-linux-musl
            variants:
              - key: libc
                value: musl
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: amd64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - darwin/arm64
          - windows
      - version_constraint: semver("<= 2.2.8")
        type: http
        url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            variants:
              - key: libc
                value: glibc
            replacements:
              linux: unknown-linux-gnu
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: amd64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - darwin/arm64
          - windows
        github_artifact_attestations:
          signer_workflow: aubepkg/aube/.github/workflows/release.yml
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            variants:
              - key: libc
                value: glibc
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            variants:
              - key: libc
                value: musl
            replacements:
              linux: unknown-linux-musl
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: amd64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aubepkg/aube/releases/download/{{.Version}}/aube-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - darwin/arm64
          - windows
        github_artifact_attestations:
          signer_workflow: aubepkg/aube/.github/workflows/release.yml
