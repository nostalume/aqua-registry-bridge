# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/ekzhang/bore/releases/download/{{.Version}}/bore-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    repo_owner: ekzhang
    repo_name: bore
    asset: bore-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    description: bore is a simple CLI tool for making tunnels to localhost
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/ekzhang/bore/releases/download/{{.Version}}/bore-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - amd64
