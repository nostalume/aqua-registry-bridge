# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: AlexNabokikh
    repo_name: tfsort
    description: A CLI utility to sort Terraform variables and outputs
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/AlexNabokikh/tfsort/releases/download/{{.Version}}/tfsort_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfsort_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/AlexNabokikh/tfsort/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/AlexNabokikh/tfsort/releases/download/{{.Version}}/tfsort_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
            asset: tfsort_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
