# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/hirose31/s3surfer/releases/download/{{.Version}}/s3surfer_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: hirose31
    repo_name: s3surfer
    description: s3surfer is CLI tool for browsing S3 bucket and download objects interactively
    asset: s3surfer_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/hirose31/s3surfer/releases/download/{{.Version}}/s3surfer_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
    supported_envs:
      - darwin
      - linux
      - amd64
    files:
      - name: s3surfer
        src: s3surfer_{{.Version}}_{{.OS}}_{{.Arch}}/s3surfer
