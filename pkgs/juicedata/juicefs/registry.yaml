# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: juicedata
    repo_name: juicefs
    description: JuiceFS is a distributed POSIX file system built on top of Redis and S3
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.12.0")
        no_asset: true
      - version_constraint: semver("<= 1.0.0-beta2")
        type: http
        url: https://gh-proxy.org/github.com/juicedata/juicefs/releases/download/{{.Version}}/juicefs-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: juicefs-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/juicedata/juicefs/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/juicedata/juicefs/releases/download/{{.Version}}/juicefs-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: juicefs-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/juicedata/juicefs/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
