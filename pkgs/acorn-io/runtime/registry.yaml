# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/acorn-io/runtime/releases/download/{{.Version}}/acorn-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: acorn-io
    repo_name: runtime
    aliases:
      - name: acorn-io/acorn
    description: A simple application deployment framework for Kubernetes
    asset: acorn-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    files:
      - name: acorn
    format: tar.gz
    replacements:
      darwin: macOS
    overrides:
      - goos: darwin
        type: http
        url: https://gh-proxy.org/github.com/acorn-io/runtime/releases/download/{{.Version}}/acorn-{{.Version}}-{{.OS}}-universal.{{.Format}}
        asset: acorn-{{.Version}}-{{.OS}}-universal.{{.Format}}
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/acorn-io/runtime/releases/download/{{.Version}}/acorn-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/acorn-io/runtime/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
