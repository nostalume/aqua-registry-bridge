# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: getzola
    repo_name: zola
    description: A fast static site generator in a single binary with everything built-in. https://www.getzola.org
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.2"
        type: http
        url: https://gh-proxy.org/github.com/getzola/zola/releases/download/{{.Version}}/gutenberg-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: gutenberg-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
        supported_envs:
          - linux/amd64
          - darwin
        files:
          - name: gutenberg
      - version_constraint: semver("<= 0.0.7")
        type: http
        url: https://gh-proxy.org/github.com/getzola/zola/releases/download/{{.Version}}/gutenberg-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: gutenberg-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-gnu
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getzola/zola/releases/download/{{.Version}}/gutenberg-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
        files:
          - name: gutenberg
      - version_constraint: semver("<= 0.4.2")
        type: http
        url: https://gh-proxy.org/github.com/getzola/zola/releases/download/{{.Version}}/gutenberg-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: gutenberg-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getzola/zola/releases/download/{{.Version}}/gutenberg-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
        files:
          - name: gutenberg
      - version_constraint: Version == "v0.9.0"
        type: http
        url: https://gh-proxy.org/github.com/getzola/zola/releases/download/{{.Version}}/zola-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: zola-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.17.2")
        type: http
        url: https://gh-proxy.org/github.com/getzola/zola/releases/download/{{.Version}}/zola-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: zola-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getzola/zola/releases/download/{{.Version}}/zola-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("< 0.20.0")
