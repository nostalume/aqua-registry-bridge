# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mstange
    repo_name: samply
    description: Command-line sampling profiler for macOS, Linux, and Windows
    version_prefix: samply-v
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("= 0.12.0")
        type: http
        url: https://gh-proxy.org/github.com/mstange/samply/releases/download/{{.Version}}/samply-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: samply-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        files:
          - name: samply
            src: samply-{{.Arch}}-{{.OS}}/samply
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/mstange/samply/releases/download/{{.Version}}/samply-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mstange/samply/releases/download/{{.Version}}/samply-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: samply
                src: samply.exe
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.11.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mstange/samply/releases/download/{{.Version}}/samply-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: samply-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        files:
          - name: samply
            src: samply-{{.Arch}}-{{.OS}}/samply
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/mstange/samply/releases/download/{{.Version}}/samply-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/mstange/samply/releases/download/{{.Version}}/samply-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              linux: unknown-linux-gnu
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mstange/samply/releases/download/{{.Version}}/samply-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: samply
                src: samply.exe
