# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/simonwhitaker/gibo/releases/download/{{.Version}}/gibo_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: simonwhitaker
    repo_name: gibo
    description: Easy access to gitignore boilerplates
    asset: gibo_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/simonwhitaker/gibo/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/simonwhitaker/gibo/releases/download/{{.Version}}/gibo_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/simonwhitaker/gibo/releases/download/{{.Version}}/checksums.windows.txt
          asset: checksums.windows.txt
          algorithm: sha256
