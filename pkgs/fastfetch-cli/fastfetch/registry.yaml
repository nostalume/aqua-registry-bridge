# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fastfetch-cli
    repo_name: fastfetch
    description: An actively maintained, feature-rich and performance oriented, neofetch like system information tool
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["1.10.2", "2.1.2", "2.7.0"]
        type: http
        url: https://gh-proxy.org/github.com/fastfetch-cli/fastfetch/releases/download/{{.Version}}/fastfetch-{{.Version}}-{{.OS}}.{{.Format}}
        asset: fastfetch-{{.Version}}-{{.OS}}.{{.Format}}
        files:
          - name: fastfetch
            src: "{{.AssetWithoutExt}}/usr/bin/fastfetch"
        format: tar.gz
        replacements:
          darwin: Darwin
          linux: Linux
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fastfetch-cli/fastfetch/releases/download/{{.Version}}/fastfetch-{{.Version}}-{{.OS}}.{{.Format}}
            goarch: amd64
            format: zip
            replacements:
              windows: Win64
            files:
              - name: fastfetch
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fastfetch-cli/fastfetch/releases/download/{{.Version}}/fastfetch-{{.Version}}-{{.OS}}.{{.Format}}
            goarch: arm64
            format: zip
            replacements:
              windows: WinArm64
            files:
              - name: fastfetch
        supported_envs:
          - darwin
          - windows
          - amd64
