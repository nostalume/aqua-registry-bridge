# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kubernetes-sigs
    repo_name: gwctl
    description: gwctl is a command-line tool for managing and understanding Gateway API resources in your Kubernetes cluster
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kubernetes-sigs/gwctl/releases/download/{{.Version}}/gwctl_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gwctl_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubernetes-sigs/gwctl/releases/download/{{.Version}}/gwctl_{{trimV .Version}}_checksums.txt
          asset: gwctl_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubernetes-sigs/gwctl/releases/download/{{.Version}}/gwctl_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
