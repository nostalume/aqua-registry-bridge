# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/kubernetes-sigs/krew/releases/download/{{.Version}}/krew-{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: kubernetes-sigs
    repo_name: krew
    asset: krew-{{.OS}}_{{.Arch}}.tar.gz
    description: Find and install kubectl plugins
    files:
      - name: krew
        src: krew-{{.OS}}_{{.Arch}}
    version_constraint: semver(">= 0.4.2")
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kubernetes-sigs/krew/releases/download/{{.Version}}/krew.tar.gz
        asset: krew.tar.gz
        files:
          - name: krew
            src: krew-{{.OS}}_{{.Arch}}
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: "{{.AssetURL}}.sha256"
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
