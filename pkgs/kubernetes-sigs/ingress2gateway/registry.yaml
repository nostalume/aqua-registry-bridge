# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kubernetes-sigs
    repo_name: ingress2gateway
    description: Convert Ingress resources to Gateway API resources
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kubernetes-sigs/ingress2gateway/releases/download/{{.Version}}/ingress2gateway_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ingress2gateway_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubernetes-sigs/ingress2gateway/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubernetes-sigs/ingress2gateway/releases/download/{{.Version}}/ingress2gateway_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
