# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: spinel-coop
    repo_name: rv
    description: Next-gen very fast Ruby tooling
    version_constraint: "false"
    files:
      - name: rv
        src: rv-{{.Arch}}-{{.OS}}/rv
    version_overrides:
      - version_constraint: semver("<= 0.1.1")
        type: http
        url: https://gh-proxy.org/github.com/spinel-coop/rv/releases/download/{{.Version}}/rv-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rv-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        replacements:
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/spinel-coop/rv/releases/download/{{.Version}}/rv-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: x86_64
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: semver("<= 0.5.2")
        type: http
        url: https://gh-proxy.org/github.com/spinel-coop/rv/releases/download/{{.Version}}/rv-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rv-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/spinel-coop/rv/releases/download/{{.Version}}/rv-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rv-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
        github_artifact_attestations:
          signer_workflow: spinel-coop/rv/.github/workflows/release.yml
