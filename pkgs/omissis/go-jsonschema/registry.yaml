# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: omissis
    repo_name: go-jsonschema
    description: A tool to generate Go data types from JSON Schema definitions
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v0.13.1-rc.0", "v0.14.0-rc.0"]
        no_asset: true
      - version_constraint: semver("<= 0.9.0")
        type: http
        url: https://gh-proxy.org/github.com/omissis/go-jsonschema/releases/download/{{.Version}}/gojsonschema-{{.OS}}-{{.Arch}}
        asset: gojsonschema-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.12.0")
        type: http
        url: https://gh-proxy.org/github.com/omissis/go-jsonschema/releases/download/{{.Version}}/go-jsonschema_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: go-jsonschema_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/omissis/go-jsonschema/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/omissis/go-jsonschema/releases/download/{{.Version}}/go-jsonschema_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: go-jsonschema_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/omissis/go-jsonschema/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
