# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sylwit
    repo_name: terraform-cleaner
    description: Tiny utility which detects unused variables in your terraform modules
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sylwit/terraform-cleaner/releases/download/{{.Version}}/terraform-cleaner_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terraform-cleaner_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sylwit/terraform-cleaner/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
