# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: joerdav
    repo_name: xc
    description: Markdown defined task runner
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.30"
        type: http
        url: https://gh-proxy.org/github.com/joerdav/xc/releases/download/{{.Version}}/xc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: xc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/joerdav/xc/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.0.43")
        type: http
        url: https://gh-proxy.org/github.com/joerdav/xc/releases/download/{{.Version}}/xc_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: xc_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/joerdav/xc/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/joerdav/xc/releases/download/{{.Version}}/xc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: xc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/joerdav/xc/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
