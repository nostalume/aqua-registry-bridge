# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: containers/gvisor-tap-vsock/gvproxy
    type: github_release
    repo_owner: containers
    repo_name: gvisor-tap-vsock
    description: A new network stack based on gVisor
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.6.2"
        type: http
        url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}
        asset: gvproxy-{{.OS}}
        format: raw
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}-{{.Arch}}
            asset: gvproxy-{{.OS}}-{{.Arch}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.7.0"
        type: http
        url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}
        asset: gvproxy-{{.OS}}
        format: raw
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}
        asset: gvproxy-{{.OS}}
        format: raw
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}
        asset: gvproxy-{{.OS}}
        format: raw
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}-{{.Arch}}
            asset: gvproxy-{{.OS}}-{{.Arch}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.6.1")
        type: http
        url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}
        asset: gvproxy-{{.OS}}
        format: raw
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.7.3")
        type: http
        url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}
        asset: gvproxy-{{.OS}}
        format: raw
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}-{{.Arch}}
            asset: gvproxy-{{.OS}}-{{.Arch}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}
        asset: gvproxy-{{.OS}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/sha256sums
          asset: sha256sums
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.OS}}-{{.Arch}}
            asset: gvproxy-{{.OS}}-{{.Arch}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/containers/gvisor-tap-vsock/releases/download/{{.Version}}/gvproxy-{{.Arch}}
            goarch: arm64
            asset: gvproxy-{{.Arch}}
