# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: LucasPickering
    repo_name: slumber
    description: Terminal-based HTTP/REST client
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/LucasPickering/slumber/releases/download/{{.Version}}/slumber-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: slumber-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        files:
          - name: slumber
            src: "{{.AssetWithoutExt}}/slumber"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/LucasPickering/slumber/releases/download/{{.Version}}/slumber-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/LucasPickering/slumber/releases/download/{{.Version}}/slumber-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: slumber-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: slumber
            src: "{{.AssetWithoutExt}}/slumber"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/LucasPickering/slumber/releases/download/{{.Version}}/slumber-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/LucasPickering/slumber/releases/download/{{.Version}}/slumber-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: slumber
        supported_envs:
          - darwin
          - windows
          - amd64
