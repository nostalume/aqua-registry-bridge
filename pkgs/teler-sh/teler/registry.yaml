# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: teler-sh
    repo_name: teler
    aliases:
      - name: kitabisa/teler
    description: Real-time HTTP Intrusion Detection
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 2.0.0-beta")
        type: http
        url: https://gh-proxy.org/github.com/teler-sh/teler/releases/download/{{.Version}}/teler_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: teler_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/teler-sh/teler/releases/download/{{.Version}}/teler_{{trimV .Version}}_checksums.txt
          asset: teler_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/teler-sh/teler/releases/download/{{.Version}}/teler_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 2.0.0-rc.4")
        type: http
        url: https://gh-proxy.org/github.com/teler-sh/teler/releases/download/{{.Version}}/teler_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: teler_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/teler-sh/teler/releases/download/{{.Version}}/teler_{{trimV .Version}}_checksums.txt
          asset: teler_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/teler-sh/teler/releases/download/{{.Version}}/teler_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/teler-sh/teler/releases/download/{{.Version}}/teler_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: teler_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/teler-sh/teler/releases/download/{{.Version}}/teler_checksums.txt
          asset: teler_checksums.txt
          algorithm: sha256
