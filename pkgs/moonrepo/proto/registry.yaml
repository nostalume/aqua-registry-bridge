            url: https://gh-proxy.org/github.com/moonrepo/proto/releases/download/{{.Version}}/proto_cli-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: proto
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.20.4")
        type: http
        url: https://gh-proxy.org/github.com/moonrepo/proto/releases/download/{{.Version}}/proto_cli-{{.Arch}}-{{.OS}}.{{.Format}}
