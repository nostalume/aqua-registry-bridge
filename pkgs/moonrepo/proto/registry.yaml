# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: moonrepo
    repo_name: proto
    description: A pluggable multi-language version manager
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.8.2")
        type: http
        url: https://gh-proxy.org/github.com/moonrepo/proto/releases/download/{{.Version}}/proto_cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: proto_cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        files:
          - name: proto
            src: "{{.AssetWithoutExt}}/proto"
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/moonrepo/proto/releases/download/{{.Version}}/proto_cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/moonrepo/proto/releases/download/{{.Version}}/proto_cli-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: proto
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.14.1")
        type: http
        url: https://gh-proxy.org/github.com/moonrepo/proto/releases/download/{{.Version}}/proto_cli-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: proto_cli-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        files:
