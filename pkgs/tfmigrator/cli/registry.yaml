# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tfmigrator
    repo_name: cli
    description: CLI to migrate Terraform Configuration and State
    asset: tfmigrator_{{.OS}}_amd64.tar.gz
    files:
      - name: tfmigrator
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver(">= 0.2.2")
        type: http
        url: https://gh-proxy.org/github.com/tfmigrator/cli/releases/download/{{.Version}}/tfmigrator_{{.OS}}_amd64.tar.gz
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/tfmigrator/cli/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tfmigrator/cli/releases/download/{{.Version}}/tfmigrator_{{trimV .Version}}_checksums.txt
          asset: tfmigrator_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --signature
              - https://gh-proxy.org/github.com/tfmigrator/cli/releases/download/{{.Version}}/tfmigrator_{{trimV .Version}}_checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/tfmigrator/cli/releases/download/{{.Version}}/tfmigrator_{{trimV .Version}}_checksums.txt.pem
              - --certificate-github-workflow-repository
              - tfmigrator/cli
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/tfmigrator/cli/releases/download/{{.Version}}/tfmigrator_{{.OS}}_amd64.tar.gz
        slsa_provenance:
          enabled: false
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tfmigrator/cli/releases/download/{{.Version}}/tfmigrator_{{trimV .Version}}_checksums.txt
          asset: tfmigrator_{{trimV .Version}}_checksums.txt
          algorithm: sha256
