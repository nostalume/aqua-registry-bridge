# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: losfair
    repo_name: zeroserve
    description: Zero-config, fast `io_uring`-based HTTPS server
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.12-alpha.12")
        type: http
        url: https://gh-proxy.org/github.com/losfair/zeroserve/releases/download/{{.Version}}/zeroserve-{{.Arch}}-{{.OS}}
        asset: zeroserve-{{.Arch}}-{{.OS}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
        supported_envs:
          - linux
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/losfair/zeroserve/releases/download/{{.Version}}/zeroserve-{{.Arch}}-{{.OS}}
        asset: zeroserve-{{.Arch}}-{{.OS}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/losfair/zeroserve/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/losfair/zeroserve/\\.github/workflows/.+\\.ya?ml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/losfair/zeroserve/releases/download/{{.Version}}/SHA256SUMS.sigstore.json
              asset: SHA256SUMS.sigstore.json
        supported_envs:
          - linux
