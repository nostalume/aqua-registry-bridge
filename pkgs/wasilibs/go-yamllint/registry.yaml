# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: wasilibs
    repo_name: go-yamllint
    description: A distribution of yamllint that can be used with go run
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.35.1"
        type: http
        url: https://gh-proxy.org/github.com/wasilibs/go-yamllint/releases/download/{{.Version}}/go-yamllint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: go-yamllint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: yamllint
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/wasilibs/go-yamllint/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/wasilibs/go-yamllint/releases/download/{{.Version}}/go-yamllint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/wasilibs/go-yamllint/releases/download/{{.Version}}/go-yamllint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: go-yamllint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: yamllint
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/wasilibs/go-yamllint/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/wasilibs/go-yamllint/releases/download/{{.Version}}/go-yamllint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        github_artifact_attestations:
          signer-workflow: wasilibs/actions/.github/workflows/release.yaml
