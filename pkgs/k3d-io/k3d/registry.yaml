# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k3d-io
    repo_name: k3d
    aliases:
      - name: rancher/k3d
    description: Little helper to run CNCF's k3s in Docker
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v3.0.0-syntax.0", "v3.1.0-dev.0", "v3.4.0-test.0", "v4.1.0-alpha.2"]
        type: http
        url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/k3d-{{.OS}}-{{.Arch}}
        asset: k3d-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 3.0.0-rc.3")
        type: http
        url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/k3d-{{.OS}}-{{.Arch}}
        asset: k3d-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 4.2.0")
        type: http
        url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/k3d-{{.OS}}-{{.Arch}}
        asset: k3d-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/sha256sum.txt
          asset: sha256sum.txt
          algorithm: sha256
      - version_constraint: semver("<= 5.3.0")
        type: http
        url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/k3d-{{.OS}}-{{.Arch}}
        asset: k3d-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/sha256sum.txt
          asset: sha256sum.txt
          algorithm: sha256
      - version_constraint: semver("<= 5.4.9")
        type: http
        url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/k3d-{{.OS}}-{{.Arch}}
        asset: k3d-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/k3d-{{.OS}}-{{.Arch}}
        asset: k3d-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k3d-io/k3d/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
