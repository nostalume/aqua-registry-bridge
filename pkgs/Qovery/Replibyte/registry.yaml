# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Qovery
    repo_name: Replibyte
    description: Seed your development database with real data
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.8")
        type: http
        url: https://gh-proxy.org/github.com/Qovery/Replibyte/releases/download/{{.Version}}/replibyte_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: replibyte_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: replibyte
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Qovery/Replibyte/releases/download/{{.Version}}/replibyte_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
            format: tar.gz
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-gnu
        supported_envs:
          - darwin
          - windows
          - amd64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Qovery/Replibyte/releases/download/{{.Version}}/replibyte_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}.sha256sum
          asset: replibyte_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}.sha256sum
          algorithm: sha256
      - version_constraint: Version == "v0.2.0"
        no_asset: true
      - version_constraint: semver("<= 0.4.1")
        type: http
        url: https://gh-proxy.org/github.com/Qovery/Replibyte/releases/download/{{.Version}}/replibyte_{{.Version}}_{{.Arch}}-{{.OS}}.{{.Format}}
