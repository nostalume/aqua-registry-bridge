# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/kanisterio/kanister/releases/download/{{.Version}}/kanister_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: kanisterio
    repo_name: kanister
    description: An extensible framework for application-level data management on Kubernetes
    asset: kanister_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    files:
      - name: kanctl
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/kanisterio/kanister/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 0.84.0")
    # The darwin support was removed.
    # https://github.com/aquaproj/aqua-registry/pull/7537#issuecomment-1299550841
    supported_envs:
      - linux/amd64
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kanisterio/kanister/releases/download/{{.Version}}/kanister_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        rosetta2: true
        supported_envs:
          - darwin
          - linux/amd64
