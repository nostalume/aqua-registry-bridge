# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/climech/grit/releases/download/{{.Version}}/grit_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: climech
    repo_name: grit
    asset: grit_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: Multitree-based personal task manager
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/climech/grit/releases/download/{{.Version}}/grit_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    files:
      - name: grit
        src: grit_{{.Version}}_{{.OS}}_{{.Arch}}/grit
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/climech/grit/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
