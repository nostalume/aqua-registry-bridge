# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Cian911
    repo_name: switchboard
    description: "Automated file organisation and routing for all your machines. :open_file_folder:"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/Cian911/switchboard/releases/download/{{.Version}}/switchboard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: switchboard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Cian911/switchboard/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Cian911/switchboard/releases/download/{{.Version}}/switchboard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: switchboard_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Cian911/switchboard/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
