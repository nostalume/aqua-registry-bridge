# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sorenisanerd
    repo_name: gotty
    description: Share your terminal as a web application
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.1.0"
        type: http
        url: https://gh-proxy.org/github.com/sorenisanerd/gotty/releases/download/{{.Version}}/gotty_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gotty_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sorenisanerd/gotty/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "v1.2.0"
        type: http
        url: https://gh-proxy.org/github.com/sorenisanerd/gotty/releases/download/{{.Version}}/gotty_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gotty_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sorenisanerd/gotty/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sorenisanerd/gotty/releases/download/{{.Version}}/gotty_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gotty_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sorenisanerd/gotty/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
