# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Schniz/fnm/releases/download/{{.Version}}/fnm-linux.zip
    repo_owner: Schniz
    repo_name: fnm
    description: Fast and simple Node.js version manager, built in Rust
    asset: fnm-linux.zip
    overrides:
      - goos: darwin
        type: http
        url: https://gh-proxy.org/github.com/Schniz/fnm/releases/download/{{.Version}}/fnm-macos.zip
        asset: fnm-macos.zip
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/Schniz/fnm/releases/download/{{.Version}}/fnm-windows.zip
        asset: fnm-windows.zip
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/Schniz/fnm/releases/download/{{.Version}}/fnm-arm64.zip
        goarch: arm64
        asset: fnm-arm64.zip
