# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: marcosnils
    repo_name: bin
    description: Effortless binary manager
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.17.1"
        type: http
        url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.8.0")
        type: http
        url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.17.0")
        type: http
        url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: bin_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/marcosnils/bin/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
