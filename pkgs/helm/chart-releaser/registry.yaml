# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: helm
    repo_name: chart-releaser
    description: Hosting Helm Charts via GitHub Pages and Releases
    files:
      - name: cr
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.3.0"
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.1.4")
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        files:
          - name: chart-releaser
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.2.1")
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - https://gh-proxy.org/github.com/helm/chart-releaser/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - helm/chart-releaser
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-releaser/releases/download/{{.Version}}/chart-releaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
