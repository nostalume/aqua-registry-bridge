# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: helm
    repo_name: chart-testing
    description: CLI tool for linting and testing Helm charts
    files:
      - name: ct
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v2.5.0"
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v3.5.1"
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 3.0.0-rc.1")
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 3.3.1")
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 3.5.0")
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - https://gh-proxy.org/github.com/helm/chart-testing/.github/workflows/release.yaml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - helm/chart-testing
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/helm/chart-testing/releases/download/{{.Version}}/chart-testing_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
