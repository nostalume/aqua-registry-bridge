# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/pachyderm/pachyderm/releases/download/{{.Version}}/pachctl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: pachyderm
    repo_name: pachyderm
    asset: pachctl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: zip
    description: Data-Centric Pipelines and Data Versioning
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/pachyderm/pachyderm/releases/download/{{.Version}}/pachctl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
    files:
      - name: pachctl
        src: pachctl_{{trimV .Version}}_{{.OS}}_{{.Arch}}/pachctl
    supported_envs:
      - linux
      - darwin
