# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: linnea-bakshi
    repo_name: gha-doctor
    description: "Diagnose GitHub Actions: flaky jobs, wasted minutes, slow steps, and anti-patterns"
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/linnea-bakshi/gha-doctor/releases/download/{{.Version}}/gha-doctor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gha-doctor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/linnea-bakshi/gha-doctor/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/linnea-bakshi/gha-doctor/releases/download/{{.Version}}/gha-doctor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
