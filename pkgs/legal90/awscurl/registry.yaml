# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: legal90
    repo_name: awscurl
    description: cURL with AWS request signing
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.1")
        type: http
        url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/awscurl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awscurl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/awscurl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.1.2"
        type: http
        url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/awscurl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awscurl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: Version == "v0.1.3"
        type: http
        url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/awscurl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awscurl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/awscurl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awscurl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/legal90/awscurl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
