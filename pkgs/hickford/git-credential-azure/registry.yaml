# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: hickford
    repo_name: git-credential-azure
    description: A Git credential helper for Azure Repos
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.3")
        type: http
        url: https://gh-proxy.org/github.com/hickford/git-credential-azure/releases/download/{{.Version}}/git-credential-azure_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: git-credential-azure_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hickford/git-credential-azure/releases/download/{{.Version}}/git-credential-azure_{{trimV .Version}}_checksums.txt
          asset: git-credential-azure_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/hickford/git-credential-azure/releases/download/{{.Version}}/git-credential-azure_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: git-credential-azure_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hickford/git-credential-azure/releases/download/{{.Version}}/git-credential-azure_{{trimV .Version}}_checksums.txt
          asset: git-credential-azure_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hickford/git-credential-azure/releases/download/{{.Version}}/git-credential-azure_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
