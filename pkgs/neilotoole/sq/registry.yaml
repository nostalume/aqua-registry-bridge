# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: neilotoole
    repo_name: sq
    description: sq data wrangler
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.14.6")
        type: http
        url: https://gh-proxy.org/github.com/neilotoole/sq/releases/download/{{.Version}}/sq-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sq-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/neilotoole/sq/releases/download/{{.Version}}/sq-{{trimV .Version}}-checksums.txt
          asset: sq-{{trimV .Version}}-checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/neilotoole/sq/releases/download/{{.Version}}/sq-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.15.4")
        type: http
        url: https://gh-proxy.org/github.com/neilotoole/sq/releases/download/{{.Version}}/sq-{{.OS}}-{{.Arch}}.{{.Format}}
