# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/ddev/ddev/releases/download/{{.Version}}/ddev_{{.OS}}-{{.Arch}}.{{.Version}}.{{.Format}}
    repo_owner: ddev
    repo_name: ddev
    aliases:
      - name: drud/ddev
    asset: ddev_{{.OS}}-{{.Arch}}.{{.Version}}.{{.Format}}
    format: tar.gz
    description: "DDEV: a local web development environment system for PHP"
    replacements:
      darwin: macos
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/ddev/ddev/releases/download/{{.Version}}/ddev_{{.OS}}-{{.Arch}}.{{.Version}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/ddev/ddev/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
