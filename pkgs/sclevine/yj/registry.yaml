# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sclevine
    repo_name: yj
    description: "CLI - Convert between YAML, TOML, JSON, and HCL. Preserves map order"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v5.0.0"
        type: http
        url: https://gh-proxy.org/github.com/sclevine/yj/releases/download/{{.Version}}/yj-{{.OS}}
        asset: yj-{{.OS}}
        format: raw
        replacements:
          darwin: macos
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/sclevine/yj/releases/download/{{.Version}}/yj-{{.OS}}-{{.Arch}}
            goarch: arm64
            asset: yj-{{.OS}}-{{.Arch}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sclevine/yj/releases/download/{{.Version}}/yj
            asset: yj
      - version_constraint: semver("<= 4.0.0")
        type: http
        url: https://gh-proxy.org/github.com/sclevine/yj/releases/download/{{.Version}}/yj-{{.OS}}
        asset: yj-{{.OS}}
        format: raw
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sclevine/yj/releases/download/{{.Version}}/yj
            asset: yj
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sclevine/yj/releases/download/{{.Version}}/yj-{{.OS}}-{{.Arch}}
        asset: yj-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sclevine/yj/releases/download/{{.Version}}/yj
            asset: yj
