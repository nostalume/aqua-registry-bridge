# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/turbot/steampipe/releases/download/{{.Version}}/steampipe_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: turbot
    repo_name: steampipe
    asset: steampipe_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: Use SQL to instantly query your cloud services (AWS, Azure, GCP and more). Open source CLI. No DB required
    overrides:
      - goos: darwin
        type: http
        url: https://gh-proxy.org/github.com/turbot/steampipe/releases/download/{{.Version}}/steampipe_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - linux
      - darwin
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/turbot/steampipe/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
