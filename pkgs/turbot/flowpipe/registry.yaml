# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: turbot
    repo_name: flowpipe
    description: Flowpipe is a cloud scripting engine. Automation and workflow to connect your clouds to the people, systems and data that matters
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/turbot/flowpipe/releases/download/{{.Version}}/flowpipe.{{.OS}}.{{.Arch}}.{{.Format}}
        asset: flowpipe.{{.OS}}.{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux
          - darwin
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/turbot/flowpipe/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
