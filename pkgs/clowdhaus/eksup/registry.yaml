# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: clowdhaus
    repo_name: eksup
    description: EKS cluster upgrade guidance
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0-alpha"
        no_asset: true
      - version_constraint: semver("<= 0.10.0")
        type: http
        url: https://gh-proxy.org/github.com/clowdhaus/eksup/releases/download/{{.Version}}/eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: eksup
            src: "{{.AssetWithoutExt}}/eksup"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/clowdhaus/eksup/releases/download/{{.Version}}/eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/clowdhaus/eksup/releases/download/{{.Version}}/eksup-{{.Version}}-{{.Arch}}-{{.OS}}eabihf.{{.Format}}
            goarch: arm64
            asset: eksup-{{.Version}}-{{.Arch}}-{{.OS}}eabihf.{{.Format}}
            replacements:
              arm64: arm
              linux: unknown-linux-gnu
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/clowdhaus/eksup/releases/download/{{.Version}}/eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/clowdhaus/eksup/releases/download/{{.Version}}/eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 0.12.0")
        type: http
        url: https://gh-proxy.org/github.com/clowdhaus/eksup/releases/download/{{.Version}}/eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: eksup
            src: "{{.AssetWithoutExt}}/eksup"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/clowdhaus/eksup/releases/download/{{.Version}}/eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: eksup
            src: "{{.AssetWithoutExt}}/eksup"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/clowdhaus/eksup/releases/download/{{.Version}}/eksup-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
