# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ernoaapa
    repo_name: kubectl-warp
    description: Kubernetes CLI plugin for syncing and executing local files in Pod on Kubernetes
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ernoaapa/kubectl-warp/releases/download/{{.Version}}/kubectl-warp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubectl-warp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ernoaapa/kubectl-warp/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
