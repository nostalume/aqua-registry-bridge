# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: pyama86
    repo_name: pachanger
    description: Pachanger - A CLI tool for renaming Go package names safely and efficiently
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/pyama86/pachanger/releases/download/{{.Version}}/pachanger_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pachanger_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pyama86/pachanger/releases/download/{{.Version}}/pachanger_{{trimV .Version}}_checksums.txt
          asset: pachanger_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
