# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/heartbeatsjp/check-tls-cert/releases/download/{{.Version}}/check-tls-cert-{{trimV .Version}}-{{.OS}}-{{.Arch}}.tar.xz
    repo_owner: heartbeatsjp
    repo_name: check-tls-cert
    description: Check-tls-cert is a TLS certificate checker
    asset: check-tls-cert-{{trimV .Version}}-{{.OS}}-{{.Arch}}.tar.xz
    supported_envs:
      - linux
      - darwin
      - amd64
    files:
      - name: check-tls-cert
        src: check-tls-cert-{{trimV .Version}}/check-tls-cert
