# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/project-copacetic/copacetic/releases/download/{{.Version}}/copa_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: project-copacetic
    repo_name: copacetic
    description: CLI tool for directly patching container images using reports from vulnerability scanners
    asset: copa_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: copa
    supported_envs:
      - linux
      - darwin
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/project-copacetic/copacetic/releases/download/{{.Version}}/copacetic_checksums.txt
      asset: copacetic_checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 0.3.0")
    version_overrides:
      - version_constraint: semver(">= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/project-copacetic/copacetic/releases/download/{{.Version}}/copa_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - linux/amd64
      - version_constraint: semver("< 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/project-copacetic/copacetic/releases/download/{{.Version}}/copa_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - linux/amd64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
