# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: gohugoio/hugo/hugo-extended-withdeploy
    type: github_release
    repo_owner: gohugoio
    repo_name: hugo
    description: The world’s fastest framework for building websites
    files:
      - name: hugo
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.139.5"
        no_asset: true
      - version_constraint: semver("< 0.137.0")
        no_asset: true
      - version_constraint: Version == "v0.137.0"
        type: http
        url: https://gh-proxy.org/github.com/gohugoio/hugo/releases/download/{{.Version}}/hugo_extended_withdeploy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: hugo_extended_withdeploy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gohugoio/hugo/releases/download/{{.Version}}/hugo_{{trimV .Version}}_checksums.txt
          asset: hugo_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/gohugoio/hugo/releases/download/{{.Version}}/hugo_extended_withdeploy_{{trimV .Version}}_{{.OS}}-universal.{{.Format}}
            asset: hugo_extended_withdeploy_{{trimV .Version}}_{{.OS}}-universal.{{.Format}}
        supported_envs:
          - darwin
          - linux/amd64
      - version_constraint: semver("<= 0.138.0")
        type: http
        url: https://gh-proxy.org/github.com/gohugoio/hugo/releases/download/{{.Version}}/hugo_extended_withdeploy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: hugo_extended_withdeploy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gohugoio/hugo/releases/download/{{.Version}}/hugo_{{trimV .Version}}_checksums.txt
          asset: hugo_{{trimV .Version}}_checksums.txt
