        asset: hugo_extended_withdeploy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gohugoio/hugo/releases/download/{{.Version}}/hugo_{{trimV .Version}}_checksums.txt
          asset: hugo_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
