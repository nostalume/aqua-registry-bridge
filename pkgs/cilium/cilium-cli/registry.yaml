# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cilium
    repo_name: cilium-cli
    description: CLI to install, manage & troubleshoot Kubernetes clusters running Cilium
    files:
      - name: cilium
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1"
        type: http
        url: https://gh-proxy.org/github.com/cilium/cilium-cli/releases/download/{{.Version}}/cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.8.6")
        type: http
        url: https://gh-proxy.org/github.com/cilium/cilium-cli/releases/download/{{.Version}}/cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256sum"
          asset: "{{.Asset}}.sha256sum"
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.9.1")
        type: http
        url: https://gh-proxy.org/github.com/cilium/cilium-cli/releases/download/{{.Version}}/cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256sum"
          asset: "{{.Asset}}.sha256sum"
          algorithm: sha256
      - version_constraint: semver("<= 0.16.4")
        type: http
        url: https://gh-proxy.org/github.com/cilium/cilium-cli/releases/download/{{.Version}}/cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256sum"
          asset: "{{.Asset}}.sha256sum"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cilium/cilium-cli/releases/download/{{.Version}}/cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: cilium-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256sum"
          asset: "{{.Asset}}.sha256sum"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/cilium/cilium-cli/releases/download/{{.Version}}/cilium-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
