# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/ldez/prm/releases/download/{{.Version}}/prm_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: ldez
    repo_name: prm
    asset: prm_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: Pull Request Manager for Maintainers
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/ldez/prm/releases/download/{{.Version}}/prm_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/ldez/prm/releases/download/{{.Version}}/prm_{{trimV .Version}}_checksums.txt
      asset: prm_{{trimV .Version}}_checksums.txt
      algorithm: sha256
