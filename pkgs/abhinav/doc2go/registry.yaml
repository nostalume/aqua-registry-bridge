# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: abhinav
    repo_name: doc2go
    description: Your Go project's documentation, to-go
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/abhinav/doc2go/releases/download/{{.Version}}/doc2go-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: doc2go-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/abhinav/doc2go/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
