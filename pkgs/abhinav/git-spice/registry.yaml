# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: abhinav
    repo_name: git-spice
    description: Manage stacked Git branches
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0-beta4")
        type: http
        url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        asset: git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: gs
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.5.2")
        type: http
        url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        asset: git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: gs
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: aarch64
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.23.0")
        type: http
        url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        asset: git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: gs
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: aarch64
      - version_constraint: semver("<= 0.31.1")
        type: http
        url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        asset: git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: git-spice
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: aarch64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        asset: git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: git-spice
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/abhinav/git-spice/.github/workflows/publish-release.yml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/abhinav/git-spice/releases/download/{{.Version}}/git-spice.{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: aarch64
