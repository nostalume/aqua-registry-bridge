# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: santosr2
    repo_name: TerraTidy
    description: A comprehensive quality platform for Terraform and Terragrunt
    files:
      - name: terratidy
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0-alpha.3")
        type: http
        url: https://gh-proxy.org/github.com/santosr2/TerraTidy/releases/download/{{.Version}}/terratidy-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: terratidy-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/santosr2/TerraTidy/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/santosr2/TerraTidy/releases/download/{{.Version}}/terratidy-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/santosr2/TerraTidy/releases/download/{{.Version}}/terratidy-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: terratidy-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/santosr2/TerraTidy/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/santosr2/TerraTidy/\\.github/workflows/.+\\.ya?ml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/santosr2/TerraTidy/releases/download/{{.Version}}/checksums.txt.bundle
              asset: checksums.txt.bundle
          github_artifact_attestations:
            signer_workflow: santosr2/TerraTidy/.github/workflows/release.yml
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/santosr2/TerraTidy/releases/download/{{.Version}}/terratidy-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
