# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/etcd-io/etcd/releases/download/{{.Version}}/etcd-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: etcd-io
    repo_name: etcd
    asset: etcd-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: zip
    description: Distributed reliable key-value store for the most critical data of a distributed system
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/etcd-io/etcd/releases/download/{{.Version}}/etcd-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
    supported_envs:
      - darwin
      - linux
      - amd64
    rosetta2: true
    files:
      - name: etcdctl
        src: etcd-{{.Version}}-{{.OS}}-{{.Arch}}/etcdctl
      - name: etcd
        src: etcd-{{.Version}}-{{.OS}}-{{.Arch}}/etcd
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/etcd-io/etcd/releases/download/{{.Version}}/SHA256SUMS
      asset: SHA256SUMS
      algorithm: sha256
