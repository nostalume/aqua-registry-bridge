# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cubicdaiya
    repo_name: nginx-build
    description: Seamless nginx builder
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        no_asset: true
      - version_constraint: semver("<= 0.11.13")
        type: http
        url: https://gh-proxy.org/github.com/cubicdaiya/nginx-build/releases/download/{{.Version}}/nginx-build-{{.OS}}-{{.Arch}}-{{trimV .Version}}.{{.Format}}
        asset: nginx-build-{{.OS}}-{{.Arch}}-{{trimV .Version}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.12.1")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cubicdaiya/nginx-build/releases/download/{{.Version}}/nginx-build-{{.OS}}-{{.Arch}}-{{trimV .Version}}.{{.Format}}
        asset: nginx-build-{{.OS}}-{{.Arch}}-{{trimV .Version}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cubicdaiya/nginx-build/releases/download/{{.Version}}/nginx-build_{{trimV .Version}}_checksums.txt
          asset: nginx-build_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
