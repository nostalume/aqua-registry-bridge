# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ned1313
    repo_name: terrahash
    description: Create and store a hash of the Terraform modules used by your configuration
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ned1313/terrahash/releases/download/{{.Version}}/terrahash_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terrahash_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ned1313/terrahash/releases/download/{{.Version}}/terrahash_{{trimV .Version}}_checksums.txt
          asset: terrahash_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ned1313/terrahash/releases/download/{{.Version}}/terrahash_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
