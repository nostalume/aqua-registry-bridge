# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ouch-org
    repo_name: ouch
    description: Painless compression and decompression in the terminal
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "0.1.4"
        type: http
        url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch
        asset: ouch
        format: raw
        replacements:
          darwin: macOS
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.OS}}
            asset: ouch-{{.OS}}
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: Version == "0.1.5"
        type: http
        url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.OS}}-x86-64-musl
        asset: ouch-{{.OS}}-x86-64-musl
        format: raw
        replacements:
          darwin: macOS
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.OS}}
            asset: ouch-{{.OS}}
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "0.1.6"
        type: http
        url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}
        asset: ouch-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}-musl
            asset: ouch-{{.Arch}}-{{.OS}}-musl
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "0.2.0"
        type: http
        url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}
        asset: ouch-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        complete_windows_ext: false
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}-musl
            asset: ouch-{{.Arch}}-{{.OS}}-musl
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.3.1")
        type: http
        url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}
        asset: ouch-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}-musl
            asset: ouch-{{.Arch}}-{{.OS}}-musl
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.1")
        type: http
        url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: ouch-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: ouch
            src: "{{.AssetWithoutExt}}/ouch"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 0.8.0")
        type: http
        url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: ouch-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: ouch
            src: "{{.AssetWithoutExt}}/ouch"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: ouch-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: ouch
            src: "{{.AssetWithoutExt}}/ouch"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ouch-org/ouch/releases/download/{{.Version}}/ouch-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        github_artifact_attestations:
          signer_workflow: ouch-org/ouch/.github/workflows/draft-release-automatic-trigger.yml
