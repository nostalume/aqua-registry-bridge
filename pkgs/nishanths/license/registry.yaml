# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: nishanths
    repo_name: license
    description: Command line license text generator
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 3.0.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/nishanths/license/releases/download/{{.Version}}/license-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: license-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/nishanths/license/releases/download/{{.Version}}/SHA256SUMS.txt
          asset: SHA256SUMS.txt
          algorithm: sha256
