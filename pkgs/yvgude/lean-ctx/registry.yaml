# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: yvgude
    repo_name: lean-ctx
    description: Local-first context intelligence layer for AI agents
    version_filter: not (Version startsWith "vscode-")
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.6.0")
        no_asset: true
      - version_constraint: semver("<= 1.7.0")
        type: http
        url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 2.4.0")
        type: http
        url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 3.1.5")
        type: http
        url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          windows: pc-windows-msvc
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              linux: unknown-linux-gnu
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yvgude/lean-ctx/releases/download/{{.Version}}/lean-ctx-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
