# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gopasspw
    repo_name: gopass
    description: The slightly more awesome standard unix password manager for teams
    asset: gopass-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.16.1")
        type: http
        url: https://gh-proxy.org/github.com/gopasspw/gopass/releases/download/{{.Version}}/gopass-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gopasspw/gopass/releases/download/{{.Version}}/gopass_{{trimV .Version}}_SHA256SUMS
          asset: gopass_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gopasspw/gopass/releases/download/{{.Version}}/gopass-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/gopasspw/gopass/releases/download/{{.Version}}/gopass-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gopasspw/gopass/releases/download/{{.Version}}/gopass_{{trimV .Version}}_SHA256SUMS
          asset: gopass_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/gopasspw/gopass/releases/download/{{.Version}}/gopass_{{trimV .Version}}_SHA256SUMS.sigstore.json
              asset: "gopass_{{trimV .Version}}_SHA256SUMS.sigstore.json"
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/gopasspw/gopass/.github/workflows/autorelease.yml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - gopasspw/gopass
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gopasspw/gopass/releases/download/{{.Version}}/gopass-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
