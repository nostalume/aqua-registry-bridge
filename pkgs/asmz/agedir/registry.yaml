# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: asmz
    repo_name: agedir
    description: A CLI tool to bulk-encrypt, decrypt, and place multiple secret files across a project using age encryption and a simple YAML mapping config
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/asmz/agedir/releases/download/{{.Version}}/agedir-{{.OS}}-{{.Arch}}
        asset: agedir-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/asmz/agedir/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/asmz/agedir/releases/download/{{.Version}}/agedir_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: agedir_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/asmz/agedir/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/asmz/agedir/releases/download/{{.Version}}/agedir_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
