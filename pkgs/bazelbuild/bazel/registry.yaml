# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: bazelbuild
    repo_name: bazel
    description: a fast, scalable, multi-language and extensible build system
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.1")
        no_asset: true
      - version_constraint: semver("<= 0.11.1")
        type: http
        url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - windows/amd64
      - version_constraint: semver("<= 3.3.1")
        type: http
        url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
            asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 4.0.0")
        type: http
        url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
            asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
      - version_constraint: semver("<= 5.0.0")
        type: http
        url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
            asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bazelbuild/bazel/releases/download/{{.Version}}/bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
            asset: bazel-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
