# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ataraxy-labs
    repo_name: sem
    description: Semantic version control => entity-level diffs, blame, and impact analysis on top of git. 28 languages via tree-sitter. Built for coding agents
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.3.16"
        no_asset: true
      - version_constraint: Version == "v0.3.17"
        type: http
        url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sem-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              amd64: amd64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.3.6")
        no_asset: true
      - version_constraint: semver("<= 0.3.10")
        type: http
        url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sem-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              amd64: x86_64
        supported_envs:
          - linux/amd64
          - darwin/arm64
      - version_constraint: semver("<= 0.3.15")
        type: http
        url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sem-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              amd64: amd64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sem-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              amd64: amd64
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.5.2")
        no_asset: true
      - version_constraint: semver("<= 0.13.0")
        type: http
        url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sem-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              amd64: amd64
        supported_envs:
          - linux
          - darwin/arm64
          - windows/amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/sem-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: sem-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ataraxy-labs/sem/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
