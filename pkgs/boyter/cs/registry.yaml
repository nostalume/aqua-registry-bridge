# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: boyter
    repo_name: cs
    description: Code search tool with CLI, TUI, MCP and HTTP support that requires no indexing
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0.0"
        type: http
        url: https://gh-proxy.org/github.com/boyter/cs/releases/download/{{.Version}}/cs-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: cs-{{trimV .Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 1.3.0")
        type: http
        url: https://gh-proxy.org/github.com/boyter/cs/releases/download/{{.Version}}/cs_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cs_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/boyter/cs/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/boyter/cs/releases/download/{{.Version}}/cs_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cs_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/boyter/cs/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/boyter/cs/releases/download/{{.Version}}/cs_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
