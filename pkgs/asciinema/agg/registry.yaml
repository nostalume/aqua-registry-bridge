# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: asciinema
    repo_name: agg
    description: asciinema gif generator
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/asciinema/agg/releases/download/{{.Version}}/agg-{{.Arch}}-{{.OS}}
        asset: agg-{{.Arch}}-{{.OS}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/asciinema/agg/releases/download/{{.Version}}/agg-{{.Arch}}-{{.OS}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/asciinema/agg/releases/download/{{.Version}}/agg-{{.Arch}}-{{.OS}}
            goarch: arm64
            replacements:
              linux: unknown-linux-gnu
