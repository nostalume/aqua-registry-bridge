# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: danvergara
    repo_name: dblab
    description: The database client every command line junkie deserves
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.10.0"
        type: http
        url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.9.2")
        type: http
        url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/dblab_{{trimV .Version}}_checksums.txt
          asset: dblab_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.14.0")
        type: http
        url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.16.0")
        type: http
        url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: dblab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/danvergara/dblab/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
