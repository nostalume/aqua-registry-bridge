# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sachaos
    repo_name: tcpterm
    description: tcpterm is a packet visualizer in TUI
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sachaos/tcpterm/releases/download/{{.Version}}/tcpterm_{{.OS}}_{{.Arch}}
        asset: tcpterm_{{.OS}}_{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
