# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sachaos
    repo_name: todoist
    description: Todoist CLI Client. I  Todoist and CLI
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.19.0")
        type: http
        url: https://gh-proxy.org/github.com/sachaos/todoist/releases/download/{{.Version}}/todoist_{{.OS}}_{{.Arch}}
        asset: todoist_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        complete_windows_ext: false
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.20.0"
        type: http
        url: https://gh-proxy.org/github.com/sachaos/todoist/releases/download/{{.Version}}/todoist_{{.OS}}_{{.Arch}}
        asset: todoist_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sachaos/todoist/releases/download/{{.Version}}/todoist_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: todoist_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sachaos/todoist/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
