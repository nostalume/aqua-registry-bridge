# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: alajmo
    repo_name: mani
    description: CLI tool to help you manage repositories
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/alajmo/mani/releases/download/{{.Version}}/mani_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: mani_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/alajmo/mani/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/alajmo/mani/releases/download/{{.Version}}/mani_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
