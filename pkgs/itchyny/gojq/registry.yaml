# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/itchyny/gojq/releases/download/{{.Version}}/gojq_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: itchyny
    repo_name: gojq
    asset: gojq_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    description: Pure Go implementation of jq
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/itchyny/gojq/releases/download/{{.Version}}/gojq_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
    files:
      - name: gojq
        src: gojq_{{.Version}}_{{.OS}}_{{.Arch}}/gojq
