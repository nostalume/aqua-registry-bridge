# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/itchyny/fillin/releases/download/{{.Version}}/fillin_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: itchyny
    repo_name: fillin
    asset: fillin_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: zip
    description: fill-in your command and execute
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/itchyny/fillin/releases/download/{{.Version}}/fillin_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
    files:
      - name: fillin
        src: fillin_{{.Version}}_{{.OS}}_{{.Arch}}/fillin
