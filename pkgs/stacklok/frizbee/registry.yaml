# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: stacklok
    repo_name: frizbee
    description: Throw a tag at it and it comes back with a checksum
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.1"
        type: http
        url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_checksums.txt
          asset: frizbee_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v0.1.5"
        type: http
        url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_checksums.txt
          asset: frizbee_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v0.1.6"
        type: http
        url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_checksums.txt
          asset: frizbee_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        cosign:
          opts:
            - --certificate
            - https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/{{.AssetWithoutExt}}.pem
            - --certificate-identity
            - https://gh-proxy.org/github.com/stacklok/frizbee/.github/workflows/releaser.yml@refs/tags/{{.Version}}
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --signature
            - https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/{{.Asset}}.sig
            - --certificate-github-workflow-repository
            - stacklok/frizbee
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_checksums.txt
          asset: frizbee_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/stacklok/frizbee/releases/download/{{.Version}}/frizbee_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
