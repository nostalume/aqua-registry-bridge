# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Getdeck
    repo_name: getdeck
    description: A CLI that creates reproducible Kubernetes environments for development and testing
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.1")
        no_asset: true
      - version_constraint: semver("<= 0.6.0")
        type: http
        url: https://gh-proxy.org/github.com/Getdeck/getdeck/releases/download/{{.Version}}/deck-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: deck-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        supported_envs:
          - linux/amd64
        files:
          - name: deck
      - version_constraint: semver("<= 0.7.1")
        type: http
        url: https://gh-proxy.org/github.com/Getdeck/getdeck/releases/download/{{.Version}}/deck-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: deck-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/Getdeck/getdeck/releases/download/{{.Version}}/deck-{{.Version}}-{{.OS}}-universal.{{.Format}}
            asset: deck-{{.Version}}-{{.OS}}-universal.{{.Format}}
        supported_envs:
          - linux/amd64
          - darwin
        files:
          - name: deck
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Getdeck/getdeck/releases/download/{{.Version}}/deck-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: deck-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/Getdeck/getdeck/releases/download/{{.Version}}/deck-{{.Version}}-{{.OS}}-universal.{{.Format}}
            asset: deck-{{.Version}}-{{.OS}}-universal.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Getdeck/getdeck/releases/download/{{.Version}}/deck-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              amd64: x86_64
            files:
              - name: deck
                src: dist/deck
        supported_envs:
          - darwin
          - windows
          - amd64
        files:
          - name: deck
