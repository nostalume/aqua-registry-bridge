# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: emprcl
    repo_name: spor
    description: infinite undo for your whole project
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/emprcl/spor/releases/download/{{.Version}}/spor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: spor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/emprcl/spor/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/emprcl/spor/releases/download/{{.Version}}/spor_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
