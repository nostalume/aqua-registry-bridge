# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gastownhall
    repo_name: beads
    aliases:
      - name: steveyegge/beads
    description: "Beads - A memory upgrade for your coding agent"
    files:
      - name: bd
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.9.11")
        no_asset: true
      - version_constraint: semver("<= 0.21.9")
        type: http
        url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.24.3")
        type: http
        url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.0.3")
        type: http
        url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gastownhall/beads/releases/download/{{.Version}}/beads_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        github_artifact_attestations:
          signer_workflow: gastownhall/beads/.github/workflows/release.yml
