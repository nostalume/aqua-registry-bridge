# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/harness/drone-cli/releases/download/{{.Version}}/drone_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: harness
    repo_name: drone-cli
    asset: drone_{{.OS}}_{{.Arch}}.tar.gz
    description: Command Line Tools for Drone CI
    files:
      - name: drone
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/harness/drone-cli/releases/download/{{.Version}}/drone_checksums.txt
      asset: drone_checksums.txt
      algorithm: sha256
