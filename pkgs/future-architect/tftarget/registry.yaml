# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: future-architect
    repo_name: tftarget
    description: tftarget is a CLI tool for Terraform ( plan | apply | destroy ) with target option. You can interactivity select resource to ( plan | apply | destroy )  with target option
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v0.0.5", "v0.0.6", "v0.0.8"]
        no_asset: true
      - version_constraint: semver("<= 0.0.7")
        type: http
        url: https://gh-proxy.org/github.com/future-architect/tftarget/releases/download/{{.Version}}/tftarget_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tftarget_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/future-architect/tftarget/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/future-architect/tftarget/releases/download/{{.Version}}/tftarget_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/future-architect/tftarget/releases/download/{{.Version}}/tftarget_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tftarget_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/future-architect/tftarget/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
