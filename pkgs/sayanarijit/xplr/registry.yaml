# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/sayanarijit/xplr/releases/download/{{.Version}}/xplr-{{.OS}}.{{.Format}}
    repo_owner: sayanarijit
    repo_name: xplr
    description: A hackable, minimal, fast TUI file explorer
    asset: xplr-{{.OS}}.{{.Format}}
    format: tar.gz
    replacements:
      darwin: macos
    supported_envs:
      - linux/amd64
      - darwin
    rosetta2: true
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/sayanarijit/xplr/releases/download/{{.Version}}/xplr-{{.OS}}.sha256
      asset: xplr-{{.OS}}.sha256
      algorithm: sha256
