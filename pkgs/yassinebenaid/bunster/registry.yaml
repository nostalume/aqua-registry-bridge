# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: yassinebenaid
    repo_name: bunster
    description: Compile shell scripts to static binaries
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.0")
        no_asset: true
      - version_constraint: semver("<= 0.7.1")
        type: http
        url: https://gh-proxy.org/github.com/yassinebenaid/bunster/releases/download/{{.Version}}/bunster_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: bunster_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yassinebenaid/bunster/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
        files:
          - name: bunster
            src: bunster_{{.OS}}-{{.Arch}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/yassinebenaid/bunster/releases/download/{{.Version}}/bunster_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: bunster_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yassinebenaid/bunster/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
