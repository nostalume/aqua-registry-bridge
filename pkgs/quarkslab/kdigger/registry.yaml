# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/quarkslab/kdigger/releases/download/{{.Version}}/kdigger-{{.OS}}-{{.Arch}}
    repo_owner: quarkslab
    repo_name: kdigger
    description: Kubernetes focused container assessment tool for penetration testing
    supported_envs:
      - darwin
      - linux
    rosetta2: true
    asset: kdigger-{{.OS}}-{{.Arch}}
    checksum:
      type: http
      url: "{{.AssetURL}}.sha256"
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
