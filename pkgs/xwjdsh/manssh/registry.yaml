# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: xwjdsh
    repo_name: manssh
    description: Manage your ssh alias configs easily
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.1")
        type: http
        url: https://gh-proxy.org/github.com/xwjdsh/manssh/releases/download/{{.Version}}/manssh_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: manssh_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/xwjdsh/manssh/releases/download/{{.Version}}/manssh_{{trimV .Version}}_checksums.txt
          asset: manssh_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/xwjdsh/manssh/releases/download/{{.Version}}/manssh_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: manssh_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/xwjdsh/manssh/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
