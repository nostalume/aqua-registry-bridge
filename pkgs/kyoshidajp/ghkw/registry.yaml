# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/kyoshidajp/ghkw/releases/download/{{.Version}}/ghkw_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: kyoshidajp
    repo_name: ghkw
    asset: ghkw_{{.OS}}_{{.Arch}}.tar.gz
    description: Search how many keywords in GitHub Code tool
    replacements:
      amd64: x86_64
    supported_envs:
      - linux/amd64
      - darwin
    rosetta2: true
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/kyoshidajp/ghkw/releases/download/{{.Version}}/ghkw_{{trimV .Version}}_checksums.txt
      asset: ghkw_{{trimV .Version}}_checksums.txt
      algorithm: sha256
