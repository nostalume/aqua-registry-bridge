# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: google
    repo_name: osv-scanner
    description: Vulnerability scanner written in Go which uses the data provided by https://osv.dev
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/osv-scanner_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: osv-scanner_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/osv-scanner_{{trimV .Version}}_SHA256SUMS
          asset: osv-scanner_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v1.4.2"
        type: http
        url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/osv-scanner_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        # https://github.com/google/osv-scanner/issues/611
        asset: osv-scanner_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/osv-scanner_{{trimV .Version}}_SHA256SUMS
          asset: osv-scanner_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
      - version_constraint: semver("<= 1.6.2")
        type: http
        url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/osv-scanner_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: osv-scanner_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/osv-scanner_{{trimV .Version}}_SHA256SUMS
          asset: osv-scanner_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/osv-scanner_{{.OS}}_{{.Arch}}
        # v1.7.0 https://github.com/google/osv-scanner/pull/831
        asset: osv-scanner_{{.OS}}_{{.Arch}}
        format: raw
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/google/osv-scanner/releases/download/{{.Version}}/osv-scanner_SHA256SUMS
          asset: osv-scanner_SHA256SUMS
          algorithm: sha256
