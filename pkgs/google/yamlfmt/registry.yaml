# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: google
    repo_name: yamlfmt
    description: An extensible command line tool or library to format yaml files
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.14.0")
        type: http
        url: https://gh-proxy.org/github.com/google/yamlfmt/releases/download/{{.Version}}/yamlfmt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: yamlfmt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/google/yamlfmt/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/google/yamlfmt/releases/download/{{.Version}}/yamlfmt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: yamlfmt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/google/yamlfmt/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/google/yamlfmt/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/google/yamlfmt/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/google/yamlfmt/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-github-workflow-repository
              - google/yamlfmt
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
