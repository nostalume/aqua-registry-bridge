# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: openfga
    repo_name: cli
    description: A cross-platform CLI to interact with an OpenFGA server
    files:
      - name: fga
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0-beta1"
        type: http
        url: https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/openfga-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: openfga-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - "https://gh-proxy.org/github.com/openfga/cli/.github/workflows/main.yaml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - openfga/cli
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/fga_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: fga_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - "https://gh-proxy.org/github.com/openfga/cli/.github/workflows/main.yaml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - openfga/cli
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/fga_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: fga_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - "https://gh-proxy.org/github.com/openfga/cli/.github/workflows/main.yaml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - openfga/cli
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/openfga/cli/releases/download/{{.Version}}/fga.intoto.jsonl
          asset: fga.intoto.jsonl
