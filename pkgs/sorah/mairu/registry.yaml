# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sorah
    repo_name: mairu
    description: on-memory AWS credentials agent and executor
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sorah/mairu/releases/download/{{.Version}}/mairu-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: mairu-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/sorah/mairu/releases/download/{{.Version}}/mairu-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              amd64: x86_64
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/sorah/mairu/releases/download/{{.Version}}/mairu-universal-{{.OS}}.{{.Format}}
            goarch: amd64
            asset: mairu-universal-{{.OS}}.{{.Format}}
        supported_envs:
          - linux
          - darwin
