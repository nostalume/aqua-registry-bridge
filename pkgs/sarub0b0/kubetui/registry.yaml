# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sarub0b0
    repo_name: kubetui
    description: An intuitive Terminal User Interface (TUI) tool for real-time monitoring and exploration of Kubernetes resources
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.1")
        type: http
        url: https://gh-proxy.org/github.com/sarub0b0/kubetui/releases/download/{{.Version}}/kubetui-{{.Arch}}-{{.OS}}
        asset: kubetui-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        supported_envs:
          - darwin
