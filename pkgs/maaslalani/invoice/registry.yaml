# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: maaslalani
    repo_name: invoice
    description: Command line invoice generator
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/maaslalani/invoice/releases/download/{{.Version}}/invoice_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: invoice_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/maaslalani/invoice/releases/download/{{.Version}}/invoice_{{trimV .Version}}_checksums.txt
          asset: invoice_{{trimV .Version}}_checksums.txt
          algorithm: sha256
