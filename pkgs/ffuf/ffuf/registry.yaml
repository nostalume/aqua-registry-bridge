# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ffuf
    repo_name: ffuf
    description: Fast web fuzzer written in Go
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/ffuf/ffuf/releases/download/{{.Version}}/ffuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ffuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ffuf/ffuf/releases/download/{{.Version}}/ffuf_{{trimV .Version}}_checksums.txt
          asset: ffuf_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 1.5.0")
        type: http
        url: https://gh-proxy.org/github.com/ffuf/ffuf/releases/download/{{.Version}}/ffuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ffuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ffuf/ffuf/releases/download/{{.Version}}/ffuf_{{trimV .Version}}_checksums.txt
          asset: ffuf_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ffuf/ffuf/releases/download/{{.Version}}/ffuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ffuf/ffuf/releases/download/{{.Version}}/ffuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ffuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ffuf/ffuf/releases/download/{{.Version}}/ffuf_{{trimV .Version}}_checksums.txt
          asset: ffuf_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ffuf/ffuf/releases/download/{{.Version}}/ffuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
