# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: openshift-online
    repo_name: ocm-cli
    description: CLI for the Red Hat OpenShift Cluster Manager
    files:
      - name: ocm
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.57"
        no_asset: true
      - version_constraint: semver("<= 0.1.30")
        type: http
        url: https://gh-proxy.org/github.com/openshift-online/ocm-cli/releases/download/{{.Version}}/ocm-{{.OS}}-{{.Arch}}
        asset: ocm-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.1.58")
        type: http
        url: https://gh-proxy.org/github.com/openshift-online/ocm-cli/releases/download/{{.Version}}/ocm-{{.OS}}-{{.Arch}}
        asset: ocm-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        complete_windows_ext: false
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.1.65")
        type: http
        url: https://gh-proxy.org/github.com/openshift-online/ocm-cli/releases/download/{{.Version}}/ocm-{{.OS}}-{{.Arch}}
        asset: ocm-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        complete_windows_ext: false
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/openshift-online/ocm-cli/releases/download/{{.Version}}/ocm-{{.OS}}-{{.Arch}}
        asset: ocm-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
