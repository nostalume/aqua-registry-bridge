# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tkuchiki
    repo_name: alp
    description: Access Log Profiler
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.8")
        type: http
        url: https://gh-proxy.org/github.com/tkuchiki/alp/releases/download/{{.Version}}/alp_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: alp_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tkuchiki/alp/releases/download/{{.Version}}/alp_{{.OS}}_{{.Arch}}.exe.{{.Format}}
            asset: alp_{{.OS}}_{{.Arch}}.exe.{{.Format}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/tkuchiki/alp/releases/download/{{.Version}}/alp_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: alp_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tkuchiki/alp/releases/download/{{.Version}}/alp_{{trimV .Version}}_checksums.txt
          asset: alp_{{trimV .Version}}_checksums.txt
          algorithm: sha256
