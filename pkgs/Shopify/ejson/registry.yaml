# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Shopify
    repo_name: ejson
    description: EJSON is a small library to manage encrypted secrets using asymmetric encryption
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 1.3.0")
        error_message: Please use v1.3.0 or later
      - version_constraint: semver("<= 1.3.2")
        type: http
        url: https://gh-proxy.org/github.com/Shopify/ejson/releases/download/{{.Version}}/{{.OS}}-{{.Arch}}
        asset: "{{.OS}}-{{.Arch}}"
        supported_envs:
          - darwin
          - linux
      - version_constraint: Version == "v1.3.3"
        type: http
        url: https://gh-proxy.org/github.com/Shopify/ejson/releases/download/{{.Version}}/ejson_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        asset: ejson_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Shopify/ejson/releases/download/{{.Version}}/ejson_{{trimV .Version}}_checksums.txt
          asset: ejson_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - linux
      - version_constraint: Version == "v1.4.0"
        type: http
        url: https://gh-proxy.org/github.com/Shopify/ejson/releases/download/{{.Version}}/ejson_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        asset: ejson_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Shopify/ejson/releases/download/{{.Version}}/ejson_{{trimV .Version}}_checksums.txt
          asset: ejson_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - linux
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Shopify/ejson/releases/download/{{.Version}}/ejson_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        asset: ejson_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Shopify/ejson/releases/download/{{.Version}}/ejson_{{trimV .Version}}_checksums.txt
          asset: ejson_{{trimV .Version}}_checksums.txt
          algorithm: sha256
