# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/robscott/kube-capacity/releases/download/{{.Version}}/kube-capacity_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: robscott
    repo_name: kube-capacity
    asset: kube-capacity_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    description: A simple CLI that provides an overview of the resource requests, limits, and utilization in a Kubernetes cluster
    format: tar.gz
    replacements:
      amd64: x86_64
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/robscott/kube-capacity/releases/download/{{.Version}}/kube-capacity_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    files:
      - name: kube-capacity
        src: kube-capacity
      - name: kubectl-resource_capacity
        src: kube-capacity
    version_constraint: semver(">= 0.7.4")
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/robscott/kube-capacity/releases/download/{{.Version}}/kube-capacity_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        overrides: []
        asset: kube-capacity_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        replacements:
          darwin: Darwin
          linux: Linux
          windows: Windows
          amd64: x86_64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/robscott/kube-capacity/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
