# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tattoy-org
    repo_name: tattoy
    description: A text-based compositor for modern terminals
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/tattoy-org/tattoy/releases/download/{{.Version}}/tattoy-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: tattoy-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tattoy-org/tattoy/releases/download/{{.Version}}/tattoy-{{.Arch}}-{{.OS}}.sha256
          asset: tattoy-{{.Arch}}-{{.OS}}.sha256
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tattoy-org/tattoy/releases/download/{{.Version}}/tattoy-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
