# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: typst
    repo_name: typst
    description: A new markup-based typesetting system that is powerful and easy to learn
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/typst/typst/releases/download/{{.Version}}/typst-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: typst-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: typst
            src: "{{.AssetWithoutExt}}/typst"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/typst/typst/releases/download/{{.Version}}/typst-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/typst/typst/releases/download/{{.Version}}/typst-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: typst-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        files:
          - name: typst
            src: "{{.AssetWithoutExt}}/typst"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/typst/typst/releases/download/{{.Version}}/typst-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.11.1")
        type: http
        url: https://gh-proxy.org/github.com/typst/typst/releases/download/{{.Version}}/typst-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: typst-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        windows_arm_emulation: true
        files:
          - name: typst
            src: "{{.AssetWithoutExt}}/typst"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/typst/typst/releases/download/{{.Version}}/typst-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/typst/typst/releases/download/{{.Version}}/typst-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: typst-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        files:
          - name: typst
            src: "{{.AssetWithoutExt}}/typst"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/typst/typst/releases/download/{{.Version}}/typst-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
