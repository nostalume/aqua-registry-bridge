# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: aereal
    repo_name: jsondiff
    description: functions to calculate JSON objects differences with gojq filter
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        no_asset: true
      - version_constraint: semver("<= 0.2.3")
        type: http
        url: https://gh-proxy.org/github.com/aereal/jsondiff/releases/download/{{.Version}}/jsondiff_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: jsondiff_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aereal/jsondiff/releases/download/{{.Version}}/jsondiff_{{trimV .Version}}_checksums.txt
          asset: jsondiff_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.4.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/aereal/jsondiff/releases/download/{{.Version}}/jsondiff_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: jsondiff_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aereal/jsondiff/releases/download/{{.Version}}/jsondiff_{{trimV .Version}}_checksums.txt
          asset: jsondiff_{{trimV .Version}}_checksums.txt
          algorithm: sha256
