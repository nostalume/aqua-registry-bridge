# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: nao1215
    repo_name: sqly
    description: easily execute SQL against CSV/TSV/LTSV/JSON and Microsoft Excel with shell
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.4"
        type: http
        url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v0.8.0"
        type: http
        url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.5.2")
        type: http
        url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 0.7.0")
        type: http
        url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 0.24.0")
        type: http
        url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/nao1215/sqly/.github/workflows/release.yml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/nao1215/sqly/releases/download/{{.Version}}/sqly_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        github_artifact_attestations:
          signer_workflow: nao1215/sqly/.github/workflows/release.yml
