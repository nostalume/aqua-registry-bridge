# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fujiwara
    repo_name: s3mover
    description: s3mover is an agent for moving local files to Amazon S3
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/s3mover/releases/download/{{.Version}}/s3mover_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: s3mover_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/s3mover/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
