# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fujiwara
    repo_name: grpcp
    description: gRPC stream file transfer server/client
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/grpcp/releases/download/{{.Version}}/grpcp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: grpcp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/grpcp/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
