# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fujiwara
    repo_name: riex
    description: AWS RI expiration detector
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/riex/releases/download/{{.Version}}/riex_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: riex_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/riex/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
