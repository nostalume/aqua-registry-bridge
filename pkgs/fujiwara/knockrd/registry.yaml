# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fujiwara
    repo_name: knockrd
    description: HTTP knocker daemon
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.16")
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/knockrd/releases/download/{{.Version}}/knockrd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: knockrd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/knockrd/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/knockrd/releases/download/{{.Version}}/knockrd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: knockrd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/knockrd/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
