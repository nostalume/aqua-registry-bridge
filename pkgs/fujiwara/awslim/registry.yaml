# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fujiwara
    repo_name: awslim
    aliases:
      - name: fujiwara/aws-sdk-client-go
    description: A simplified alternative to the AWS CLI for limited use cases
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.7")
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/awslim/releases/download/{{.Version}}/aws-sdk-client-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: aws-sdk-client-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/awslim/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
        files:
          - name: aws-sdk-client-go
      - version_constraint: semver("<= 0.0.14")
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/awslim/releases/download/{{.Version}}/aws-sdk-client-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: aws-sdk-client-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/awslim/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
        files:
          - name: aws-sdk-client-go
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/awslim/releases/download/{{.Version}}/awslim_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awslim_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/awslim/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
