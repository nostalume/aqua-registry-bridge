# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fujiwara
    repo_name: apprun-cli
    description: CLI for sakura AppRun
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/apprun-cli/releases/download/{{.Version}}/apprun-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: apprun-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/apprun-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.2.2")
        no_asset: true
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/apprun-cli/releases/download/{{.Version}}/apprun-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: apprun-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/apprun-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fujiwara/apprun-cli/releases/download/{{.Version}}/apprun-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: apprun-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fujiwara/apprun-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
