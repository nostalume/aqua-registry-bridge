# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: suzuki-shunsuke
    repo_name: yaml2json
    description: Convert YAML to JSON
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/yaml2json/releases/download/{{.Version}}/yaml2json_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: yaml2json_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/yaml2json/releases/download/{{.Version}}/yaml2json_{{trimV .Version}}_checksums.txt
          asset: yaml2json_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/yaml2json/releases/download/{{.Version}}/yaml2json_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: yaml2json_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/yaml2json/releases/download/{{.Version}}/yaml2json_{{trimV .Version}}_checksums.txt
          asset: yaml2json_{{trimV .Version}}_checksums.txt
          algorithm: sha256
