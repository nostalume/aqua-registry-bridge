# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: suzuki-shunsuke
    repo_name: docfresh
    description: Make document maintainable, reusable, and testable
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/docfresh_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: docfresh_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/docfresh_checksums.txt
          asset: docfresh_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/docfresh_checksums.txt.bundle
              asset: docfresh_checksums.txt.bundle
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/docfresh
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        github_artifact_attestations:
          signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/docfresh_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/docfresh_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: docfresh_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/docfresh_checksums.txt
          asset: docfresh_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/docfresh_checksums.txt.sigstore.json
              asset: docfresh_checksums.txt.sigstore.json
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/docfresh
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        github_artifact_attestations:
          signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/suzuki-shunsuke/docfresh/releases/download/{{.Version}}/docfresh_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
