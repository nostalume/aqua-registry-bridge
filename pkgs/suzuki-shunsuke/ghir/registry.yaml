# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: suzuki-shunsuke
    repo_name: ghir
    description: ghir is a CLI making past GitHub Releases immutable
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.3")
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ghir_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_checksums.txt
          asset: ghir_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_checksums.txt.pem
              - --certificate-identity-regexp
              - "^https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.+$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_checksums.txt.sig
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/ghir
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        github_artifact_attestations:
          signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ghir_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_checksums.txt
          asset: ghir_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_checksums.txt.sigstore.json
              asset: ghir_checksums.txt.sigstore.json
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.+$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/ghir
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        github_artifact_attestations:
          signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghir/releases/download/{{.Version}}/ghir_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
