# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: suzuki-shunsuke
    repo_name: pinact
    description: pinact is a CLI to edit GitHub Workflow and Composite action files and pin versions of Actions and Reusable Workflows. pinact can also update their versions and verify version annotations
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0-1")
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pinact_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{trimV .Version}}_checksums.txt
          asset: pinact_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity-regexp
              - "^https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.+$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{trimV .Version}}_checksums.txt.sig
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/pinact
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
      - version_constraint: semver("<= 4.1.0")
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pinact_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{trimV .Version}}_checksums.txt
          asset: pinact_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity-regexp
              - "^https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.+$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{trimV .Version}}_checksums.txt.sig
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/pinact
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        github_artifact_attestations:
          signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pinact_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{trimV .Version}}_checksums.txt
          asset: pinact_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{trimV .Version}}_checksums.txt.sigstore.json
              asset: pinact_{{trimV .Version}}_checksums.txt.sigstore.json
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.+$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/pinact
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        github_artifact_attestations:
          signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/suzuki-shunsuke/pinact/releases/download/{{.Version}}/pinact_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
