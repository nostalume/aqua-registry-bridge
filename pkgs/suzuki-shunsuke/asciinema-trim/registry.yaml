# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: suzuki-shunsuke
    repo_name: asciinema-trim
    description: Trim and change the playback speed of asciinema's session
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.1")
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/asciinema-trim/releases/download/{{.Version}}/asciinema-trim_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: asciinema-trim_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/asciinema-trim/releases/download/{{.Version}}/asciinema-trim_{{trimV .Version}}_checksums.txt
          asset: asciinema-trim_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("< 0.1.4")
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/asciinema-trim/releases/download/{{.Version}}/asciinema-trim_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: asciinema-trim_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/asciinema-trim/releases/download/{{.Version}}/asciinema-trim_{{trimV .Version}}_checksums.txt
          asset: asciinema-trim_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/asciinema-trim/releases/download/{{.Version}}/asciinema-trim_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: asciinema-trim_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/asciinema-trim/releases/download/{{.Version}}/asciinema-trim_{{trimV .Version}}_checksums.txt
          asset: asciinema-trim_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/asciinema-trim/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
