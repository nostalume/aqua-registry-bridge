# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: suzuki-shunsuke
    repo_name: ghaperf
    description: ghaperf is a CLI to analyze the performance of GitHub Actions using GitHub API and raw job logs
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.1")
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghaperf/releases/download/{{.Version}}/ghaperf_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ghaperf_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghaperf/releases/download/{{.Version}}/ghaperf_checksums.txt
          asset: ghaperf_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/ghaperf
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghaperf/releases/download/{{.Version}}/ghaperf_checksums.txt.bundle
              asset: ghaperf_checksums.txt.bundle
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghaperf/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghaperf/releases/download/{{.Version}}/ghaperf_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ghaperf_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghaperf/releases/download/{{.Version}}/ghaperf_checksums.txt
          asset: ghaperf_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/suzuki-shunsuke/go-release-workflow/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - suzuki-shunsuke/ghaperf
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghaperf/releases/download/{{.Version}}/ghaperf_checksums.txt.sigstore.json
              asset: ghaperf_checksums.txt.sigstore.json
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/suzuki-shunsuke/ghaperf/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
        supported_envs:
          - linux
          - darwin/arm64
