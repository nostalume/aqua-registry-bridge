      - version_constraint: Version == "v0.1.1"
        type: http
        url: https://gh-proxy.org/github.com/afnanenayet/diffsitter/releases/download/{{.Version}}/diffsitter-{{.OS}}-{{.Arch}}
        asset: diffsitter-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        complete_windows_ext: false
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.1.3")
