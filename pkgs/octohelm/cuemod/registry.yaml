# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/octohelm/cuemod/releases/download/{{.Version}}/cuem_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: octohelm
    repo_name: cuemod
    description: experimental cuelang mod tool
    supported_envs:
      - linux
      - darwin
    asset: cuem_{{.OS}}_{{.Arch}}.tar.gz
    files:
      - name: cuem
