# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: leg100
    repo_name: pug
    description: Drive terraform at terminal velocity
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/leg100/pug/releases/download/{{.Version}}/pug_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pug_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/leg100/pug/releases/download/{{.Version}}/pug_{{trimV .Version}}_checksums.txt
          asset: pug_{{trimV .Version}}_checksums.txt
          algorithm: sha256
