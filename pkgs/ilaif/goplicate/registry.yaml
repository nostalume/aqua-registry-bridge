# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ilaif
    repo_name: goplicate
    description: A CLI tool that helps define common code or configuration snippets once, and sync it to multiple projects
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ilaif/goplicate/releases/download/{{.Version}}/goplicate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: goplicate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ilaif/goplicate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
