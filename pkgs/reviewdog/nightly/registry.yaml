# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/reviewdog/nightly/releases/download/{{.Version}}/reviewdog_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: reviewdog
    repo_name: nightly
    description: reviewdog nightly releases
    asset: reviewdog_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: reviewdog
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/reviewdog/nightly/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
