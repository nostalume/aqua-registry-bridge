# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: regclient/regclient/regctl
    type: github_release
    repo_owner: regclient
    repo_name: regclient
    asset: regctl-{{.OS}}-{{.Arch}}
    format: raw
    description: Docker and OCI Registry Client
    files:
      - name: regctl
    supported_envs:
      - darwin
      - linux
      - amd64
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.3.9")
        type: http
        url: https://gh-proxy.org/github.com/regclient/regclient/releases/download/{{.Version}}/regctl-{{.OS}}-{{.Arch}}
        rosetta2: true
      - version_constraint: semver("< 0.11.6")
        type: http
        url: https://gh-proxy.org/github.com/regclient/regclient/releases/download/{{.Version}}/regctl-{{.OS}}-{{.Arch}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/regclient/regclient/releases/download/{{.Version}}/regctl-{{.OS}}-{{.Arch}}
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/regclient/regclient/releases/download/{{.Version}}/regctl-{{.OS}}-{{.Arch}}.sigstore.json
            asset: regctl-{{.OS}}-{{.Arch}}.sigstore.json
          opts:
            - --certificate-identity
            - https://gh-proxy.org/github.com/regclient/regclient/.github/workflows/go.yml@refs/tags/{{.Version}}
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
