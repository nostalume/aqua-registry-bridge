# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gruntwork-io
    repo_name: fetch
    description: Download files, folders, and release assets from a specific git commit, branch, or tag of public and private GitHub repos
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.3")
        type: http
        url: https://gh-proxy.org/github.com/gruntwork-io/fetch/releases/download/{{.Version}}/fetch_{{.OS}}_{{.Arch}}
        asset: fetch_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.1")
        type: http
        url: https://gh-proxy.org/github.com/gruntwork-io/fetch/releases/download/{{.Version}}/fetch_{{.OS}}_{{.Arch}}
        asset: fetch_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gruntwork-io/fetch/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/gruntwork-io/fetch/releases/download/{{.Version}}/fetch_{{.OS}}_{{.Arch}}
        asset: fetch_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gruntwork-io/fetch/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
