# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gruntwork-io
    repo_name: git-xargs
    description: git-xargs is a command-line tool (CLI) for making updates across multiple Github repositories with a single command
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.1")
        type: http
        url: https://gh-proxy.org/github.com/gruntwork-io/git-xargs/releases/download/{{.Version}}/git-xargs_{{.OS}}_{{.Arch}}
        asset: git-xargs_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gruntwork-io/git-xargs/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
      - version_constraint: Version == "v0.0.2"
        no_asset: true
      - version_constraint: semver("<= 0.1.6")
        type: http
        url: https://gh-proxy.org/github.com/gruntwork-io/git-xargs/releases/download/{{.Version}}/git-xargs_{{.OS}}_{{.Arch}}
        asset: git-xargs_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gruntwork-io/git-xargs/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
      - version_constraint: semver("<= 0.1.8")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/gruntwork-io/git-xargs/releases/download/{{.Version}}/git-xargs_{{.OS}}_{{.Arch}}
        asset: git-xargs_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gruntwork-io/git-xargs/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
