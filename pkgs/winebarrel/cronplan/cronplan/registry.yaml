# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/winebarrel/cronplan/releases/download/{{.Version}}/cronplan_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    name: winebarrel/cronplan/cronplan
    repo_owner: winebarrel
    repo_name: cronplan
    description: Cron expression parser for Amazon EventBridge
    asset: cronplan_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    version_constraint: semver(">= 1.8.1")
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/winebarrel/cronplan/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_overrides:
      - version_constraint: semver(">= 1.2.0")
        type: http
        url: https://gh-proxy.org/github.com/winebarrel/cronplan/releases/download/{{.Version}}/cronplan_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/winebarrel/cronplan/releases/download/{{.Version}}/cronplan-checksums.txt
          asset: cronplan-checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/winebarrel/cronplan/releases/download/{{.Version}}/cronplan_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/winebarrel/cronplan/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
