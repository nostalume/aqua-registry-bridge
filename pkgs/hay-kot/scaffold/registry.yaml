# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: hay-kot
    repo_name: scaffold
    description: A cookie cutter alternative with in-project scaffolding for generating components, controllers, or other common code patterns
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/hay-kot/scaffold/releases/download/{{.Version}}/scaffold_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: scaffold_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hay-kot/scaffold/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hay-kot/scaffold/releases/download/{{.Version}}/scaffold_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
