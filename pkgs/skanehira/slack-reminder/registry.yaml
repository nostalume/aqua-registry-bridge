# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: skanehira
    repo_name: slack-reminder
    description: Slack remind generator
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/skanehira/slack-reminder/releases/download/{{.Version}}/slack-reminder_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: slack-reminder_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/skanehira/slack-reminder/releases/download/{{.Version}}/slack-reminder_{{trimV .Version}}_checksums.txt
          asset: slack-reminder_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/skanehira/slack-reminder/releases/download/{{.Version}}/slack-reminder_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
