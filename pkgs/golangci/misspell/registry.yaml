# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: golangci
    repo_name: misspell
    description: Correct commonly misspelled English words in source files
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.1")
        type: http
        url: https://gh-proxy.org/github.com/golangci/misspell/releases/download/{{.Version}}/misspell_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: misspell_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: 64bit
          darwin: mac
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/golangci/misspell/releases/download/{{.Version}}/misspell_{{trimV .Version}}_checksums.txt
          asset: misspell_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.5.1")
        type: http
        url: https://gh-proxy.org/github.com/golangci/misspell/releases/download/{{.Version}}/misspell_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: misspell_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/golangci/misspell/releases/download/{{.Version}}/misspell_{{trimV .Version}}_checksums.txt
          asset: misspell_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/golangci/misspell/releases/download/{{.Version}}/misspell_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: misspell_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: misspell
            src: "{{.AssetWithoutExt}}/misspell"
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/golangci/misspell/releases/download/{{.Version}}/misspell_{{trimV .Version}}_checksums.txt
          asset: misspell_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/golangci/misspell/releases/download/{{.Version}}/misspell_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
