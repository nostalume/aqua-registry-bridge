# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/yamafaktory/jql/releases/download/{{.Version}}/{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    repo_owner: yamafaktory
    repo_name: jql
    description: A JSON Query Language CLI tool
    asset: "{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}"
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/yamafaktory/jql/releases/download/{{.Version}}/{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/yamafaktory/jql/releases/download/{{.Version}}/{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        replacements:
          arm64: arm64
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
    supported_envs:
      - darwin
      - linux
      - amd64
    version_prefix: jql-
    checksum:
      type: http
      url: "{{.AssetURL}}.sha256"
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    version_constraint: semver(">= 6.0.7")
    version_overrides:
      - version_constraint: semver(">= 6.0.5")
        type: http
        url: https://gh-proxy.org/github.com/yamafaktory/jql/releases/download/{{.Version}}/{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/yamafaktory/jql/releases/download/{{.Version}}/{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver(">= 6.0.4")
