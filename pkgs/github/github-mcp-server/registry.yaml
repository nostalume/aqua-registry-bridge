# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: github
    repo_name: github-mcp-server
    description: GitHub's official MCP Server
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.1")
        type: http
        url: https://gh-proxy.org/github.com/github/github-mcp-server/releases/download/{{.Version}}/github-mcp-server_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: github-mcp-server_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/github/github-mcp-server/releases/download/{{.Version}}/github-mcp-server_{{trimV .Version}}_checksums.txt
          asset: github-mcp-server_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/github/github-mcp-server/releases/download/{{.Version}}/github-mcp-server_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/github/github-mcp-server/releases/download/{{.Version}}/github-mcp-server_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: github-mcp-server_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/github/github-mcp-server/releases/download/{{.Version}}/github-mcp-server_{{trimV .Version}}_checksums.txt
          asset: github-mcp-server_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        github_artifact_attestations:
          signer_workflow: github/github-mcp-server/.github/workflows/goreleaser.yml
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/github/github-mcp-server/releases/download/{{.Version}}/github-mcp-server_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
