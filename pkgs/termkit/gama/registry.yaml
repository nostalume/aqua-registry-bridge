# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: termkit
    repo_name: gama
    description: Manage your GitHub Actions from Terminal with great UI
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.7")
        type: http
        url: https://gh-proxy.org/github.com/termkit/gama/releases/download/{{.Version}}/gama-{{.OS}}-{{.Arch}}
        asset: gama-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.1.2")
        type: http
        url: https://gh-proxy.org/github.com/termkit/gama/releases/download/{{.Version}}/gama-{{.OS}}-{{.Arch}}
        asset: gama-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          darwin: macos
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/termkit/gama/releases/download/{{.Version}}/gama-{{.OS}}-{{.Arch}}
        asset: gama-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          darwin: macos
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
