# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k0sproject
    repo_name: k0sctl
    description: A bootstrapping and management tool for k0s clusters
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.0")
        type: http
        url: https://gh-proxy.org/github.com/k0sproject/k0sctl/releases/download/{{.Version}}/k0sctl-{{.OS}}-{{.Arch}}
        asset: k0sctl-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x64
          windows: win
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.10.1")
        type: http
        url: https://gh-proxy.org/github.com/k0sproject/k0sctl/releases/download/{{.Version}}/k0sctl-{{.OS}}-{{.Arch}}
        asset: k0sctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x64
          windows: win
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.11.4")
        type: http
        url: https://gh-proxy.org/github.com/k0sproject/k0sctl/releases/download/{{.Version}}/k0sctl-{{.OS}}-{{.Arch}}
        asset: k0sctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x64
          windows: win
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver("<= 0.18.1")
        type: http
        url: https://gh-proxy.org/github.com/k0sproject/k0sctl/releases/download/{{.Version}}/k0sctl-{{.OS}}-{{.Arch}}
        asset: k0sctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x64
          windows: win
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k0sproject/k0sctl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/k0sproject/k0sctl/releases/download/{{.Version}}/k0sctl-{{.OS}}-{{.Arch}}
        asset: k0sctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          windows: win
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k0sproject/k0sctl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
