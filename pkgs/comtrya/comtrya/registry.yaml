# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/comtrya/comtrya/releases/download/{{.Version}}/comtrya-{{.Arch}}-{{.OS}}
    repo_owner: comtrya
    repo_name: comtrya
    format: raw
    description: Configuration Management for Localhost / dotfiles
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/comtrya/comtrya/releases/download/{{.Version}}/comtrya-{{.Arch}}-{{.OS}}
        goarch: arm64
        replacements:
          linux: unknown-linux-gnu
    supported_envs:
      - darwin
      - linux
      - amd64
    version_constraint: semver(">= 0.3.19")
    asset: comtrya-{{.Arch}}-{{.OS}}
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/comtrya/comtrya/releases/download/{{.Version}}/comtrya
        asset: comtrya
        supported_envs:
          - linux/amd64
          - windows/amd64
