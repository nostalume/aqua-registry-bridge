# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: svenstaro
    repo_name: miniserve
    description: For when you really just want to serve some files over HTTP right now
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.10.1"
        no_asset: true
      - version_constraint: semver("<= 0.1.3")
        type: http
        url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{.OS}}
        asset: miniserve-{{.OS}}
        format: raw
        replacements:
          darwin: osx
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.3.1")
        type: http
        url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{.OS}}
        asset: miniserve-{{.OS}}
        format: raw
        replacements:
          darwin: osx
          windows: win
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.7.0")
        type: http
        url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{.OS}}-{{.Arch}}
        asset: miniserve-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: osx
          windows: win
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.10.4")
        type: http
        url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: miniserve-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{.Version}}-{{.OS}}-{{.Arch}}
            replacements:
              arm64: aarch64
      - version_constraint: semver("<= 0.20.0")
        type: http
        url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{.Version}}-{{.Arch}}-{{.OS}}
        asset: miniserve-{{.Version}}-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{.Version}}-{{.Arch}}-{{.OS}}
            replacements:
              arm64: aarch64
      - version_constraint: semver("<= 0.23.1")
        type: http
        url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{trimV .Version}}-{{.Arch}}-{{.OS}}
        asset: miniserve-{{trimV .Version}}-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{trimV .Version}}-{{.Arch}}-{{.OS}}
            replacements:
              arm64: aarch64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/svenstaro/miniserve/releases/download/{{.Version}}/miniserve-{{trimV .Version}}-{{.Arch}}-{{.OS}}
        asset: miniserve-{{trimV .Version}}-{{.Arch}}-{{.OS}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
