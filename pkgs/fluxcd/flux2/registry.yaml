# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fluxcd
    repo_name: flux2
    description: Open and extensible continuous delivery solution for Kubernetes. Powered by GitOps Toolkit
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.25.2")
        type: http
        url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        files:
          - name: flux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt
          asset: flux_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 2.0.0")
        type: http
        url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        files:
          - name: flux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt
          asset: flux_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/fluxcd/flux2/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt.pem
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        files:
          - name: flux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt
          asset: flux_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/fluxcd/flux2/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt.pem
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/fluxcd/flux2/releases/download/{{.Version}}/provenance.intoto.jsonl
          asset: provenance.intoto.jsonl
