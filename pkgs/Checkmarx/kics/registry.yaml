# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Checkmarx
    repo_name: kics
    description: Find security vulnerabilities, compliance issues, and infrastructure misconfigurations early in the development cycle of your infrastructure-as-code with KICS by Checkmarx
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.1.2")
        type: http
        url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        replacements:
          amd64: x64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_checksums.txt
          asset: kics_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: semver("<= 1.2.3")
        type: http
        url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_checksums.txt
          asset: kics_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.4.4")
        type: http
        url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_checksums.txt
          asset: kics_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 1.5.1")
        type: http
        url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_checksums.txt
          asset: kics_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Checkmarx/kics/releases/download/{{.Version}}/kics_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: go_build
        files:
          - name: kics
            src: ./cmd/console
            dir: kics-{{trimV .Version}}
