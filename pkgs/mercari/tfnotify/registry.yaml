# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mercari
    repo_name: tfnotify
    description: A CLI command to parse Terraform execution result and notify it to GitHub
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.8.0"
        type: http
        url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{trimV .Version}}_checksums.txt
          asset: tfnotify_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.3.1")
        type: http
        url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfnotify_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        files:
          - name: tfnotify
            src: tfnotify_{{.Version}}_{{.OS}}_{{.Arch}}/tfnotify
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfnotify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{trimV .Version}}_checksums.txt
          asset: tfnotify_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.7.0")
        type: http
        url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{trimV .Version}}_checksums.txt
          asset: tfnotify_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.7.5")
        type: http
        url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{trimV .Version}}_checksums.txt
          asset: tfnotify_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{trimV .Version}}_checksums.txt
          asset: tfnotify_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/mercari/tfnotify/releases/download/{{.Version}}/tfnotify_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
