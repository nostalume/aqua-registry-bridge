# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: brumhard
    repo_name: krewfile
    description: Declarative krew plugin management
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.1")
        type: go_install
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/brumhard/krewfile/releases/download/{{.Version}}/krewfile_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: krewfile_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/brumhard/krewfile/releases/download/{{.Version}}/krewfile_checksums.txt
          asset: krewfile_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/brumhard/krewfile/releases/download/{{.Version}}/krewfile_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/brumhard/krewfile/releases/download/{{.Version}}/krewfile_{{.OS}}_all.{{.Format}}
            asset: krewfile_{{.OS}}_all.{{.Format}}
