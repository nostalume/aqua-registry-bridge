# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kachick
    repo_name: selfup
    description: Versions should know how to update themselves
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kachick/selfup/releases/download/{{.Version}}/selfup_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: selfup_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kachick/selfup/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
