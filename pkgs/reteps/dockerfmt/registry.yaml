# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: reteps
    repo_name: dockerfmt
    description: Dockerfile format and parser. a modern dockfmt
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/reteps/dockerfmt/releases/download/{{.Version}}/dockerfmt-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: dockerfmt-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        supported_envs:
          - linux
          - darwin/arm64
