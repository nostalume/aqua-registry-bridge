# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cloverrose
    repo_name: unusedinterface
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cloverrose/unusedinterface/releases/download/{{.Version}}/unusedinterface_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: unusedinterface_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: unusedinterface
            src: "unusedinterface_{{.OS}}_{{.Arch}}/unusedinterface"
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cloverrose/unusedinterface/releases/download/{{.Version}}/unusedinterface_{{trimV .Version}}_checksums.txt
          asset: unusedinterface_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/cloverrose/unusedinterface/releases/download/{{.Version}}/unusedinterface_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
