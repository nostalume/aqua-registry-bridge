# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gurgeous
    repo_name: tennis
    description: stylish CSV tables in your terminal
    search_words:
      - csv
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.7.0")
        type: http
        url: https://gh-proxy.org/github.com/gurgeous/tennis/releases/download/{{.Version}}/tennis_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tennis_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gurgeous/tennis/releases/download/{{.Version}}/tennis_{{trimV .Version}}_checksums.txt
          asset: tennis_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        files:
          - name: tennis
            src: tennis_{{trimV .Version}}_{{.OS}}_{{.Arch}}/tennis
        supported_envs:
          - linux
          - darwin/arm64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/gurgeous/tennis/releases/download/{{.Version}}/tennis_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tennis_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: tennis
            src: tennis_{{trimV .Version}}_{{.OS}}_{{.Arch}}/tennis
        supported_envs:
          - linux/amd64
          - darwin/arm64
