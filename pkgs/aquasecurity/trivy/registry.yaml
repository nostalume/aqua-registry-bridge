# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: aquasecurity
    repo_name: trivy
    description: Find vulnerabilities, misconfigurations, secrets, SBOM in containers, Kubernetes, code repositories, clouds and more
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.20.0"
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: 64bit
          darwin: macOS
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_checksums.txt
          asset: trivy_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: ARM64
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.1.6")
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: 64bit
          darwin: macOS
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_checksums.txt
          asset: trivy_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: ARM64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.16.0")
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: 64bit
          darwin: macOS
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_checksums.txt
          asset: trivy_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
            replacements:
              arm64: ARM64
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        asset: trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: 64bit
          arm64: ARM64
          darwin: macOS
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_checksums.txt
          asset: trivy_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_checksums.txt.sigstore.json
              asset: trivy_{{trimV .Version}}_checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - aquasecurity/trivy
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aquasecurity/trivy/releases/download/{{.Version}}/trivy_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
            replacements: {}
