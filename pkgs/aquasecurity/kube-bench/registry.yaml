# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: aquasecurity
    repo_name: kube-bench
    description: Checks whether Kubernetes is deployed according to security best practices as defined in the CIS Kubernetes Benchmark
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v0.0.12", "v0.6.4"]
        no_asset: true
      - version_constraint: Version == "v0.0.11"
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_checksums.txt
          asset: kube-bench_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.0.8")
        no_asset: true
      - version_constraint: semver("<= 0.0.29")
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_checksums.txt
          asset: kube-bench_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.0.32")
        no_asset: true
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_checksums.txt
          asset: kube-bench_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 0.6.13-rc2")
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_checksums.txt
          asset: kube-bench_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kube-bench_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aquasecurity/kube-bench/releases/download/{{.Version}}/kube-bench_{{trimV .Version}}_checksums.txt
          asset: kube-bench_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
