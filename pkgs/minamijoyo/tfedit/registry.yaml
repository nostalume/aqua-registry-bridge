# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: minamijoyo
    repo_name: tfedit
    description: A refactoring tool for Terraform
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/minamijoyo/tfedit/releases/download/{{.Version}}/tfedit_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfedit_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/minamijoyo/tfedit/releases/download/{{.Version}}/tfedit_{{trimV .Version}}_checksums.txt
          asset: tfedit_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
