# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: minamijoyo
    repo_name: tfschema
    description: A schema inspector for Terraform / OpenTofu providers
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0")
        type: http
        url: https://gh-proxy.org/github.com/minamijoyo/tfschema/releases/download/{{.Version}}/tfschema_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfschema_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/minamijoyo/tfschema/releases/download/{{.Version}}/tfschema_{{trimV .Version}}_checksums.txt
          asset: tfschema_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.7.2")
        type: http
        url: https://gh-proxy.org/github.com/minamijoyo/tfschema/releases/download/{{.Version}}/tfschema_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfschema_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/minamijoyo/tfschema/releases/download/{{.Version}}/tfschema_{{trimV .Version}}_checksums.txt
          asset: tfschema_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/minamijoyo/tfschema/releases/download/{{.Version}}/tfschema_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfschema_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/minamijoyo/tfschema/releases/download/{{.Version}}/tfschema_{{trimV .Version}}_checksums.txt
          asset: tfschema_{{trimV .Version}}_checksums.txt
          algorithm: sha256
