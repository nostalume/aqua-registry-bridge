# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: minamijoyo
    repo_name: tfupdate
    description: Update version constraints in your Terraform configurations
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.2")
        type: http
        url: https://gh-proxy.org/github.com/minamijoyo/tfupdate/releases/download/{{.Version}}/tfupdate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfupdate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/minamijoyo/tfupdate/releases/download/{{.Version}}/tfupdate_{{trimV .Version}}_checksums.txt
          asset: tfupdate_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/minamijoyo/tfupdate/releases/download/{{.Version}}/tfupdate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfupdate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/minamijoyo/tfupdate/releases/download/{{.Version}}/tfupdate_{{trimV .Version}}_checksums.txt
          asset: tfupdate_{{trimV .Version}}_checksums.txt
          algorithm: sha256
