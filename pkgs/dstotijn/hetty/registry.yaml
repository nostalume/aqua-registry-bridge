# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/dstotijn/hetty/releases/download/{{.Version}}/hetty_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: dstotijn
    repo_name: hetty
    asset: hetty_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: An HTTP toolkit for security research
    replacements:
      amd64: x86_64
      darwin: macOS
      linux: Linux
      windows: Windows
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/dstotijn/hetty/releases/download/{{.Version}}/hetty_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/dstotijn/hetty/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
