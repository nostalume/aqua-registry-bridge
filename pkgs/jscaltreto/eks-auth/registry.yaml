# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jscaltreto
    repo_name: eks-auth
    description: Standalone program to fetch authentication tokens for AWS EKS Clusters
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/jscaltreto/eks-auth/releases/download/{{.Version}}/eks-auth-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: eks-auth-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        supported_envs:
          - linux
          - darwin
