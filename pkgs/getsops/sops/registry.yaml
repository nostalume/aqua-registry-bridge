# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: getsops
    repo_name: sops
    aliases:
      - name: mozilla/sops
    description: Simple and flexible tool for managing secrets
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v3.8.0-rc.1"
        type: http
        url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}.{{.OS}}.{{.Arch}}
        asset: sops-{{.Version}}.{{.OS}}.{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}.checksums.txt
          asset: sops-{{.Version}}.checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}.checksums.pem
              - --signature
              - https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}.checksums.sig
              - --certificate-identity-regexp
              - https://gh-proxy.org/github.com/getsops
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - getsops/sops
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/provenance.intoto.jsonl
          asset: provenance.intoto.jsonl
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}
            asset: sops-{{.Version}}
      - version_constraint: semver("<= 3.7.1")
        type: http
        url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}.{{.OS}}
        asset: sops-{{.Version}}.{{.OS}}
        format: raw
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}
            asset: sops-{{.Version}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 3.7.3")
        type: http
        url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}.{{.OS}}.{{.Arch}}
        asset: sops-{{.Version}}.{{.OS}}.{{.Arch}}
        format: raw
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}
            asset: sops-{{.Version}}
      - version_constraint: semver("<= 3.9.4")
        type: http
        url: https://gh-proxy.org/github.com/getsops/sops/releases/download/{{.Version}}/sops-{{.Version}}.{{.OS}}.{{.Arch}}
