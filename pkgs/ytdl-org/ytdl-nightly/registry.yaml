# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ytdl-org
    repo_name: ytdl-nightly
    description: Nightly builds for youtube-dl
    files:
      - name: youtube-dl
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "2024.03.28"
        type: http
        url: https://gh-proxy.org/github.com/ytdl-org/ytdl-nightly/releases/download/{{.Version}}/youtube-dl-{{.Version}}.{{.Format}}
        asset: youtube-dl-{{.Version}}.{{.Format}}
        format: tar.gz
        files:
          - name: youtube-dl
            src: youtube-dl/youtube-dl
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ytdl-org/ytdl-nightly/releases/download/{{.Version}}/youtube-dl-{{.Version}}.{{.Format}}
        asset: youtube-dl-{{.Version}}.{{.Format}}
        format: tar.gz
        files:
          - name: youtube-dl
            src: youtube-dl/youtube-dl
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ytdl-org/ytdl-nightly/releases/download/{{.Version}}/youtube-dl
            asset: youtube-dl
            format: raw
