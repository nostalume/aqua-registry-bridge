# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/tohjustin/kube-lineage/releases/download/{{.Version}}/kube-lineage_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: tohjustin
    repo_name: kube-lineage
    description: A CLI tool to display all dependencies or dependents of an object in a Kubernetes cluster
    asset: kube-lineage_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/tohjustin/kube-lineage/releases/download/{{.Version}}/kube-lineage_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    files:
      - name: kubectl-lineage
        src: kube-lineage
      - name: kube-lineage
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/tohjustin/kube-lineage/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 0.2.0")
    version_overrides:
      - version_constraint: semver("< 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/tohjustin/kube-lineage/releases/download/{{.Version}}/kubectl-lineage_{{.OS}}_{{.Arch}}.{{.Format}}
        files:
          - name: kubectl-lineage
        asset: kubectl-lineage_{{.OS}}_{{.Arch}}.{{.Format}}
