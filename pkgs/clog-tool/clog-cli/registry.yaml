# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/clog-tool/clog-cli/releases/download/{{.Version}}/clog-{{.Version}}-{{.Arch}}-{{.OS}}.tar.gz
    repo_owner: clog-tool
    repo_name: clog-cli
    description: Generate beautiful changelogs from your Git commit history
    rosetta2: true
    asset: clog-{{.Version}}-{{.Arch}}-{{.OS}}.tar.gz
    replacements:
      arm64: aarch64
      amd64: x86_64
      darwin: apple-darwin
      linux: unknown-linux-musl
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/clog-tool/clog-cli/releases/download/{{.Version}}/clog-{{.Version}}-{{.Arch}}-{{.OS}}.tar.gz
        goarch: arm64
        replacements:
          linux: unknown-linux-gnu
    supported_envs:
      - darwin
      - linux
    files:
      - name: clog
