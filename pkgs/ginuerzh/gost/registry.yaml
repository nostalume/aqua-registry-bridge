        asset: gost-{{.OS}}-{{.Arch}}-{{trimV .Version}}.{{.Format}}
        format: gz
        files:
          - name: gost
            src: "{{.AssetWithoutExt}}"
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ginuerzh/gost/releases/download/{{.Version}}/gost-{{.OS}}-{{.Arch}}-{{trimV .Version}}.{{.Format}}
            format: zip
            files:
              - name: gost
                src: gost-{{.OS}}-{{.Arch}}.exe
        supported_envs:
          - linux/amd64
          - darwin
          - windows
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ginuerzh/gost/releases/download/{{.Version}}/gost_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gost_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ginuerzh/gost/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ginuerzh/gost/releases/download/{{.Version}}/gost_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
