# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/hashicorp/terraform-plugin-docs/releases/download/{{.Version}}/tfplugindocs_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
    repo_owner: hashicorp
    repo_name: terraform-plugin-docs
    description: Generate and validate Terraform plugin/provider documentation
    asset: tfplugindocs_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
    files:
      - name: tfplugindocs
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/hashicorp/terraform-plugin-docs/releases/download/{{.Version}}/tfplugindocs_{{trimV .Version}}_SHA256SUMS
      asset: tfplugindocs_{{trimV .Version}}_SHA256SUMS
      algorithm: sha256
