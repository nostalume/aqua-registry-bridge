# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: hashicorp
    repo_name: copywrite
    description: Automate copyright headers and license files at scale
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.16.5"
        type: http
        url: https://gh-proxy.org/github.com/hashicorp/copywrite/releases/download/{{.Version}}/copywrite_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: copywrite_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hashicorp/copywrite/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hashicorp/copywrite/releases/download/{{.Version}}/copywrite_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/hashicorp/copywrite/releases/download/{{.Version}}/copywrite_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: copywrite_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/hashicorp/copywrite/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/hashicorp/copywrite/releases/download/{{.Version}}/copywrite_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
