# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: terramate-io
    repo_name: terramate
    description: "Open-source Infrastructure as Code (IaC) orchestration platform: GitOps workflows, orchestration, code generation, observability, drift detection, asset management, policies, Slack notifications, and more. Integrates with Terraform, OpenTofu, Terragrunt, Kubernetes, GitHub Actions, GitLab CI/CD, BitBucket Pipelines, and any other CI/CD platform"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.10"
        no_asset: true
      - version_constraint: Version == "v0.0.1"
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terrastack-{{.OS}}-{{.Arch}}
        asset: terrastack-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.0.2"
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terrastack-{{.OS}}-{{.Arch}}
        asset: terrastack-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
      - version_constraint: Version == "v0.0.3"
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate-{{.OS}}-{{.Arch}}
        asset: terramate-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "v0.0.11"
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.0.7")
        no_asset: true
      - version_constraint: semver("<= 0.0.9")
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.1.33")
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.2.7")
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          windows: win
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.9.0")
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        files:
          - name: terramate
          - name: terramate-ls
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        files:
          - name: terramate
          - name: terramate-ls
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --key
              - https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/cosign.pub
              - --signature
              - https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/checksums.txt.sig
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/terramate-io/terramate/releases/download/{{.Version}}/terramate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
