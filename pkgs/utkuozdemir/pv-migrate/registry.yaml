# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: utkuozdemir
    repo_name: pv-migrate
    description: CLI tool to easily migrate Kubernetes persistent volumes
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate-{{.OS}}.{{.Format}}
        asset: pv-migrate-{{.OS}}.{{.Format}}
        format: tar.gz
        files:
          - name: pv-migrate
            src: bin/{{.OS}}/pv-migrate
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.5.4"
        type: http
        url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        # disable checksum because asset names in the checksum file are different from actual asset names.
        # https://github.com/aquaproj/aqua-registry/pull/12352#issuecomment-1558413383
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.5.3")
        type: http
        url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pv-migrate_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.6.2")
        type: http
        url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.8.0")
        type: http
        url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/utkuozdemir/pv-migrate/releases/download/{{.Version}}/pv-migrate_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
