# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: getanteon
    repo_name: anteon
    description: Anteon (formerly Ddosify) - Effortless Kubernetes Monitoring and Performance Testing. Available on CLI, Self-Hosted, and Cloud
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.1")
        type: http
        url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: ddosify
        replacements:
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 1.0.3")
        type: http
        url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: ddosify
        replacements:
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/ddosify_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
            asset: ddosify_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        files:
          - name: ddosify
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/ddosify_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
            asset: ddosify_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/getanteon/anteon/releases/download/{{.Version}}/ddosify_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
