# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: clamoriniere
    repo_name: crd-to-markdown
    description: util to generate a markdown file from a Kubernetes CRD go struct definition
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/clamoriniere/crd-to-markdown/releases/download/{{.Version}}/crd-to-markdown_{{.OS}}_{{.Arch}}
        asset: crd-to-markdown_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/clamoriniere/crd-to-markdown/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
