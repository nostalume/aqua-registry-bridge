# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: manabusakai
    repo_name: tdtidy
    description: A command line tool for managing ECS task definitions. `tdtidy` can deregister and delete old task definitions
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/manabusakai/tdtidy/releases/download/{{.Version}}/tdtidy_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tdtidy_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/manabusakai/tdtidy/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
