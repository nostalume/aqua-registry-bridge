# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k1LoW
    repo_name: ndiag
    description: ndiag is a high-level architecture diagramming/documentation tool
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.14.2")
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/ndiag/releases/download/{{.Version}}/ndiag_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ndiag_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/ndiag/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/ndiag/releases/download/{{.Version}}/ndiag_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/ndiag/releases/download/{{.Version}}/ndiag_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: ndiag_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/ndiag/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/ndiag/releases/download/{{.Version}}/ndiag_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux/amd64
          - darwin
