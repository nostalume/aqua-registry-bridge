# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k1LoW
    repo_name: tcmux
    description: tcmux is a terminal and coding agent mux viewer
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/tcmux/releases/download/{{.Version}}/tcmux_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tcmux_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/tcmux/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/tcmux/releases/download/{{.Version}}/tcmux_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux
          - darwin
