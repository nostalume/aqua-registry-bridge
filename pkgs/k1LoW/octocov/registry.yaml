# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k1LoW
    repo_name: octocov
    description: octocov is a toolkit for collecting code metrics (code coverage, code to test ratio, test execution time and your own custom metrics)
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.47.0"
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/octocov/releases/download/{{.Version}}/octocov_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: octocov_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/octocov/releases/download/{{.Version}}/checksums-{{.OS}}.txt
          asset: checksums-{{.OS}}.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 0.28.2")
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/octocov/releases/download/{{.Version}}/octocov_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: octocov_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/octocov/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
