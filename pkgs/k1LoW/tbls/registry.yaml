# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/k1LoW/tbls/releases/download/{{.Version}}/tbls_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: k1LoW
    repo_name: tbls
    asset: tbls_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: zip
    description: tbls is a CI-Friendly tool for document a database, written in Go
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/tbls/releases/download/{{.Version}}/tbls_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
    supported_envs:
      - darwin
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/k1LoW/tbls/releases/download/{{.Version}}/checksums-{{.OS}}.txt
      asset: "checksums-{{.OS}}.txt"
      algorithm: sha256
