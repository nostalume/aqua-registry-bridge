# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k1LoW
    repo_name: tbls
    description: tbls is a CI-Friendly tool to document a database, written in Go
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.91.0"
        no_asset: true
      - version_constraint: Version == "v1.55.0"
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/tbls/releases/download/{{.Version}}/tbls_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tbls_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/tbls/releases/download/{{.Version}}/tbls_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v1.55.1"
