# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k1LoW
    repo_name: gh-setup
    description: Setup asset of Github releases
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.2"
        no_asset: true
      - version_constraint: semver("<= 1.6.0")
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/gh-setup/releases/download/{{.Version}}/gh-setup_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gh-setup_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/gh-setup/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/gh-setup/releases/download/{{.Version}}/gh-setup_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/gh-setup/releases/download/{{.Version}}/gh-setup_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gh-setup_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/gh-setup/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/gh-setup/releases/download/{{.Version}}/gh-setup_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
