# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k1LoW
    repo_name: hclstr
    description: hclstr is a utility tool for string literals in HCL files
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/hclstr/releases/download/{{.Version}}/hclstr_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: hclstr_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/hclstr/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/hclstr/releases/download/{{.Version}}/hclstr_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
