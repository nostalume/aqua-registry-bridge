# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k1LoW
    repo_name: awsdo
    description: awsdo is a tool to do anything using AWS temporary credentials
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.9.1")
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.10.0")
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/k1LoW/awsdo/releases/download/{{.Version}}/awsdo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - linux
          - darwin
