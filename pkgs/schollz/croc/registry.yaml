# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: schollz
    repo_name: croc
    description: Easily and securely send things from one computer to another
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.2")
        type: http
        url: https://gh-proxy.org/github.com/schollz/croc/releases/download/{{.Version}}/croc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: croc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: 64bit
          darwin: OSX
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/schollz/croc/releases/download/{{.Version}}/croc_{{trimV .Version}}_checksums.txt
          asset: croc_{{trimV .Version}}_checksums.txt
          algorithm: sha256
