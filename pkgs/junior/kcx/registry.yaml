# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: junior
    repo_name: kcx
    description: One kubeconfig file per cluster, with a context and namespace switcher
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/junior/kcx/releases/download/{{.Version}}/kcx_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kcx_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/junior/kcx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/junior/kcx/\\.github/workflows/.+\\.ya?ml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/junior/kcx/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/junior/kcx/releases/download/{{.Version}}/kcx_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        github_artifact_attestations:
          signer_workflow: junior/kcx/.github/workflows/release.yml
