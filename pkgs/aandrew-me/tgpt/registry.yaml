# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: aandrew-me
    repo_name: tgpt
    description: AI Chatbots in terminal without needing API keys
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.1")
        type: http
        url: https://gh-proxy.org/github.com/aandrew-me/tgpt/releases/download/{{.Version}}/tgpt-{{.OS}}-{{.Arch}}
        asset: tgpt-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          darwin: mac
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aandrew-me/tgpt/releases/download/{{.Version}}/tgpt-{{.Arch}}
            asset: tgpt-{{.Arch}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 2.2.1")
        type: http
        url: https://gh-proxy.org/github.com/aandrew-me/tgpt/releases/download/{{.Version}}/tgpt-{{.OS}}-{{.Arch}}
        asset: tgpt-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          darwin: mac
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aandrew-me/tgpt/releases/download/{{.Version}}/tgpt-{{.Arch}}
            asset: tgpt-{{.Arch}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/aandrew-me/tgpt/releases/download/{{.Version}}/tgpt-{{.OS}}-{{.Arch}}
        asset: tgpt-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          darwin: mac
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aandrew-me/tgpt/releases/download/{{.Version}}/tgpt-{{.Arch}}.exe
            asset: tgpt-{{.Arch}}.exe
