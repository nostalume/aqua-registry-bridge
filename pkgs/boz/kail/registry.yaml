# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: boz
    repo_name: kail
    description: kubernetes log viewer
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.17.0"
        no_asset: true
      - version_constraint: Version == "v0.15.1"
        type: http
        url: https://gh-proxy.org/github.com/boz/kail/releases/download/{{.Version}}/kail_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kail_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/boz/kail/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/boz/kail/releases/download/{{.Version}}/kail_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kail_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/boz/kail/releases/download/{{.Version}}/kail_checksums.txt
          asset: kail_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.3.2")
        type: http
        url: https://gh-proxy.org/github.com/boz/kail/releases/download/{{.Version}}/kail_{{trimV .Version}}_{{.OS}}_{{.Arch}}
