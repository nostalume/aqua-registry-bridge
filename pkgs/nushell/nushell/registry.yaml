# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/nushell/nushell/releases/download/{{.Version}}/nu-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    repo_owner: nushell
    repo_name: nushell
    asset: nu-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    description: A new type of shell
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/nushell/nushell/releases/download/{{.Version}}/nu-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        goarch: arm64
        replacements:
          linux: unknown-linux-gnu
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/nushell/nushell/releases/download/{{.Version}}/nu-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        files:
          - name: nu
            src: nu.exe
    supported_envs:
      - darwin
      - linux
      - amd64
    version_constraint: semver(">= 0.71.0")
    files:
      - name: nu
        src: nu-{{.Version}}-{{.Arch}}-{{.OS}}/nu
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/nushell/nushell/releases/download/{{.Version}}/nu-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        files:
          - name: nu
