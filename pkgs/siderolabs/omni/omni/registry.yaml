# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: siderolabs/omni/omni
    type: github_release
    repo_owner: siderolabs
    repo_name: omni
    description: SaaS-simple deployment of Kubernetes - on your own hardware
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/siderolabs/omni/releases/download/{{.Version}}/omni-{{.OS}}-{{.Arch}}
        asset: omni-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/siderolabs/omni/releases/download/{{.Version}}/sha256sum.txt
          asset: sha256sum.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - linux
