# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kluctl
    repo_name: kluctl
    description: The missing glue to put together large Kubernetes deployments, composed of multiple smaller parts (Helm/Kustomize/...)  in a manageable and unified way
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 2.6.2")
        type: http
        url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/kluctl-{{.OS}}-{{.Arch}}
        asset: kluctl-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 2.7.1")
        type: http
        url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/kluctl-{{.OS}}-{{.Arch}}
        asset: kluctl-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 2.7.8")
        type: http
        url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/kluctl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kluctl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: Version == "v2.7.9"
        type: http
        url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/kluctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kluctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/kluctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/kluctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kluctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/kluctl_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kluctl/kluctl/releases/download/{{.Version}}/kluctl_{{.Version}}_checksums.txt
          asset: kluctl_{{.Version}}_checksums.txt
          algorithm: sha256
