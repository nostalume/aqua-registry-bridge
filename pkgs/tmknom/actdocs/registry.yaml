# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tmknom
    repo_name: actdocs
    description: Generate documentation from Actions and Reusable Workflows
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/tmknom/actdocs/releases/download/{{.Version}}/actdocs_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: actdocs_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tmknom/actdocs/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.5.1")
        type: http
        url: https://gh-proxy.org/github.com/tmknom/actdocs/releases/download/{{.Version}}/actdocs_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: actdocs_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tmknom/actdocs/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/tmknom/actdocs/releases/download/{{.Version}}/actdocs_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: actdocs_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        github_artifact_attestations:
          signer_workflow: tmknom/release-workflows/.github/workflows/go.yml
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tmknom/actdocs/releases/download/{{.Version}}/actdocs_{{trimV .Version}}_checksums.txt
          asset: actdocs_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/tmknom/actdocs/releases/download/{{.Version}}/actdocs_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity-regexp
              - "^https://github\\.com/tmknom/release-workflows/\\.github/workflows/go\\.yml@"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/tmknom/actdocs/releases/download/{{.Version}}/actdocs_{{trimV .Version}}_checksums.txt.sig
