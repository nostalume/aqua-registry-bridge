# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: CircleCI-Public
    repo_name: circleci-cli
    description: Use CircleCI from the command line
    files:
      - name: circleci
        src: "{{.AssetWithoutExt}}/circleci"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.28363"
        type: http
        url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_checksums.txt
          asset: circleci-cli_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.1.17522")
        type: http
        url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_checksums.txt
          asset: circleci-cli_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.1.28434")
        type: http
        url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_checksums.txt
          asset: circleci-cli_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 1.0.39747-pre")
        type: http
        url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_checksums.txt
          asset: circleci-cli_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: circleci
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_checksums.txt
          asset: circleci-cli_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/CircleCI-Public/circleci-cli/releases/download/{{.Version}}/circleci-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
