# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: aporia-ai
    repo_name: kubesurvival
    description: Significantly reduce Kubernetes costs by finding the cheapest machine types that can run your workloads
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/aporia-ai/kubesurvival/releases/download/{{.Version}}/KubeSurvival_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: KubeSurvival_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/aporia-ai/kubesurvival/releases/download/{{.Version}}/kubesurvival_checksums.txt
          asset: kubesurvival_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/aporia-ai/kubesurvival/releases/download/{{.Version}}/KubeSurvival_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
