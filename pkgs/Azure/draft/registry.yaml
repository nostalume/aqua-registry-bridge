# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Azure
    repo_name: draft
    description: A day 0 tool for getting your app on k8s fast
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.3")
        type: http
        url: https://gh-proxy.org/github.com/Azure/draft/releases/download/{{.Version}}/draftv2-{{.OS}}-{{.Arch}}
        asset: draftv2-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
        files:
          - name: draftv2
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/Azure/draft/releases/download/{{.Version}}/draft-v2{{.OS}}-{{.Arch}}
            goarch: arm64
            asset: draft-v2{{.OS}}-{{.Arch}}
      - version_constraint: semver("<= 0.0.7")
        type: http
        url: https://gh-proxy.org/github.com/Azure/draft/releases/download/{{.Version}}/draftv2-{{.OS}}-{{.Arch}}
        asset: draftv2-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
        files:
          - name: draftv2
      - version_constraint: semver("<= 0.0.21")
        type: http
        url: https://gh-proxy.org/github.com/Azure/draft/releases/download/{{.Version}}/draft-{{.OS}}-{{.Arch}}
        asset: draft-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Azure/draft/releases/download/{{.Version}}/draft-{{.OS}}-{{.Arch}}
        asset: draft-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
