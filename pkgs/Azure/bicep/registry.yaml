# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Azure
    repo_name: bicep
    description: Bicep is a declarative language for describing and deploying Azure resources
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.1")
        type: http
        url: https://gh-proxy.org/github.com/Azure/bicep/releases/download/{{.Version}}/bicep-{{.OS}}-{{.Arch}}
        asset: bicep-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x64
          darwin: osx
          windows: win
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.4.1008")
        type: http
        url: https://gh-proxy.org/github.com/Azure/bicep/releases/download/{{.Version}}/bicep-{{.OS}}-{{.Arch}}
        asset: bicep-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x64
          darwin: osx
          windows: win
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Azure/bicep/releases/download/{{.Version}}/bicep-{{.OS}}-musl-{{.Arch}}
            asset: bicep-{{.OS}}-musl-{{.Arch}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Azure/bicep/releases/download/{{.Version}}/bicep-{{.OS}}-{{.Arch}}
        asset: bicep-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x64
          darwin: osx
          windows: win
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Azure/bicep/releases/download/{{.Version}}/bicep-{{.OS}}-musl-{{.Arch}}
            goarch: amd64
            asset: bicep-{{.OS}}-musl-{{.Arch}}
