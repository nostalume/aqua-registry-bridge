# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Azure/aks-engine/releases/download/{{.Version}}/aks-engine-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    repo_owner: Azure
    repo_name: aks-engine
    description: AKS Engine deploys and manages Kubernetes clusters in Azure
    rosetta2: true
    supported_envs:
      - darwin
      - amd64
    asset: aks-engine-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    files:
      - name: aks-engine
        src: aks-engine-{{.Version}}-{{.OS}}-{{.Arch}}/aks-engine
