# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kyverno
    repo_name: chainsaw
    description: Declarative K8s e2e testing
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0-alpha.1"
        type: http
        url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/chainsaw_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chainsaw_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - "https://gh-proxy.org/github.com/kyverno/chainsaw/.github/workflows/release.yaml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - kyverno/chainsaw
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
      - version_constraint: Version == "v0.1.3-alpha.1"
        type: http
        url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/chainsaw_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chainsaw_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - "https://gh-proxy.org/github.com/kyverno/chainsaw/.github/workflows/release.yaml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - kyverno/chainsaw
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
      - version_constraint: semver("<= 0.2.13")
        type: http
        url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/chainsaw_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chainsaw_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-identity
              - "https://gh-proxy.org/github.com/kyverno/chainsaw/.github/workflows/release.yaml@refs/tags/{{.Version}}"
              - --certificate
              - https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt.pem
              - --signature
              - https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - kyverno/chainsaw
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        cosign:
          opts:
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --certificate-identity
            - "https://gh-proxy.org/github.com/kyverno/chainsaw/.github/workflows/release.yaml@refs/tags/{{.Version}}"
            - --certificate
            - https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/{{.Asset}}.pem
            - --signature
            - https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/{{.Asset}}.sig
            - --certificate-github-workflow-repository
            - kyverno/chainsaw
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/chainsaw_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: chainsaw_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - "https://gh-proxy.org/github.com/kyverno/chainsaw/.github/workflows/release.yaml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - kyverno/chainsaw
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/{{.Asset}}.sigstore.json
            asset: "{{.Asset}}.sigstore.json"
          opts:
            - --certificate-identity
            - "https://gh-proxy.org/github.com/kyverno/chainsaw/.github/workflows/release.yaml@refs/tags/{{.Version}}"
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --certificate-github-workflow-repository
            - kyverno/chainsaw
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/kyverno/chainsaw/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
