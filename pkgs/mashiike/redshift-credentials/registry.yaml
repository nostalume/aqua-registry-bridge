# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mashiike
    repo_name: redshift-credentials
    description: a command line tool for Amazon Redshift temporary authorization with AWS IAM
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.3")
        type: http
        url: https://gh-proxy.org/github.com/mashiike/redshift-credentials/releases/download/{{.Version}}/redshift-credentials_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: redshift-credentials_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mashiike/redshift-credentials/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mashiike/redshift-credentials/releases/download/{{.Version}}/redshift-credentials_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: redshift-credentials_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mashiike/redshift-credentials/releases/download/{{.Version}}/redshift-credentials_{{trimV .Version}}_checksums.txt
          asset: redshift-credentials_{{trimV .Version}}_checksums.txt
          algorithm: sha256
