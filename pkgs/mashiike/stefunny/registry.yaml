# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mashiike
    repo_name: stefunny
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.8.4")
        type: http
        url: https://gh-proxy.org/github.com/mashiike/stefunny/releases/download/{{.Version}}/stefunny_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: stefunny_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mashiike/stefunny/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mashiike/stefunny/releases/download/{{.Version}}/stefunny_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: stefunny_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mashiike/stefunny/releases/download/{{.Version}}/stefunny_{{trimV .Version}}_checksums.txt
          asset: stefunny_{{trimV .Version}}_checksums.txt
          algorithm: sha256
