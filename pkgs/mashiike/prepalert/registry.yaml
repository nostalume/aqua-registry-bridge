# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: mashiike
    repo_name: prepalert
    description: Toil reduction tool to prepare before responding to Mackerel alerts
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/mashiike/prepalert/releases/download/{{.Version}}/prepalert_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: prepalert_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mashiike/prepalert/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: Version == "v0.2.1"
        no_asset: true
      - version_constraint: semver("<= 1.0.1")
        type: http
        url: https://gh-proxy.org/github.com/mashiike/prepalert/releases/download/{{.Version}}/prepalert_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: prepalert_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mashiike/prepalert/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/mashiike/prepalert/releases/download/{{.Version}}/prepalert_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: prepalert_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/mashiike/prepalert/releases/download/{{.Version}}/prepalert_{{trimV .Version}}_checksums.txt
          asset: prepalert_{{trimV .Version}}_checksums.txt
          algorithm: sha256
