# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: yuuki
    repo_name: tcpulse
    description: A TCP/UDP load generator that provides fine-grained, flow-level control in Go
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/yuuki/tcpulse/releases/download/{{.Version}}/connperf_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: connperf_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yuuki/tcpulse/releases/download/{{.Version}}/connperf_{{trimV .Version}}_checksums.txt
          asset: connperf_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
        files:
          - name: connperf
      - version_constraint: semver("<= 0.7.2")
        type: http
        url: https://gh-proxy.org/github.com/yuuki/tcpulse/releases/download/{{.Version}}/connperf_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: connperf_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yuuki/tcpulse/releases/download/{{.Version}}/connperf_{{trimV .Version}}_checksums.txt
          asset: connperf_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
        files:
          - name: connperf
      - version_constraint: semver("<= 0.8.1")
        type: http
        url: https://gh-proxy.org/github.com/yuuki/tcpulse/releases/download/{{.Version}}/tcpulse_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tcpulse_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yuuki/tcpulse/releases/download/{{.Version}}/tcpulse_{{trimV .Version}}_checksums.txt
          asset: tcpulse_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/yuuki/tcpulse/releases/download/{{.Version}}/tcpulse_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tcpulse_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yuuki/tcpulse/releases/download/{{.Version}}/tcpulse_{{trimV .Version}}_checksums.txt
          asset: tcpulse_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
