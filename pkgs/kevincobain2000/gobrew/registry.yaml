# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kevincobain2000
    repo_name: gobrew
    description: Go version manager, written in Go. Super simple tool to install and manage Go versions. Install go without root. Gobrew doesn't require shell rehash
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "1.9.3"
        type: http
        url: https://gh-proxy.org/github.com/kevincobain2000/gobrew/releases/download/{{.Version}}/gobrew-{{.OS}}-{{.Arch}}
        asset: gobrew-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kevincobain2000/gobrew/releases/download/{{.Version}}/gobrew_{{.Version}}_checksums.txt
          asset: gobrew_{{.Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 1.10.8")
        type: http
        url: https://gh-proxy.org/github.com/kevincobain2000/gobrew/releases/download/{{.Version}}/gobrew-{{.OS}}-{{.Arch}}
        asset: gobrew-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kevincobain2000/gobrew/releases/download/{{.Version}}/gobrew_{{trimV .Version}}_checksums.txt
          asset: gobrew_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kevincobain2000/gobrew/releases/download/{{.Version}}/gobrew-{{.OS}}-{{.Arch}}
        asset: gobrew-{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kevincobain2000/gobrew/releases/download/{{.Version}}/gobrew_{{trimV .Version}}_checksums.txt
          asset: gobrew_{{trimV .Version}}_checksums.txt
          algorithm: sha256
