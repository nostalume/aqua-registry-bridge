# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ryane
    repo_name: kfilt
    description: kfilt can filter Kubernetes resources
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.5")
        type: http
        url: https://gh-proxy.org/github.com/ryane/kfilt/releases/download/{{.Version}}/kfilt_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: kfilt_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ryane/kfilt/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("< 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/ryane/kfilt/releases/download/{{.Version}}/kfilt_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: kfilt_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ryane/kfilt/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ryane/kfilt/releases/download/{{.Version}}/kfilt_{{trimV .Version}}_{{.OS}}_all
            asset: kfilt_{{trimV .Version}}_{{.OS}}_all
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ryane/kfilt/releases/download/{{.Version}}/kfilt_{{.OS}}_{{.Arch}}
        asset: kfilt_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ryane/kfilt/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/ryane/kfilt/releases/download/{{.Version}}/kfilt_{{.OS}}_all
            asset: kfilt_{{.OS}}_all
