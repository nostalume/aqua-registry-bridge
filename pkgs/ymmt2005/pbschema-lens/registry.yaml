# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ymmt2005
    repo_name: pbschema-lens
    description: HTML site generator for protobuf schema
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ymmt2005/pbschema-lens/releases/download/{{.Version}}/pbschema-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: pbschema-lens_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ymmt2005/pbschema-lens/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ymmt2005/pbschema-lens/releases/download/{{.Version}}/pbschema-lens_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
