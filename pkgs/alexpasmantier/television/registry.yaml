# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: alexpasmantier
    repo_name: television
    description: The revolution will (not) be televised
    files:
      - name: tv
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.15")
        no_asset: true
      - version_constraint: semver("<= 0.10.9")
        type: http
        url: https://gh-proxy.org/github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: tv-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{.OS}}-{{.Arch}}.sha256
          asset: "tv-{{.Version}}-{{.OS}}-{{.Arch}}.sha256"
          algorithm: sha256
      - version_constraint: semver("<= 0.11.3")
        type: http
        url: https://gh-proxy.org/github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: tv-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: tv
            src: "{{.AssetWithoutExt}}/tv"
        replacements:
          amd64: x86_64
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{.OS}}-{{.Arch}}.sha256
          asset: "tv-{{.Version}}-{{.OS}}-{{.Arch}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: tv-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: tv
            src: "{{.AssetWithoutExt}}/tv"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          windows: pc-windows-msvc
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{.Arch}}-{{.OS}}.sha256
          asset: tv-{{.Version}}-{{.Arch}}-{{.OS}}.sha256
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/alexpasmantier/television/releases/download/{{.Version}}/tv-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              linux: unknown-linux-gnu
