# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: rs
    repo_name: curlie
    description: The power of curl, the ease of use of httpie
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.1"
        type: http
        url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curl-httpie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: curl-httpie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: http
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curl-httpie_{{trimV .Version}}_checksums.txt
          asset: curl-httpie_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
      - version_constraint: semver("<= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curl-httpie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: curl-httpie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: http
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curl-httpie_{{trimV .Version}}_checksums.txt
          asset: curl-httpie_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.6.0")
        type: http
        url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: curlie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_checksums.txt
          asset: curlie_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.7.2")
        type: http
        url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: curlie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_checksums.txt
          asset: curlie_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: curlie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_checksums.txt
          asset: curlie_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity
              - https://gh-proxy.org/github.com/rs/curlie/.github/workflows/release.yml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_checksums.txt.sig
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/rs/curlie/releases/download/{{.Version}}/curlie_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
