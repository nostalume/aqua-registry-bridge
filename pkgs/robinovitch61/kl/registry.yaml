# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: robinovitch61
    repo_name: kl
    description: An interactive Kubernetes log viewer for your terminal
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/robinovitch61/kl/releases/download/{{.Version}}/kl_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
        asset: kl_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/robinovitch61/kl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/robinovitch61/kl/releases/download/{{.Version}}/kl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            asset: kl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/robinovitch61/kl/releases/download/{{.Version}}/kl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
            asset: kl_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
