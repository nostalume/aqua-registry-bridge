# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: grafana
    repo_name: jsonnet-language-server
    description: A Language Server Protocol (LSP) server for Jsonnet (https://jsonnet.org)
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.7.1")
        type: http
        url: https://gh-proxy.org/github.com/grafana/jsonnet-language-server/releases/download/{{.Version}}/jsonnet-language-server_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: jsonnet-language-server_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/grafana/jsonnet-language-server/releases/download/{{.Version}}/jsonnet-language-server_{{trimV .Version}}_checksums.txt
          asset: jsonnet-language-server_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/grafana/jsonnet-language-server/releases/download/{{.Version}}/jsonnet-language-server_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: jsonnet-language-server_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/grafana/jsonnet-language-server/releases/download/{{.Version}}/jsonnet-language-server_{{trimV .Version}}_checksums.txt
          asset: jsonnet-language-server_{{trimV .Version}}_checksums.txt
          algorithm: sha256
