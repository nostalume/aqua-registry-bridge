# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: visma-prodsec
    repo_name: confused
    description: Tool to check for dependency confusion vulnerabilities in multiple package management systems
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/visma-prodsec/confused/releases/download/{{.Version}}/confused_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: confused_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/visma-prodsec/confused/releases/download/{{.Version}}/confused_{{trimV .Version}}_checksums.txt
          asset: confused_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/visma-prodsec/confused/releases/download/{{.Version}}/confused_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
