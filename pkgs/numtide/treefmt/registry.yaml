# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: numtide
    repo_name: treefmt
    description: one CLI to format your repo
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.6")
        type: http
        url: https://gh-proxy.org/github.com/numtide/treefmt/releases/download/{{.Version}}/treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/numtide/treefmt/releases/download/{{.Version}}/treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/numtide/treefmt/releases/download/{{.Version}}/treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
          arm64: aarch64
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/numtide/treefmt/releases/download/{{.Version}}/treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - linux
          - windows
      - version_constraint: semver("<= 0.6.1")
        type: http
        url: https://gh-proxy.org/github.com/numtide/treefmt/releases/download/{{.Version}}/treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/numtide/treefmt/releases/download/{{.Version}}/treefmt-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/numtide/treefmt/releases/download/{{.Version}}/treefmt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: treefmt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/numtide/treefmt/releases/download/{{.Version}}/treefmt_{{trimV .Version}}_checksums.txt
          asset: treefmt_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
