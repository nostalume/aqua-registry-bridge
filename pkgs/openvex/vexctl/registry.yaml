# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: openvex
    repo_name: vexctl
    description: A  tool to create, transform and attest VEX metadata
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.5")
        type: http
        url: https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vexctl-{{.OS}}-{{.Arch}}
        asset: vexctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vex_checksums.txt
          asset: vex_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/openvex/vexctl/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --signature
              - https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vex_checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vex_checksums.txt.pem
              - --certificate-github-workflow-repository
              - openvex/vexctl
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        cosign:
          opts:
            - --certificate-identity-regexp
            - "https://github\\.com/openvex/vexctl/\\.github/workflows/release\\.yaml@.*"
            - --certificate-oidc-issuer
            - "https://token.actions.githubusercontent.com"
            - --signature
            - https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/{{.Asset}}.sig
            - --certificate
            - https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/{{.Asset}}.pem
            - --certificate-github-workflow-repository
            - openvex/vexctl
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
      - version_constraint: semver("<= 0.4.1")
        type: http
        url: https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vexctl-{{.OS}}-{{.Arch}}
        asset: vexctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vexctl_checksums.txt
          asset: vexctl_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/openvex/vexctl/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --signature
              - https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vexctl_checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vexctl_checksums.txt.pem
              - --certificate-github-workflow-repository
              - openvex/vexctl
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        cosign:
          opts:
            - --certificate-identity-regexp
            - "https://github\\.com/openvex/vexctl/\\.github/workflows/release\\.yaml@.*"
            - --certificate-oidc-issuer
            - "https://token.actions.githubusercontent.com"
            - --signature
            - https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/{{.Asset}}.sig
            - --certificate
            - https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/{{.Asset}}.pem
            - --certificate-github-workflow-repository
            - openvex/vexctl
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vexctl-{{.OS}}-{{.Arch}}
        asset: vexctl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vexctl_checksums.txt
          asset: vexctl_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "https://github\\.com/openvex/vexctl/\\.github/workflows/release\\.yaml@.*"
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-github-workflow-repository
              - openvex/vexctl
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/vexctl_checksums.txt.sigstore.json
              asset: vexctl_checksums.txt.sigstore.json
        cosign:
          opts:
            - --certificate-identity-regexp
            - "https://github\\.com/openvex/vexctl/\\.github/workflows/release\\.yaml@.*"
            - --certificate-oidc-issuer
            - "https://token.actions.githubusercontent.com"
            - --certificate-github-workflow-repository
            - openvex/vexctl
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/openvex/vexctl/releases/download/{{.Version}}/{{.Asset}}.sigstore.json
            asset: "{{.Asset}}.sigstore.json"
