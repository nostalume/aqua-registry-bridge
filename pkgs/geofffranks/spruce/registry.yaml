# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/geofffranks/spruce/releases/download/{{.Version}}/spruce-{{.OS}}-{{.Arch}}
    repo_owner: geofffranks
    repo_name: spruce
    description: Standalone, daemon-less, unprivileged Dockerfile and OCI compatible container image builder
    supported_envs:
      - darwin
      - linux
      - amd64
    format: raw
    version_constraint: semver(">= 1.30.1")
    asset: spruce-{{.OS}}-{{.Arch}}
    complete_windows_ext: false
    checksum:
      type: http
      url: "{{.AssetURL}}.sha1"
      asset: "{{.Asset}}.sha1"
      algorithm: sha1
    version_overrides:
      - version_constraint: semver("= 1.30.0")
        type: http
        url: https://gh-proxy.org/github.com/geofffranks/spruce/releases/download/{{.Version}}/spruce-{{.OS}}-{{.Arch}}
        rosetta2: true
        supported_envs:
          - darwin
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/geofffranks/spruce/releases/download/{{.Version}}/spruce-{{.OS}}-{{.Arch}}
        complete_windows_ext: true
        checksum:
          enabled: false
        rosetta2: true
        supported_envs:
          - darwin
          - amd64
