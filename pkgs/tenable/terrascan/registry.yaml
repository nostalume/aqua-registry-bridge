# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/tenable/terrascan/releases/download/{{.Version}}/terrascan_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: tenable
    repo_name: terrascan
    aliases:
      - name: accurics/terrascan
    asset: terrascan_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    description: Detect compliance and security violations across Infrastructure as Code to mitigate risk before provisioning cloud native infrastructure
    supported_envs:
      - darwin
      - linux
      - amd64
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/tenable/terrascan/releases/download/{{.Version}}/terrascan_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    replacements:
      darwin: Darwin
      linux: Linux
      windows: Windows
      386: i386
      amd64: x86_64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/tenable/terrascan/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
