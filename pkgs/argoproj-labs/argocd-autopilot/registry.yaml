# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: argoproj-labs
    repo_name: argocd-autopilot
    description: Argo-CD Autopilot
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.6")
        type: http
        url: https://gh-proxy.org/github.com/argoproj-labs/argocd-autopilot/releases/download/{{.Version}}/argocd-autopilot-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: argocd-autopilot-{{.OS}}-{{.Arch}}.{{.Format}}
        format: gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: argocd-autopilot
            src: argocd-autopilot-{{.OS}}-{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/argoproj-labs/argocd-autopilot/releases/download/{{.Version}}/argocd-autopilot-{{.OS}}-{{.Arch}}.sha256
          asset: argocd-autopilot-{{.OS}}-{{.Arch}}.sha256
          algorithm: sha256
      - version_constraint: semver("<= 0.3.7")
        type: http
        url: https://gh-proxy.org/github.com/argoproj-labs/argocd-autopilot/releases/download/{{.Version}}/argocd-autopilot-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: argocd-autopilot-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: argocd-autopilot
            src: argocd-autopilot-{{.OS}}-{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/argoproj-labs/argocd-autopilot/releases/download/{{.Version}}/argocd-autopilot-{{.OS}}-{{.Arch}}.sha256
          asset: argocd-autopilot-{{.OS}}-{{.Arch}}.sha256
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/argoproj-labs/argocd-autopilot/releases/download/{{.Version}}/argocd-autopilot-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: argocd-autopilot-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: argocd-autopilot
            src: argocd-autopilot-{{.OS}}-{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/argoproj-labs/argocd-autopilot/releases/download/{{.Version}}/argocd-autopilot-{{.OS}}-{{.Arch}}.sha256
          asset: argocd-autopilot-{{.OS}}-{{.Arch}}.sha256
          algorithm: sha256
