# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kcl-lang
    repo_name: kcl
    description: KCL Programming Language (CNCF Sandbox Project). https://kcl-lang.io
    files:
      - name: kcl-language-server
      - name: kclvm_cli
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kcl-lang/kcl/releases/download/{{.Version}}/kclvm-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: kclvm-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: kcl-language-server
            src: kclvm/bin/kcl-language-server
          - name: kclvm_cli
            src: kclvm/bin/kclvm_cli
        supported_envs:
          - darwin
          - linux
