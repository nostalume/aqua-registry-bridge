# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: 8051Enthusiast
    repo_name: biodiff
    description: Hex diff viewer using alignment algorithms from biology
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.2")
        type: http
        url: https://gh-proxy.org/github.com/8051Enthusiast/biodiff/releases/download/{{.Version}}/biodiff-{{.OS}}-latest-x86.{{.Format}}
        asset: biodiff-{{.OS}}-latest-x86.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: Version == "v0.2.0"
        type: http
        url: https://gh-proxy.org/github.com/8051Enthusiast/biodiff/releases/download/{{.Version}}/biodiff-{{.OS}}-{{trimV .Version}}.{{.Format}}
        asset: biodiff-{{.OS}}-{{trimV .Version}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: Version == "v0.2.1"
        type: http
        url: https://gh-proxy.org/github.com/8051Enthusiast/biodiff/releases/download/{{.Version}}/biodiff-{{.OS}}-0-2-1.{{.Format}}
        asset: biodiff-{{.OS}}-0-2-1.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/8051Enthusiast/biodiff/releases/download/{{.Version}}/biodiff-{{.OS}}-{{trimV .Version}}.{{.Format}}
        asset: biodiff-{{.OS}}-{{trimV .Version}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
