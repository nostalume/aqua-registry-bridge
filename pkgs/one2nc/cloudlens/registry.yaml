# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: one2nc
    repo_name: cloudlens
    description: k9s like CLI for AWS and GCP
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/one2nc/cloudlens/releases/download/{{.Version}}/cloudlens_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cloudlens_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/one2nc/cloudlens/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/one2nc/cloudlens/releases/download/{{.Version}}/cloudlens_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
            asset: cloudlens_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
