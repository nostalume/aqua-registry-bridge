# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: runkids
    repo_name: skillshare
    description: Sync skills across all AI CLI tools with one command and simplify team sharing. Supporting Claude Code, OpenClaw, OpenCode & more
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/runkids/skillshare/releases/download/{{.Version}}/skillshare_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: skillshare_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/runkids/skillshare/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/runkids/skillshare/releases/download/{{.Version}}/skillshare_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
