# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: BetterDiscord
    repo_name: cli
    description: CLI for installing and managing BetterDiscord
    files:
      - name: bdcli
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/BetterDiscord/cli/releases/download/{{.Version}}/bdcli_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bdcli_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/BetterDiscord/cli/releases/download/{{.Version}}/bdcli_checksums.txt
          asset: bdcli_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/BetterDiscord/cli/releases/download/{{.Version}}/bdcli_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/BetterDiscord/cli/releases/download/{{.Version}}/bdcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bdcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/BetterDiscord/cli/releases/download/{{.Version}}/bdcli_checksums.txt
          asset: bdcli_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/BetterDiscord/cli/releases/download/{{.Version}}/bdcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
