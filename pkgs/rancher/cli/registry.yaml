# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/rancher/cli/releases/download/{{.Version}}/rancher-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
    repo_owner: rancher
    repo_name: cli
    description: Rancher CLI
    rosetta2: true
    supported_envs:
      - darwin
      - amd64
    asset: rancher-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/rancher/cli/releases/download/{{.Version}}/rancher-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
        format: zip
    files:
      - name: rancher
        src: rancher-{{.Version}}/rancher
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/rancher/cli/releases/download/{{.Version}}/sha256sum.txt
      asset: sha256sum.txt
      algorithm: sha256
