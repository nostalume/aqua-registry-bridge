# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: rancher
    repo_name: kim
    description: In ur kubernetes, buildin ur imagez
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.0-alpha.3")
        type: http
        url: https://gh-proxy.org/github.com/rancher/kim/releases/download/{{.Version}}/kim-{{.OS}}-{{.Arch}}
        asset: kim-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
      - version_constraint: semver("<= 0.1.0-alpha.6")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/rancher/kim/releases/download/{{.Version}}/kim-{{.OS}}-{{.Arch}}
        asset: kim-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rancher/kim/releases/download/{{.Version}}/sha256sum.txt
          asset: sha256sum.txt
          algorithm: sha256
