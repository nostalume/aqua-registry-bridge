# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: stepchowfun
    repo_name: docuum
    description: Docuum performs least recently used (LRU) eviction of Docker images
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.22.1"
        type: http
        url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
        asset: docuum-{{.Arch}}-{{.OS}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
            replacements:
              arm64: aarch64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.22.2"
        type: http
        url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
        asset: docuum-{{.Arch}}-{{.OS}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
            goarch: arm64
            replacements:
              linux: unknown-linux-gnu
      - version_constraint: Version == "v0.22.3"
        type: http
        url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
        asset: docuum-{{.Arch}}-{{.OS}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
      - version_constraint: semver("<= 0.16.0")
        type: http
        url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
        asset: docuum-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.17.0")
        type: http
        url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
        asset: docuum-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.22.0")
        type: http
        url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
        asset: docuum-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/stepchowfun/docuum/releases/download/{{.Version}}/docuum-{{.Arch}}-{{.OS}}
        asset: docuum-{{.Arch}}-{{.OS}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
