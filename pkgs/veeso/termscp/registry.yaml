# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: veeso
    repo_name: termscp
    asset: termscp-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    description: A feature rich terminal UI file transfer and explorer with support for SCP/SFTP/FTP/S3
    replacements:
      amd64: x86_64
      darwin: apple-darwin
      linux: unknown-linux-gnu
      windows: pc-windows-msvc
    overrides:
      - goos: windows
        format: zip
    supported_envs:
      - darwin
      - amd64
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("< 0.6.1")
        type: http
        url: https://gh-proxy.org/github.com/veeso/termscp/releases/download/{{.Version}}/termscp-{{.OS}}.{{.Format}}
        asset: termscp-{{.OS}}.{{.Format}}
        rosetta2: true
        replacements:
          darwin: mac
          windows: msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/veeso/termscp/releases/download/{{.Version}}/termscp-{{trimV .Version}}.{{.Format}}
            format: txz
            asset: termscp-{{trimV .Version}}.{{.Format}}
            files:
              - name: termscp
                src: usr/local/bin/termscp
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/veeso/termscp/releases/download/{{.Version}}/termscp-{{trimV .Version}}-{{.OS}}.{{.Format}}
            format: zip
            asset: termscp-{{trimV .Version}}-{{.OS}}.{{.Format}}
      - version_constraint: semver("< 0.8.1")
        type: http
        url: https://gh-proxy.org/github.com/veeso/termscp/releases/download/{{.Version}}/termscp-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        rosetta2: true
      - version_constraint: semver("< 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/veeso/termscp/releases/download/{{.Version}}/termscp-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/veeso/termscp/releases/download/{{.Version}}/termscp-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
