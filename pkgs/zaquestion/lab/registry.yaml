# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: zaquestion
    repo_name: lab
    description: Lab wraps Git or Hub, making it simple to clone, fork, and interact with repositories on GitLab
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.5.0"
        no_asset: true
      - version_constraint: Version == "v0.24.0"
        type: http
        url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_checksums.txt
          asset: lab_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.11.1")
        type: http
        url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_checksums.txt
          asset: lab_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.17.2")
        type: http
        url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_checksums.txt
          asset: lab_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.23.0")
        type: http
        url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_checksums.txt
          asset: lab_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_checksums.txt
          asset: lab_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/zaquestion/lab/releases/download/{{.Version}}/lab_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
