# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/PaddiM8/kalker/releases/download/{{.Version}}/kalker-{{.OS}}.{{.Format}}
    repo_owner: PaddiM8
    repo_name: kalker
    description: Kalker is a calculator program that supports user-defined variables, functions, differentiation, and integration
    asset: kalker-{{.OS}}.{{.Format}}
    format: zip
    overrides:
      - goos: linux
        type: http
        url: https://gh-proxy.org/github.com/PaddiM8/kalker/releases/download/{{.Version}}/kalker-{{.OS}}
        format: raw
        asset: kalker-{{.OS}}
    replacements:
      darwin: macOS
    supported_envs:
      - linux/amd64
      - darwin
    rosetta2: true
    files:
      - name: kalker
        src: target/release/kalker
    version_constraint: semver(">= 1.0.0")
    version_overrides:
      - version_constraint: semver(">= 0.3.4")
        type: http
        url: https://gh-proxy.org/github.com/PaddiM8/kalker/releases/download/{{.Version}}/kalk-{{.OS}}.{{.Format}}
        asset: kalk-{{.OS}}.{{.Format}}
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/PaddiM8/kalker/releases/download/{{.Version}}/kalk-{{.OS}}
            format: raw
            asset: kalk-{{.OS}}
        files:
          - name: kalker
            src: target/release/kalk
      - version_constraint: semver(">= 0.3.3")
        type: http
        url: https://gh-proxy.org/github.com/PaddiM8/kalker/releases/download/{{.Version}}/kalk-{{.OS}}
        asset: kalk-{{.OS}}
        format: raw
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/PaddiM8/kalker/releases/download/{{.Version}}/kalk
            asset: kalk
        replacements:
          darwin: macOS
          linux: Linux
        supported_envs:
          - darwin
          - amd64
        files:
          - name: kalker
            src: target/release/kalk
      - version_constraint: semver(">= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/PaddiM8/kalker/releases/download/{{.Version}}/kalk_cli_{{.OS}}64
        asset: kalk_cli_{{.OS}}64
        format: raw
        overrides: []
        replacements:
          amd64: x64
        supported_envs:
          - linux/amd64
          - windows/amd64
        rosetta2: false
      - version_constraint: semver("< 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/PaddiM8/kalker/releases/download/{{.Version}}/kalk_cli
        asset: kalk_cli
        format: raw
        overrides: []
        supported_envs:
          - linux/amd64
        rosetta2: false
