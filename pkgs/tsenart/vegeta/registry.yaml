# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/tsenart/vegeta/releases/download/{{.Version}}/vegeta_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: tsenart
    repo_name: vegeta
    description: HTTP load testing tool and library. It's over 9000
    rosetta2: true
    supported_envs:
      - darwin
      - linux/amd64
    asset: vegeta_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/tsenart/vegeta/releases/download/{{.Version}}/vegeta_{{trimV .Version}}_checksums.txt
      asset: vegeta_{{trimV .Version}}_checksums.txt
      algorithm: sha256
