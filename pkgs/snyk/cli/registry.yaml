# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: snyk
    repo_name: cli
    description: Snyk CLI scans and monitors your projects for security vulnerabilities
    files:
      - name: snyk
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.1036.0"
        no_asset: true
      - version_constraint: semver("<= 1.850.0")
        type: http
        url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-{{.OS}}
        asset: snyk-{{.OS}}
        format: raw
        replacements:
          windows: win
          darwin: macos
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.1229.0")
        type: http
        url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-{{.OS}}
        asset: snyk-{{.OS}}
        format: raw
        replacements:
          darwin: macos
          windows: win
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-{{.OS}}-{{.Arch}}
            goarch: arm64
            asset: snyk-{{.OS}}-{{.Arch}}
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-{{.OS}}
        asset: snyk-{{.OS}}
        format: raw
        replacements:
          darwin: macos
          windows: win
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-{{.OS}}-{{.Arch}}
            goarch: arm64
            asset: snyk-{{.OS}}-{{.Arch}}
            variants:
              - key: libc
                value: glibc
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-alpine-{{.Arch}}
            goarch: arm64
            asset: snyk-alpine-{{.Arch}}
            variants:
              - key: libc
                value: musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-{{.OS}}
            variants:
              - key: libc
                value: glibc
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-{{.OS}}
            variants:
              - key: libc
                value: musl
            replacements:
              linux: alpine
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/snyk/cli/releases/download/{{.Version}}/snyk-{{.OS}}-{{.Arch}}
            goarch: arm64
            asset: snyk-{{.OS}}-{{.Arch}}
