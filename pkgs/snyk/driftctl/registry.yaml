# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: snyk
    repo_name: driftctl
    description: Detect, track and alert on infrastructure drift
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.4.0"
        type: http
        url: https://gh-proxy.org/github.com/snyk/driftctl/releases/download/{{.Version}}/driftctl_{{.OS}}_{{.Arch}}
        asset: driftctl_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/snyk/driftctl/releases/download/{{.Version}}/driftctl_SHA256SUMS
          asset: driftctl_SHA256SUMS
          algorithm: sha256
      - version_constraint: semver("<= 0.3.1")
        type: http
        url: https://gh-proxy.org/github.com/snyk/driftctl/releases/download/{{.Version}}/driftctl_{{.OS}}_{{.Arch}}
        asset: driftctl_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 0.18.5")
        type: http
        url: https://gh-proxy.org/github.com/snyk/driftctl/releases/download/{{.Version}}/driftctl_{{.OS}}_{{.Arch}}
        asset: driftctl_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/snyk/driftctl/releases/download/{{.Version}}/driftctl_SHA256SUMS
          asset: driftctl_SHA256SUMS
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/snyk/driftctl/releases/download/{{.Version}}/driftctl_{{.OS}}_{{.Arch}}
        asset: driftctl_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/snyk/driftctl/releases/download/{{.Version}}/driftctl_SHA256SUMS
          asset: driftctl_SHA256SUMS
          algorithm: sha256
