# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
---
packages:
  - name: projectcalico/calico/calicoctl
    type: http
    url: https://gh-proxy.org/github.com/projectcalico/calico/releases/download/{{.Version}}/calicoctl-{{.OS}}-{{.Arch}}
    repo_owner: projectcalico
    repo_name: calico
    asset: calicoctl-{{.OS}}-{{.Arch}}
    format: raw
    description: CLI tool for Calico cloud native networking and network security
    link: https://projectcalico.docs.tigera.io/
    supported_envs:
      - darwin
      - linux
      - amd64
    files:
      - name: calicoctl
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/projectcalico/calico/releases/download/{{.Version}}/SHA256SUMS
      asset: SHA256SUMS
      algorithm: sha256
    version_constraint: semver(">= 3.23.0")
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/projectcalico/calico/releases/download/{{.Version}}/calicoctl-{{.OS}}-{{.Arch}}
        rosetta2: true
        supported_envs:
          - darwin
          - linux
          - amd64
