# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jwilder
    repo_name: dockerize
    description: Utility to simplify running applications in docker containers
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/jwilder/dockerize/releases/download/{{.Version}}/dockerize-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
        asset: dockerize-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 0.6.1")
        type: http
        url: https://gh-proxy.org/github.com/jwilder/dockerize/releases/download/{{.Version}}/dockerize-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
        asset: dockerize-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/jwilder/dockerize/releases/download/{{.Version}}/dockerize-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
        asset: dockerize-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux
          - darwin
