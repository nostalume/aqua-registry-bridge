# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: rustic-rs
    repo_name: rustic
    description: "rustic - fast, encrypted, and deduplicated backups powered by Rust"
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.6.0"
        no_asset: true
      - version_constraint: Version == "v0.2.0-rc1"
        type: http
        url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic_{{trimV .Version}}_{{.Arch}}_64-{{.OS}}.{{.Format}}
        asset: rustic_{{trimV .Version}}_{{.Arch}}_64-{{.OS}}.{{.Format}}
        format: bz2
        files:
          - name: rustic
            src: rustic_0.2.0-rc1_x64_64-unknown-linux-musl
        replacements:
          amd64: x64
          linux: unknown-linux-musl
        supported_envs:
          - linux/amd64
      - version_constraint: Version == "v0.6.1"
        type: http
        url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rustic-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              linux: unknown-linux-gnu
        supported_envs:
          - linux
          - darwin
      - version_constraint: Version == "v0.10.2"
        type: http
        url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic-{{.Version}}-1-g189b17c-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rustic-{{.Version}}-1-g189b17c-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic-{{.Version}}-1-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            asset: rustic-{{.Version}}-1-{{.Arch}}-{{.OS}}.{{.Format}}
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic-{{.Version}}-1-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            asset: rustic-{{.Version}}-1-{{.Arch}}-{{.OS}}.{{.Format}}
      - version_constraint: semver("<= 0.2.2")
        type: http
        url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic-rs-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rustic-rs-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: rustic
            src: rustic-rs
        replacements:
          amd64: x86_64
          darwin: apple-darwin
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/rustic-rs/rustic/releases/download/{{.Version}}/rustic-rs-{{.Version}}-{{.Arch}}-{{.OS}}.sha256
          asset: rustic-rs-{{.Version}}-{{.Arch}}-{{.OS}}.sha256
          algorithm: sha256
