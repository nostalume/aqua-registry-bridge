# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/peak/s5cmd/releases/download/{{.Version}}/s5cmd_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: peak
    repo_name: s5cmd
    description: Parallel S3 and local filesystem execution tool
    replacements:
      darwin: macOS
      linux: Linux
      windows: Windows
      386: 32bit
      amd64: 64bit
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/peak/s5cmd/releases/download/{{.Version}}/s5cmd_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    asset: s5cmd_{{trimV .Version}}_{{.OS}}-{{.Arch}}.{{.Format}}
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/peak/s5cmd/releases/download/{{.Version}}/s5cmd_checksums.txt
      asset: s5cmd_checksums.txt
      algorithm: sha256
