# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/birdayz/kaf/releases/download/{{.Version}}/kaf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: birdayz
    repo_name: kaf
    description: Modern CLI for Apache Kafka, written in Go
    asset: kaf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/birdayz/kaf/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 0.2.6")
    version_overrides:
      - version_constraint: semver(">= 0.2.5")
        type: http
        url: https://gh-proxy.org/github.com/birdayz/kaf/releases/download/{{.Version}}/kaf_.{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kaf_.{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        checksum:
          enabled: false
      - version_constraint: semver(">= 0.2.4")
        type: http
        url: https://gh-proxy.org/github.com/birdayz/kaf/releases/download/{{.Version}}/kaf_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kaf_{{.OS}}_{{.Arch}}.{{.Format}}
      - version_constraint: semver(">= 0.1.44")
        type: http
        url: https://gh-proxy.org/github.com/birdayz/kaf/releases/download/{{.Version}}/kaf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
      - version_constraint: semver(">= 0.1.43")
        type: http
        url: https://gh-proxy.org/github.com/birdayz/kaf/releases/download/{{.Version}}/kaf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - linux
          - amd64
        rosetta2: true
      - version_constraint: semver(">= 0.1.6")
        type: http
        url: https://gh-proxy.org/github.com/birdayz/kaf/releases/download/{{.Version}}/kaf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
      - version_constraint: semver("< 0.1.6")
        type: http
        url: https://gh-proxy.org/github.com/birdayz/kaf/releases/download/{{.Version}}/kaf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        supported_envs:
          - linux/amd64
          - darwin
        rosetta2: true
