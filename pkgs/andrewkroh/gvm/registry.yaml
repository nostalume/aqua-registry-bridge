# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: andrewkroh
    repo_name: gvm
    description: Go Version Manager (written in Go for cross-platform usability)
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.3.1-rc1"
        type: http
        url: https://gh-proxy.org/github.com/andrewkroh/gvm/releases/download/{{.Version}}/gvm-{{.OS}}-{{.Arch}}
        asset: gvm-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
      - version_constraint: Version == "v0.3.1"
        type: http
        url: https://gh-proxy.org/github.com/andrewkroh/gvm/releases/download/{{.Version}}/gvm-{{.OS}}-{{.Arch}}
        asset: gvm-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 0.0.3")
        type: http
        url: https://gh-proxy.org/github.com/andrewkroh/gvm/releases/download/{{.Version}}/gvm-{{.OS}}-{{.Arch}}
        asset: gvm-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.3.0")
        type: http
        url: https://gh-proxy.org/github.com/andrewkroh/gvm/releases/download/{{.Version}}/gvm-{{.OS}}-{{.Arch}}
        asset: gvm-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/andrewkroh/gvm/releases/download/{{.Version}}/gvm-{{.OS}}-{{.Arch}}
        asset: gvm-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/andrewkroh/gvm/releases/download/{{.Version}}/gvm-{{.OS}}-{{.Arch}}
        asset: gvm-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/andrewkroh/gvm/releases/download/{{.Version}}/gvm_{{trimV .Version}}_SHA256SUMS
          asset: gvm_{{trimV .Version}}_SHA256SUMS
          algorithm: sha256
