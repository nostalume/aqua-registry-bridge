# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/antonmedv/fx/releases/download/{{.Version}}/fx_{{.OS}}_{{.Arch}}
    repo_owner: antonmedv
    repo_name: fx
    description: Command-line tool and terminal JSON viewer
    version_constraint: semver(">= 21.0.0")
    asset: fx_{{.OS}}_{{.Arch}}
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/antonmedv/fx/releases/download/{{.Version}}/fx-{{.OS}}.zip
        asset: fx-{{.OS}}.zip
        replacements:
          darwin: macos
          windows: win.exe
        files:
          - name: fx
            src: fx-{{.OS}}
