# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ViRb3
    repo_name: wgcf
    description: Cross-platform, unofficial CLI for Cloudflare Warp
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v2.2.6"
        type: http
        url: https://gh-proxy.org/github.com/ViRb3/wgcf/releases/download/{{.Version}}/wgcf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: wgcf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ViRb3/wgcf/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 2.2.2")
        type: http
        url: https://gh-proxy.org/github.com/ViRb3/wgcf/releases/download/{{.Version}}/wgcf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: wgcf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ViRb3/wgcf/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 2.2.5")
        type: http
        url: https://gh-proxy.org/github.com/ViRb3/wgcf/releases/download/{{.Version}}/wgcf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: wgcf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ViRb3/wgcf/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ViRb3/wgcf/releases/download/{{.Version}}/wgcf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: wgcf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ViRb3/wgcf/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
