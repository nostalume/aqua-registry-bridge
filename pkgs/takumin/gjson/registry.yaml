# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: takumin
    repo_name: gjson
    description: Golang JSON Tool
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.1"
        type: http
        url: https://gh-proxy.org/github.com/takumin/gjson/releases/download/{{.Version}}/gjson_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gjson_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/takumin/gjson/releases/download/{{.Version}}/gjson_sha256sums.txt
          asset: gjson_sha256sums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/takumin/gjson/releases/download/{{.Version}}/gjson_{{.OS}}_all.{{.Format}}
            asset: gjson_{{.OS}}_all.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/takumin/gjson/releases/download/{{.Version}}/gjson_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/takumin/gjson/releases/download/{{.Version}}/gjson_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gjson_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/takumin/gjson/releases/download/{{.Version}}/gjson_sha256sums.txt
          asset: gjson_sha256sums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/takumin/gjson/releases/download/{{.Version}}/gjson_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
