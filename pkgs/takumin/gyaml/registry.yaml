# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: takumin
    repo_name: gyaml
    description: Golang YAML Tool
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/takumin/gyaml/releases/download/{{.Version}}/gyaml_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gyaml_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/takumin/gyaml/releases/download/{{.Version}}/gyaml_sha256sums.txt
          asset: gyaml_sha256sums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/takumin/gyaml/releases/download/{{.Version}}/gyaml_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
