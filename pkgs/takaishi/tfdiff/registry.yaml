# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: takaishi
    repo_name: tfdiff
    description: A CLI that shows attribute-level diffs between Terraform modules with clean, diff-like output
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/takaishi/tfdiff/releases/download/{{.Version}}/tfdiff_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: tfdiff_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/takaishi/tfdiff/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
