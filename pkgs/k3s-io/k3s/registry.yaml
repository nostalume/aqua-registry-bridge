# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: k3s-io
    repo_name: k3s
    description: Lightweight Kubernetes
    version_filter: not (Version matches "-rc")
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/k3s-io/k3s/releases/download/{{.Version}}/k3s-{{.Arch}}
        asset: k3s-{{.Arch}}
        format: raw
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/k3s-io/k3s/releases/download/{{.Version}}/k3s
            goarch: amd64
            asset: k3s
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/k3s-io/k3s/releases/download/{{.Version}}/sha256sum-{{.Arch}}.txt
          asset: sha256sum-{{.Arch}}.txt
          algorithm: sha256
        supported_envs:
          - linux
