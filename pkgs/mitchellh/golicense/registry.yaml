# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/mitchellh/golicense/releases/download/{{.Version}}/golicense_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: mitchellh
    repo_name: golicense
    description: Scan and analyze OSS dependencies and licenses from compiled Go binaries
    asset: golicense_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x86_64
      darwin: macos
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/mitchellh/golicense/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
