# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: opencontainers
    repo_name: umoci
    description: umoci modifies Open Container images
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.1")
        type: http
        url: https://gh-proxy.org/github.com/opencontainers/umoci/releases/download/{{.Version}}/umoci.amd64
        asset: umoci.amd64
        format: raw
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 0.4.7")
        type: http
        url: https://gh-proxy.org/github.com/opencontainers/umoci/releases/download/{{.Version}}/umoci.amd64
        asset: umoci.amd64
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/opencontainers/umoci/releases/download/{{.Version}}/umoci.sha256sum
          asset: umoci.sha256sum
          algorithm: sha256
        supported_envs:
          - linux/amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/opencontainers/umoci/releases/download/{{.Version}}/umoci.{{.OS}}.{{.Arch}}
        asset: umoci.{{.OS}}.{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/opencontainers/umoci/releases/download/{{.Version}}/umoci.sha256sum
          asset: umoci.sha256sum
          algorithm: sha256
        supported_envs:
          - linux
