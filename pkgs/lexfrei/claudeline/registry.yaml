# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: lexfrei
    repo_name: claudeline
    description: Claude Code statusline with real usage limits from Anthropic API
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/lexfrei/claudeline/releases/download/{{.Version}}/claudeline_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: claudeline_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/lexfrei/claudeline/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
