# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: specstoryai
    repo_name: getspecstory
    description: Install our local first extensions for your favorite AI IDE or Terminal Agent. Process your histories into reusable skills with Lore. Sync your conversations to the cloud. File issues and requests
    files:
      - name: specstory
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 2.8.0")
        type: http
        url: https://gh-proxy.org/github.com/specstoryai/getspecstory/releases/download/{{.Version}}/SpecStoryCLI_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: SpecStoryCLI_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/specstoryai/getspecstory/releases/download/{{.Version}}/SpecStoryCLI_{{trimV .Version}}_checksums.txt
          asset: SpecStoryCLI_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/specstoryai/getspecstory/releases/download/{{.Version}}/SpecStoryCLI_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: SpecStoryCLI_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/specstoryai/getspecstory/releases/download/{{.Version}}/SpecStoryCLI_{{trimV .Version}}_checksums.txt
          asset: SpecStoryCLI_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/specstoryai/getspecstory/releases/download/{{.Version}}/SpecStoryCLI_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
