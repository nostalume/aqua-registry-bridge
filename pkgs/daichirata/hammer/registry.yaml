# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: daichirata
    repo_name: hammer
    description: hammer is a command-line tool to schema management for Google Cloud Spanner
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.4.0")
        type: http
        url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/hammer_{{trimV .Version}}_{{.Arch}}_{{.OS}}
        asset: hammer_{{trimV .Version}}_{{.Arch}}_{{.OS}}
        format: raw
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.5.4")
        type: http
        url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        files:
          - name: hammer
            src: hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}/hammer
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.5.9")
        type: http
        url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        files:
          - name: hammer
            src: hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}/hammer
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        files:
          - name: hammer
            src: hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}/hammer
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/daichirata/hammer/releases/download/{{.Version}}/hammer-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
