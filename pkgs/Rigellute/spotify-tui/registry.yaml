# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Rigellute/spotify-tui/releases/download/{{.Version}}/spotify-tui-{{.OS}}.tar.gz
    repo_owner: Rigellute
    repo_name: spotify-tui
    asset: spotify-tui-{{.OS}}.tar.gz
    description: Spotify for the terminal written in Rust
    replacements:
      darwin: macos
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    files:
      - name: spt
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/Rigellute/spotify-tui/releases/download/{{.Version}}/spotify-tui-{{.OS}}.sha256
      asset: spotify-tui-{{.OS}}.sha256
      algorithm: sha256
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/Rigellute/spotify-tui/releases/download/{{.Version}}/spotify-tui-{{.OS}}.tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Rigellute/spotify-tui/releases/download/{{.Version}}/spotify-tui-{{.OS}}.sha256
          asset: spotify-tui-{{.OS}}.sha256
          algorithm: sha256
