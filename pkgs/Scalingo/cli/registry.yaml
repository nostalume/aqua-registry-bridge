# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: Scalingo
    repo_name: cli
    description: Command Line client for Scalingo PaaS
    asset: scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: scalingo
        src: scalingo_{{.Version}}_{{.OS}}_{{.Arch}}/scalingo
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/checksums_windows.txt
          asset: checksums_windows.txt
          algorithm: sha256
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 1.26.0")
    version_overrides:
      - version_constraint: semver(">= 1.24.1")
        type: http
        url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver(">= 1.24.0")
        type: http
        url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        overrides: []
      - version_constraint: semver(">= 1.21.0")
        type: http
        url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        checksum:
          enabled: false
      - version_constraint: semver(">= 1.20.1")
        type: http
        url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - darwin
          - linux
          - amd64
        checksum:
          enabled: false
      - version_constraint: semver("< 1.20.1")
        type: http
        url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Scalingo/cli/releases/download/{{.Version}}/scalingo_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            files:
              - name: scalingo
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
        checksum:
          enabled: false
