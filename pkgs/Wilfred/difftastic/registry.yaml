        url: https://gh-proxy.org/github.com/Wilfred/difftastic/releases/download/{{.Version}}/difft-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: difft-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: difft
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Wilfred/difftastic/releases/download/{{.Version}}/difft-{{.Arch}}-{{.OS}}.{{.Format}}
