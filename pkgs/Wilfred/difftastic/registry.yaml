# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Wilfred
    repo_name: difftastic
    description: a structural diff that understands syntax
    files:
      - name: difft
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "0.51.0"
        no_asset: true
      - version_constraint: Version == "0.36.0"
        type: http
        url: https://gh-proxy.org/github.com/Wilfred/difftastic/releases/download/{{.Version}}/difft-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: difft-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: difft
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "0.51.1"
