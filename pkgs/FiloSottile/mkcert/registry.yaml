# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: FiloSottile
    repo_name: mkcert
    description: A simple zero-config tool to make locally trusted development certificates with any names you'd like
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.1")
        type: http
        url: https://gh-proxy.org/github.com/FiloSottile/mkcert/releases/download/{{.Version}}/mkcert-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: mkcert-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.4.1")
        type: http
        url: https://gh-proxy.org/github.com/FiloSottile/mkcert/releases/download/{{.Version}}/mkcert-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: mkcert-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.4.3")
        type: http
        url: https://gh-proxy.org/github.com/FiloSottile/mkcert/releases/download/{{.Version}}/mkcert-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: mkcert-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/FiloSottile/mkcert/releases/download/{{.Version}}/mkcert-{{.Version}}-{{.OS}}-{{.Arch}}
        asset: mkcert-{{.Version}}-{{.OS}}-{{.Arch}}
        format: raw
