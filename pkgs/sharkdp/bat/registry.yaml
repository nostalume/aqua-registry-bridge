# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sharkdp
    repo_name: bat
    description: A cat(1) clone with wings
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.2")
        type: http
        url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: bat
            src: "{{.AssetWithoutExt}}/bat"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        supported_envs:
          - darwin
          - linux/amd64
      - version_constraint: semver("<= 0.6.0")
        type: http
        url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: bat
            src: "{{.AssetWithoutExt}}/bat"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
        supported_envs:
          - darwin
          - linux/amd64
      - version_constraint: Version == "v0.6.1"
        type: http
        url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: bat
            src: "{{.AssetWithoutExt}}/bat"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
            files:
              - name: bat
        supported_envs:
          - darwin
          - windows
          - linux/amd64
      - version_constraint: semver("<= 0.24.0")
        type: http
        url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: bat
            src: "{{.AssetWithoutExt}}/bat"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              arm64: aarch64
              linux: unknown-linux-gnu
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: bat
            src: "{{.AssetWithoutExt}}/bat"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sharkdp/bat/releases/download/{{.Version}}/bat-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
