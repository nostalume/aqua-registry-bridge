# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kreuzwerker
    repo_name: awsu
    description: Enhanced account switching for AWS, supports Yubikey as MFA source
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v2.3.10"
        type: http
        url: https://gh-proxy.org/github.com/kreuzwerker/awsu/releases/download/{{.Version}}/awsu_{{trimV .Version}}_{{.OS}}_arm.{{.Format}}
        asset: awsu_{{trimV .Version}}_{{.OS}}_arm.{{.Format}}
        format: tar.gz
        replacements:
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kreuzwerker/awsu/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 2.3.2")
        type: http
        url: https://gh-proxy.org/github.com/kreuzwerker/awsu/releases/download/{{.Version}}/awsu-{{.OS}}-{{.Arch}}
        asset: awsu-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 2.3.9")
        type: http
        url: https://gh-proxy.org/github.com/kreuzwerker/awsu/releases/download/{{.Version}}/awsu_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awsu_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kreuzwerker/awsu/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kreuzwerker/awsu/releases/download/{{.Version}}/awsu_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: awsu_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kreuzwerker/awsu/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
