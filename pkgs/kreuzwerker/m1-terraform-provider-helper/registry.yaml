# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/kreuzwerker/m1-terraform-provider-helper/releases/download/{{.Version}}/m1-terraform-provider-helper_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: kreuzwerker
    repo_name: m1-terraform-provider-helper
    description: CLI to support with downloading and compiling terraform providers for Mac with M1 chip
    supported_envs:
      - darwin
      - linux
    asset: m1-terraform-provider-helper_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    replacements:
      darwin: Darwin
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/kreuzwerker/m1-terraform-provider-helper/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
