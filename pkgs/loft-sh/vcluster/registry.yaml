# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: loft-sh
    repo_name: vcluster
    description: "vCluster - Create fully functional virtual Kubernetes clusters - Each vcluster runs inside a namespace of the underlying k8s cluster. It's cheaper than creating separate full-blown clusters and it offers better multi-tenancy and isolation than regular namespaces"
    version_filter: not (Version matches "-(alpha|beta|rc)")
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.15.2")
        type: http
        url: https://gh-proxy.org/github.com/loft-sh/vcluster/releases/download/{{.Version}}/vcluster-{{.OS}}-{{.Arch}}
        asset: vcluster-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/loft-sh/vcluster/releases/download/{{.Version}}/vcluster-{{.OS}}-{{.Arch}}
        asset: vcluster-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/loft-sh/vcluster/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/loft-sh/vcluster/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - https://gh-proxy.org/github.com/loft-sh/vcluster/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/loft-sh/vcluster/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - loft-sh/vcluster
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
