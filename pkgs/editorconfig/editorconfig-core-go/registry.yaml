# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: editorconfig
    repo_name: editorconfig-core-go
    description: EditorConfig Core written in Go
    files:
      - name: editorconfig
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 2.3.2")
        no_asset: true
      - version_constraint: semver("<= 2.3.9")
        type: http
        url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - linux/amd64
      - version_constraint: Version == "v2.3.10"
        type: http
        url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 2.4.2")
        type: http
        url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig/editorconfig-core-go/releases/download/{{.Version}}/editorconfig-core-go_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
