# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/megaease/easeprobe/releases/download/{{.Version}}/easeprobe-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    repo_owner: megaease
    repo_name: easeprobe
    description: A simple, standalone, and lightWeight tool that can do health/status checking, written in Go
    asset: easeprobe-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    files:
      - name: easeprobe
        src: bin/easeprobe
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/megaease/easeprobe/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
