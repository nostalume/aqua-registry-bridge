# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: adhocteam
    repo_name: ssm
    description: AWS SSM Parameter Store CLI
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.3.0"
        no_asset: true
      - version_constraint: semver("<= 1.1.0")
        type: http
        url: https://gh-proxy.org/github.com/adhocteam/ssm/releases/download/{{.Version}}/ssm-{{.OS}}-{{.Arch}}
        asset: ssm-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha"
          asset: "{{.Asset}}.sha"
          algorithm: sha256
      - version_constraint: semver("<= 1.4.2")
        type: http
        url: https://gh-proxy.org/github.com/adhocteam/ssm/releases/download/{{.Version}}/ssm-{{.OS}}-{{.Arch}}
        asset: ssm-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
        # linux/amd64 doesn't match hash
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/adhocteam/ssm/releases/download/{{.Version}}/ssm-{{.OS}}-{{.Arch}}
            goarch: amd64
            checksum:
              enabled: false
        checksum:
          type: http
          url: "{{.AssetURL}}.sha"
          asset: "{{.Asset}}.sha"
          algorithm: sha256
      - version_constraint: semver("<= 1.5.1")
        type: http
        url: https://gh-proxy.org/github.com/adhocteam/ssm/releases/download/{{.Version}}/ssm-{{.OS}}-{{.Arch}}
        asset: ssm-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
          - darwin
        # darwin/arm64 doesn't match hash
        # https://github.com/adhocteam/ssm/pull/41
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/adhocteam/ssm/releases/download/{{.Version}}/ssm-{{.OS}}-{{.Arch}}
            goarch: arm64
            checksum:
              enabled: false
        checksum:
          type: http
          url: "{{.AssetURL}}.sha"
          asset: "{{.Asset}}.sha"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/adhocteam/ssm/releases/download/{{.Version}}/ssm-{{.OS}}-{{.Arch}}
        # https://github.com/adhocteam/ssm/pull/41
        asset: ssm-{{.OS}}-{{.Arch}}
        format: raw
        supported_envs:
          - linux/amd64
          - darwin
        checksum:
          type: http
          url: "{{.AssetURL}}.sha"
          asset: "{{.Asset}}.sha"
          algorithm: sha256
