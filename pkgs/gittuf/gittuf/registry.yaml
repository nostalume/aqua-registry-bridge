# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gittuf
    repo_name: gittuf
    description: A security layer for Git repositories
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.12.0")
        type: http
        url: https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/gittuf_{{trimV .Version}}_checksums.txt
          asset: gittuf_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
            cosign:
              opts:
                - --certificate-identity-regexp
                - "https://github\\.com/gittuf/gittuf/\\.github/workflows/release\\.ya?ml@.*"
                - --certificate-oidc-issuer
                - "https://token.actions.githubusercontent.com"
                - --signature
                - https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.exe.sig
                - --certificate
                - https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.exe.pem
        cosign:
          opts:
            - --certificate-identity-regexp
            - "https://github\\.com/gittuf/gittuf/\\.github/workflows/release\\.ya?ml@.*"
            - --certificate-oidc-issuer
            - "https://token.actions.githubusercontent.com"
            - --signature
            - https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.sig
            - --certificate
            - https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.pem
      - version_constraint: Version == "v0.13.0"
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: gittuf_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/gittuf/gittuf/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-identity
              - "https://gh-proxy.org/github.com/gittuf/gittuf/.github/workflows/release.yml@refs/tags/{{.Version}}"
        github_artifact_attestations:
          signer_workflow: gittuf/gittuf/.github/workflows/release.yml
