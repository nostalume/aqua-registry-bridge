# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/dtan4/k8stail/releases/download/{{.Version}}/k8stail_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: dtan4
    repo_name: k8stail
    asset: k8stail_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: tail -f experience for Kubernetes Pods
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/dtan4/k8stail/releases/download/{{.Version}}/k8stail_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/dtan4/k8stail/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
