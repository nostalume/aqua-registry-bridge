# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: dtan4
    repo_name: k8sec
    description: CLI tool to manage Kubernetes Secrets easily
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.8.0"
        type: http
        url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.5.1")
        type: http
        url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/k8sec-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: k8sec-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: k8sec
            src: "{{.OS}}-{{.Arch}}/k8sec"
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.7.0")
        type: http
        url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dtan4/k8sec/releases/download/{{.Version}}/k8sec_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
