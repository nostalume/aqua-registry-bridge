# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: thomasschafer
    repo_name: scooter
    description: Interactive find and replace in the terminal
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.1"
        no_asset: true
      - version_constraint: semver("<= 0.2.2")
        type: http
        url: https://gh-proxy.org/github.com/thomasschafer/scooter/releases/download/{{.Version}}/scooter-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: scooter-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: scooter
            src: scooter-{{.Arch}}-{{.OS}}
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha512"
          asset: "{{.Asset}}.sha512"
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/thomasschafer/scooter/releases/download/{{.Version}}/scooter-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/thomasschafer/scooter/releases/download/{{.Version}}/scooter-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: scooter-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        checksum:
          type: http
          url: "{{.AssetURL}}.sha512"
          asset: "{{.Asset}}.sha512"
          algorithm: sha512
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/thomasschafer/scooter/releases/download/{{.Version}}/scooter-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
