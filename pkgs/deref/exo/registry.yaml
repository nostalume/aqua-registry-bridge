# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/deref/exo/releases/download/{{.Version}}/exo_standalone_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: deref
    repo_name: exo
    description: A process manager & log viewer for dev
    asset: exo_standalone_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz
    supported_envs:
      - darwin
      - linux
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/deref/exo/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
