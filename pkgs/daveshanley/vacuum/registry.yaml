# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: daveshanley
    repo_name: vacuum
    description: vacuum is the worlds fastest OpenAPI 3, OpenAPI 2 / Swagger linter and quality analysis tool. Built in go, it tears through API specs faster than you can think. vacuum is compatible with Spectral rulesets and generates compatible reports
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.9.0"
        no_asset: true
      - version_constraint: Version == "v0.2.1"
        type: http
        url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/vacuum_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: vacuum_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.0.13")
        type: http
        url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/vacuum_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: vacuum_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.29.9")
        type: http
        url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/vacuum_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: vacuum_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/vacuum_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: vacuum_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/daveshanley/vacuum/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/daveshanley/vacuum/.github/workflows/publish.yaml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - daveshanley/vacuum
