# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: masasuzu
    repo_name: clrnd
    description: a command-line tool for deploying services to Google Cloud Run
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        no_asset: true
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/masasuzu/clrnd/releases/download/{{.Version}}/clrnd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: clrnd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/masasuzu/clrnd/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/masasuzu/clrnd/releases/download/{{.Version}}/clrnd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/masasuzu/clrnd/releases/download/{{.Version}}/clrnd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: clrnd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/masasuzu/clrnd/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/masasuzu/clrnd/releases/download/{{.Version}}/checksums.txt.bundle
              asset: checksums.txt.bundle
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/masasuzu/clrnd/.github/workflows/release.yml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - masasuzu/clrnd
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/masasuzu/clrnd/releases/download/{{.Version}}/clrnd_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
