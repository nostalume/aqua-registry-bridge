# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/po3rin/github_link_creator/releases/download/{{.Version}}/github_link_creator_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: po3rin
    repo_name: github_link_creator
    asset: github_link_creator_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: GitHub Link Card Creator lets you generate GitHub images has links to repositories
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    files:
      - name: repoimg
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/po3rin/github_link_creator/releases/download/{{.Version}}/github_link_creator_{{trimV .Version}}_checksums.txt
      asset: github_link_creator_{{trimV .Version}}_checksums.txt
      algorithm: sha256
