# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: gitleaks
    repo_name: gitleaks
    aliases:
      - name: zricethezav/gitleaks
    description: Find secrets with Gitleaks
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.0") || Version == "v1.2.1"
        no_asset: true
      - version_constraint: Version == "v0.4.0"
        type: http
        url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks-{{.OS}}-{{.Arch}}
        asset: gitleaks-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 7.6.1")
        type: http
        url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks-{{.OS}}-{{.Arch}}
        asset: gitleaks-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 8.1.2")
        type: http
        url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_checksums.txt
          asset: gitleaks_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 8.2.7")
        type: http
        url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_checksums.txt
          asset: gitleaks_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 8.17.0")
        type: http
        url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_checksums.txt
          asset: gitleaks_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_checksums.txt
          asset: gitleaks_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/gitleaks/gitleaks/releases/download/{{.Version}}/gitleaks_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
