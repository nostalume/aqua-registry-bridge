# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/pan-net-security/kcount/releases/download/{{.Version}}/kcount_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: pan-net-security
    repo_name: kcount
    asset: kcount_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: Count Kubernetes objects across namespaces and clusters
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/pan-net-security/kcount/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
