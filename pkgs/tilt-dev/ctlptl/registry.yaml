# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tilt-dev
    repo_name: ctlptl
    description: Making local Kubernetes clusters fun and easy to set up
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/tilt-dev/ctlptl/releases/download/{{.Version}}/ctlptl.{{trimV .Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
        asset: ctlptl.{{trimV .Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: mac
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tilt-dev/ctlptl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tilt-dev/ctlptl/releases/download/{{.Version}}/ctlptl.{{trimV .Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/tilt-dev/ctlptl/releases/download/{{.Version}}/ctlptl.{{trimV .Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
        asset: ctlptl.{{trimV .Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: mac
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/tilt-dev/ctlptl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tilt-dev/ctlptl/releases/download/{{.Version}}/ctlptl.{{trimV .Version}}.{{.OS}}.{{.Arch}}.{{.Format}}
            format: zip
