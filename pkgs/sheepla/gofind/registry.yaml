# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sheepla
    repo_name: gofind
    description: A command line pkg.go.dev searcher and `go get` helper
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.1"
        type: http
        url: https://gh-proxy.org/github.com/sheepla/gofind/releases/download/{{.Version}}/gofind_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gofind_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sheepla/gofind/releases/download/{{.Version}}/gofind_{{trimV .Version}}_checksums.txt
          asset: gofind_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sheepla/gofind/releases/download/{{.Version}}/gofind_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gofind_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sheepla/gofind/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sheepla/gofind/releases/download/{{.Version}}/gofind_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
