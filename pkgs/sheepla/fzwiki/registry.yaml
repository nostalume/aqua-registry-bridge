# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sheepla
    repo_name: fzwiki
    description: A command line tool with fzf-like UI to search Wikipedia articles and open it in your browser quickly
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.0.1"
        no_asset: true
      - version_constraint: semver("<= 0.0.2")
        type: http
        url: https://gh-proxy.org/github.com/sheepla/fzwiki/releases/download/{{.Version}}/fzwiki_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: fzwiki_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sheepla/fzwiki/releases/download/{{.Version}}/fzwiki_{{trimV .Version}}_checksums.txt
          asset: fzwiki_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.0.9")
        type: http
        url: https://gh-proxy.org/github.com/sheepla/fzwiki/releases/download/{{.Version}}/fzwiki_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: fzwiki_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sheepla/fzwiki/releases/download/{{.Version}}/fzwiki_{{trimV .Version}}_checksums.txt
          asset: fzwiki_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sheepla/fzwiki/releases/download/{{.Version}}/fzwiki_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: fzwiki_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sheepla/fzwiki/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sheepla/fzwiki/releases/download/{{.Version}}/fzwiki_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
