# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: docker
    repo_name: compose
    description: Define and run multi-container applications with Docker
    files:
      - name: docker-cli-plugin-docker-compose
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.2")
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/{{.OS}}
        asset: "{{.OS}}"
        format: raw
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.0.1")
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/fig-{{.OS}}-{{.Arch}}
        asset: fig-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.4.2")
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 1.17.1")
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.29.2")
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        supported_envs:
          - darwin
          - windows
          - amd64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: Version == "v2.0.0-rc.3"
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
      - version_constraint: Version == "v2.0.0"
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: semver("<= 2.9.0")
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: Version == "v2.10.0"
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 5.0.2")
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}
        asset: docker-compose-{{.OS}}-{{.Arch}}
        format: raw
        replacements:
          amd64: x86_64
          arm64: aarch64
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/docker/compose/releases/download/{{.Version}}/docker-compose-{{.OS}}-{{.Arch}}.sigstore.json
            asset: "docker-compose-{{.OS}}-{{.Arch}}.sigstore.json"
          opts:
            - --certificate-identity-regexp
            - "^https://github\\.com/docker/github-builder/\\.github/workflows/bake\\.yml@"
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --certificate-github-workflow-repository
            - docker/compose
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
