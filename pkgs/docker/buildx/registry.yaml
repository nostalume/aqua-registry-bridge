# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: docker
    repo_name: buildx
    description: Docker CLI plugin for extended build capabilities with BuildKit
    files:
      - name: docker-cli-plugin-docker-buildx
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.0-rc1")
        type: http
        url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
      - version_constraint: semver("<= 0.5.1")
        type: http
        url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
      - version_constraint: semver("<= 0.6.3")
        type: http
        url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
      - version_constraint: semver("<= 0.10.0-rc1")
        type: http
        url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
            checksum:
              enabled: false # https://github.com/docker/buildx/issues/945
      - version_constraint: semver("< 0.31.0")
        type: http
        url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
            checksum:
              enabled: false # https://github.com/docker/buildx/issues/945
      - version_constraint: semver("< 0.36.0-rc2")
        type: http
        url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}.sigstore.json
            asset: "buildx-{{.Version}}.{{.OS}}-{{.Arch}}.sigstore.json"
          opts:
            - --certificate-identity-regexp
            - "^https://github\\.com/docker/github-builder/\\.github/workflows/bake\\.yml@.+$"
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --certificate-github-workflow-repository
            - docker/buildx
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
            checksum:
              enabled: false # https://github.com/docker/buildx/issues/945
            cosign:
              enabled: false
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        cosign:
          bundle:
            type: http
            url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}.sigstore.json
            asset: "buildx-{{.Version}}.{{.OS}}-{{.Arch}}.sigstore.json"
          opts:
            - --certificate-identity-regexp
            - "^https://github\\.com/docker/github-builder/\\.github/workflows/bake\\.yml@.+$"
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --certificate-github-workflow-repository
            - docker/buildx
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
            checksum:
              enabled: false # https://github.com/docker/buildx/issues/945
            cosign:
              enabled: false
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/docker/buildx/releases/download/{{.Version}}/buildx-{{.Version}}.{{.OS}}-{{.Arch}}
            cosign:
              enabled: false # binaries are code-signed instead from v0.36.0
