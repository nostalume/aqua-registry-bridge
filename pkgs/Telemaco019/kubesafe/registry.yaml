# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Telemaco019
    repo_name: kubesafe
    description: Safely manage multiple Kubernetes clusters by defining safe contexts and protected commands
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Telemaco019/kubesafe/releases/download/{{.Version}}/kubesafe_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubesafe_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Telemaco019/kubesafe/releases/download/{{.Version}}/kubesafe_{{trimV .Version}}_checksums.txt
          asset: kubesafe_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Telemaco019/kubesafe/releases/download/{{.Version}}/kubesafe_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
