# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/GoodwayGroup/gwvault/releases/download/{{.Version}}/gwvault_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: GoodwayGroup
    repo_name: gwvault
    description: ansible-vault CLI reimplemented in go
    supported_envs:
      - darwin
      - linux
      - amd64
    asset: gwvault_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    files:
      - name: gwvault
        src: gwvault_{{trimV .Version}}_{{.OS}}_{{.Arch}}/gwvault
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/GoodwayGroup/gwvault/releases/download/{{.Version}}/gwvault_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/GoodwayGroup/gwvault/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
