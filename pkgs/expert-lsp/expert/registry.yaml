# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: expert-lsp
    repo_name: expert
    aliases:
      - name: elixir-lang/expert
    description: Official Elixir Language Server Protocol implementation
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/expert-lsp/expert/releases/download/{{.Version}}/expert_{{.OS}}_{{.Arch}}
        asset: expert_{{.OS}}_{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/expert-lsp/expert/releases/download/{{.Version}}/expert_checksums.txt
          asset: expert_checksums.txt
          algorithm: sha256
