# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: vmware/govmomi/govc
    type: github_release
    repo_owner: vmware
    repo_name: govmomi
    description: a vSphere CLI built on top of govmomi
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: govc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: govc
            src: govc_{{.OS}}_{{.Arch}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.exe.{{.Format}}
            asset: govc_{{.OS}}_{{.Arch}}.exe.{{.Format}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.18.0"
        type: http
        url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: govc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: govc
            src: govc_{{.OS}}_{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{trimV .Version}}_checksums.txt
          asset: govc_{{trimV .Version}}_checksums.txt
          algorithm: sha1
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.exe.{{.Format}}
            format: zip
            asset: govc_{{.OS}}_{{.Arch}}.exe.{{.Format}}
            files:
              - name: govc
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.24.0")
        type: http
        url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: govc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: govc
            src: govc_{{.OS}}_{{.Arch}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.exe.{{.Format}}
            format: zip
            asset: govc_{{.OS}}_{{.Arch}}.exe.{{.Format}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.25.0"
        type: http
        url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: govc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.27.4")
        type: http
        url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: govc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: govc_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/vmware/govmomi/releases/download/{{.Version}}/govc_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
