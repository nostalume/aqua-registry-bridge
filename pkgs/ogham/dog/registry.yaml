# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/ogham/dog/releases/download/{{.Version}}/dog-{{.Version}}-{{.Arch}}-{{.OS}}.zip
    repo_owner: ogham
    repo_name: dog
    description: A command-line DNS client
    rosetta2: true
    supported_envs:
      - darwin
      - amd64
    asset: dog-{{.Version}}-{{.Arch}}-{{.OS}}.zip
    replacements:
      amd64: x86_64
      windows: pc-windows-msvc
      darwin: apple-darwin
      linux: unknown-linux-gnu
    files:
      - name: dog
        src: bin/dog
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/ogham/dog/releases/download/{{.Version}}/SHA256SUMS
      asset: SHA256SUMS
      algorithm: sha256
