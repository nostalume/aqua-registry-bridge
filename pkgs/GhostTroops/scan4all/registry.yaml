# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: GhostTroops
    repo_name: scan4all
    aliases:
      - name: hktalent/scan4all
    description: "Official repository vuls Scan: 15000+PoCs; 23 kinds of application password crack; 7000+Web fingerprints; 146 protocols and 90000+ rules Port scanning; Fuzz, HW, awesome BugBounty"
    asset: scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: zip
    supported_envs:
      - darwin
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all-{{.OS}}-checksums.txt
      asset: scan4all-{{.OS}}-checksums.txt
      algorithm: sha256
    overrides:
      - goos: darwin
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all-mac-checksums.txt
          asset: scan4all-mac-checksums.txt
          algorithm: sha256
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver(">= 2.9.0")
        type: http
        url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        rosetta2: true
        supported_envs:
          - darwin
          - amd64
      - version_constraint: semver(">= 2.8.8")
        type: http
        url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: semver(">= 2.8.7")
        type: http
        url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - darwin
          - amd64
      - version_constraint: semver(">= 2.8.6")
        type: http
        url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver(">= 2.6.9")
        type: http
        url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        replacements:
          darwin: macOS
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            goarch: amd64
            checksum:
              type: http
              url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all-mac-checksums.txt
              asset: scan4all-mac-checksums.txt
              algorithm: sha256
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            goarch: arm64
            checksum:
              type: http
              url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all-mac-arm64-checksums.txt
              asset: scan4all-mac-arm64-checksums.txt
              algorithm: sha256
      - version_constraint: semver("< 2.6.9")
        type: http
        url: https://gh-proxy.org/github.com/GhostTroops/scan4all/releases/download/{{.Version}}/scan4all_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        replacements:
          darwin: macOS
        rosetta2: true
