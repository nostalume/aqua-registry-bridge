# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/DelineaXPM/dsv-cli/releases/download/{{.Version}}/dsv-{{.OS}}-{{.Arch}}
    repo_owner: DelineaXPM
    repo_name: dsv-cli
    aliases:
      - name: thycotic/dsv-cli
    link: https://docs.delinea.com/dsv/current/cli-ref
    description: Delinea DevOps Secrets Vault is a secret vault automation tool for the management of credentials for applications, databases, CI/CD tools, and services
    search_words:
      - secrets
      - vault
    files:
      - name: dsv
    supported_envs:
      - darwin
      - amd64
    asset: dsv-{{.OS}}-{{.Arch}}
    format: raw
    replacements:
      amd64: x64
      windows: win
    version_constraint: semver(">= 1.39.9")
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/DelineaXPM/dsv-cli/releases/download/{{.Version}}/checksums-sha256.txt
      asset: checksums-sha256.txt
      algorithm: sha256
    version_overrides:
      - version_constraint: semver(">= 1.39.5")
        type: http
        url: https://gh-proxy.org/github.com/DelineaXPM/dsv-cli/releases/download/{{.Version}}/dsv-{{.OS}}-{{.Arch}}
        checksum:
          enabled: false
      - version_constraint: semver(">= 1.39.1")
        type: http
        url: https://gh-proxy.org/github.com/DelineaXPM/dsv-cli/releases/download/{{.Version}}/dsv-{{.OS}}-{{.Arch}}
        checksum:
          enabled: false
        replacements:
          windows: win
      - version_constraint: semver(">= 1.33.0")
        type: http
        url: https://gh-proxy.org/github.com/DelineaXPM/dsv-cli/releases/download/{{.Version}}/dsv-{{.OS}}-{{.Arch}}
        checksum:
          enabled: false
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/DelineaXPM/dsv-cli/releases/download/{{.Version}}/dsv-{{.OS}}-{{.Arch}}
        rosetta2: true
        checksum:
          enabled: false
