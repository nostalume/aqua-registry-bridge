# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: domcyrus
    repo_name: rustnet
    description: Per-process network monitoring for your terminal with deep packet inspection. Cross-platform, sandboxed
    files:
      - name: rustnet
        src: "{{.AssetWithoutExt}}/rustnet"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.10.0")
        no_asset: true
      - version_constraint: semver("<= 0.17.0")
        type: http
        url: https://gh-proxy.org/github.com/domcyrus/rustnet/releases/download/{{.Version}}/rustnet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rustnet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/domcyrus/rustnet/releases/download/{{.Version}}/rustnet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/domcyrus/rustnet/releases/download/{{.Version}}/rustnet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: rustnet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/domcyrus/rustnet/releases/download/{{.Version}}/rustnet-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
