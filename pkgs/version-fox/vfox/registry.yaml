# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: version-fox
    repo_name: vfox
    description: A cross-platform and extendable version manager with support for Java, Node.js, Golang, Python, Flutter, .NET & more
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.2.5"
        no_asset: true
      - version_constraint: semver("<= 1.0.8")
        type: http
        url: https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/vfox_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: vfox_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: vfox
            src: "{{.AssetWithoutExt}}/vfox"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity-regexp
              - "^https://github\\.com/version-fox/vfox/\\.github/workflows/.+\\.ya?ml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/checksums.txt.sig
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/vfox_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/vfox_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: vfox_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: vfox
            src: "{{.AssetWithoutExt}}/vfox"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity-regexp
              - "^https://github\\.com/version-fox/vfox/\\.github/workflows/.+\\.ya?ml@refs/tags/\\Q{{.Version}}\\E$"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/version-fox/vfox/releases/download/{{.Version}}/vfox_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
