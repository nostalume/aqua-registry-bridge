# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sibprogrammer
    repo_name: xq
    description: Command-line XML and HTML beautifier and content extractor
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.2.0"
        type: http
        url: https://gh-proxy.org/github.com/sibprogrammer/xq/releases/download/{{.Version}}/xq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: xq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sibprogrammer/xq/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 1.1.4")
        type: http
        url: https://gh-proxy.org/github.com/sibprogrammer/xq/releases/download/{{.Version}}/xq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: xq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sibprogrammer/xq/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sibprogrammer/xq/releases/download/{{.Version}}/xq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: xq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sibprogrammer/xq/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sibprogrammer/xq/releases/download/{{.Version}}/xq_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
