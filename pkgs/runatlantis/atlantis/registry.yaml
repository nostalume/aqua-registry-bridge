# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: runatlantis
    repo_name: atlantis
    description: Terraform Pull Request Automation
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.28.2"
        no_asset: true
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/runatlantis/atlantis/releases/download/{{.Version}}/atlantis_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: atlantis_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.15.1")
        type: http
        url: https://gh-proxy.org/github.com/runatlantis/atlantis/releases/download/{{.Version}}/atlantis_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: atlantis_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.17.3")
        type: http
        url: https://gh-proxy.org/github.com/runatlantis/atlantis/releases/download/{{.Version}}/atlantis_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: atlantis_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/runatlantis/atlantis/releases/download/{{.Version}}/atlantis_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: atlantis_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/runatlantis/atlantis/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
