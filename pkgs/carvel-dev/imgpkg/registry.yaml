# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: carvel-dev
    repo_name: imgpkg
    aliases:
      - name: vmware-tanzu/carvel-imgpkg
    description: Store application configuration files in Docker/OCI registries
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.17.0"
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.27.1"
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.27.3"
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.35.0"
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/checksum.txt
          asset: checksum.txt
          algorithm: sha256
      - version_constraint: semver("<= 0.12.0")
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.16.0")
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.27.0")
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("< 0.40.0")
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/imgpkg-{{.OS}}-{{.Arch}}
        asset: imgpkg-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity
              - https://gh-proxy.org/github.com/carvel-dev/imgpkg/.github/workflows/release.yml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate
              - https://gh-proxy.org/github.com/carvel-dev/imgpkg/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-github-workflow-repository
              - carvel-dev/imgpkg
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
