# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ktr0731
    repo_name: evans
    description: "Evans: more expressive universal gRPC client"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.3")
        type: http
        url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/evans_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: evans_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.6.9")
        type: http
        url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/evans_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: evans_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/evans_{{.OS}}_{{.Arch}}.exe.{{.Format}}
            asset: evans_{{.OS}}_{{.Arch}}.exe.{{.Format}}
      - version_constraint: semver("<= 0.7.3")
        type: http
        url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/evans_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: evans_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/evans_{{.OS}}_{{.Arch}}.exe.{{.Format}}
            asset: evans_{{.OS}}_{{.Arch}}.exe.{{.Format}}
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.10.1")
        type: http
        url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/evans_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: evans_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/evans_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: evans_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ktr0731/evans/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
