# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ekristen
    repo_name: aws-nuke
    description: Remove all the resources from an AWS account
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["v3.0.0-beta.25", "v3.0.0-beta.44", "v3.0.0-beta.56", "v3.46.0", "v3.53.0", "v3.62.1", "v3.63.0", "v3.64.3"]
        no_asset: true
      - version_constraint: Version == "v2.17.0-ek.1"
        type: http
        url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: aws-nuke-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: Version == "v2.18.6"
        type: http
        url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: aws-nuke-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 2.17.0-ek.4")
        type: http
        url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 3.0.0-beta.7")
        type: http
        url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --key
              - https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/cosign.pub
              - --signature
              - https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt.sig
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 3.64.2")
        type: http
        url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - "https://gh-proxy.org/github.com/ekristen/aws-nuke/.github/workflows/goreleaser.yml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt.sig
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity
              - "https://gh-proxy.org/github.com/ekristen/aws-nuke/.github/workflows/goreleaser.yml@refs/tags/{{.Version}}"
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ekristen/aws-nuke/releases/download/{{.Version}}/aws-nuke-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
