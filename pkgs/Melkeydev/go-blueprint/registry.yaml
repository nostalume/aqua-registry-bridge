# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Melkeydev
    repo_name: go-blueprint
    description: Go-blueprint allows users to spin up a quick Go project using a popular framework
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.2.4"
        type: http
        url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint-{{.Arch}}
        asset: go-blueprint-{{.Arch}}
        replacements:
          amd64: x86
          arm64: arm
        supported_envs:
          - linux
      - version_constraint: semver("<= 0.2.11")
        type: http
        url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint-{{.OS}}_{{.Arch}}
        asset: go-blueprint-{{.OS}}_{{.Arch}}
        format: raw
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint-{{.OS}}_{{.Arch}}
            replacements:
              amd64: x86_64
        replacements:
          darwin: Darwin
          linux: Linux
          windows: Windows
        supported_envs:
          - darwin
          - linux
          - amd64
      - version_constraint: semver("<= 0.2.13")
        type: http
        url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: go-blueprint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
            asset: go-blueprint_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: Version == "v0.3.0"
        type: http
        url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: go-blueprint_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint_{{.OS}}_all.{{.Format}}
            asset: go-blueprint_{{.OS}}_all.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: go-blueprint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
            asset: go-blueprint_{{trimV .Version}}_{{.OS}}_all.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/go-blueprint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/Melkeydev/go-blueprint/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
