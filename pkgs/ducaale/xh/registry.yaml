# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ducaale
    repo_name: xh
    description: Friendly and fast tool for sending HTTP requests
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.7.0"
        type: http
        url: https://gh-proxy.org/github.com/ducaale/xh/releases/download/{{.Version}}/xh-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: xh-{{.Arch}}-{{.OS}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: xh
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ducaale/xh/releases/download/{{.Version}}/xh-{{.Arch}}-{{.OS}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.3.3")
        type: http
        url: https://gh-proxy.org/github.com/ducaale/xh/releases/download/{{.Version}}/ht-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: ht-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
