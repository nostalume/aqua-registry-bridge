# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: high-moctane
    repo_name: nextword
    description: Predict next English words
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/high-moctane/nextword/releases/download/{{.Version}}/nextword_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: nextword_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/high-moctane/nextword/releases/download/{{.Version}}/nextword_{{trimV .Version}}_checksums.txt
          asset: nextword_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/high-moctane/nextword/releases/download/{{.Version}}/nextword_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
