# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: anchore
    repo_name: syft
    description: CLI tool and library for generating a Software Bill of Materials from container images and filesystems
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.26.0"
        type: http
        url: https://gh-proxy.org/github.com/anchore/syft/releases/download/{{.Version}}/syft_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: syft_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/anchore/syft/releases/download/{{.Version}}/syft_{{trimV .Version}}_checksums.txt
          asset: syft_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/anchore/syft/releases/download/{{.Version}}/syft_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/anchore/syft/releases/download/{{.Version}}/syft_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            checksum:
              # checksum isn't included in checksums.txt
              enabled: false
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: Version == "v0.27.0"
        type: http
        url: https://gh-proxy.org/github.com/anchore/syft/releases/download/{{.Version}}/syft_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
