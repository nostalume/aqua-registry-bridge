# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: anchore
    repo_name: quill
    description: Simple mac binary signing from any platform
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.1.0"
        type: http
        url: https://gh-proxy.org/github.com/anchore/quill/releases/download/{{.Version}}/quill_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: quill_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/anchore/quill/releases/download/{{.Version}}/quill_{{trimV .Version}}_checksums.txt
          asset: quill_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/anchore/quill/releases/download/{{.Version}}/quill_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
        supported_envs:
          - darwin
          - windows/amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/anchore/quill/releases/download/{{.Version}}/quill_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: quill_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/anchore/quill/releases/download/{{.Version}}/quill_{{trimV .Version}}_checksums.txt
          asset: quill_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/anchore/quill/releases/download/{{.Version}}/quill_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
