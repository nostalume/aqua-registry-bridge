# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: anchore
    repo_name: grype
    description: A vulnerability scanner for container images and filesystems
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.2.0")
        type: http
        url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_checksums.txt
          asset: grype_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.23.0")
        type: http
        url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_checksums.txt
          asset: grype_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            checksum:
              # checksum not included in checksums.txt
              enabled: false
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: semver("<= 0.31.1")
        type: http
        url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_checksums.txt
          asset: grype_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            checksum:
              # checksum not included in checksums.txt
              enabled: false
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            checksum:
              # checksum not included in checksums.txt
              enabled: false
      - version_constraint: semver("<= 0.71.0")
        type: http
        url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_checksums.txt
          asset: grype_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_checksums.txt
          asset: grype_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity
              - https://gh-proxy.org/github.com/anchore/grype/.github/workflows/release.yaml@refs/heads/main
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_checksums.txt.sig
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/anchore/grype/releases/download/{{.Version}}/grype_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
