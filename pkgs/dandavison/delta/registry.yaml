              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dandavison/delta/releases/download/{{.Version}}/delta-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - linux/amd64
          - darwin/arm64
          - windows/amd64
      - version_constraint: semver("<= 0.2.0")
