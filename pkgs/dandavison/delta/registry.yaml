# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: dandavison
    repo_name: delta
    description: A syntax-highlighting pager for git, diff, grep, and blame output
    files:
      - name: delta
        src: "{{.AssetWithoutExt}}/delta"
    overrides:
      - goos: windows
        files:
          - name: delta
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "0.16.4"
        type: http
        url: https://gh-proxy.org/github.com/dandavison/delta/releases/download/{{.Version}}/delta-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: delta-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/dandavison/delta/releases/download/{{.Version}}/delta-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/dandavison/delta/releases/download/{{.Version}}/delta-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "0.19.0"
        type: http
        url: https://gh-proxy.org/github.com/dandavison/delta/releases/download/{{.Version}}/delta-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
