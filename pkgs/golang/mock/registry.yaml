# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/golang/mock/releases/download/{{.Version}}/mock_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: golang
    repo_name: mock
    asset: mock_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: GoMock is a mocking framework for the Go programming language
    files:
      - name: mockgen
        src: mock_{{trimV .Version}}_{{.OS}}_{{.Arch}}/mockgen
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/golang/mock/releases/download/{{.Version}}/mock_{{trimV .Version}}_checksums.txt
      asset: mock_{{trimV .Version}}_checksums.txt
      algorithm: sha256
