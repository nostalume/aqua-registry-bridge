# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cgapp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: create-go-app
    repo_name: cli
    description: Create a new production-ready project with backend, frontend and deploy automation by running one CLI command
    asset: cgapp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: cgapp
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cgapp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
    version_constraint: semver(">= 4.0.0")
    version_overrides:
      - version_constraint: semver(">= 1.7.0")
        type: http
        url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cgapp_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cgapp_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cgapp_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: macOS
          linux: Linux
          windows: Windows
        supported_envs:
          - darwin
          - amd64
      - version_constraint: semver(">= 1.6.3")
        type: http
        url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cgapp_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cgapp_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cgapp_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: macOS
          linux: Linux
          windows: Windows
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
      - version_constraint: semver(">= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cgapp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cgapp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cgapp_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: macOS
          linux: Linux
          windows: Windows
        supported_envs:
          - darwin
          - amd64
        rosetta2: true
      - version_constraint: semver("< 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: cgapp
            src: cli
        overrides: []
        supported_envs:
          - linux/amd64
          - darwin
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/create-go-app/cli/releases/download/{{.Version}}/cli_{{.Version}}_checksums.txt
          asset: cli_{{.Version}}_checksums.txt
          algorithm: sha256
