# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: bytecodealliance
    repo_name: wasmtime
    description: A lightweight WebAssembly runtime that is fast, secure, and standards-compliant
    files:
      - name: wasmtime
        src: wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}/wasmtime
    version_filter: not (Version == "dev")
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.34.1"
        type: http
        url: https://gh-proxy.org/github.com/bytecodealliance/wasmtime/releases/download/{{.Version}}/wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/bytecodealliance/wasmtime/releases/download/{{.Version}}/wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
        supported_envs:
          - linux
          - darwin
      - version_constraint: Version == "cranelift-v0.60.0"
        type: http
        url: https://gh-proxy.org/github.com/bytecodealliance/wasmtime/releases/download/{{.Version}}/wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bytecodealliance/wasmtime/releases/download/{{.Version}}/wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.15.0")
        type: http
        url: https://gh-proxy.org/github.com/bytecodealliance/wasmtime/releases/download/{{.Version}}/wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/bytecodealliance/wasmtime/releases/download/{{.Version}}/wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.36.0")
        type: http
        url: https://gh-proxy.org/github.com/bytecodealliance/wasmtime/releases/download/{{.Version}}/wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.xz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/bytecodealliance/wasmtime/releases/download/{{.Version}}/wasmtime-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
