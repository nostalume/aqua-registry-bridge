# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fujiapple852
    repo_name: trippy
    description: A network diagnostic tool
    files:
      - name: trip
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.0")
        no_asset: true
      - version_constraint: Version == "0.6.0"
        type: http
        url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        files:
          - name: trip
            src: "{{.AssetWithoutExt}}/trip"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              arm64: aarch64
              linux: unknown-linux-gnu
        supported_envs:
          - linux
          - darwin
      - version_constraint: Version == "0.7.0"
        type: http
        url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: trip
            src: "{{.AssetWithoutExt}}/trip"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: Version == "0.8.0"
        type: http
        url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: trip
            src: "{{.AssetWithoutExt}}/trip"
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              arm64: aarch64
              linux: unknown-linux-gnu
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        asset: trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        files:
          - name: trip
            src: "{{.AssetWithoutExt}}/trip"
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/fujiapple852/trippy/releases/download/{{.Version}}/trippy-{{.Version}}-{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
