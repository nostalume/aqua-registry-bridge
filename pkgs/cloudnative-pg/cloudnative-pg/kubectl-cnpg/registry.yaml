# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: cloudnative-pg/cloudnative-pg/kubectl-cnpg
    type: github_release
    repo_owner: cloudnative-pg
    repo_name: cloudnative-pg
    description: CloudNativePG is a comprehensive platform designed to seamlessly manage PostgreSQL databases within Kubernetes environments, covering the entire operational lifecycle from initial deployment to ongoing maintenance
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.27.4"
        type: http
        url: https://gh-proxy.org/github.com/cloudnative-pg/cloudnative-pg/releases/download/{{.Version}}/kubectl-cnpg_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubectl-cnpg_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cloudnative-pg/cloudnative-pg/releases/download/{{.Version}}/cnpg-{{trimV .Version}}-checksums.txt
          asset: cnpg-{{trimV .Version}}-checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/cloudnative-pg/cloudnative-pg/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
      - version_constraint: semver("<= 1.28.1")
        type: http
        url: https://gh-proxy.org/github.com/cloudnative-pg/cloudnative-pg/releases/download/{{.Version}}/kubectl-cnpg_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubectl-cnpg_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cloudnative-pg/cloudnative-pg/releases/download/{{.Version}}/cnpg-{{trimV .Version}}-checksums.txt
          asset: cnpg-{{trimV .Version}}-checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cloudnative-pg/cloudnative-pg/releases/download/{{.Version}}/kubectl-cnpg_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubectl-cnpg_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x86_64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cloudnative-pg/cloudnative-pg/releases/download/{{.Version}}/cnpg-{{trimV .Version}}-checksums.txt
          asset: cnpg-{{trimV .Version}}-checksums.txt
          algorithm: sha256
        slsa_provenance:
          type: http
          url: https://gh-proxy.org/github.com/cloudnative-pg/cloudnative-pg/releases/download/{{.Version}}/multiple.intoto.jsonl
          asset: multiple.intoto.jsonl
