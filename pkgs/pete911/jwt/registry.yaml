# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: pete911
    repo_name: jwt
    description: jwt cli
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/pete911/jwt/releases/download/{{.Version}}/jwt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: jwt_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pete911/jwt/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
