# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: pete911
    repo_name: certinfo
    description: print x509 certificate info
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.4")
        type: http
        url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 1.0.17")
        type: http
        url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 1.0.20")
        type: http
        url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/pete911/certinfo/releases/download/{{.Version}}/certinfo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
