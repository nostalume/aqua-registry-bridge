# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: minc-org
    repo_name: minc
    description: MicroShift in Container
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.9")
        type: http
        url: https://gh-proxy.org/github.com/minc-org/minc/releases/download/{{.Version}}/minc_{{.OS}}_{{.Arch}}
        asset: minc_{{.OS}}_{{.Arch}}
        format: raw
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/minc-org/minc/releases/download/{{.Version}}/minc
            asset: minc
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/minc-org/minc/releases/download/{{.Version}}/minc_{{.OS}}_{{.Arch}}
        asset: minc_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/minc-org/minc/releases/download/{{.Version}}/sha256sum.txt
          asset: sha256sum.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/minc-org/minc/releases/download/{{.Version}}/minc
            asset: minc
