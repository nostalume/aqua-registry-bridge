# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/pseudomuto/protoc-gen-doc/releases/download/{{.Version}}/protoc-gen-doc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: pseudomuto
    repo_name: protoc-gen-doc
    asset: protoc-gen-doc_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: Documentation generator plugin for Google Protocol Buffers
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/pseudomuto/protoc-gen-doc/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
