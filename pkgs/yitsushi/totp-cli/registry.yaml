# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: yitsushi
    repo_name: totp-cli
    description: Authy/Google Authenticator like TOTP CLI tool written in Go
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.5")
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli-{{.OS}}-{{.Arch}}
        asset: totp-cli-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.1.3")
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}_checksum.txt
          asset: totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}_checksum.txt
          algorithm: md5
      - version_constraint: Version == "v1.1.4"
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux/amd64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}_checksum.txt
          asset: totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}_checksum.txt
          algorithm: md5
      - version_constraint: semver("<= 1.1.9")
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        supported_envs:
          - linux/amd64
          - darwin
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}_checksum.txt
          asset: totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}_checksum.txt
          algorithm: md5
      - version_constraint: Version == "v1.1.10"
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux/amd64
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}_checksum.txt
          asset: totp-cli_{{.Version}}_{{.OS}}_{{.Arch}}_checksum.txt
          algorithm: md5
      - version_constraint: semver("<= 1.1.17")
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: totp-cli-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
      - version_constraint: semver("<= 1.2.1")
        no_asset: true
      - version_constraint: semver("<= 1.8.5")
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: totp-cli-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
      - version_constraint: Version == "v1.8.6"
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: totp-cli_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{trimV .Version}}_checksums.txt
          asset: totp-cli_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: totp-cli_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/yitsushi/totp-cli/releases/download/{{.Version}}/totp-cli_{{trimV .Version}}_checksums.txt
          asset: totp-cli_{{trimV .Version}}_checksums.txt
          algorithm: sha256
