# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: DataDog
    repo_name: managed-kubernetes-auditing-toolkit
    aliases:
      - name: datadog/managed-kubernetes-auditing-toolkit
    description: All-in-one auditing toolkit for identifying common security issues in managed Kubernetes environments. Currently supports Amazon EKS
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.1.1")
        type: http
        url: https://gh-proxy.org/github.com/DataDog/managed-kubernetes-auditing-toolkit/releases/download/{{.Version}}/managed-kubernetes-auditing-toolkit_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: managed-kubernetes-auditing-toolkit_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        files:
          - name: mkat
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/DataDog/managed-kubernetes-auditing-toolkit/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/DataDog/managed-kubernetes-auditing-toolkit/releases/download/{{.Version}}/managed-kubernetes-auditing-toolkit_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: managed-kubernetes-auditing-toolkit_{{.OS}}_{{.Arch}}.{{.Format}}
        files:
          - name: mkat
        format: tar.gz
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/DataDog/managed-kubernetes-auditing-toolkit/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
