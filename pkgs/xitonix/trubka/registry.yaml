# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/xitonix/trubka/releases/download/{{.Version}}/trubka_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: xitonix
    repo_name: trubka
    description: A CLI tool for Kafka
    rosetta2: true
    asset: trubka_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    supported_envs:
      - darwin
      - amd64
