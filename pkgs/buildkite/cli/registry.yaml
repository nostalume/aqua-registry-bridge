# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: buildkite
    repo_name: cli
    description: A command line interface for Buildkite
    files:
      - name: bk
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.1.0")
        type: http
        url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/bk-{{.OS}}-{{.Arch}}-{{trimV .Version}}
        asset: bk-{{.OS}}-{{.Arch}}-{{trimV .Version}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v1.2.0"
        type: http
        url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/cli-{{.OS}}-{{.Arch}}
        asset: cli-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
      - version_constraint: Version == "v2.0.0"
        type: http
        url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/cli-{{.OS}}-{{.Arch}}
        asset: cli-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
      - version_constraint: Version == "v3.0.0-beta.20240202"
        type: http
        url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/bk_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: bk_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
      - version_constraint: Version == "v3.0.0-beta.20240326"
        type: http
        url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/bk_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        asset: bk_{{trimV .Version}}_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
      - version_constraint: Version == "v3.0.0-beta.20240418"
        type: http
        url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/{{.Version}}_{{.OS}}_{{.Arch}}
        asset: "{{.Version}}_{{.OS}}_{{.Arch}}"
        format: raw
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/bk_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: bk_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        files:
          - name: bk
            src: "{{.AssetWithoutExt}}/bk"
        replacements:
          darwin: macOS
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/bk_{{trimV .Version}}_checksums.txt
          asset: bk_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/bk_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: tar.gz
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/buildkite/cli/releases/download/{{.Version}}/bk_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            files:
              - name: bk
