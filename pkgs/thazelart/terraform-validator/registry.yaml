# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/thazelart/terraform-validator/releases/download/{{.Version}}/terraform-validator_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: thazelart
    repo_name: terraform-validator
    description: A norms and conventions validator for Terraform
    supported_envs:
      - darwin
      - amd64
    rosetta2: true
    asset: terraform-validator_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/thazelart/terraform-validator/releases/download/{{.Version}}/terraform-validator_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    replacements:
      darwin: Darwin
      linux: Linux
      386: i386
      amd64: x86_64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/thazelart/terraform-validator/releases/download/{{.Version}}/terraform-validator_checksums.txt
      asset: terraform-validator_checksums.txt
      algorithm: sha256
