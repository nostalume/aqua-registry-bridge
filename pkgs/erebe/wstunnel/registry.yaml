# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: erebe
    repo_name: wstunnel
    description: Tunnel all your traffic over Websocket or HTTP2 - Bypass firewalls/DPI
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "1.0"
        type: http
        url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/wstunnel
        asset: wstunnel
        format: raw
        supported_envs:
          - linux/amd64
      - version_constraint: Version in ["1.1", "1.2"]
        type: http
        url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/wstunnel_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: wstunnel_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/wstunnel_{{.OS}}_{{.Arch}}
            format: raw
            asset: wstunnel_{{.OS}}_{{.Arch}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/wstunnel_{{.OS}}_{{.Arch}}.{{.Format}}
            files:
              - name: wstunnel
                src: wstunnel_{{.OS}}_{{.Arch}}/wstunnel
        replacements:
          amd64: x64
        supported_envs:
          - linux/amd64
          - windows/amd64
      - version_constraint: Version == "2.0"
        type: http
        url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/wstunnel_{{.OS}}_{{.Arch}}
        asset: wstunnel_{{.OS}}_{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/wstunnel-{{.OS}}
            asset: wstunnel-{{.OS}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/wstunnel_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
            asset: wstunnel_{{.OS}}_{{.Arch}}.{{.Format}}
            files:
              - name: wstunnel
                src: wstunnel_{{.OS}}_{{.Arch}}/wstunnel
        replacements:
          amd64: x64
          darwin: macos
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v0.1.5"
        type: http
        url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/wstunnel_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: wstunnel_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/erebe/wstunnel/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
