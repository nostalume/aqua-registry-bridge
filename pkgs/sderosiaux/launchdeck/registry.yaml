# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/sderosiaux/launchdeck/releases/download/{{.Version}}/launchdeck-{{.Arch}}-{{.OS}}.{{.Format}}
    repo_owner: sderosiaux
    repo_name: launchdeck
    description: Unified macOS service console for launchd and Homebrew
    asset: launchdeck-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
    supported_envs:
      - darwin
    files:
      - name: launchdeck
        src: launchdeck-{{.Arch}}-{{.OS}}/launchdeck
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/sderosiaux/launchdeck/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
