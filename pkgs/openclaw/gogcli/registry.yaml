# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: openclaw
    repo_name: gogcli
    aliases:
      - name: steipete/gogcli
    description: "Google Suite CLI: Gmail, GCal, GDrive, GContacts"
    files:
      - name: gog
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.5.0")
        type: http
        url: https://gh-proxy.org/github.com/openclaw/gogcli/releases/download/{{.Version}}/gogcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gogcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: gog
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openclaw/gogcli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/openclaw/gogcli/releases/download/{{.Version}}/gogcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/openclaw/gogcli/releases/download/{{.Version}}/gogcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gogcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: gog
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/openclaw/gogcli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/openclaw/gogcli/releases/download/{{.Version}}/gogcli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
