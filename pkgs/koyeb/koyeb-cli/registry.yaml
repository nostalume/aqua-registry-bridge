# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: koyeb
    repo_name: koyeb-cli
    description: Koyeb cli
    files:
      - name: koyeb
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.2.0")
        type: http
        url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/koyeb-cli-{{.OS}}-{{.Arch}}
        asset: koyeb-cli-{{.OS}}-{{.Arch}}
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v2.0.0-rc1"
        type: http
        url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 2.0.1")
        type: http
        url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/koyeb/koyeb-cli/releases/download/{{.Version}}/koyeb-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
