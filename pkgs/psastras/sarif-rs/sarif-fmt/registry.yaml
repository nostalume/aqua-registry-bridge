# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: psastras/sarif-rs/sarif-fmt
    type: github_release
    repo_owner: psastras
    repo_name: sarif-rs
    description: Pretty print SARIF results
    version_filter: not (Version matches "-latest$")
    version_prefix: sarif-fmt-
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "sarif-fmt-v0.6.2"
        type: http
        url: https://gh-proxy.org/github.com/psastras/sarif-rs/releases/download/{{.Version}}/sarif-fmt-{{.Arch}}-{{.OS}}
        asset: sarif-fmt-{{.Arch}}-{{.OS}}
        format: raw
        replacements:
          amd64: x86_64
          linux: unknown-linux-gnu
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 0.4.2")
        type: http
        url: https://gh-proxy.org/github.com/psastras/sarif-rs/releases/download/{{.Version}}/sarif-fmt-{{.Arch}}-{{.OS}}
        asset: sarif-fmt-{{.Arch}}-{{.OS}}
        format: raw
        rosetta2: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/psastras/sarif-rs/releases/download/{{.Version}}/sarif-fmt-{{.Arch}}-{{.OS}}
        asset: sarif-fmt-{{.Arch}}-{{.OS}}
        format: raw
        replacements:
          darwin: apple-darwin
          linux: unknown-linux-gnu
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/psastras/sarif-rs/releases/download/{{.Version}}/sarif-fmt-{{.Arch}}-{{.OS}}
            replacements:
              amd64: x86_64
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/psastras/sarif-rs/releases/download/{{.Version}}/sarif-fmt-{{.Arch}}-{{.OS}}
            replacements:
              arm64: aarch64
        supported_envs:
          - linux/amd64
          - darwin/arm64
