# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sivchari
    repo_name: ccowl
    description: A cross-platform status bar application that monitors Claude Code usage in real-time
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.0.0"
        type: http
        url: https://gh-proxy.org/github.com/sivchari/ccowl/releases/download/{{.Version}}/ccowl-{{.OS}}-{{.Arch}}
        asset: ccowl-{{.OS}}-{{.Arch}}
        format: raw
        windows_arm_emulation: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sivchari/ccowl/releases/download/{{.Version}}/ccowl-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: ccowl-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: ccowl
            src: "{{.AssetWithoutExt}}"
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sivchari/ccowl/releases/download/{{.Version}}/ccowl-{{.OS}}-{{.Arch}}.exe.{{.Format}}
            format: zip
            asset: ccowl-{{.OS}}-{{.Arch}}.exe.{{.Format}}
            checksum:
              enabled: false
