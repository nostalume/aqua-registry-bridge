# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: sivchari
    repo_name: gopls-lazy
    description: An LSP proxy that lazily scopes gopls to open files, keeping large monorepos fast
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/sivchari/gopls-lazy/releases/download/{{.Version}}/gopls-lazy_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gopls-lazy_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/sivchari/gopls-lazy/releases/download/{{.Version}}/gopls-lazy_{{trimV .Version}}_checksums.txt
          asset: gopls-lazy_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/sivchari/gopls-lazy/releases/download/{{.Version}}/gopls-lazy_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
