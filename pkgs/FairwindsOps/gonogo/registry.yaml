# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: FairwindsOps
    repo_name: gonogo
    description: "[alpha] Tool to evaluate upgrade confidence for Kubernetes cluster addons"
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.3.1")
        type: http
        url: https://gh-proxy.org/github.com/FairwindsOps/gonogo/releases/download/{{.Version}}/gonogo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gonogo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/FairwindsOps/gonogo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --key
              - https://artifacts.fairwinds.com/cosign.pub
              - --signature
              - https://gh-proxy.org/github.com/FairwindsOps/gonogo/releases/download/{{.Version}}/checksums.txt.sig
              - --insecure-ignore-tlog
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/FairwindsOps/gonogo/releases/download/{{.Version}}/gonogo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: gonogo_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/FairwindsOps/gonogo/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --key
              - https://artifacts.fairwinds.com/cosign-p256.pub
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/FairwindsOps/gonogo/releases/download/{{.Version}}/checksums.txt.sigstore.json
              asset: checksums.txt.sigstore.json
