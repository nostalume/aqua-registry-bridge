# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: tealdeer-rs
    repo_name: tealdeer
    aliases:
      - name: dbrgn/tealdeer
    description: A very fast implementation of tldr in Rust
    files:
      - name: tldr
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.1.0")
        type: http
        url: https://gh-proxy.org/github.com/tealdeer-rs/tealdeer/releases/download/{{.Version}}/tldr-{{.Arch}}-musl
        asset: tldr-{{.Arch}}-musl
        format: raw
        replacements:
          amd64: x86_64
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 1.4.1")
        type: http
        url: https://gh-proxy.org/github.com/tealdeer-rs/tealdeer/releases/download/{{.Version}}/tldr-{{.OS}}-{{.Arch}}-musl
        asset: tldr-{{.OS}}-{{.Arch}}-musl
        format: raw
        replacements:
          amd64: x86_64
        supported_envs:
          - linux/amd64
      - version_constraint: semver("<= 1.6.1")
        type: http
        url: https://gh-proxy.org/github.com/tealdeer-rs/tealdeer/releases/download/{{.Version}}/tealdeer-{{.OS}}-{{.Arch}}-musl
        asset: tealdeer-{{.OS}}-{{.Arch}}-musl
        format: raw
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: macos
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/tealdeer-rs/tealdeer/releases/download/{{.Version}}/tealdeer-{{.OS}}-{{.Arch}}
            asset: tealdeer-{{.OS}}-{{.Arch}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tealdeer-rs/tealdeer/releases/download/{{.Version}}/tealdeer-{{.OS}}-{{.Arch}}-msvc
            asset: tealdeer-{{.OS}}-{{.Arch}}-msvc
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/tealdeer-rs/tealdeer/releases/download/{{.Version}}/tealdeer-{{.OS}}-{{.Arch}}-musl
        asset: tealdeer-{{.OS}}-{{.Arch}}-musl
        format: raw
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: macos
        checksum:
          type: http
          url: "{{.AssetURL}}.sha256"
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/tealdeer-rs/tealdeer/releases/download/{{.Version}}/tealdeer-{{.OS}}-{{.Arch}}
            asset: tealdeer-{{.OS}}-{{.Arch}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/tealdeer-rs/tealdeer/releases/download/{{.Version}}/tealdeer-{{.OS}}-{{.Arch}}-msvc
            asset: tealdeer-{{.OS}}-{{.Arch}}-msvc
