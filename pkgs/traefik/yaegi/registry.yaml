# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: traefik
    repo_name: yaegi
    description: Yaegi is Another Elegant Go Interpreter
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v0.8.14"
        no_asset: true
      - version_constraint: Version == "v0.9.23"
        type: http
        url: https://gh-proxy.org/github.com/traefik/yaegi/releases/download/{{.Version}}/yaegi_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: yaegi_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/traefik/yaegi/releases/download/{{.Version}}/yaegi_{{trimV .Version}}_checksums.txt
          asset: yaegi_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: semver("<= 0.9.13")
        type: http
        url: https://gh-proxy.org/github.com/traefik/yaegi/releases/download/{{.Version}}/yaegi_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: yaegi_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/traefik/yaegi/releases/download/{{.Version}}/yaegi_{{trimV .Version}}_checksums.txt
          asset: yaegi_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/traefik/yaegi/releases/download/{{.Version}}/yaegi_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: yaegi_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/traefik/yaegi/releases/download/{{.Version}}/yaegi_{{trimV .Version}}_checksums.txt
          asset: yaegi_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
