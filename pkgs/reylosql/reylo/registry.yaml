# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: reylosql
    repo_name: reylo
    description: Infer types for SQL queries from the database itself
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.6.0")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/reylosql/reylo/releases/download/{{.Version}}/reylo-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: reylo-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements:
          amd64: x64
          windows: win32
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/reylosql/reylo/releases/download/{{.Version}}/SHA256SUMS
          asset: SHA256SUMS
          algorithm: sha256
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/reylosql/reylo/releases/download/{{.Version}}/reylo-{{.OS}}-{{.Arch}}.{{.Format}}
            variants:
              - key: libc
                value: glibc
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/reylosql/reylo/releases/download/{{.Version}}/reylo-{{.OS}}-{{.Arch}}-musl.{{.Format}}
            asset: reylo-{{.OS}}-{{.Arch}}-musl.{{.Format}}
            variants:
              - key: libc
                value: musl
