# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: Macmod
    repo_name: godap
    description: A complete terminal user interface (TUI) for LDAP
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/Macmod/godap/releases/download/{{.Version}}/godap-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: godap-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: "{{.AssetURL}}.md5"
          asset: "{{.Asset}}.md5"
          algorithm: md5
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/Macmod/godap/releases/download/{{.Version}}/godap-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
