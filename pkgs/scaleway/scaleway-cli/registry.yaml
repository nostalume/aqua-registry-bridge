# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/scaleway/scaleway-cli/releases/download/{{.Version}}/scaleway-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}
    repo_owner: scaleway
    repo_name: scaleway-cli
    description: Command Line Interface for Scaleway
    format: raw
    files:
      - name: scw
    version_constraint: semver(">= 2.5.1")
    asset: scaleway-cli_{{trimV .Version}}_{{.OS}}_{{.Arch}}
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/scaleway/scaleway-cli/releases/download/{{.Version}}/scw-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        asset: scw-{{trimV .Version}}-{{.OS}}-{{.Arch}}
        supported_envs:
          - darwin
          - amd64
        replacements:
          amd64: x86_64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/scaleway/scaleway-cli/releases/download/{{.Version}}/SHA256SUMS
      asset: SHA256SUMS
      algorithm: sha256
