# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: itaysk
    repo_name: kubectl-neat
    description: Clean up Kubernetes yaml and json output to make it readable
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.0.0")
        type: http
        url: https://gh-proxy.org/github.com/itaysk/kubectl-neat/releases/download/{{.Version}}/kubectl-neat_{{.OS}}.{{.Format}}
        asset: kubectl-neat_{{.OS}}.{{.Format}}
        format: tar.gz
        supported_envs:
          - linux/amd64
          - darwin
        files:
          - name: kubectl-neat
            src: dist/{{.OS}}/kubectl-neat
      - version_constraint: semver("<= 2.0.2")
        type: http
        url: https://gh-proxy.org/github.com/itaysk/kubectl-neat/releases/download/{{.Version}}/kubectl-neat_{{.OS}}.{{.Format}}
        asset: kubectl-neat_{{.OS}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/itaysk/kubectl-neat/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux/amd64
          - darwin
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/itaysk/kubectl-neat/releases/download/{{.Version}}/kubectl-neat_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubectl-neat_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/itaysk/kubectl-neat/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        supported_envs:
          - linux
          - darwin
