# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/digitalocean/doctl/releases/download/{{.Version}}/doctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: digitalocean
    repo_name: doctl
    asset: doctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    description: The official command line interface for the DigitalOcean API
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/digitalocean/doctl/releases/download/{{.Version}}/doctl-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/digitalocean/doctl/releases/download/{{.Version}}/doctl-{{trimV .Version}}-checksums.sha256
      asset: doctl-{{trimV .Version}}-checksums.sha256
      algorithm: sha256
