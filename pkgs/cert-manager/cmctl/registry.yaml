# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: cert-manager
    repo_name: cmctl
    description: the command line utility that makes cert-manager'ing easier
    version_constraint: "false"
    version_overrides:
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/cert-manager/cmctl/releases/download/{{.Version}}/cmctl_{{.OS}}_{{.Arch}}
        asset: cmctl_{{.OS}}_{{.Arch}}
        format: raw
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/cert-manager/cmctl/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: http
              url: https://gh-proxy.org/github.com/cert-manager/cmctl/releases/download/{{.Version}}/checksums.txt.cosign.bundle
              asset: checksums.txt.cosign.bundle
            opts:
              - --certificate-oidc-issuer
              - "https://token.actions.githubusercontent.com"
              - --certificate-identity
              - https://gh-proxy.org/github.com/cert-manager/cmctl/.github/workflows/release.yaml@refs/tags/{{.Version}}
