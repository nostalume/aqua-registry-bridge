# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/tdewolff/minify/releases/download/{{.Version}}/minify_{{.OS}}_{{.Arch}}.{{.Format}}
    repo_owner: tdewolff
    repo_name: minify
    asset: minify_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    description: Go minifiers for web formats
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/tdewolff/minify/releases/download/{{.Version}}/minify_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/tdewolff/minify/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
