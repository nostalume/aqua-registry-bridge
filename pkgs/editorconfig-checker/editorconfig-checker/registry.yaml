# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: editorconfig-checker
    repo_name: editorconfig-checker
    description: A tool to verify that your files are in harmony with your .editorconfig
    files:
      - name: ec
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 1.1.0")
        type: http
        url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: ec-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: ec
            src: bin/ec-{{.OS}}-{{.Arch}}
      - version_constraint: semver("<= 2.3.5")
        type: http
        url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: ec-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        files:
          - name: ec
            src: bin/ec-{{.OS}}-{{.Arch}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.exe.{{.Format}}
            asset: ec-{{.OS}}-{{.Arch}}.exe.{{.Format}}
      - version_constraint: semver("<= 2.5.0")
        type: http
        url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: ec-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        files:
          - name: ec
            src: bin/ec-{{.OS}}-{{.Arch}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.exe.{{.Format}}
            asset: ec-{{.OS}}-{{.Arch}}.exe.{{.Format}}
      - version_constraint: Version == "2.6.0"
        type: http
        url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: ec-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: ec
            src: bin/ec-{{.OS}}-{{.Arch}}
      - version_constraint: semver("<= 3.0.3")
        type: http
        url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: ec-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: ec
            src: bin/ec-{{.OS}}-{{.Arch}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.exe.{{.Format}}
            asset: ec-{{.OS}}-{{.Arch}}.exe.{{.Format}}
      - version_constraint: semver("< 4.0.0")
        type: http
        url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: ec-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: ec
            src: bin/ec-{{.OS}}-{{.Arch}}
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/ec-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/editorconfig-checker-{{.OS}}-{{.Arch}}.{{.Format}}
        asset: editorconfig-checker-{{.OS}}-{{.Arch}}.{{.Format}}
        format: tar.gz
        files:
          - name: editorconfig-checker
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: darwin
            type: http
            url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/editorconfig-checker-{{.OS}}-all.{{.Format}}
            asset: editorconfig-checker-{{.OS}}-all.{{.Format}}
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/editorconfig-checker/editorconfig-checker/releases/download/{{.Version}}/editorconfig-checker-{{.OS}}-{{.Arch}}.{{.Format}}
            format: zip
