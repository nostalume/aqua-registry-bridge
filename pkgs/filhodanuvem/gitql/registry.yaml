# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/filhodanuvem/gitql/releases/download/{{.Version}}/gitql_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    repo_owner: filhodanuvem
    repo_name: gitql
    asset: gitql_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    description: A git query language
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    supported_envs:
      - darwin
      - linux
      - amd64
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/filhodanuvem/gitql/releases/download/{{.Version}}/checksums.txt
      asset: checksums.txt
      algorithm: sha256
