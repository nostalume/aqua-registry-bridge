# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: ClementTsang
    repo_name: bottom
    description: Yet another cross-platform graphical process/system monitor
    files:
      - name: btm
    version_filter: not (Version == "nightly")
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version in ["0.1.0-alpha-1", "0.1.0-alpha-4"]
        type: http
        url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/{{.OS}}-bottom-{{.Version}}
        asset: "{{.OS}}-bottom-{{.Version}}"
        format: raw
        supported_envs:
          - linux/amd64
      - version_constraint: Version == "0.1.0-alpha-3"
        type: http
        url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom
        asset: bottom
        format: raw
        supported_envs:
          - linux/amd64
      - version_constraint: Version == "0.2.0"
        type: http
        url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "0.5.0"
        type: http
        url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
            replacements:
              arm64: aarch64
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 0.1.2")
        no_asset: true
      - version_constraint: semver("<= 0.4.7")
        type: http
        url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          linux: unknown-linux-gnu
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 0.6.8")
        type: http
        url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          darwin: apple-darwin
          windows: pc-windows-msvc
        overrides:
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: amd64
            replacements:
              linux: unknown-linux-musl
          - goos: linux
            type: http
            url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
            goarch: arm64
            replacements:
              arm64: aarch64
              linux: unknown-linux-gnu
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: semver("< 0.10.0")
        type: http
        url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        asset: bottom_{{.Arch}}-{{.OS}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements:
          amd64: x86_64
          arm64: aarch64
          darwin: apple-darwin
          linux: unknown-linux-musl
          windows: pc-windows-msvc
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/ClementTsang/bottom/releases/download/{{.Version}}/bottom_{{.Arch}}-{{.OS}}.{{.Format}}
            format: zip
        github_artifact_attestations:
          signer_workflow: ClementTsang/bottom/.github/workflows/build_releases.yml
