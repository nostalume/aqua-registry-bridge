# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: masutaka
    repo_name: github-nippou
    description: Print today's your GitHub activity for issues and pull requests
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 3.2.0")
        no_asset: true
      - version_constraint: semver("<= 4.1.11")
        type: http
        url: https://gh-proxy.org/github.com/masutaka/github-nippou/releases/download/{{.Version}}/github-nippou_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: github-nippou_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        rosetta2: true
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 4.2.9")
        type: http
        url: https://gh-proxy.org/github.com/masutaka/github-nippou/releases/download/{{.Version}}/github-nippou_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: github-nippou_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: Version == "v4.3.0"
        type: http
        url: https://gh-proxy.org/github.com/masutaka/github-nippou/releases/download/{{.Version}}/github-nippou_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: github-nippou_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/masutaka/github-nippou/releases/download/{{.Version}}/github-nippou_{{.Version}}_checksums.txt
          asset: github-nippou_{{.Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/masutaka/github-nippou/releases/download/{{.Version}}/github-nippou_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: github-nippou_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/masutaka/github-nippou/releases/download/{{.Version}}/github-nippou_{{.Version}}_checksums.txt
          asset: github-nippou_{{.Version}}_checksums.txt
          algorithm: sha256
        github_artifact_attestations:
          signer_workflow: masutaka/github-nippou/.github/workflows/release.yml
