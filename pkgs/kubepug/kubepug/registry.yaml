# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: kubepug
    repo_name: kubepug
    aliases:
      - name: rikatz/kubepug
    description: Kubernetes PreUpGrade (Checker)
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.2.1"
        no_asset: true
      - version_constraint: Version == "v1.2.2"
        type: http
        url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{trimV .Version}}_checksums.txt
          asset: kubepug_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: semver("<= 1.1.3")
        type: http
        url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{trimV .Version}}_checksums.txt
          asset: kubepug_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
        supported_envs:
          - darwin
          - windows
          - amd64
      - version_constraint: semver("<= 1.4.0")
        type: http
        url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{trimV .Version}}_checksums.txt
          asset: kubepug_{{trimV .Version}}_checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{trimV .Version}}_checksums.txt
          asset: kubepug_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{trimV .Version}}_checksums.txt.pem
              - --certificate-identity
              - https://gh-proxy.org/github.com/kubepug/kubepug/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{trimV .Version}}_checksums.txt.sig
              - --certificate-github-workflow-repository
              - kubepug/kubepug
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            type: http
            url: https://gh-proxy.org/github.com/kubepug/kubepug/releases/download/{{.Version}}/kubepug_{{.OS}}_{{.Arch}}.{{.Format}}
            format: zip
