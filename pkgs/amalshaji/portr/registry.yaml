# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: amalshaji
    repo_name: portr
    description: Open source ngrok alternative designed for teams. Tunnel http, tcp or websocket connections
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.0.1")
        no_asset: true
      - version_constraint: "true"
        type: http
        url: https://gh-proxy.org/github.com/amalshaji/portr/releases/download/{{.Version}}/portr_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        asset: portr_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: zip
        replacements:
          amd64: x86_64
          darwin: Darwin
          linux: Linux
          windows: Windows
        checksum:
          type: http
          url: https://gh-proxy.org/github.com/amalshaji/portr/releases/download/{{.Version}}/checksums.txt
          asset: checksums.txt
          algorithm: sha256
