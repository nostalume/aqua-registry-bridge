# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    url: https://gh-proxy.org/github.com/jtyr/gbt/releases/download/{{.Version}}/gbt-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    repo_owner: jtyr
    repo_name: gbt
    description: Highly configurable prompt builder for Bash, ZSH and PowerShell written in Go
    rosetta2: true
    asset: gbt-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    overrides:
      - goos: windows
        type: http
        url: https://gh-proxy.org/github.com/jtyr/gbt/releases/download/{{.Version}}/gbt-{{trimV .Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
        format: zip
    supported_envs:
      - darwin
      - linux
      - amd64
    files:
      - name: gbt
        src: gbt-{{trimV .Version}}/gbt
    checksum:
      type: http
      url: https://gh-proxy.org/github.com/jtyr/gbt/releases/download/{{.Version}}/gbt-{{trimV .Version}}-checksums-sha256.txt
      asset: gbt-{{trimV .Version}}-checksums-sha256.txt
      algorithm: sha256
