---
name: Validate registry bridge

on:
  pull_request:
    paths:
      - .github/workflows/mirror-test.yaml
      - aqua.yaml
      - mirror.yaml
      - requirements-dev.txt
      - scripts/mirror.py
      - scripts/validate.py
      - tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/mirror-test.yaml
      - aqua.yaml
      - mirror.yaml
      - requirements-dev.txt
      - scripts/mirror.py
      - scripts/validate.py
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and validate generated registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Single pin: the aqua binary and the registry JSON Schema must stay on the same release.
      AQUA_VERSION: v2.66.1 # renovate: depName=aquaproj/aqua
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out aqua schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aquaproj/aqua
          ref: ${{ env.AQUA_VERSION }}
          path: .ai/aqua
          persist-credentials: false
      - name: Install Python dependencies
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Set up aqua tools
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: ${{ env.AQUA_VERSION }}
          aqua_opts: -l
          policy_allow: "true"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint workflows
        run: actionlint
      - name: Validate projection and aggregate
        run: |
          python3 scripts/mirror.py --dry-run
          python3 scripts/validate.py --schema .ai/aqua/json-schema/registry.json
          argd gr
          python3 scripts/validate.py --schema .ai/aqua/json-schema/registry.json
